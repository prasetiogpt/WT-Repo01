<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Player - Data Index</title>
<style>body{font-family:sans-serif;padding:24px;max-width:480px;margin:0 auto}h1{font-size:1.1rem}ul{padding-left:0;list-style:none}li{margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}a{color:#2b6cb0;text-decoration:none;font-size:1.05rem;flex:1 1 auto;min-width:120px}a:active{opacity:.6}.ts{font-size:.75rem;color:#888;white-space:nowrap}button.del{border:none;background:#fee2e2;color:#b91c1c;border-radius:6px;padding:6px 10px;font-size:1rem;flex-shrink:0}button.del:active{opacity:.6}button.del:disabled{opacity:.4}#msg{margin-top:16px;font-size:.85rem;color:#555;min-height:1.2em}</style>
</head><body>
<h1>🀄 Mandarin Player — Data Tersimpan</h1>
<ul id="list">
<li><a href="ap-html-mandarin-001-010.v1789478267754.html">ap-html-mandarin-001-010</a><span class="ts">15 Sep 2026, 20.17</span><button class="del" data-name="ap-html-mandarin-001-010.v1789478267754.html" data-label="ap-html-mandarin-001-010" data-updated="2026-09-15T13:17:54.206Z" onclick="deleteEntry(this)" type="button">🗑</button></li>
</ul>
<div id="msg"></div>
<script>
const GIT_OWNER='prasetiogpt', GIT_REPO='WT-Repo01', GIT_DATA_DIR='html-mandarin-player/data', GIT_BRANCH='main', GIT_TOKEN_KEY='ghPatToken';
function getGitToken(){
  let t=localStorage.getItem(GIT_TOKEN_KEY);
  if(!t){ t=prompt('Paste GitHub Personal Access Token (disimpan di browser ini saja):'); if(t) localStorage.setItem(GIT_TOKEN_KEY, t.trim()); }
  return t ? t.trim() : '';
}
function gitHeaders(token){ return {'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}; }
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function formatTs(iso){
  if(!iso) return '';
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
async function ghGetSha(token, path){
  const res=await fetch('https://api.github.com/repos/'+GIT_OWNER+'/'+GIT_REPO+'/contents/'+path+'?ref='+GIT_BRANCH, {headers:gitHeaders(token)});
  if(res.status===404) return null;
  if(res.status===401) throw new Error('401: token ditolak (salah/kadaluarsa)');
  if(!res.ok) throw new Error('GET gagal: '+res.status);
  return (await res.json()).sha;
}
function renderIndexHtml(entries){
  const items=entries.map(({file, label, updatedAt})=>'<li><a href="'+file+'">'+label+'</a><span class="ts">'+formatTs(updatedAt)+'</span><button class="del" data-name="'+file+'" data-label="'+label+'" data-updated="'+(updatedAt||'')+'" onclick="deleteEntry(this)" type="button">\uD83D\uDDD1</button></li>').join('\n');
  return document.documentElement.outerHTML.replace(
    /<ul id="list">[\s\S]*?<\/ul>/,
    '<ul id="list">\n'+(items || '<li>(belum ada data)</li>')+'\n</ul>'
  );
}
async function regenerateIndex(token, names){
  const html='<!DOCTYPE html>\n'+renderIndexHtml(names);
  const path=GIT_DATA_DIR+'/index.html';
  const sha=await ghGetSha(token, path);
  const body={message:'Update index (delete)', content:utf8ToBase64(html), branch:GIT_BRANCH};
  if(sha) body.sha=sha;
  const res=await fetch('https://api.github.com/repos/'+GIT_OWNER+'/'+GIT_REPO+'/contents/'+path,{method:'PUT',headers:gitHeaders(token),body:JSON.stringify(body)});
  if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error('Update index gagal: '+res.status+' '+(j.message||'')); }
}
async function deleteEntry(btn){
  const name=btn.getAttribute('data-name');
  const label=btn.getAttribute('data-label')||name.replace(/\.html$/i,'');
  const msg=document.getElementById('msg');
  let token;
  try{
    if(!confirm('Hapus "'+label+'"? Tindakan ini tidak bisa dibatalkan.')) return;
    token=getGitToken();
    if(!token){ msg.textContent='Dibatalkan (token kosong).'; return; }
  }catch(promptErr){
    msg.textContent='✗ Gagal buka dialog: '+promptErr.message;
    alert('Tidak bisa menampilkan dialog konfirmasi/token:\n'+promptErr.message+'\n\nCoba reload halaman ini, atau buka di tab Safari biasa (bukan dari dalam app lain).');
    return;
  }
  btn.disabled=true;
  try{
    msg.textContent='Menghapus '+name+' ...';
    const path=GIT_DATA_DIR+'/'+name;
    const sha=await ghGetSha(token, path);
    if(sha){
      const res=await fetch('https://api.github.com/repos/'+GIT_OWNER+'/'+GIT_REPO+'/contents/'+path,{
        method:'DELETE', headers:gitHeaders(token),
        body: JSON.stringify({message:'Delete data: '+name, sha, branch:GIT_BRANCH})
      });
      if(res.status===401){ localStorage.removeItem(GIT_TOKEN_KEY); throw new Error('401: token ditolak (salah/kadaluarsa)'); }
      if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error('Gagal hapus: '+res.status+' '+(j.message||'')); }
    }
    btn.closest('li').remove();
    const entries=Array.from(document.querySelectorAll('#list button.del')).map(b=>({file:b.getAttribute('data-name'), label:b.getAttribute('data-label')||b.getAttribute('data-name').replace(/\.html$/i,''), updatedAt:b.getAttribute('data-updated')||''}));
    // index.html bisa "ditabrak" push/hapus lain yang hampir bersamaan (409 sha tidak cocok) -
    // data di atas sudah pasti terhapus, jadi coba beberapa kali sebelum menyerah supaya index
    // tidak diam-diam ketinggalan (file terhapus tapi masih muncul di daftar).
    let indexErr=null;
    for(let attempt=1; attempt<=3; attempt++){
      try{ await regenerateIndex(token, entries); indexErr=null; break; }
      catch(e){ indexErr=e; if(attempt<3) await new Promise(r=>setTimeout(r, 800*attempt)); }
    }
    if(indexErr) throw indexErr;
    msg.textContent='✓ '+label+' dihapus.';
  }catch(err){
    msg.textContent='✗ '+err.message;
    alert('Hapus "'+label+'" gagal atau index gagal ter-update:\n'+err.message+'\n\nMuat ulang halaman ini untuk cek status sebenarnya.');
  }
  finally{ btn.disabled=false; }
}
</script>
</body></html>
