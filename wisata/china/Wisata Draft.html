    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Xiamen`,
       nameEn:`Cerita Kota Xiamen`,
       text:`Xiamen (dulu dikenal sebagai "Amoy" di dunia Barat) jadi salah satu dari lima pelabuhan yang dibuka untuk perdagangan internasional setelah Perjanjian Nanking 1842, memicu masuknya konsulat, gereja, dan vila bergaya Eropa terutama di Gulangyu Island. Tahun 1980an, Xiamen jadi salah satu kota pertama di China yang ditetapkan sebagai Zona Ekonomi Khusus dalam kebijakan Reformasi &amp; Keterbukaan Deng Xiaoping, dan kini jadi pelabuhan terbesar ke-8 di China sekaligus kota pesisir yang menghadap langsung ke Taiwan.`,
       wiki:`https://en.wikipedia.org/wiki/Xiamen`,
       yt:`https://www.youtube.com/results?search_query=Xiamen+China+city+guide`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`November adalah salah satu bulan terbaik untuk berkunjung — awal musim kering, sejuk, dan sudah lewat musim topan (Juni-Oktober). ⚠️ Angka di ringkasan cuaca awal dokumen ini adalah rata-rata historis, BUKAN forecast real-time — cek forecast H-7 sebelum berangkat.`,
       wiki:`https://en.climate-data.org/asia/china/fujian/xiamen-2623/`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Bandara utama: <b>Xiamen Gaoqi International Airport (厦门高崎国际机场 · Xiàmén Gāoqí Guójì Jīchǎng)</b>. Stasiun HSR utama: <b>Xiamen North Railway Station (厦门北站 · Xiàmén Běi Zhàn)</b> untuk koneksi jarak jauh, <b>Xiamen Railway Station (厦门站 · Xiàmén Zhàn)</b> lebih dekat pusat kota. Xiamen Metro punya 5 jalur aktif (1, 2, 3, 4, 6) plus BRT.`,
       wiki:`https://en.wikipedia.org/wiki/Xiamen_Gaoqi_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Zhenhai Road/Zhongshan Road</b>, Siming District — pusat kota lama, dekat dermaga feri Gulangyu, di jalur Line 1 yang tersambung ke Line 3 (kluster kampus/pantai) dan Jimei. Alternatif: sekitar <b>Zengcuoan</b> kalau lebih suka suasana pantai &amp; kafe santai, meski sedikit lebih jauh dari pusat kota.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Xiamen`,
       nameEn:`Destinasi Terkenal Lain di Xiamen`,
       text:`Di luar itinerary utama: <b>Fujian Tulou (福建土楼 · Fújiàn Tǔlóu)</b> — rumah benteng tanah liat berbentuk bundar warisan UNESCO milik etnis Hakka, tapi 2,5-3 jam sekali jalan dari Xiamen (lihat Cadangan). <b>Wuyi Mountains (武夷山 · Wǔyí Shān)</b> — kawasan pegunungan &amp; ngarai terkenal, jauh di luar Xiamen, lebih cocok trip terpisah (lihat Cadangan).`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Xiamen+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Sha Cha Mian/Mie Satai (沙茶面)</b> — hidangan paling ikonik Xiamen, kuah kompleks dari kaldu tulang babi &amp; udang plus pasta satai-kacang, dipercaya diciptakan perantau yang kembali dari Asia Tenggara. <b>Oyster Omelet (海蛎煎)</b> — telur dadar isi tiram kecil, digoreng dengan lemak babi — cukup berminyak. <b>Peanut Soup (花生汤)</b> — sup kacang tanah manis lembut, dessert tradisional paling terkenal di Zhongshan Road (Huangzehe Peanut Soup Shop).`,
       yt:`https://www.youtube.com/results?search_query=Xiamen+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. Untuk Gulangyu, JANGAN naik feri dari dermaga umum Dongdu — turis asing wajib dari Xiamen International Cruise Center (Xiagu Wharf).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram.`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Zhongshan Road (中山路 · Zhōngshān Lù)`,
       nameEn:`Zhongshan Road`,
       nameHanzi:`中山路`,
       text:`Jalan pedestrian utama kota lama Xiamen, dinamai untuk menghormati Sun Yat-sen seperti banyak jalan utama kota-kota China lainnya — dipenuhi arcade bergaya "qilou" (bangunan dengan lorong beratap di lantai dasar, perpaduan arsitektur Eropa &amp; Asia Tenggara) peninggalan era Xiamen jadi pelabuhan dagang internasional. Salah satu toko paling legendaris di sini, Huangzehe Peanut Soup Shop, sudah berjualan sup kacang manis sejak awal abad ke-20. <b>Akses:</b> dekat Stasiun Zhenhai Road (Line 1), ±200m jalan kaki. <b>Jam Operasional:</b> jalan pedestrian buka 24 jam (gratis), toko/kios umumnya ±09:00–22:00. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://en.wikipedia.org/wiki/Xiamen`,
       yt:`https://www.youtube.com/results?search_query=Zhongshan+Road+Xiamen+night`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Gulangyu Island (鼓浪屿 · Gǔlàngyǔ)`,
       nameEn:`Gulangyu Island`,
       nameHanzi:`鼓浪屿`,
       text:`Pulau kecil bebas kendaraan bermotor yang jadi permukiman internasional (Inggris, Amerika, Jepang, dan lainnya) setelah Xiamen dibuka jadi pelabuhan dagang 1842 — kini situs UNESCO World Heritage sejak 2017. Dijuluki "Pulau Musik" karena warisan budaya pianonya yang kaya (menyimpan Piano Museum terbesar di dunia), dengan lebih dari 1.000 vila kolonial bergaya beragam yang masih berdiri di jalan-jalannya yang berliku &amp; teduh. <b>Akses:</b> feri dari Xiamen International Cruise Center (Xiagu Wharf) — turis asing WAJIB dari dermaga ini, BUKAN dermaga umum Dongdu. Dekat Stasiun Zhenhai Road (Line 1). <b>Jam Operasional:</b> feri beroperasi ±07:00–17:30 (turis asing terakhir naik sebelum 17:30). Pulau sendiri bisa dijelajahi sepanjang hari. <b>Tiket:</b> feri PP CNY 35/org (termasuk tiket balik, berlaku 20 hari); Sunlight Rock Scenic Area kombinasi ±CNY 90/org (⚠️ estimasi, cek loket).`,
       wiki:`https://en.wikipedia.org/wiki/Gulangyu`,
       yt:`https://www.youtube.com/results?search_query=Gulangyu+Island+Xiamen`,
       nearby:[`Sunlight Rock (日光岩 · Rìguāng Yán)`,`Piano Museum`,`Shuzhuang Garden`]},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Nanputuo Temple (南普陀寺 · Nán Pǔtuó Sì)`,
       nameEn:`Nanputuo Temple`,
       nameHanzi:`南普陀寺`,
       text:`Salah satu kuil Buddha paling terkenal di China Selatan, awalnya dibangun era Dinasti Tang, direnovasi besar-besaran di era Kangxi (Dinasti Qing) oleh Jenderal Shi Lang. Namanya merujuk pada Mount Putuo (rumah spiritual Bodhisattva Guanyin) — kompleksnya dikelilingi kolam teratai &amp; berlatar Wuyao Mountain, jadi salah satu dari delapan pemandangan ikonik Xiamen. <b>Akses:</b> MRT Line 3, turun Stasiun Xida Nanmen. <b>Jam Operasional:</b> ±06:00–18:00 (bervariasi musim). <b>Tiket:</b> Gratis, wajib reservasi online (via WeChat mini-program resmi kuil).`,
       reserveInfo:`WeChat mini-program resmi Nanputuo Temple, booking H-1/H-2, slot terbatas terutama akhir pekan.`,
       wiki:`https://en.wikipedia.org/wiki/Nanputuo_Temple`,
       yt:`https://www.youtube.com/results?search_query=Nanputuo+Temple+Xiamen`,
       nearby:[`Xiamen University (gerbang selatan persis sebelahan)`]},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xiamen University (厦门大学 · Xiàmén Dàxué)`,
       nameEn:`Xiamen University`,
       nameHanzi:`厦门大学`,
       text:`Didirikan tahun 1921 oleh filantropis Tan Kah Kee (Chen Jiageng) — universitas modern pertama di China yang didirikan oleh perantau Tionghoa (overseas Chinese) — kini secara konsisten masuk jajaran universitas top China. Kampusnya terkenal sebagai salah satu yang tercantik di China, memadukan arsitektur bergaya "jiageng" (kombinasi atap China tradisional dengan struktur bata-batu Barat) dengan latar Wuyao Mountain &amp; pantai. <b>Akses:</b> persis sebelahan Nanputuo Temple, Stasiun Xida Nanmen (Line 3). <b>Jam Operasional:</b> kampus terbuka untuk umum, jam kunjungan umumnya ±08:00–18:00. ⚠️ Beberapa periode perlu reservasi/ID untuk masuk gerbang tertentu, cek kebijakan terbaru sebelum berkunjung. <b>Tiket:</b> Gratis (area kampus umum).`,
       wiki:`https://en.wikipedia.org/wiki/Xiamen_University`,
       yt:`https://www.youtube.com/results?search_query=Xiamen+University+campus`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Wanshi Botanical Garden (万石植物园 · Wànshí Zhíwùyuán)`,
       nameEn:`Wanshi Botanical Garden`,
       nameHanzi:`万石植物园`,
       text:`Juga dikenal sebagai Xiamen Botanical Garden, terletak di bukit Wanshi Mountain persis di belakang Nanputuo Temple — bagian dari kawasan cagar alam nasional Gulangyu-Wanshi Mountain. Koleksinya mencakup ribuan spesies tanaman tropis &amp; subtropis dari seluruh dunia, dengan area khusus kaktus, palem, dan hutan hujan yang jadi salah satu koleksi botani terlengkap di China Selatan. <b>Akses:</b> persis di belakang Nanputuo Temple, akses sama (Stasiun Xida Nanmen, Line 3). <b>Jam Operasional:</b> ±06:00–18:00. <b>Tiket:</b> CNY 30/org.`,
       wiki:`https://en.wikipedia.org/wiki/Xiamen_Botanical_Garden`,
       yt:`https://www.youtube.com/results?search_query=Wanshi+Botanical+Garden+Xiamen`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Hulishan Fortress (胡里山炮台 · Húlǐshān Pàotái)`,
       nameEn:`Hulishan Fortress`,
       nameHanzi:`胡里山炮台`,
       text:`Benteng pesisir yang dibangun tahun 1891-1896 era akhir Dinasti Qing untuk pertahanan dari ancaman kolonial — menyimpan meriam Krupp buatan Jerman berkaliber 280mm yang pernah tercatat sebagai meriam pantai tertua &amp; terbesar di dunia yang masih berfungsi (Guinness World Records). Museum Rongguang di dalamnya memamerkan koleksi senjata &amp; artefak militer dari berbagai era. <b>Akses:</b> MRT Line 3, turun Stasiun Xida Baicheng. <b>Jam Operasional:</b> ±07:00–18:00 (musim panas sampai 18:30). <b>Tiket:</b> CNY 25/org.`,
       wiki:`https://en.wikipedia.org/wiki/Hulishan_Fortress`,
       yt:`https://www.youtube.com/results?search_query=Hulishan+Fortress+Xiamen`,
       nearby:[`Baicheng Beach (persis sebelahan)`]},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Baicheng Beach &amp; Island Ring Road (白城沙滩·环岛路 · Báichéng Shātān · Huándǎo Lù)`,
       nameEn:`Baicheng Beach & Island Ring Road`,
       nameHanzi:`白城沙滩环岛路`,
       text:`Baicheng Beach adalah pantai pasir putih santai persis di sebelah Hulishan Fortress, jadi titik awal populer untuk menyusuri Island Ring Road — jalan sepanjang ±30km yang melingkari pulau Xiamen, menghubungkan beberapa pantai terbaik &amp; pemandangan pesisir kota. Rental sepeda tandem tersedia di sepanjang jalur, jadi cara favorit warga &amp; wisatawan menikmati garis pantai dengan santai. <b>Akses:</b> persis sebelahan Hulishan Fortress, Stasiun Xida Baicheng (Line 3). <b>Jam Operasional:</b> area terbuka 24 jam, gratis. Rental sepeda umumnya ±08:00–18:00. <b>Tiket:</b> Gratis; sewa sepeda tandem ±CNY 15/jam/sepeda (opsional).`,
       wiki:`https://chinaexplorertour.com/2026/blog/tips-biking-walking-xiamen-island-ring-road-2026-guide/`,
       yt:`https://www.youtube.com/results?search_query=Xiamen+Island+Ring+Road+cycling`},
      // --- h5 ---
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Shapowei Art Zone (沙坡尾 · Shāpōwěi)`,
       nameEn:`Shapowei Art Zone`,
       nameHanzi:`沙坡尾`,
       text:`Bekas pelabuhan nelayan tua dekat Xiamen University, salah satu kawasan pesisir tertua di kota yang masih mempertahankan suasana perkampungan nelayan otentik di tengah pesatnya modernisasi Xiamen. Bagian barat kawasannya diubah jadi Shapowei Art Zone — bekas pabrik yang direnovasi jadi galeri lukisan, pameran keramik, dan ruang seni komunitas. <b>Akses:</b> MRT Line 3, turun Stasiun Shapowei. <b>Jam Operasional:</b> kawasan jalan buka 24 jam (gratis), galeri/kafe umumnya ±10:00–20:00. <b>Tiket:</b> Gratis masuk kawasan.`,
       wiki:`https://www.trip.com/moments/poi-shapowei-art-zone-31714490/`,
       yt:`https://www.youtube.com/results?search_query=Shapowei+Xiamen`},
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Zengcuoan (曾厝垵 · Zēngcuòān)`,
       nameEn:`Zengcuoan`,
       nameHanzi:`曾厝垵`,
       text:`Dulunya kampung nelayan kecil, kini berubah jadi kawasan bohemian dengan gang-gang sempit penuh mural warna-warni, kafe unik, dan toko suvenir buatan tangan — beberapa mural menggambarkan kehidupan Hokkien tradisional, sebagian lagi karya seni modern kontemporer. Pasar malamnya jadi salah satu tempat terbaik mencicipi jajanan khas Xiamen (satay noodles, oyster omelet, jeli rebung) sambil menikmati suasana ramai wisatawan lokal. <b>Akses:</b> MRT Line 3, turun Stasiun Zengcuoan — 1-2 halte dari Shapowei, jalur sama. <b>Jam Operasional:</b> kawasan jalan buka 24 jam (gratis), pasar malam paling ramai ±17:00–22:00. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://chinaexplorertour.com/2026/blog/plan-xiamen-zengcuoan-coastal-art-village-trip-2026-guide/`,
       yt:`https://www.youtube.com/results?search_query=Zengcuoan+Xiamen+night+market`},

      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Jimei School Village (集美学村 · Jíměi Xuécūn)`,
       nameEn:`Jimei School Village`,
       nameHanzi:`集美学村`,
       context:`Kenapa tidak dimasukkan: dihapus dari itinerary utama saat trip dipersingkat dari 7 hari jadi 6 hari (revisi 2026-09-17) — satu-satunya kluster yang berdiri sendiri di Line 1 tanpa transfer, tidak searah dengan kluster Line 3 (Nanputuo/Hulishan/Shapowei) yang mengisi Hari 3-5, jadi paling masuk akal dikorbankan tanpa mengganggu hari lain. Worth dikunjungi kalau ada waktu ekstra atau kunjungan berikutnya.`,
       text:`Kompleks pendidikan yang dibangun mulai 1913 oleh Tan Kah Kee (Chen Jiageng), filantropis perantau Tionghoa yang juga mendirikan Xiamen University — dari sini lahir gaya arsitektur "jiageng" khas yang memadukan atap tradisional China dengan struktur bata-batu Barat, jadi cetak biru banyak bangunan kampus di Xiamen. Kawasan ini mencakup beberapa sekolah &amp; universitas sekaligus, menjadikannya salah satu kompleks pendidikan tertua &amp; paling berpengaruh di China Selatan. <b>Akses:</b> MRT Line 1, turun Stasiun Jimei School Village — langsung, tanpa transfer dari kawasan pusat kota. <b>Jam Operasional:</b> kawasan kampus terbuka untuk umum, gratis, tidak ada jam tutup ketat. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Tan_Kah_Kee`,
       yt:`https://www.youtube.com/results?search_query=Jimei+School+Village+Xiamen`,
       nearby:[`Aoyuan`,`Dragon Boat Pond`,`Jiageng Park`]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Aoyuan (鳌园 · Áoyuán)`,
       nameEn:`Aoyuan`,
       nameHanzi:`鳌园`,
       context:`Kenapa tidak dimasukkan: satu paket dengan Jimei School Village (lihat di atas) — ikut terpangkas saat trip dipersingkat dari 7 hari jadi 6 hari.`,
       text:`Taman memorial seluas ±9.000 m² yang dibangun Chen Jiageng selama 10 tahun (selesai 1950) di bekas pulau kecil tepi laut Jimei — terdiri dari gerbang, Monumen Pembebasan Jimei, dan makam Chen Jiageng sendiri. Dindingnya dihiasi ratusan panel ukiran batu bergambar cerita rakyat, sejarah, dan sains, menjadikannya semacam "ensiklopedia batu" yang mencerminkan visi pendidikan Chen Jiageng. <b>Akses:</b> jalan kaki dari Jimei School Village, kawasan yang sama. <b>Jam Operasional:</b> ±08:00–17:30. <b>Tiket:</b> Gratis.`,
       wiki:`https://baike.baidu.com/item/%E9%9B%86%E7%BE%8E%E9%B3%8C%E5%9B%AD/6683809`,
       yt:`https://www.youtube.com/results?search_query=Aoyuan+Jimei+Xiamen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dragon Boat Pond &amp; Jiageng Park (龙舟池·嘉庚公园 · Lóngzhōu Chí · Jiāgēng Gōngyuán)`,
       nameEn:`Dragon Boat Pond & Jiageng Park`,
       nameHanzi:`龙舟池嘉庚公园`,
       context:`Kenapa tidak dimasukkan: satu paket dengan Jimei School Village (lihat di atas) — ikut terpangkas saat trip dipersingkat dari 7 hari jadi 6 hari.`,
       text:`Kolam besar di jantung Jimei School Village yang dipakai untuk lomba perahu naga tradisional saat Festival Peh Cun, dikelilingi jalur jalan santai &amp; taman terbuka bernama Jiageng Park sebagai penghormatan untuk Tan Kah Kee. Suasananya tenang &amp; lokal, jadi penutup yang pas untuk hari yang bertema warisan pendidikan &amp; filantropi Chen Jiageng. <b>Akses:</b> bagian dari kawasan Jimei School Village, jalan kaki dari Aoyuan. <b>Jam Operasional:</b> taman terbuka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Jimei_District`,
       yt:`https://www.youtube.com/results?search_query=Dragon+Boat+Pond+Jimei+Xiamen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Fujian Tulou — Yongding Hongkeng Cluster (福建土楼·永定洪坑土楼群 · Fújiàn Tǔlóu · Yǒngdìng Hóngkēng Tǔlóu Qún)`,
       nameEn:`Fujian Tulou — Yongding Hongkeng Cluster`,
       nameHanzi:`福建土楼永定洪坑土楼群`,
       context:`Kenapa tidak dimasukkan: 2,5 jam sekali jalan (5 jam PP) terlalu jauh untuk disisipkan di trip 7 hari yang sudah padat — worth dipertimbangkan sebagai trip terpisah 2 hari/1 malam kalau berkunjung lagi ke Xiamen, supaya tidak terburu-buru.`,
       text:`Rumah komunal berbentuk bundar dari tanah liat padat, dibangun etnis Hakka mulai abad ke-12 sebagai benteng pertahanan sekaligus rumah komunal beberapa generasi keluarga — situs UNESCO World Heritage sejak 2008, sering disebut mirip "piring terbang" dari udara. Kluster Hongkeng di Yongding County adalah salah satu yang paling terkenal &amp; terjaga baik. <b>Akses:</b> bus dari Hubinnan Long-Distance Bus Station, Xiamen, ±2,5 jam sekali jalan. <b>Jam Operasional:</b> ±08:00–18:00. <b>Tiket:</b> ±CNY 90-100/org untuk kluster utama (⚠️ estimasi, cek loket).`,
       wiki:`https://en.wikipedia.org/wiki/Fujian_tulou`,
       yt:`https://www.youtube.com/results?search_query=Fujian+Tulou+Yongding+Hongkeng`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Fujian Tulou — Nanjing Tianluokeng Cluster (福建土楼·南靖田螺坑土楼群 · Fújiàn Tǔlóu · Nánjìng Tiánluókēng Tǔlóu Qún)`,

       text:`Fuzhou, ibu kota Provinsi Fujian, punya sejarah lebih dari 2.200 tahun — didirikan tahun 202 SM sebagai ibu kota Kerajaan Minyue, dan mendapat nama "Fuzhou" (Kota Berkah) tahun 725 M era Dinasti Tang. Sejak Dinasti Song, kota ini jadi simpul penting Jalur Sutra Maritim, dan di abad ke-19 jadi salah satu pelabuhan teh utama China setelah dibuka untuk perdagangan internasional pasca Perang Candu Pertama.`,

       text:`Di luar itinerary utama: <b>Pingtan Island (平潭岛 · Píngtán Dǎo)</b> — pulau dengan pantai &amp; desa batu unik, terkenal fenomena "air mata biru" (blue tears) di musim panas, tapi ±85km dari Fuzhou (lihat Cadangan). <b>Changle District (长乐区 · Chángyuè Qū)</b> — kawasan bersejarah dekat bandara, terkait pelayaran Zheng He di era Ming.`,

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Fuzhou Fish Balls (福州鱼丸 · Fúzhōu Yúwán)</b> — bakso ikan isi daging cincang, hidangan wajib di setiap perayaan Fuzhou sejak era Qing. <b>Buddha Jumps Over the Wall (佛跳墙 · Fó Tiào Qiáng)</b> — sup mewah lebih dari 20 bahan dimasak dalam guci tanah liat, konon aromanya membuat biksu vegetarian "melompati tembok" saking tergodanya — hidangan perayaan, bukan makanan harian. <b>Taro Paste (芋泥 · Yùní)</b> — dessert manis dari talas tumbuk, tekstur lembut khas penutup makan Fuzhou.`,

const STORE_KEY = "wisata-china-checks-v3";
const store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* Independent "sudah ditinjau" checklist for Lampiran entries — not
   linked to the Itinerary tab's checkboxes (different meaning: for
   Cadangan it means "reviewed and confirmed not visiting", not "done"). */
const LAMP_STORE_KEY = "wisata-china-lampiran-reviewed-v1";
const lampStore = JSON.parse(localStorage.getItem(LAMP_STORE_KEY) || "{}");
function saveLamp(){ localStorage.setItem(LAMP_STORE_KEY, JSON.stringify(lampStore)); }
function lampiranKey(destId, title){ return destId + "::" + title; }

function cell(v, cls){
  return v ? `<td class="${cls}">${v}</td>` : `<td class="${cls} dash">&ndash;</td>`;
}

function formatJam(jam){
  // "14:25–15:15" -> "14:25–" / "15:15" on two lines so the column can stay narrow
  const i = jam.indexOf('–');
  if(i !== -1) return jam.slice(0,i+1) + '<br>' + jam.slice(i+1);
  // non-range labels like "Sore/malam" have no natural break point for the
  // narrow column — break after "/" too, otherwise it can overflow into
  // the next cell instead of wrapping.
  const j = jam.indexOf('/');
  if(j !== -1) return jam.slice(0,j+1) + '<br>' + jam.slice(j+1);
  return jam;
}

function updateProgress(dayEl){
  const boxes = dayEl.querySelectorAll('input[type=checkbox]');
  const done = [...boxes].filter(b=>b.checked).length;
  dayEl.querySelector('.day-progress').textContent = done+"/"+boxes.length;
}

function renderTransport(t){
  const isFlight = t.mode === "flight";
  const isTrain = t.mode === "train";
  const icon = isFlight ? PLANE_ICON : isTrain ? TRAIN_ICON : TRANSIT_ICON;
  const tagClass = t.tag === "ok" ? "tag-ok" : "tag-tbd";
  const tagText = t.tag === "ok" ? "Confirmed" : "Belum pasti";

  let body = "";
  if(isFlight || isTrain){
    body = `
      <div class="flight-route">
        <div class="route-city"><div class="route-code">${t.from.code}</div><div class="route-name">${t.from.name}</div></div>
        <div class="route-mid">
          <div class="route-dur">${t.duration}</div>
          <div class="route-line"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></svg></div>
          <div class="route-dur">${t.code}</div>
        </div>
        <div class="route-city" style="text-align:right"><div class="route-code">${t.to.code}</div><div class="route-name">${t.to.name}</div></div>
      </div>
      <div class="flight-meta">${t.meta.map(([l,v])=>`<div><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.note ? `<div class="flight-note">${t.note}</div>` : ``}
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  } else {
    body = `
      <div class="transit-list">${t.items.map(([l,v])=>`<div class="transit-row"><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  }

  const det = document.createElement('details');
  det.className = 'transport';
  det.innerHTML = `
    <summary>
      <div class="transport-icon">${icon}</div>
      <div class="transport-head-text">
        <div class="transport-kicker">${t.kicker}</div>
        <div class="transport-title">${t.title}</div>
      </div>
      <div class="transport-tag ${tagClass}">${tagText}</div>
      ${CHEV}
    </summary>
    <div class="transport-body">${body}</div>
  `;
  return det;
}

function renderDay(d, dest){
  const destId = dest.id;
  const det = document.createElement('details');
  det.className = 'day';

  const rows = d.items.map((it,ii)=>{
    const [jam,destName,ket,catatan,valas,rupiah] = it;
    const key = destId+"-"+d.id+"-"+ii;
    const checked = store[key] ? 'checked' : '';
    const doneClass = store[key] ? 'done' : '';
    return `<tr class="${doneClass}" data-key="${key}">
      <td class="cell-pilih"><input type="checkbox" ${checked} aria-label="Tandai selesai: ${destName}"></td>
      <td class="cell-jam">${formatJam(jam)}</td>
      <td class="cell-dest">${destName}</td>
      ${cell(ket,'cell-ket')}
      ${cell(valas,'cell-valas')}
      ${cell(rupiah,'cell-rupiah')}
    </tr>`;
  }).join('');

  const footRow = d.total ? `<tfoot><tr>
      <td></td><td></td><td>TOTAL HARI ${d.num}</td><td></td>
      <td class="cell-valas">${d.total.cny}</td><td class="cell-rupiah">${d.total.idr}</td>
    </tr></tfoot>` : '';

  const cadanganNearby = (dest.lampiran || []).filter(p =>
    p.tag === 'planc' && p.relatedDays && p.relatedDays.includes(d.num));
  const cadanganNearbyHtml = cadanganNearby.length ? `
    <div class="cadangan-nearby">
      <span class="banner-label">Tempat sekitar lain (lihat Lampiran → Cadangan)</span>
      ${cadanganNearby.map(p => p.title).join(', ')}
    </div>` : '';

  det.innerHTML = `
    <summary>
      <div class="day-badge">${d.num}</div>
      <div class="day-head-text">
        <div class="day-toprow">
          <div class="day-date">${d.date}</div>
          <div class="day-progress">0/${d.items.length}</div>
        </div>
        <div class="day-label">${d.label}</div>
      </div>
      ${CHEV}
    </summary>
    ${d.reserve ? `<div class="reserve-banner"><span class="banner-label">Reservasi wajib</span>${d.reserve}</div>` : ``}
    ${d.advisory ? `<div class="info-banner"><span class="banner-label">Perhatian</span>${d.advisory}</div>` : ``}
    <div class="table-scroll">
      <table class="itin">
        <colgroup>
          <col style="width:28px"><col style="width:72px"><col style="width:215px"><col style="width:215px"><col style="width:52px"><col style="width:98px">
        </colgroup>
        <thead><tr>
          <th class="col-pilih"><span class="sr-only">Pilih</span></th><th>Jam</th><th>Destinasi</th><th>Keterangan</th><th class="col-num">${dest.currency || 'CNY'}</th><th class="col-num">IDR</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        ${footRow}
      </table>
    </div>
    ${d.planb ? `<div class="planb-banner"><span class="banner-label">Plan-B hari ini</span>${d.planb}</div>` : ``}
    ${cadanganNearbyHtml}
  `;

  det.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const row = cb.closest('tr');
      const key = row.dataset.key;
      store[key] = cb.checked;
      row.classList.toggle('done', cb.checked);
      save();
      updateProgress(det);
    });
  });

  return det;
}

function renderBudget(b, currency){
  const el = document.createElement('details');
  el.className = 'budget-card';
  const dayRows = b.byDay.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  const catRows = b.byCategory.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  el.innerHTML = `
    <summary><h3 class="serif">Ringkasan Budget Total</h3>${CHEV}</summary>
    <div class="budget-card-body">
      <div class="budget-sub">${b.note}</div>
      <table class="budget">
        <thead><tr><th>Hari</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${dayRows}<tr class="grand"><td>${b.grand[0]}</td><td>${b.grand[1]}</td><td>${b.grand[2]}</td></tr></tbody>
      </table>
      <table class="budget">
        <thead><tr><th>Kategori</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${catRows}<tr class="grand"><td>TOTAL</td><td>${b.catTotal[1]}</td><td>${b.catTotal[2]}</td></tr></tbody>
      </table>
      <div class="budget-note">${b.caveat}</div>
    </div>
  `;
  return el;
}

function renderCity(dest){
  const panel = document.createElement('div');
  panel.className = 'city-panel';
  panel.id = 'panel-'+dest.id;

  panel.innerHTML = `
    <div class="subview itinerary active"></div>
    <div class="subview lampiran"></div>
  `;

  const itinView = panel.querySelector('.subview.itinerary');
  itinView.appendChild(renderTransport(dest.transportPergi));

  dest.days.forEach(d=>{
    const dayEl = renderDay(d, dest);
    itinView.appendChild(dayEl);
    updateProgress(dayEl);
  });

  if(dest.budget) itinView.appendChild(renderBudget(dest.budget, dest.currency || 'CNY'));

  const notesCard = document.createElement('details');
  notesCard.className = 'notes-card';
  notesCard.innerHTML = `<summary>Catatan Penting Lainnya${CHEV}</summary><div class="notes-card-body"><ul>${dest.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  itinView.appendChild(notesCard);

  if(dest.transportPulang) itinView.appendChild(renderTransport(dest.transportPulang));

  const lampiranView = panel.querySelector('.subview.lampiran');
  lampiranView.innerHTML = '';

  const tagClass = {main:'tag-main',planb:'tag-planb',food:'tag-food',planc:'tag-planc',info:'tag-info'};
  const groupDefs = dest.lampiranGroups && dest.lampiranGroups.length
    ? dest.lampiranGroups
    : dest.days.map(d=>({key:d.id, heading:d.date+' — '+d.label})).concat([{key:'cadangan', heading:'Cadangan'}]);

  function placeLinks(p){
    return (p.wiki || p.yt) ? `<div class="place-links">
        ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Foto &amp; info →</a>` : ``}
        ${p.yt ? `<a href="${p.yt}" target="_blank" rel="noopener">Video referensi →</a>` : ``}
      </div>` : ``;
  }

  groupDefs.forEach((g,gi)=>{
    const entries = dest.lampiran.filter(p=>p.group===g.key);
    if(!entries.length) return;
    const isIntro = g.key === 'intro';

    const groupEl = document.createElement('details');
    groupEl.className = 'lampiran-group';
    groupEl.dataset.key = g.key;

    const itemsHtml = entries.map(p=>{
      const noBody = !p.text && !p.wiki && !p.yt && !p.reserveInfo && (!p.nearby || !p.nearby.length) && (!p.hotels || !p.hotels.length);
      const lampKey = lampiranKey(dest.id, p.title);
      const isDestList = isIntro && /^Destinasi Terkenal Lain/.test(p.title || '');
      const lampChecked = lampStore[lampKey] ? 'checked' : '';
      const lampDoneClass = !isIntro && lampStore[lampKey] ? ' reviewed' : '';
      return `
        <div class="lampiran-item${isIntro?' intro':''}${lampDoneClass}"${!isIntro?` data-lamp-key="${lampKey}"`:``}>
          <div class="lampiran-item-head">
            ${!isIntro ? `<input type="checkbox" class="lampiran-check" ${lampChecked} aria-label="Tandai sudah ditinjau: ${p.title}">` : ``}
            ${!isIntro ? `<span class="place-tag ${tagClass[p.tag]}">${p.label}</span>` : ``}
            <span class="lampiran-item-title">${isDestList ? '<b>Destinasi</b>' : titleHtml(p)}</span>
            ${!isIntro ? `<button type="button" class="item-toggle" aria-label="Buka/tutup detail">${CHEV}</button>` : ``}
          </div>
          <div class="lampiran-item-body">
            ${isDestList ? copyAllBtnsHtml(dest.id) : ``}
            ${!isIntro && p.tag !== 'food' ? copyBtnsHtml(p.nameEn, p.nameHanzi) : ``}
            ${p.context ? `<div class="card-context"${noBody?' style="margin-bottom:0;"':''}>${p.context}</div>` : ``}
            ${p.text ? `<p>${p.text}</p>` : ``}
            ${p.reserveInfo ? `<div class="reserve-info"><span class="banner-label">Cara reservasi</span>${p.reserveInfo}</div>` : ``}
            ${p.nearby && p.nearby.length ? `<div class="nearby"><b>Rekomendasi tempat sekitar:</b> ${nearbyLine(p.nearby)}</div>` : ``}
            ${p.hotels && p.hotels.length ? `<div class="hotels"><b>Rekomendasi Hotel (Trip.com):</b> ${hotelsLine(p.hotels, dest.name)}</div>` : ``}
            ${placeLinks(p)}
          </div>
        </div>`;
    }).join('');

    groupEl.innerHTML = `
      <summary><span class="lampiran-group-title">${g.heading}</span>${CHEV}</summary>
      <div class="lampiran-group-body">${itemsHtml}</div>
    `;
    lampiranView.appendChild(groupEl);
  });

  lampiranView.querySelectorAll('.lampiran-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const item = cb.closest('.lampiran-item');
      const key = item.dataset.lampKey;
      lampStore[key] = cb.checked;
      item.classList.toggle('reviewed', cb.checked);
      saveLamp();
    });
  });

  lampiranView.querySelectorAll('.lampiran-item-head').forEach(head=>{
    const item = head.closest('.lampiran-item');
    if(item.classList.contains('intro')) return;
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.lampiran-check')) return;
      item.classList.toggle('open');
    });
  });

  return panel;
}

const cityTabsWrap = document.getElementById('city-tabs');
const cityPanelsWrap = document.getElementById('city-panels');

const AIRPORT_CODES = {nanjing:'NKG', wuxi:'WUX', hongkong:'HKG', xiamen:'XIA', ningbo2:'NB2'};
// Pengaman: kosongkan wadah dulu supaya tab/panel tidak dobel kalau HTML
// yang dibuka adalah salinan DOM yang sudah terender.
cityTabsWrap.innerHTML = '';
cityPanelsWrap.innerHTML = '';
destinations.forEach((dest,i)=>{
  const tabBtn = document.createElement('button');
  tabBtn.className = 'city-tab' + (i===0 ? ' active' : '');
  tabBtn.textContent = AIRPORT_CODES[dest.id] || dest.name.replace(/\s+/g,'').slice(0,3).toUpperCase();
  tabBtn.title = dest.name;
  tabBtn.setAttribute('aria-label', dest.name);
  tabBtn.dataset.city = dest.id;
  tabBtn.addEventListener('click', ()=>{
    document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
    tabBtn.classList.add('active');
    document.querySelectorAll('.city-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+dest.id).classList.add('active');
    setGlobalSubview('itinerary');
  });

  const panel = renderCity(dest);
  if(i===0) panel.classList.add('active');
  cityPanelsWrap.appendChild(panel);
});

/* Itinerary/Lampiran toggle lives once in the sticky header and controls
   whichever city panel is currently active — stays visible while scrolling. */
function setGlobalSubview(view){
  document.querySelectorAll('#global-subtabs .subtab-btn').forEach(b=>{
    const active = b.dataset.view === view;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  activePanel.querySelectorAll('.subview').forEach(v=>v.classList.remove('active'));
  activePanel.querySelector('.subview.'+view).classList.add('active');
  document.getElementById('dest-search').value = '';
  document.querySelectorAll('.search-hit').forEach(el=>el.classList.remove('search-hit'));
}
document.querySelectorAll('#global-subtabs .subtab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> setGlobalSubview(btn.dataset.view));
});

/* ---------------------------------------------------------
   TAB BUDGET — ringkasan budget tiap kota + total semua kota.
   Dibaca otomatis dari destinations[].budget (tidak perlu edit manual).
   Kategori dinormalisasi: Tiket masuk, Makan, Transport, Tiket HSR,
   Tiket pesawat (+ visa), Hotel — HSR/pesawat/hotel selalu terpisah.
--------------------------------------------------------- */
const BGT_CATS = [
  ['tiket','Tiket masuk'],
  ['makan','Makan'],
  ['transport','Transport lokal & antar-kota'],
  ['hsr','Tiket HSR'],
  ['pesawat','Tiket pesawat (+ visa)'],
  ['hotel','Hotel']
];
const BGT_RATE = {CNY:'Rp2.650', HKD:'Rp2.300'};
function bgtNum(s){
  const t = String(s == null ? '' : s).replace(/<[^>]*>/g,'').replace(/&[a-z]+;/g,'').replace(/[≈Rp\s*]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}
function bgtFmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function bgtClass(label){
  const l = String(label).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').toLowerCase();
  if(/grand|^total|subtotal/.test(l)) return 'skip';
  if(/hsr/.test(l)) return 'hsr';
  if(/pesawat|penerbangan|flight|visa/.test(l)) return 'pesawat';
  if(/^hotel/.test(l)) return 'hotel';
  if(/^tiket masuk/.test(l)) return 'tiket';
  if(/^makan/.test(l)) return 'makan';
  if(/^transport/.test(l)) return 'transport';
  return 'lain';
}
function bgtCityData(dest){
  const b = dest.budget || {};
  const rows = (b.byCategory && b.byCategory.length) ? b.byCategory : (b.byDay || []);
  const groups = {};
  let approx = false;
  rows.forEach(([l,c,i])=>{
    const k = bgtClass(l);
    if(k === 'skip' || k === 'lain') return;
    if(bgtNum(c) === 0 && bgtNum(i) === 0) return;
    if(String(c).indexOf('≈') !== -1) approx = true;
    (groups[k] = groups[k] || []).push({label:l, c:c, i:i});
  });
  let local = 0, idr = 0;
  const cats = {};
  BGT_CATS.forEach(([k])=>{
    const g = groups[k] || [];
    cats[k] = {local: g.reduce((s,r)=>s+bgtNum(r.c),0), idr: g.reduce((s,r)=>s+bgtNum(r.i),0)};
    local += cats[k].local; idr += cats[k].idr;
  });
  return {groups, cats, local, idr, approx};
}
function bgtEsc(s){ return String(s).replace(/&amp;/g,'&').replace(/&/g,'&amp;'); }
function renderBudgetTab(){
  const panel = document.createElement('div');
  panel.className = 'city-panel';
  panel.id = 'panel-budget';
  panel.innerHTML = '<div class="subview itinerary active"></div><div class="subview lampiran"></div>';
  const view = panel.querySelector('.subview.itinerary');
  const all = {};
  BGT_CATS.forEach(([k])=>{ all[k] = 0; });
  let grandIdr = 0;
  const cityRows = [];
  destinations.forEach(dest=>{
    if(!dest.budget) return;
    const cur = dest.currency || 'CNY';
    const d = bgtCityData(dest);
    const rowsHtml = BGT_CATS.map(([k,name])=>{
      const g = d.groups[k];
      if(!g || !g.length) return '';
      return g.map(r=>`<tr><td>${r.label}</td><td>${r.c || '—'}</td><td>${r.i || '—'}</td></tr>`).join('');
    }).join('');
    const el = document.createElement('details');
    el.className = 'budget-card';
    el.open = true;
    const shortDates = (dest.dates || '').split('·')[0].trim();
    el.innerHTML = `
      <summary><h3 class="serif">${dest.name} <span style="font-weight:400;font-size:.78em;opacity:.75">· ${shortDates} · mata uang ${cur}</span></h3>${CHEV}</summary>
      <div class="budget-card-body">
        <table class="budget">
          <thead><tr><th>Kategori</th><th>${cur}</th><th>IDR</th></tr></thead>
          <tbody>${rowsHtml}<tr class="grand"><td>GRAND TOTAL</td><td>${d.approx ? '≈' : ''}${bgtFmt(d.local)}</td><td>${bgtFmt(d.idr)}</td></tr></tbody>
        </table>
        <div class="budget-note">Kurs 1 ${cur} = ${BGT_RATE[cur] || '—'}.</div>
      </div>`;
    view.appendChild(el);
    BGT_CATS.forEach(([k])=>{ all[k] += d.cats[k].idr; });
    grandIdr += d.idr;
    cityRows.push({name: dest.name, cur: cur, local: d.local, approx: d.approx, idr: d.idr});
  });
  const sumRows = BGT_CATS.filter(([k])=>all[k] > 0).map(([k,name])=>`<tr><td>${name}</td><td>${bgtFmt(all[k])}</td></tr>`).join('');
  const cityHtml = cityRows.map(r=>`<tr><td>${r.name}</td><td>${r.cur}</td><td>${r.approx ? '≈' : ''}${bgtFmt(r.local)}</td><td>${bgtFmt(r.idr)}</td></tr>`).join('');
  const sum = document.createElement('details');
  sum.className = 'budget-card';
  sum.open = true;
  sum.innerHTML = `
    <summary><h3 class="serif">Total Semua Kota <span style="font-weight:400;font-size:.78em;opacity:.75">· dalam IDR</span></h3>${CHEV}</summary>
    <div class="budget-card-body">
      <div class="budget-sub">Summary per kategori seluruh kota (semua mata uang sudah dikonversi ke Rupiah).</div>
      <table class="budget">
        <thead><tr><th>Kategori</th><th>IDR</th></tr></thead>
        <tbody>${sumRows}<tr class="grand"><td>TOTAL SEMUA KOTA</td><td>${bgtFmt(grandIdr)}</td></tr></tbody>
      </table>
      <div class="budget-sub" style="margin-top:12px">Per kota (total lokal tidak dijumlah karena mata uang berbeda).</div>
      <table class="budget">
        <thead><tr><th>Kota</th><th>Mata uang</th><th>Total lokal</th><th>IDR</th></tr></thead>
        <tbody>${cityHtml}<tr class="grand"><td>TOTAL</td><td>—</td><td>—</td><td>${bgtFmt(grandIdr)}</td></tr></tbody>
      </table>
      <div class="budget-note">Komponen bertanda ⚠️ Estimasi masih perkiraan. Hotel Ningbo tidak dihitung (properti pribadi). Tiket pulang ke Jakarta ada di Ningbo 2; tiket pesawat Ningbo → Hong Kong ada di Hong Kong.</div>
    </div>`;
  view.appendChild(sum);
  return panel;
}
(function(){
  const btn = document.createElement('button');
  btn.className = 'city-tab';
  btn.textContent = 'BGT';
  btn.title = 'Budget';
  btn.setAttribute('aria-label', 'Budget');
  btn.dataset.city = '__budget';
  const panel = renderBudgetTab();
  cityPanelsWrap.appendChild(panel);
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.city-panel').forEach(p=>p.classList.remove('active'));
    panel.classList.add('active');
  });
  cityTabsWrap.appendChild(btn);
  cityTabsWrap.addEventListener('click', e=>{
    const b = e.target.closest('.city-tab');
    if(!b) return;
    document.getElementById('global-subtabs').style.display = (b.dataset.city === '__budget') ? 'none' : '';
  });
})();
</script>
