<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wisata Draft</title>
<style>
:root{
  --paper:#FAF7F0;
  --paper-raised:#FFFFFF;
  --ink:#1C2430;
  --ink-soft:#5B6472;
  --amber:#B9781F;
  --amber-ink:#7A5115;
  --amber-soft:#F1E0C4;
  --amber-soft-border:#E0C692;
  --amber-ink-light:#9C7238;
  --amber-soft-light:#F8EEDC;
  --amber-soft-light-border:#EDDBB0;
  --indigo:#2C4870;
  --indigo-ink:#FFFFFF;
  --indigo-soft:#E4EBF5;
  --jade:#4F7A6B;
  --jade-soft:#E1EDE7;
  --violet:#6B5CA5;
  --violet-soft:#EBE6F5;
  --border:#E4DDCC;
  --border-strong:#D2C8AE;
  --row-alt: rgba(44,72,112,.035);
  --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 16px rgba(28,36,48,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181F;
    --paper-raised:#1C222C;
    --ink:#EDE7DA;
    --ink-soft:#A7ADBB;
    --amber:#E0A354;
    --amber-ink:#F3D9AE;
    --amber-soft:#3A2E1A;
    --amber-soft-border:#5A4526;
    --amber-ink-light:#C9AD82;
    --amber-soft-light:#2A2416;
    --amber-soft-light-border:#443722;
    --indigo:#3E5F8F;
    --indigo-ink:#FFFFFF;
    --indigo-soft:#212C3D;
    --jade:#84BCA6;
    --jade-soft:#1D2E28;
    --violet:#B4A4E0;
    --violet-soft:#282137;
    --border:#2B323F;
    --border-strong:#3A4353;
    --row-alt: rgba(255,255,255,.03);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#14181F;
  --paper-raised:#1C222C;
  --ink:#EDE7DA;
  --ink-soft:#A7ADBB;
  --amber:#E0A354;
  --amber-ink:#F3D9AE;
  --amber-soft:#3A2E1A;
  --amber-soft-border:#5A4526;
  --amber-ink-light:#C9AD82;
  --amber-soft-light:#2A2416;
  --amber-soft-light-border:#443722;
  --indigo:#3E5F8F;
  --indigo-ink:#FFFFFF;
  --indigo-soft:#212C3D;
  --jade:#84BCA6;
  --jade-soft:#1D2E28;
  --border:#2B323F;
  --border-strong:#3A4353;
  --row-alt: rgba(255,255,255,.03);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:17px;}
html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;}
h1,h2,h3{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;
  text-wrap:balance;margin:0;
}
a{color:var(--indigo);}
button{font:inherit;}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 64px;}

/* page header */
header.top{
  position:fixed;top:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.top-inner{max-width:760px;margin:0 auto;padding:10px 14px 0;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.page-title{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;}
.page-title .page-sub-inline{font-weight:500;color:var(--ink-soft);font-size:.85rem;}
.top-actions{display:flex;gap:4px;flex:0 0 auto;}
.theme-toggle,.icon-btn{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;
  border:1px solid var(--border-strong);background:var(--paper-raised);
  color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.theme-toggle:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.theme-toggle svg,.icon-btn svg{width:13px;height:13px;}
.icon-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink);}
body.hide-reviewed .lampiran-item.reviewed{display:none;}
body.hide-reviewed table.itin tbody tr.done{display:none;}
.lampiran-item-head .lampiran-check{flex:0 0 auto;margin:0;}

/* city tabs (top hierarchy) */
.city-tabs{
  display:flex;gap:6px;overflow-x:auto;
  padding:8px 14px 8px;margin:0 -14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.city-tabs::-webkit-scrollbar{display:none;}
.city-tab{
  flex:0 0 auto;border:1px solid var(--border-strong);background:var(--paper-raised);
  color:var(--ink);padding:5px 13px;border-radius:99px;
  font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;
}
.city-tab.active{background:var(--indigo);color:var(--indigo-ink);border-color:var(--indigo);}
.city-tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

.search-row{margin:0 0 8px;}
.dest-search{
  width:100%;box-sizing:border-box;border:1px solid var(--border-strong);
  background:var(--paper-raised);color:var(--ink);border-radius:9px;
  padding:8px 12px;font-size:.85rem;font-family:inherit;
}
.dest-search::placeholder{color:var(--ink-soft);}
.dest-search:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
.search-hit{background:var(--amber-soft);outline:2px solid var(--amber);border-radius:4px;}

.city-panel{display:none;padding-top:12px;}
.city-panel.active{display:block;}
.city-dates{color:var(--ink-soft);font-size:.8rem;margin-bottom:12px;}

/* second-level: itinerary / lampiran (sticky, lives in header) */
.subtabs{display:flex;gap:5px;background:var(--paper-raised);border:1px solid var(--border);border-radius:9px;padding:3px;margin:0 0 8px;}
.subtab-btn{
  flex:1;border:none;background:transparent;color:var(--ink-soft);
  padding:6px 8px;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer;
}
.subtab-btn.active{background:var(--indigo);color:var(--indigo-ink);}
.subtab-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.subview{display:none;}
.subview.active{display:block;}

.section-heading{font-size:1.08rem;font-weight:700;margin:22px 0 10px;}
.section-heading:first-child{margin-top:0;}
.section-intro{color:var(--ink-soft);font-size:.88rem;margin-bottom:14px;line-height:1.6;}

/* ---- transport card, collapsible ---- */
details.transport{
  background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
}
details.transport > summary{
  list-style:none;cursor:pointer;padding:10px 12px;
  display:flex;align-items:center;gap:10px;
}
details.transport > summary::-webkit-details-marker{display:none;}
.transport-icon{
  flex:0 0 auto;width:32px;height:32px;border-radius:9px;
  background:var(--amber-soft);color:var(--amber-ink);
  display:flex;align-items:center;justify-content:center;
}
.transport-head-text{flex:1;min-width:0;}
.transport-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}
.transport-title{font-weight:700;font-size:.95rem;margin-top:1px;}
.transport-tag{flex:0 0 auto;font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:99px;}
.tag-ok{background:var(--jade-soft);color:var(--jade);}
.tag-tbd{background:var(--amber-soft);color:var(--amber-ink);}
.transport-body{border-top:1px solid var(--border);}
.chev{flex:0 0 auto;transition:transform .18s ease;color:var(--ink-soft);}
details[open] > summary .chev{transform:rotate(180deg);}

.flight-route{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;}
.route-city{text-align:left;}
.route-code{font-family:Georgia,serif;font-size:1.3rem;font-weight:700;letter-spacing:.02em;}
.route-name{font-size:.72rem;color:var(--ink-soft);margin-top:1px;}
.route-mid{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 8px;color:var(--amber);}
.route-line{width:100%;height:1px;background:var(--border-strong);position:relative;margin:3px 0;}
.route-line svg{position:absolute;right:-2px;top:-7px;}
.route-dur{font-size:.68rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.flight-meta{border-top:1px dashed var(--border-strong);display:grid;grid-template-columns:repeat(2,1fr);}
.flight-meta div{padding:8px 14px;border-bottom:1px solid var(--border);}
.flight-meta div:nth-last-child(-n+2){border-bottom:none;}
.flight-meta div:nth-child(odd){border-right:1px solid var(--border);}
.meta-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
.meta-value{font-size:.86rem;margin-top:2px;font-variant-numeric:tabular-nums;}
.flight-note{background:var(--indigo-soft);color:var(--ink);font-size:.82rem;padding:9px 14px;line-height:1.5;}
.flight-warn{background:var(--amber-soft);color:var(--amber-ink);font-size:.82rem;padding:9px 14px;line-height:1.5;border-top:1px solid var(--amber-soft-border);}
.transit-list{padding:8px 14px 2px;}
.transit-row{padding:7px 0;border-bottom:1px solid var(--border);}
.transit-row:last-child{border-bottom:none;}

/* ---- day table, collapsible ---- */
details.day{
  background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
details.day > summary{
  list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:12px;
  background:var(--jade-soft);
}
details.day > summary::-webkit-details-marker{display:none;}
.day-badge{
  flex:0 0 auto;width:40px;height:40px;border-radius:10px;
  background:var(--indigo);color:var(--indigo-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:700;font-size:1.1rem;
}
.day-head-text{flex:1;min-width:0;}
.day-toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.day-date{font-weight:700;font-size:1rem;}
.day-label{color:var(--ink-soft);font-size:.82rem;margin-top:1px;}
.day-progress{
  flex:0 0 auto;font-size:.72rem;font-variant-numeric:tabular-nums;
  color:var(--jade);background:var(--jade-soft);padding:3px 8px;border-radius:99px;font-weight:700;
}
.reserve-banner,.planb-banner,.info-banner{
  margin:12px 14px 14px;border:1px dashed var(--amber-soft-border);background:var(--amber-soft);
  color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.5;
}
.reserve-banner{margin:0 14px 12px;}
.info-banner{margin:0 14px 12px;}
.reserve-banner .banner-label,.planb-banner .banner-label,.info-banner .banner-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.cadangan-nearby{
  margin:0 14px 14px;border:1px dashed var(--amber-soft-light-border);background:var(--amber-soft-light);
  color:var(--amber-ink-light);border-radius:10px;padding:9px 12px;font-size:.82rem;line-height:1.5;
}
.cadangan-nearby .banner-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:var(--amber-ink-light);}

/* Hotel / Perhatian boxes inside a transport card's body (collapse with it) */
.hotel-banner{
  margin:12px 14px;border:1px dashed var(--amber-soft-border);background:var(--amber-soft);
  color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.5;
}
.warn-banner{
  margin:0 14px 14px;border:1px dashed var(--amber-soft-light-border);background:var(--amber-soft-light);
  color:var(--amber-ink-light);border-radius:10px;padding:9px 12px;font-size:.82rem;line-height:1.5;
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.table-scroll{overflow-x:auto;border-top:1px solid var(--border);-webkit-overflow-scrolling:touch;}
table.itin{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed;}
table.itin thead th{
  position:sticky;top:0;background:var(--indigo);color:var(--indigo-ink);
  font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
  text-align:left;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
table.itin thead th.col-pilih{text-align:center;padding-left:6px;padding-right:6px;}
table.itin thead th.col-num{text-align:right;}
table.itin tbody td{
  padding:11px 10px;font-size:.86rem;vertical-align:top;
  border-bottom:1px solid var(--border);
}
table.itin tbody tr:last-child td{border-bottom:none;}
table.itin tbody tr:nth-child(even){background:var(--row-alt);}
table.itin tbody tr.done td{color:var(--ink-soft);}
table.itin tbody tr.done .cell-dest{text-decoration:line-through;text-decoration-color:var(--border-strong);}
table.itin tfoot td{
  padding:10px 10px;font-size:.82rem;font-weight:700;border-top:2px solid var(--border-strong);
  background:var(--jade-soft);color:var(--jade);
}
table.itin tfoot .cell-valas,table.itin tfoot .cell-rupiah{font-variant-numeric:tabular-nums;text-align:right;}
.cell-pilih{text-align:center;padding-left:6px;padding-right:6px;}
.cell-pilih input{width:18px;height:18px;accent-color:var(--jade);cursor:pointer;}
.cell-jam{white-space:normal;overflow-wrap:break-word;word-break:break-word;padding-left:6px;padding-right:4px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.76rem;line-height:1.3;}
.cell-dest{overflow-wrap:break-word;word-break:break-word;}
.cell-ket{color:var(--ink);overflow-wrap:break-word;word-break:break-word;}
.cell-valas{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.cell-rupiah{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.dash{color:var(--border-strong);}

/* budget summary, collapsible */
details.budget-card{background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden;}
details.budget-card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
details.budget-card > summary::-webkit-details-marker{display:none;}
details.budget-card > summary h3{font-size:1rem;margin:0;}
.budget-card-body{padding:0 16px 16px;border-top:1px solid var(--border);}
.budget-sub{color:var(--ink-soft);font-size:.8rem;margin:12px 0;line-height:1.5;}
table.budget{border-collapse:collapse;width:100%;margin-bottom:14px;font-size:.87rem;}
table.budget th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:6px 4px;border-bottom:1px solid var(--border-strong);}
table.budget td{padding:7px 4px;border-bottom:1px solid var(--border);}
table.budget td:not(:first-child),table.budget th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;}
table.budget tr.grand td{font-weight:700;color:var(--jade);border-top:2px solid var(--border-strong);border-bottom:none;}
.budget-note{font-size:.8rem;color:var(--ink-soft);line-height:1.55;margin-top:2px;}

/* notes card, collapsible */
details.notes-card{background:var(--indigo-soft);border-radius:12px;font-size:.87rem;line-height:1.6;margin:16px 0;overflow:hidden;}
details.notes-card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;}
details.notes-card > summary::-webkit-details-marker{display:none;}
.notes-card-body{padding:0 16px 16px;}
.notes-card ul{margin:0;padding-left:18px;}
.notes-card li{margin-bottom:6px;}
.notes-card li:last-child{margin-bottom:0;}

/* Lampiran — every group (Sebelum Berangkat, Hari 1-4, Cadangan) is a
   collapsible box; places inside it are always expanded (simpler). */
.lampiran-group{background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.lampiran-group > summary{
  list-style:none;cursor:pointer;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.lampiran-group > summary::-webkit-details-marker{display:none;}
.lampiran-group[data-key^="h"] > summary{background:var(--jade-soft);}
.lampiran-group[data-key="cadangan"] > summary{background:var(--border);}
.lampiran-group-title{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;font-weight:700;font-size:1rem;}
.lampiran-group-body{border-top:1px solid var(--border);}

.lampiran-item{border-bottom:1px solid var(--border);padding:11px 16px 14px;}
.lampiran-item:last-child{border-bottom:none;}
.lampiran-item-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;cursor:pointer;}
.lampiran-item.intro .lampiran-item-head{cursor:default;}
.lampiran-item-head .place-tag{margin-bottom:0;flex:0 0 auto;}
.lampiran-item-title{flex:1;font-weight:400;font-size:.92rem;font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;}
.item-toggle{
  flex:0 0 auto;border:none;background:none;cursor:pointer;padding:4px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}
.item-toggle:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.lampiran-item.open .item-toggle .chev{transform:rotate(180deg);}
.copy-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.copy-btn{
  font-size:.72rem;font-weight:700;line-height:1;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:99px;background:var(--paper-raised);
  color:var(--indigo);padding:5px 10px;display:inline-flex;align-items:center;gap:4px;
  transition:background .15s,color .15s,border-color .15s;
}
.copy-btn:hover{background:var(--indigo-soft);}
.copy-btn.copied{background:var(--jade);border-color:var(--jade);color:var(--indigo-ink);}
.lampiran-item-body{padding:0;display:none;}
.lampiran-item.open .lampiran-item-body{display:block;}
.lampiran-item-body p{font-size:.89rem;color:var(--ink-soft);line-height:1.62;margin:0 0 10px;}

.lampiran-item.intro{padding:9px 16px 12px;}
.lampiran-item.intro .lampiran-item-head{margin-bottom:2px;}
.lampiran-item.intro .lampiran-item-body{display:block;}
.lampiran-item.intro .lampiran-item-title{
  font-size:.88rem;font-weight:700;color:var(--violet);font-family:inherit;
}
.lampiran-item.intro .lampiran-item-body p{font-size:.85rem;line-height:1.55;}

.place-tag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;margin-bottom:8px;font-weight:700;}
.tag-main{background:var(--jade-soft);color:var(--jade);}
.tag-planb{background:var(--amber-soft);color:var(--amber-ink);}
.tag-food{background:var(--indigo-soft);color:var(--indigo);}
.tag-planc{background:var(--border);color:var(--ink-soft);}
.tag-info{background:var(--violet-soft);color:var(--violet);}
.card-context{
  font-size:.83rem;font-style:italic;color:var(--amber-ink);
  background:var(--amber-soft);border-radius:8px;padding:8px 10px;
  margin-bottom:10px;line-height:1.5;
}
.reserve-info{
  background:var(--indigo-soft);border-radius:8px;padding:9px 11px;
  font-size:.83rem;line-height:1.55;color:var(--ink);margin:0 0 10px;
}
.reserve-info .banner-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--indigo);}
.nearby{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0 0 10px;padding-top:8px;border-top:1px solid var(--border);}
.nearby b{color:var(--ink);font-weight:700;}
.hotels{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0 0 10px;padding-top:8px;border-top:1px solid var(--border);}
.hotels b{color:var(--ink);font-weight:700;}
.hotels a{color:var(--indigo);text-decoration:none;font-weight:600;}
.hotels a:hover{text-decoration:underline;}
.place-links{display:flex;gap:8px;flex-wrap:wrap;}
.place-links a{
  font-size:.8rem;font-weight:700;text-decoration:none;
  border:1px solid var(--border-strong);border-radius:99px;
  padding:6px 13px;display:inline-flex;align-items:center;gap:5px;color:var(--ink);
}
.place-links a:hover{background:var(--indigo-soft);border-color:var(--indigo);}


@media (prefers-reduced-motion: reduce){.chev{transition:none;}}
</style>

<header class="top">
  <div class="top-inner">

const THEME_KEY = 'wisata-theme';
function systemTheme(){ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.innerHTML = t === 'dark' ? MOON_ICON : SUN_ICON;
}
let currentTheme = 'light';
applyTheme(currentTheme);
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, currentTheme);
  applyTheme(currentTheme);
});

function syncHeaderOffset(){
  const header = document.querySelector('header.top');
  const wrap = document.querySelector('.wrap');
  if(header && wrap) wrap.style.paddingTop = header.offsetHeight + 'px';
}
syncHeaderOffset();
window.addEventListener('resize', syncHeaderOffset);
new ResizeObserver(syncHeaderOffset).observe(document.querySelector('header.top'));

function setAllDetails(open){
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  const activeSubview = activePanel.querySelector('.subview.active');
  if(!activeSubview) return;
  activeSubview.querySelectorAll('details').forEach(d=>{ d.open = open; });
}

function searchDestinations(query){
  document.querySelectorAll('.search-hit').forEach(el=>el.classList.remove('search-hit'));
  const q = query.trim().toLowerCase();
  if(!q) return;
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  const activeSubview = activePanel.querySelector('.subview.active');
  if(!activeSubview) return;
  const candidates = [...activeSubview.querySelectorAll('.cell-dest, .lampiran-item-title')];
  const matches = candidates.filter(el => el.textContent.toLowerCase().includes(q));
  matches.forEach(el=>{
    el.classList.add('search-hit');
    const det = el.closest('details');
    if(det) det.open = true;
  });
  if(matches.length) matches[0].scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('dest-search').addEventListener('input', (e)=> searchDestinations(e.target.value));
document.getElementById('collapse-all-btn').addEventListener('click', ()=>{
  setAllDetails(false);
  window.scrollTo(0,0);
});
document.getElementById('expand-all-btn').addEventListener('click', ()=> setAllDetails(true));

const HIDE_REVIEWED_KEY = 'wisata-hide-reviewed';
let hideReviewed = localStorage.getItem(HIDE_REVIEWED_KEY) === '1';
function applyHideReviewed(){
  document.body.classList.toggle('hide-reviewed', hideReviewed);
  const btn = document.getElementById('hide-reviewed-btn');
  btn.classList.toggle('active', hideReviewed);
  btn.setAttribute('aria-pressed', hideReviewed ? 'true' : 'false');
}
applyHideReviewed();
document.getElementById('hide-reviewed-btn').addEventListener('click', ()=>{
  hideReviewed = !hideReviewed;
  localStorage.setItem(HIDE_REVIEWED_KEY, hideReviewed ? '1' : '0');
  applyHideReviewed();
});

/* Downloads a static snapshot of the current page. The app rebuilds all
   its DOM from `destinations` + localStorage on every load, so baking
   `checked` attributes into cloned <input>s would just get discarded by
   that rebuild — instead, inject a tiny seed script (before the main
   script) that pre-populates localStorage with the CURRENT progress if
   the browser opening the file doesn't already have its own (so it
   carries over on a new device/browser, but won't clobber newer progress
   if this same downloaded file is reopened later). */
document.getElementById('download-html-btn').addEventListener('click', ()=>{
  const clone = document.documentElement.cloneNode(true);
  // Tab & panel kota dibangun ulang oleh script saat file dibuka — kosongkan
  // di salinan supaya tidak dobel (dan file hasil download jadi jauh lebih kecil).
  clone.querySelector('#city-tabs').innerHTML = '';
  clone.querySelector('#city-panels').innerHTML = '';
  const seed = document.createElement('script');
  seed.textContent =
    'try{' +
    'if(!localStorage.getItem(' + JSON.stringify(STORE_KEY) + '))' +
    ' localStorage.setItem(' + JSON.stringify(STORE_KEY) + ',' + JSON.stringify(JSON.stringify(store)) + ');' +
    'if(!localStorage.getItem(' + JSON.stringify(LAMP_STORE_KEY) + '))' +
    ' localStorage.setItem(' + JSON.stringify(LAMP_STORE_KEY) + ',' + JSON.stringify(JSON.stringify(lampStore)) + ');' +
    '}catch(e){}';
  const mainScript = clone.querySelector('script');
  mainScript.parentNode.insertBefore(seed, mainScript);
  const html = '<!doctype html>\n' + clone.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Wisata Draft.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* Copy-to-clipboard buttons for Lampiran place names (Amap/Google Maps).
   Values live in copyMap (plain JS strings, never HTML-embedded) so
   names with special characters can't break the markup — buttons only
   carry a numeric index into it. */
const copyMap = [];
function copyBtnsHtml(nameEn, nameHanzi){
  if(!nameEn) return '';
  const enIdx = copyMap.push(nameEn) - 1;
  let html = `<button type="button" class="copy-btn" data-copy-idx="${enIdx}" title="Salin nama Inggris untuk Google Maps">📋 EN</button>`;
  if(nameHanzi){
    const hzIdx = copyMap.push(nameHanzi) - 1;
    html += `<button type="button" class="copy-btn" data-copy-idx="${hzIdx}" title="Salin nama Hanzi untuk Amap">📋 中文</button>`;
  }
  return `<div class="copy-row">${html}</div>`;
}
/* Salin SEMUA destinasi satu kota (Hari 1 s/d terakhir + Cadangan) jadi 1 daftar.
   Entri yang sudah di-tick (tanda "sudah ditinjau") diberi awalan "X ". Dibaca
   saat tombol ditekan, jadi selalu mengikuti tick terbaru. */
function copyAllText(destId, lang){
  const dest = destinations.find(d=>d.id===destId);
  if(!dest) return '';
  const seen = new Map();
  dest.lampiran.forEach(p=>{
    if(p.group === 'intro' || p.tag === 'food') return;
    const name = lang === 'zh' ? p.nameHanzi : p.nameEn;
    if(!name) return;
    const ticked = !!lampStore[lampiranKey(destId, p.title)];
    seen.set(name, (seen.get(name) || false) || ticked);
  });
  return [...seen].map(([n,t])=>(t ? 'X ' : '') + n).join('\n');
}
function copyAllBtnsHtml(destId){
  return `<div class="copy-row">
    <button type="button" class="copy-btn" data-copy-all="en" data-dest="${destId}" title="Salin semua destinasi (nama Inggris); yang sudah di-tick diberi awalan X">📋 EN</button>
    <button type="button" class="copy-btn" data-copy-all="zh" data-dest="${destId}" title="Salin semua destinasi (nama Hanzi); yang sudah di-tick diberi awalan X">📋 中文</button>
  </div>`;
}
function titleHtml(p){
  const t = p.title || '';
  if(p.nameEn){
    const enEsc = p.nameEn.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(t.startsWith(enEsc)) return `<b>${enEsc}</b>${t.slice(enEsc.length)}`;
  }
  return `<b>${t}</b>`;
}
function legacyCopy(text){
  // Fallback for contexts where navigator.clipboard is blocked (sandboxed
  // iframe without a "clipboard-write" Permissions-Policy allowance,
  // document not focused, older browsers, etc).
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const text = btn.dataset.copyAll
    ? copyAllText(btn.dataset.dest, btn.dataset.copyAll)
    : copyMap[+btn.dataset.copyIdx];
  if(text == null || text === '') return;
  const orig = btn.innerHTML;
  const showResult = ok=>{
    btn.textContent = ok ? 'Tersalin ✓' : 'Gagal, coba lagi';
    if(ok) btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML = orig; btn.classList.remove('copied'); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showResult(true)).catch(()=>showResult(legacyCopy(text)));
  } else {
    showResult(legacyCopy(text));
  }
});
function nearbyLine(items){
  // Plain text, no Google Maps link — names are already written in
  // Amap-searchable "English (Hanzi)" form in the source .md, meant for
  // the reader to copy-paste manually into Amap/Google Maps themselves.
  if(!items || !items.length) return '';
  return items.join(', ');
}
function tripComLink(name, city){
  return 'https://www.google.com/search?q=' + encodeURIComponent('site:trip.com ' + name + ' ' + city);
}
function hotelsLine(items, city){
  if(!items || !items.length) return '';
  return items.map(txt=>{
    const name = txt.split(' — ')[0].split(' (')[0];
    return `<a href="${tripComLink(name, city)}" target="_blank" rel="noopener">${txt}</a>`;
  }).join(', ');
}

    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Suzhou`,
       nameEn:`Cerita Kota Suzhou`,
       text:`Suzhou didirikan tahun 514 SM oleh Raja Helü dari Kerajaan Wu sebagai ibu kota "Helü City" — jauh lebih tua dari Nanjing sebagai pusat kekuasaan di kawasan ini, dan menjadi cikal-bakal tata kota tua Suzhou yang masih terlihat sampai sekarang. Berkat jaringan kanalnya yang rumit dan taman-taman klasiknya, Suzhou dijuluki "Venice of the East" dan sering disebut bersama Hangzhou sebagai "surga di bumi" (上有天堂，下有苏州杭州).`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+China+history+canal+city`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Oktober adalah salah satu bulan terbaik berkunjung — sejuk (siang ±23°C, malam ±14-16°C), kelembapan ±71%, hujan ringan ±9-10 hari sepanjang bulan. ⚠️ September-Oktober juga musim topan paling mungkin di kawasan pesisir timur China — angka di atas rata-rata historis, BUKAN forecast real-time, cek forecast H-7 sebelum berangkat.`,
       wiki:`https://en.climate-data.org/asia/china/jiangsu/suzhou-2755/`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Suzhou tidak punya bandara besar sendiri — pelancong umumnya masuk lewat Shanghai (Hongqiao/Pudong) lalu HSR ke Suzhou. Stasiun HSR utama: <b>Suzhou Railway Station (苏州站 · Sūzhōu Zhàn)</b> di Gusu District, ±2,8km dari pusat kota — inilah yang dipakai untuk leg pulang ke Ningbo di itinerary ini. Ada juga <b>Suzhou North Railway Station (苏州北站 · Sūzhōu Běi Zhàn)</b> di Xiangcheng District, ±16km dari pusat kota — jauh lebih jauh, hanya relevan kalau transportasi datang/pergi dari stasiun itu.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_railway_station`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Gusu District sisi selatan, sekitar Shiquan Street/Nanmen</b> — strategis karena 1 halte MRT (Line 5) dari kluster Panmen, dan dekat jalur transfer ke Line 2/4 menuju kota tua bagian utara. Alternatif lain: sekitar Guanqian Street/Xuanmiao Temple untuk yang mengutamakan pusat kota tua yang lebih ramai &amp; komersial.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Suzhou`,
       nameEn:`Destinasi Terkenal Lain di Suzhou`,
       text:`Di luar itinerary utama: <b>Tiger Hill (虎丘 · Hǔqiū)</b> — bukit dengan pagoda miring ("Leaning Tower of China"), salah satu ikon Suzhou paling terkenal. <b>Zhouzhuang</b> dan <b>Tongli</b> — kota air kuno ±30-50 menit di luar Suzhou, populer sebagai day-trip terpisah tapi tidak masuk trip kali ini (terlalu jauh dari rute). <b>Suzhou Industrial Park</b> di sekitar Jinji Lake — wajah modern kota ini, kontras dengan kota tua.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Suzhou+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Songshu Guiyu (松鼠桂鱼 · Sōngshǔ Guìyú, "squirrel fish")</b> — hidangan ikon Suzhou, ikan mandarin digoreng berbentuk menyerupai tupai dengan saus asam-manis, cukup berminyak jadi perlu dibatasi. <b>Suzhou-style mooncake (苏式月饼 · Sū Shì Yuèbǐng)</b> — versi berlapis renyah, lebih ringan dari versi Kanton. <b>Zhagao (糖粥/赤豆糊 · Tángzhōu/Chìdòu Hú)</b> — bubur kacang merah manis, jajanan jalanan klasik. Masakan Suzhou umumnya masuk gaya "Jiangnan" yang cenderung manis-ringan dibanding daerah lain di China — relatif lebih ramah untuk lambung dibanding masakan pedas.`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. Taman-taman klasik (Humble Administrator's Garden, dll) cukup ramai di akhir pekan — datang lebih pagi kalau bisa. September-Oktober musim topan, cek forecast rutin.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram. Salinan paspor/visa (fisik &amp; digital).`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Shiquan Street (十全街 · Shíquán Jiē)`,
       nameEn:`Shiquan Street`,
       nameHanzi:`十全街`,
       text:`Jalan kuliner dan hiburan malam klasik Suzhou, membentang di sisi selatan kota tua persis di depan hotel — dikenal dengan restoran, bar, dan toko kerajinan tangan yang menyatu dengan suasana kanal &amp; arsitektur tradisional di sekitarnya. Nama hotel trip ini ("Shiquan Street·Wangshi Garden") merujuk langsung ke jalan ini. <b>Akses:</b> Langsung di depan/sangat dekat hotel — tidak perlu transportasi, cukup jalan kaki. <b>Jam Operasional:</b> jalan buka 24 jam; mayoritas resto/toko ±10:00–22:00 (beberapa bar buka lebih malam). <b>Tiket:</b> Gratis jalan di sepanjang jalan.`,
       wiki:`https://www.google.com/search?q=Shiquan+Street+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Shiquan+Street+Suzhou`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`The Oriental Gate / Gate of the Orient (东方之门 · Dōngfāng Zhī Mén)`,
       nameEn:`The Oriental Gate / Gate of the Orient`,
       nameHanzi:`东方之门`,
       text:`Gedung pencakar langit berbentuk gerbang raksasa (dijuluki warga lokal "celana panjang" karena bentuknya) yang jadi landmark arsitektur kontroversial-tapi-ikonik Suzhou modern, selesai dibangun 2015 di tepi Jinji Lake sebagai simbol gerbang masuk ke distrik bisnis baru. Dijadwalkan dilihat sore/malam (bukan pagi) di itinerary ini — gedung kaca ini lebih menarik dilihat saat lampu mulai menyala, dan lokasinya persis searah jalan ke titik nonton Music Fountain. <b>Akses:</b> Stasiun Dongfangzhimen (东方之门) — gedung ini punya stasiun MRT sendiri, tersambung langsung. Sisi barat Jinji Lake. Dari hotel: <b>Line 5 → transfer → Line 3</b> (terverifikasi Amap, 6 halte, ¥3/org, ±32 menit — koreksi dari klaim lama "transfer ke Line 1"). <b>Jam Operasional:</b> area luar/lihat dari luar bisa kapan saja; bangunan sendiri fungsinya hotel/kantor/residensial (bukan objek wisata dengan jam buka publik). Paling bagus dilihat menjelang malam saat lampu gedung menyala. <b>Tiket:</b> Gratis, lihat dari luar saja.`,
       wiki:`https://en.wikipedia.org/wiki/Gate_of_the_Orient`,
       yt:`https://www.youtube.com/results?search_query=Gate+of+the+Orient+Suzhou`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Jinji Lake (金鸡湖 · Jīnjī Hú)`,
       nameEn:`Jinji Lake`,
       nameHanzi:`金鸡湖`,
       text:`Danau alami seluas ±8.9 km² yang jadi jantung Suzhou Industrial Park — kawasan kota baru modern hasil kerja sama China-Singapura sejak 1994. Promenadenya menampilkan taman modern, gedung pencakar langit, dan jembatan-jembatan kontemporer, representasi wajah Suzhou masa kini. Lakeside Avenue di sisi barat sepanjang ±2km jadi jalur jalan kaki utama. <b>Akses:</b> Stasiun Dongfangzhimen (sisi barat/West Gate, dari hotel via Line 5→transfer Line 3 — lihat entri Gate of the Orient) atau Stasiun Cultural Expo Center (sisi timur). <b>Jam Operasional:</b> promenade &amp; tepi danau buka 24 jam. <b>Tiket:</b> Gratis masuk &amp; jalan di tepi danau; wahana berbayar (Ferris wheel, cruise) terpisah dan tidak dihitung di itinerary ini.`,
       wiki:`https://en.wikipedia.org/wiki/Jinji_Lake`,
       yt:`https://www.youtube.com/results?search_query=Jinji+Lake+Suzhou+promenade`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Jinji Lake Music Fountain (金鸡湖音乐喷泉 · Jīnjī Hú Yīnyuè Pēnquán)`,
       nameEn:`Jinji Lake Music Fountain`,
       nameHanzi:`金鸡湖音乐喷泉`,
       text:`Salah satu air mancur musikal terbesar di Asia saat diresmikan, dengan pertunjukan cahaya &amp; air yang disinkronkan musik setiap malam — jadi daya tarik gratis paling populer di kawasan Jinji Lake untuk warga lokal maupun turis. <b>Akses:</b> Stasiun Dongfangzhimen — lokasi di persimpangan Suyalu Road &amp; Xingyang Street, kawasan Lakeside New World, dekat Gate of the Orient. <b>Jam Operasional:</b> ⚠️ jadwal bervariasi musiman &amp; sumbernya sedikit tidak konsisten — per sumber terbaru: Jumat &amp; Sabtu 19:30 (durasi ±30 menit), tambahan sesi saat libur nasional. Hari 2 itinerary ini sengaja jatuh di hari <b>Sabtu</b> supaya pertunjukan terjamin ada. Pertunjukan dibatalkan saat cuaca buruk. <b>Cek jadwal WeChat/website resmi Jinji Lake Scenic Area H-1</b> untuk konfirmasi terakhir. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Jinji+Lake+Music+Fountain`,
       yt:`https://www.youtube.com/results?search_query=Jinji+Lake+Music+Fountain+Suzhou`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`Suzhou Centre Plaza / Suzhou Center (苏州中心 · Sūzhōu Zhōngxīn)`,
       nameEn:`Suzhou Centre Plaza / Suzhou Center`,
       nameHanzi:`苏州中心`,
       context:`Kenapa jadi Plan-B: TIDAK termasuk destinasi wisata utama (prinsip itinerary ini menghindari sesi belanja), tapi lokasinya di tepi Jinji Lake — pilihan praktis untuk berteduh kalau hujan deras.`,
       text:`Mal besar di tepi Jinji Lake dengan atap gelombang khas ("cloud roof") yang jadi salah satu ikon arsitektur baru Suzhou, plus taman atap (rooftop garden) dengan pemandangan langsung ke Gate of the Orient. <b>Akses:</b> Stasiun Dongfangzhimen, keluar Exit 3 — tersambung langsung ke mal, tidak perlu keluar ke jalan. <b>Jam Operasional:</b> 10:00–22:00 setiap hari. <b>Tiket:</b> Gratis masuk (mal), bukan sesi belanja di itinerary ini.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Center`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Center+Mall+Jinji+Lake`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Suzhou Museum (苏州博物馆 · Sūzhōu Bówùguǎn)`,
       nameEn:`Suzhou Museum`,
       nameHanzi:`苏州博物馆`,
       text:`Dirancang oleh arsitek kelahiran Suzhou I.M. Pei (juga arsitek Piramida Kaca Louvre), dibuka 2006 sebagai proyek terakhir karir panjangnya. Bangunan ini memadukan estetika taman klasik Suzhou (dinding putih, atap abu-abu, kolam batu) dengan garis geometris modern — letaknya pun sengaja bersebelahan dengan Humble Administrator's Garden supaya menyatu dengan lanskap kota tua. <b>Akses:</b> Stasiun Beisita (北寺塔, Line 4), keluar Exit 4, jalan kaki ±700m ke timur. Dari hotel: Nanyuanbeilu (Line 5) → Nanmen → transfer Line 4 → Beisita, ±25-30 menit. Alternatif: Stasiun Humble Administrator's Garden·Suzhou Museum (Line 6). <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00), tutup setiap Senin kecuali libur nasional. <b>Tiket:</b> Gratis (sejak 18 Mei 2008); sebagian pameran khusus mungkin berbayar terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Museum`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Museum+I.M.+Pei+tour`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Guanqian Street (观前街 · Guānqián Jiē)`,
       nameEn:`Guanqian Street`,
       nameHanzi:`观前街`,
       text:`Guanqian Street ('jalan di depan kelenteng') berkembang sejak Dinasti Song sebagai pusat perdagangan di depan Xuanmiao Temple, dan sekarang jadi salah satu pedestrian street belanja &amp; jajanan tersibuk di Suzhou. <b>Akses:</b> Stasiun Chayuanchang (察院场, Line 4), keluar Exit 2, jalan kaki ±450m ke utara. ✅ Dari Beisita: <b>1 halte MRT Line 4 ke Chayuanchang</b> (koreksi 2026-09-20 — sebelumnya diklaim "jalan kaki singkat dari Beisita", padahal jaraknya 2,5km/10 menit naik mobil, terlalu jauh untuk jalan kaki). <b>Jam Operasional:</b> jalan pedestrian buka 24 jam (gratis); toko &amp; kios umumnya ±09:00–22:00. <b>Tiket:</b> Gratis jalan di pedestrian street.`,
       wiki:`https://en.wikipedia.org/wiki/Xuanmiao_Temple`,
       yt:`https://www.youtube.com/results?search_query=Guanqian+Street+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xuanmiao Temple (玄妙观 · Xuánmiào Guàn)`,
       nameEn:`Xuanmiao Temple`,
       nameHanzi:`玄妙观`,
       text:`Salah satu kelenteng Tao tertua &amp; terbesar di China, pertama dibangun tahun 276 M, terletak persis di tengah Guanqian Street. Aula utamanya, Sanqing Hall, adalah bangunan kayu Dinasti Song asli yang masih berdiri. <b>Akses:</b> Sama dengan Guanqian Street (lihat entri sebelumnya) — kelenteng ini persis di tengah jalan tersebut, Stasiun Chayuanchang (Line 4) Exit 2, ±450m jalan kaki. <b>Jam Operasional:</b> Mei–September 07:30–17:00 (masuk terakhir 16:45); Oktober–April 07:30–16:30 (masuk terakhir 16:15). <b>Tiket:</b> Pelataran luar gratis; masuk aula utama (Sanqing Hall) CNY 20/org (±Rp53.000/org).`,
       wiki:`https://en.wikipedia.org/wiki/Xuanmiao_Temple`,
       yt:`https://www.youtube.com/results?search_query=Xuanmiao+Temple+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Humble Administrator's Garden (拙政园 · Zhuōzhèng Yuán)`,
       nameEn:`Humble Administrator's Garden`,
       nameHanzi:`拙政园`,
       text:`Taman klasik terbesar di Suzhou (±5.2 hektar) dan situs UNESCO World Heritage, dibangun tahun 1509 oleh pejabat Dinasti Ming, Wang Xianchen, setelah pensiun kecewa dari birokrasi — namanya diambil dari puisi era Jin yang menyindir "mengurus kebun adalah politik orang bodoh". Desainnya berpusat pada kolam-kolam besar dengan paviliun, jembatan, dan koridor. <b>Akses:</b> Stasiun Zhuozhengyuan·Suzhou Museum (拙政园·苏州博物馆, Line 6), keluar Exit 1, jalan kaki ±450m — satu kompleks dengan Suzhou Museum. Dari Guanqian Street (rute Hari 3 ini): ✅ <b>terverifikasi Amap</b> — rute transit (jalan 247m→Chayuanchang→Line 4→Beisita→jalan ±19 menit) ±29 menit; <b>sewa sepeda</b> direkomendasikan sebagai alternatif lebih cepat untuk jarak ±2,5km ini. <b>Jam Operasional:</b> 1 Maret–15 November 07:30–17:30; 16 November–akhir Februari 07:30–17:00. <b>Tiket:</b> Musim ramai (April–Mei, Juli–Oktober) CNY 80/org (±Rp212.000/org) — cocok dengan yang dipakai di itinerary ini; musim sepi CNY 70/org (±Rp185.500/org). Pelajar/lansia setengah harga.`,
       wiki:`https://en.wikipedia.org/wiki/Humble_Administrator%27s_Garden`,
       yt:`https://www.youtube.com/results?search_query=Humble+Administrator%27s+Garden+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Pingjiang Road (平江路 · Píngjiāng Lù)`,
       nameEn:`Pingjiang Road`,
       nameHanzi:`平江路`,
       text:`Jalan kanal yang tata letaknya nyaris tidak berubah sejak peta kota era Dinasti Song (1229) — salah satu bukti tata kota kuno yang paling terjaga di China. Menyusuri kanal sepanjang ±1.6km dengan jembatan batu, rumah putih-abu tradisional, dan teahouse kecil. <b>Akses:</b> Stasiun Xiangmen (相门, Line 1), keluar Exit 3, jalan kaki ±350m. Dari kluster Beisita/Guanqian, transfer ke Line 1 dulu. <b>Jam Operasional:</b> jalan kanal buka 24 jam (gratis); mayoritas toko/teahouse tutup ±22:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Pingjiang_Road`,
       yt:`https://www.youtube.com/results?search_query=Pingjiang+Road+Suzhou+night`},
      {group:`h3`, tag:`planb`, label:`Plan-B H3`, title:`Huqiu Wetland Park (虎丘湿地公园 · Hǔqiū Shīdì Gōngyuán)`,
       nameEn:`Huqiu Wetland Park`,
       nameHanzi:`虎丘湿地公园`,
       context:`Kenapa jadi Plan-B: gratis, alternatif praktis kalau ingin mengurangi satu spot berbayar hari itu.`,
       text:`Taman lahan basah di sekitar kawasan Tiger Hill (Huqiu), dikembangkan sebagai ruang hijau publik gratis dengan jalur air &amp; vegetasi alami, luas ±12 km² — kontras dengan taman klasik berbayar di sekitarnya. Rumah bagi 200+ spesies burung. <b>Akses:</b> Stasiun Sunwu Memorial Museum (孙武纪念苑, Line 4), keluar Exit 2, jalan kaki ±15 menit — searah kluster Line 4 Hari 3 ini. <b>Jam Operasional:</b> ±06:00–20:00 setiap hari. <b>Tiket:</b> Gratis (beberapa aktivitas tambahan di dalam mungkin berbayar).`,
       wiki:`https://www.google.com/search?q=Huqiu+Wetland+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Huqiu+Wetland+Park+Suzhou`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Wumen Bridge (吴门桥 · Wúmén Qiáo)`,
       nameEn:`Wumen Bridge`,
       nameHanzi:`吴门桥`,
       text:`Jembatan batu tertinggi di Suzhou (dibangun awal abad ke-11), berdiri di dekat Panmen Gate — salah satu peninggalan arsitektur kanal kuno Suzhou yang menghubungkan area gerbang kota dengan permukiman sekitarnya, bebas dikunjungi sebagai bagian dari jalan santai kawasan Panmen. <b>Akses:</b> Satu kawasan dengan Panmen Scenic Spots (lihat entri berikutnya) — persis 1 halte MRT dari hotel via Nanmen (Line 5). <b>Jam Operasional:</b> area jembatan bisa dilihat/dilewati kapan saja sebagai bagian jalan umum; untuk masuk ke sisi dalam kompleks Panmen ikuti jam operasional Panmen. <b>Tiket:</b> Gratis (melihat/menyeberangi jembatan dari luar kompleks berbayar Panmen).`,
       wiki:`https://www.google.com/search?q=Wumen+Bridge+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Wumen+Bridge+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Panmen Scenic Spots (盘门景区 · Pánmén Jǐngqū)`,
       nameEn:`Panmen Scenic Spots`,
       nameHanzi:`盘门景区`,
       text:`Satu-satunya gerbang kota kuno di China yang menggabungkan gerbang air DAN gerbang darat dalam satu struktur — mencerminkan kota Suzhou yang sejak awal dibangun mengelilingi jaringan kanal. Sejarahnya bermula era Kerajaan Wu (abad ke-6 SM), dengan struktur yang berdiri sekarang direkonstruksi era Dinasti Yuan-Ming. Kompleksnya juga mencakup Ruiguang Pagoda dan Wumen Bridge. <b>Akses:</b> Stasiun Nanmen (南门, Line 4 &amp; Line 5) — persis <b>1 halte MRT dari hotel via Line 5</b> (koreksi dari draft lama yang mengasumsikan perjalanan lebih jauh), atau jalan kaki ±1,2km/17 menit. <b>Jam Operasional:</b> 07:30–17:30 setiap hari. <b>Tiket:</b> CNY 40/org (±Rp106.000/org) — cocok dengan yang dipakai di itinerary ini; beli online lebih murah beberapa yuan.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_city_wall`,
       yt:`https://www.youtube.com/results?search_query=Panmen+Gate+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Hanshan Temple (寒山寺 · Hánshān Sì)`,
       nameEn:`Hanshan Temple`,
       nameHanzi:`寒山寺`,
       text:`Kuil Buddha yang jadi terkenal berkat puisi Dinasti Tang "Malam Berlabuh di Maple Bridge" (枫桥夜泊 · Fēngqiáo Yèbó) karya Zhang Ji, yang menggambarkan suara lonceng kuil ini terdengar hingga ke perahu di kanal — puisi itu sendiri jadi salah satu karya sastra China paling dikenal. Kuil aslinya dibangun era Dinasti Liang (abad ke-6), sudah beberapa kali hancur &amp; dibangun ulang, terakhir era Qing. <b>Akses:</b> Stasiun Shantangjie (山塘街, Line 2), keluar Exit 3, jalan kaki ±15 menit. ⚠️ <b>Koreksi 2026-09-20 (terverifikasi Amap)</b>: dari hotel/Nanmen BUKAN via Laodonglu/Line 2 seperti klaim lama — rute sebenarnya <b>Nanmen → Line 4 → transfer di Sujin → Line 6 → Shantangjie</b> (9 halte, ¥3/org, ±39 menit). <b>Jam Operasional:</b> 07:30–17:30 (masuk terakhir 16:30); tanggal 1 &amp; 15 penanggalan lunar buka lebih awal jam 07:00. <b>Tiket:</b> Musim ramai (April–Oktober) CNY 20/org dewasa, CNY 10/org pelajar/lansia (±Rp53.000/26.500); musim sepi (November–Maret) CNY 15/CNY 8/org (±Rp39.750/21.200).`,
       wiki:`https://en.wikipedia.org/wiki/Hanshan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Hanshan+Temple+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Fengqiao Scenic Area (枫桥景区 · Fēngqiáo Jǐngqū)`,
       nameEn:`Fengqiao Scenic Area`,
       nameHanzi:`枫桥景区`,
       text:`Kawasan Maple Bridge (Fengqiao) yang jadi latar puisi terkenal Zhang Ji di atas — bersebelahan langsung dengan Hanshan Temple. Area sekitar jembatan &amp; kanal bisa dinikmati gratis sambil membayangkan suasana yang diabadikan dalam puisi 1.200 tahun lalu. ⚠️ Catatan: meski sering dikira satu tempat dengan Hanshan Temple, keduanya scenic spot terpisah dengan tiket masing-masing. <b>Akses:</b> Persis bersebelahan dengan Hanshan Temple (lihat entri sebelumnya) — akses &amp; rute sama. <b>Jam Operasional:</b> Maret–Oktober 06:00–21:30; November–Februari 06:30–21:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Maple_Bridge`,
       yt:`https://www.youtube.com/results?search_query=Fengqiao+Scenic+Area+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Shantang Street (七里山塘 · Qīlǐ Shāntáng)`,
       nameEn:`Shantang Street`,
       nameHanzi:`七里山塘`,
       text:`Dijuluki "Jalan Kuno No.1 Suzhou", dibangun tahun 825 M atas perintah penyair sekaligus gubernur Bai Juyi untuk menghubungkan kota dengan Tiger Hill sepanjang ±7 li (±3.6km). Sepanjang kanal berjejer rumah tradisional, jembatan batu era Ming-Qing, dan toko-toko kecil. <b>Akses:</b> Stasiun Shantang Street (山塘街, Line 2), keluar Exit 3 — langsung di depan jalan, satu jalur dengan Hanshan Temple. <b>Jam Operasional:</b> jalan buka 24 jam (gratis); toko/atraksi umumnya ±09:00–22:00; boating 08:00–17:00 &amp; 18:00–20:00. <b>Tiket:</b> Gratis jalan di sepanjang jalan. Boat tour terpisah — lihat entri <b>Suzhou Ancient Canal Night Cruise</b> di bawah untuk versi malam yang dipakai di Hari 4.`,
       wiki:`https://en.wikipedia.org/wiki/Shantang_Street`,
       yt:`https://www.youtube.com/results?search_query=Shantang+Street+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Suzhou Ancient Canal Night Cruise (苏州古运河夜游 · Sūzhōu Gǔ Yùnhé Yèyóu)`,
       nameEn:`Suzhou Ancient Canal Night Cruise`,
       nameHanzi:`苏州古运河夜游`,
       text:`Perahu wisata menyusuri kanal kuno Suzhou di malam hari, berangkat dari dermaga di kawasan Shantang Street (Baijuyi Wharf) — versi malam dijuluki "Oriental Venice" karena suasana lampion &amp; bangunan tepi kanal yang menyala. Cara paling santai untuk melihat kota tua dari sisi air, pelengkap jalan kaki di Shantang Street. <b>Akses:</b> Naik dari dermaga di Shantang Street (山塘街, Line 2, Exit 3) — sama persis dengan akses Shantang Street, tidak perlu transportasi tambahan. <b>Jam Operasional:</b> boating 08:00–17:00 (siang) &amp; 18:00–20:00 (malam); durasi tiap sesi ±40 menit–1 jam. <b>Tiket:</b> Siang CNY 55/org (±Rp145.750/org), malam "Oriental Venice" CNY 100/org (±Rp265.000/org) — versi malam yang dipakai di Hari 4 itinerary ini.`,
       wiki:`https://www.tripadvisor.com/AttractionProductReview-g297442-d20003384-Suzhou_Ancient_Grand_Canal_Cruise_Experience-Suzhou_Jiangsu.html`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Ancient+Canal+Night+Cruise+Shantang`},
      {group:`h4`, tag:`planb`, label:`Plan-B H4`, title:`Xiyuan Temple (西园寺 · Xīyuán Sì, kelenteng kucing)`,
       nameEn:`Xiyuan Temple`,
       nameHanzi:`西园寺`,
       context:`Kenapa jadi Plan-B: dekat Shantang Street, jalur datar, suasana tenang — alternatif kalau Hanshan Temple/Fengqiao terasa memutar dari rute utama.`,
       text:`Awalnya bagian dari taman pribadi keluarga bangsawan era Ming, diubah jadi kelenteng Buddha tahun 1635. Terkenal dengan kolam kura-kura besar dan Aula 500 Arhat berisi ratusan patung Buddha berlapis emas. <b>Akses:</b> TIDAK ada stasiun MRT persis di depan — naik bus 6/10/11/17/40/Y1/Y3 turun halte Xiyuan (西园站), searah kawasan Shantang Street. <b>Jam Operasional:</b> 07:30–17:30 setiap hari (loket tutup 17:00). <b>Tiket:</b> CNY 5/org (±Rp13.250/org).`,
       wiki:`https://en.wikipedia.org/wiki/Xiyuan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Xiyuan+Temple+Suzhou+turtle+pond`},
      // --- h5 ---
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Master of Nets Garden (网师园 · Wǎngshī Yuán)`,
       nameEn:`Master of Nets Garden`,
       nameHanzi:`网师园`,
       text:`Salah satu taman klasik terkecil tapi paling dipuji desainnya di Suzhou, pertama dibangun era Song (abad ke-12) oleh seorang pejabat yang pensiun dan menamainya "Wangshi Yuan" (taman tukang jaring ikan) sebagai sindiran rendah hati terhadap karir birokrasinya. Terkenal dengan pertunjukan "Night Garden" di musim panas-gugur yang menampilkan opera Kunqu di antara paviliun bercahaya lampion — situs UNESCO World Heritage. Nama hotel trip ini merujuk langsung ke taman ini, dan lokasinya memang persis di area yang sama. <b>Akses:</b> Persis di kawasan hotel/Shiquan Street — TIDAK ada stasiun MRT persis di depan. ✅ <b>Terverifikasi Amap (2026-09-20): 1,1km dari hotel</b> (±5 menit sepeda, ±15 menit jalan kaki) — cukup dekat untuk jalan kaki santai. Alternatif: halte bus "Master of Nets Garden West" (bus 529/9003/9010). <b>Jam Operasional:</b> 21 April–20 Oktober 07:30–17:30 (loket tutup 17:00); 21 Oktober–20 April 07:30–17:00. Night Garden: pertengahan Maret–pertengahan November, setiap malam 19:30–22:00. <b>Tiket:</b> Siang CNY 40/org musim ramai, CNY 30/org musim sepi (±Rp106.000/79.500 per org). Night Garden CNY 100/org (±Rp265.000/org) — terpisah dari tiket siang, opsional di Hari 1 malam kalau masih berminat lihat versi lampion. Gratis untuk lansia 70+ (bawa identitas) &amp; anak di bawah 1,2m.`,
       wiki:`https://en.wikipedia.org/wiki/Master_of_the_Nets_Garden`,
       yt:`https://www.youtube.com/results?search_query=Master+of+the+Nets+Garden+Suzhou+night`},
      // --- cadangan ---
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Baoen Temple / North Pagoda (Beisi Ta) (北寺塔 · Běisì Tǎ)`,
       nameEn:`Baoen Temple / North Pagoda`,
       nameHanzi:`北寺塔`,
       context:`Kenapa tidak dimasukkan: searah Suzhou Museum tapi Hari 3 sudah cukup padat (Museum, Guanqian, Xuanmiao, Humble Administrator's Garden, Pingjiang Road) — bisa disisipkan kalau ternyata ada waktu ekstra.`,
       text:`Pagoda tertinggi di selatan Sungai Yangtze (±76m, 9 lantai kayu bersusun), berdiri di atas lahan kuil yang riwayatnya diperkirakan mundur hingga era Tiga Kerajaan (abad ke-3). Bangunan yang ada sekarang direkonstruksi era Dinasti Song (abad ke-12). Taman di sekelilingnya rindang dan tenang, cocok untuk jalan santai tanpa harus naik ke atas pagoda. <b>Akses:</b> Stasiun Beisita (北寺塔, Line 4) — pagoda punya stasiun MRT sendiri, langsung di depan gerbang. Persis sejalur dengan Suzhou Museum (Hari 3). <b>Jam Operasional:</b> ±08:00–18:00 setiap hari (loket tutup 17:30). Tidak ada hari libur rutin. <b>Tiket:</b> ⚠️ harga bervariasi antar sumber (CNY 25–40/org untuk naik ke atas pagoda, ±Rp66.250–106.000/org) — kalau dikunjungi, TIDAK naik ke atas (pertimbangan lutut), cukup nikmati taman &amp; pagoda dari luar yang <b>gratis</b>.`,
       wiki:`https://en.wikipedia.org/wiki/Bao%27en_Temple,_Suzhou`,
       yt:`https://www.youtube.com/results?search_query=North+Temple+Pagoda+Suzhou+Beisi+Ta`,
       relatedDays:[3]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Taihu Lake Wetland Park (苏州太湖湿地公园 · Sūzhōu Tàihú Shīdì Gōngyuán)`,
       nameEn:`Suzhou Taihu Lake Wetland Park`,
       nameHanzi:`苏州太湖湿地公园`,
       context:`Kenapa tidak dimasukkan: ±40-45 menit sekali jalan dari hotel — terlalu jauh untuk hari kepulangan (Hari 5), dan tidak ada hari lain yang tersisa untuk dedicated day khusus Taihu di trip 5-hari ini. Cocok jadi tambahan kalau durasi trip Suzhou diperpanjang di kesempatan lain.`,
       text:`Taman lahan basah di tepi Danau Taihu — danau terbesar ketiga di China, terkenal dengan batu-batu taihu (batu kapur berlubang khas) yang dulu banyak diambil untuk menghias taman klasik Suzhou. Jalur promenadenya datar dan luas, kontras menyegarkan dari padatnya kota tua. <b>Akses:</b> <b>Stasiun Taihu Xiangshan (太湖香山, Line 5) — LANGSUNG dari hotel TANPA transfer</b>, 17 halte, ¥5/org, ±43 menit (terverifikasi Amap 2026-09-22). Dari stasiun, taksi/bus singkat ±10-15 menit ke pintu masuk taman. <b>Jam Operasional:</b> 08:30–17:00 (masuk terakhir 16:00). <b>Tiket:</b> ⚠️ harga bervariasi antar sumber — CNY 60/org (±Rp159.000/org) hingga versi gratis/CNY 20/org tergantung sumber &amp; mungkin tergantung area spesifik yang dimaksud. Cek harga pasti di loket/Trip.com sebelum berangkat.`,
       wiki:`https://en.wikipedia.org/wiki/Lake_Tai`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Taihu+Lake+Wetland+Park`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Shoutao Lake Scenic Area (寿桃湖 · Shòutáo Hú)`,
       nameEn:`Shoutao Lake Scenic Area`,
       nameHanzi:`寿桃湖`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Taihu Lake Wetland Park (lihat entri di atas) yang sendiri sudah tidak masuk itinerary utama — hanya realistis kalau ada waktu ekstra dedicated ke kawasan Taihu.`,
       text:`Danau kecil (±400 mu/26.7 hektar, kedalaman maksimum 70m) hasil genangan air tanah alami sejak penambangan batu dilarang tahun 1999 di kawasan Wuzhong. Batu-batu di tengah danau menyerupai buah persik umur panjang (asal namanya), juga dijuluki "Guilin Mini"-nya Suzhou. Jadi spot foto yang relatif belum ramai turis. <b>Akses:</b> Satu kawasan resor dengan Taihu Xiangshan (Line 5) — taksi/Didi singkat dari stasiun, lokasi di kawasan Wuzhong dekat persimpangan Lingtian Road &amp; Zhangjingbang Road. <b>Jam Operasional:</b> buka sepanjang tahun, tidak ada jam tutup khusus (area publik terbuka). <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Shoutao+Lake+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Shoutao+Lake+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Wuzhong Taihu Tourist Zone (吴中太湖旅游度假区 · Wúzhōng Tàihú Lǚyóu Dùjiàqū)`,
       nameEn:`Suzhou Wuzhong Taihu Tourist Zone`,
       nameHanzi:`吴中太湖旅游度假区`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Taihu Lake Wetland Park — sama-sama tidak masuk itinerary utama karena Hari 5 sekarang fokus destinasi dekat hotel.`,
       text:`Kawasan wisata resmi 5A di tepi Danau Taihu, distrik Wuzhong, seluas ±250 km², mencakup beberapa taman &amp; area publik di sepanjang tepi danau (termasuk Taihu Park, Situ Temple, Lushan). <b>Akses:</b> Satu kawasan resor dengan Taihu Xiangshan (Line 5) — taksi/Didi singkat dari stasiun. <b>Jam Operasional:</b> area publik buka sepanjang hari; sub-atraksi berbayar (mis. Taihu Park, CNY 10/org) punya jam &amp; hari tutup sendiri (tutup Rabu April–Oktober, Selasa-Rabu November–Maret, kecuali libur nasional). <b>Tiket:</b> Gratis untuk area publik/promenade tepi danau.`,
       wiki:`https://www.google.com/search?q=Wuzhong+Taihu+Tourist+Zone`,
       yt:`https://www.youtube.com/results?search_query=Wuzhong+Taihu+Tourist+Zone`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dayangshan National Forest Park (大阳山国家森林公园 · Dàyángshān Guójiā Sēnlín Gōngyuán)`,
       nameEn:`Dayangshan National Forest Park`,
       nameHanzi:`大阳山国家森林公园`,
       context:`Kenapa tidak dimasukkan: redundant dengan Taihu Lake Wetland Park sebagai pilihan "alam", dan Taihu sendiri sudah tidak masuk itinerary utama karena keterbatasan hari.`,
       text:`Taman hutan nasional di pinggiran barat kota tua Suzhou, terbagi 2 area utama: Wenshu Monastery (dibangun era Dinasti Jin Timur) dan Botanical Garden dengan koleksi tanaman langka (yew, huanghuali, podocarpus). Jalur trekking ringan &amp; udara segar. <b>Akses:</b> TIDAK ada MRT langsung — taksi/Didi dari kota. <b>Jam Operasional:</b> 09:00–16:30. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi harga tiket — cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.google.com/search?q=Dayangshan+National+Forest+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Dayangshan+National+Forest+Park+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Tianpingshan Scenic Spot (天平山 · Tiānpíng Shān)`,
       nameEn:`Tianpingshan Scenic Spot`,
       nameHanzi:`天平山`,
       context:`Kenapa tidak dimasukkan: jalur hiking gunung cukup menanjak — untuk kondisi lutut, lebih aman hanya dicoba di area bawah/foothill saja, bukan pendakian penuh. Juga di luar musim daun maple terbaik (trip ini 10-14 Okt, puncak maple baru akhir Oktober).`,
       text:`Gunung kecil terkenal dengan pohon maple (paling indah saat musim gugur, sekitar akhir Oktober-awal Desember) dan mata air alami yang sudah jadi tempat rekreasi sejak Dinasti Song. <b>Akses:</b> MRT Line 1 ke Stasiun Mudu (木渎), transfer bus rute 4, turun halte Tianpingshan (天平山站), ±3.5km dari stasiun Mudu. <b>Jam Operasional:</b> 08:00–17:00 (loket &amp; masuk terakhir 16:30). <b>Tiket:</b> CNY 30/org dewasa, CNY 15/org lansia/anak (±Rp79.500/39.750 per org).`,
       wiki:`https://en.wikipedia.org/wiki/Tianping_Mountain`,
       yt:`https://www.youtube.com/results?search_query=Tianpingshan+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Culture &amp; Arts Centre (苏州文化艺术中心 · Sūzhōu Wénhuà Yìshù Zhōngxīn)`,
       nameEn:`Suzhou Culture & Arts Centre`,
       nameHanzi:`苏州文化艺术中心`,
       context:`Kenapa tidak dimasukkan: kontennya (galeri/teater indoor) kurang sesuai gaya jalan-jalan outdoor santai yang diprioritaskan trip ini — meski searah rute Hari 2, sengaja tidak ditambahkan supaya hari itu tidak terlalu padat.`,
       text:`Pusat seni &amp; budaya modern Suzhou rancangan arsitek Prancis Paul Andreu, dibuka 2007, seluas ±150.000 m² di tepi timur Jinji Lake — berisi grand theater, concert hall, bioskop IMAX, sekolah seni, dan Suzhou Jinji Lake Art Museum di dalamnya. <b>Akses:</b> Stasiun Cultural Expo Center (文化博览中心, Line 1), keluar Exit 1 — tersambung langsung, searah kawasan Jinji Lake (Hari 2). <b>Jam Operasional:</b> area pameran umumnya 10:00–20:00, tutup setiap Senin. <b>Tiket:</b> Gratis masuk gedung; harga tiket pertunjukan/pameran tertentu bervariasi per acara ⚠️.`,
       wiki:`https://www.google.com/search?q=Suzhou+Culture+%26+Arts+Centre`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Culture+and+Arts+Centre`,
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dongshahu Ecology Park (东沙湖生态园 · Dōngshāhú Shēngtài Yuán)`,
       nameEn:`Dongshahu Ecology Park`,
       nameHanzi:`东沙湖生态园`,
       context:`Kenapa tidak dimasukkan: redundant dengan Jinji Lake &amp; Taihu Lake Wetland Park sebagai pilihan "taman/danau" trip ini — dipilih yang lebih ikonik.`,
       text:`Taman ekologi terbuka terbesar di kawasan ini (±1,21 juta m², termasuk ±540.000 m² area air), tanpa pagar/tembok dengan banyak pintu masuk. Punya sistem 3 pulau (Cherry Blossom Island, Crabapple Island, Reed Island) memadukan bukit &amp; air. <b>Akses:</b> Stasiun Dongshahu (东沙湖, Line 1) — taman ini punya stasiun MRT sendiri, searah kawasan Jinji Lake (Hari 2). <b>Jam Operasional:</b> ⚠️ belum ditemukan sumber jam buka-tutup pasti — sebagai taman terbuka tanpa pagar, kemungkinan bisa diakses kapan saja. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Dongshahu+Ecology+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Dongshahu+Ecology+Park+Suzhou`,
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Amusement Land (苏州乐园 · Sūzhōu Lèyuán)`,
       nameEn:`Suzhou Amusement Land`,
       nameHanzi:`苏州乐园`,
       context:`Kenapa tidak dimasukkan: berbayar mahal dan berorientasi turis/hiburan, tidak sejalan dengan prinsip trip ini yang mengutamakan tempat gratis/merakyat dan suasana lokal otentik.`,
       text:`Taman hiburan skala besar dengan 3 zona utama (Water World, Forest World, Children's World), wahana modern termasuk roller coaster gantung terbesar di China, serta beberapa instalasi bertema landmark dunia (mis. replika Coliseum Romawi, tanda mirip "HOLLYWOOD"). <b>Akses:</b> Stasiun Suzhou Amusement Park (苏州乐园, Line 1), jalan kaki ±5 menit. <b>Jam Operasional:</b> ⚠️ bervariasi per zona/musim, cek jadwal spesifik hari kunjungan di Trip.com/website resmi sebelum berangkat. <b>Tiket:</b> CNY 200–260/org dewasa, CNY 150–180/org anak/lansia (±Rp530.000–689.000 / Rp397.500–477.000 per org) tergantung zona &amp; musim; paket combo dewasa+anak mulai CNY 198.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Amusement_Land`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Amusement+Land`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Lion Grove Garden (狮子林 · Shīzi Lín)`,
       nameEn:`Lion Grove Garden`,
       nameHanzi:`狮子林`,
       context:`Kenapa tidak dimasukkan: persis searah/dekat kluster Suzhou Museum &amp; Humble Administrator's Garden (Hari 3), tapi trip ini sudah cukup padat dengan Humble Administrator's Garden sebagai taman klasik utama hari itu — bisa disisipkan kalau ada waktu ekstra.`,
       text:`Salah satu 4 taman klasik terkenal Suzhou, dibangun tahun 1342 oleh biksu Buddha Tianru untuk menghormati gurunya — dijuluki "Lion Grove" karena batu-batu taihu-nya yang berbentuk menyerupai singa, dianggap kompleks batu buatan (rockery) terbesar &amp; paling rumit di antara taman-taman klasik Suzhou. Kublai Khan's descendant dan pelukis terkenal Ni Zan pernah terlibat dalam desainnya. <b>Akses:</b> Stasiun Humble Administrator's Garden·Suzhou Museum (Line 6), Exit 2, jalan kaki beberapa menit. Alternatif: Stasiun Beisita (Line 4), jalan kaki ±1km ke timur. No. 23 Yuanlin Road, Gusu District. <b>Jam Operasional:</b> 1 Maret–31 Oktober 07:30–17:30; 1 November–akhir Februari 07:30–17:00. <b>Tiket:</b> Musim ramai (April, Mei, Juli–Oktober) CNY 40/org (±Rp106.000/org); musim sepi (Januari–Maret, Juni, November–Desember) CNY 30/org (±Rp79.500/org).`,
       wiki:`https://en.wikipedia.org/wiki/Lion_Grove_Garden`,
       yt:`https://www.youtube.com/results?search_query=Lion+Grove+Garden+Suzhou`,
       relatedDays:[3]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`The Lingering Garden (留园 · Liú Yuán)`,
       nameEn:`The Lingering Garden`,
       nameHanzi:`留园`,
       context:`Kenapa tidak dimasukkan: lokasinya di barat kota (dekat Shi Road), tidak searah dengan kluster manapun di itinerary ini — situs UNESCO yang bagus, tapi butuh perjalanan tersendiri. Bisa jadi alternatif kalau ingin ganti Humble Administrator's Garden di kesempatan lain.`,
       text:`Salah satu 4 taman klasik terkenal China (bersama Humble Administrator's Garden, Summer Palace Beijing, dan Chengde Mountain Resort), pertama dibangun era Ming (1593) oleh pejabat Xu Taishi. Terkenal dengan koridor beratap sepanjang ±700m yang menghubungkan seluruh taman dan koleksi batu taihu raksasa termasuk "Cloud-Capped Peak" setinggi ±6,5m — situs UNESCO World Heritage. <b>Akses:</b> Stasiun Shi Road (石路, Line 2), Exit 1, jalan kaki ke utara ±300m via Guangji South Road. <b>Jam Operasional:</b> 1 Maret–31 Oktober 07:30–17:30 (loket tutup 17:00); 1 November–28 Februari 07:30–17:00 (loket tutup 16:30). <b>Tiket:</b> Musim ramai (April, Mei, Juli–Oktober) CNY 55/org (±Rp145.750/org); musim sepi (Januari–Maret, Juni, November–Desember) CNY 45/org (±Rp119.250/org).`,
       wiki:`https://en.wikipedia.org/wiki/Lingering_Garden`,
       yt:`https://www.youtube.com/results?search_query=Lingering+Garden+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Yuanrong Times Square (圆融时代广场 · Yuánróng Shídài Guǎngchǎng)`,
       nameEn:`Yuanrong Times Square`,
       nameHanzi:`圆融时代广场`,
       context:`Kenapa tidak dimasukkan: sesi belanja/mal bukan prioritas trip ini (sama alasan seperti Suzhou Centre Plaza) — meski searah kawasan Jinji Lake (Hari 2), sengaja tidak ditambahkan supaya hari itu tetap fokus outdoor.`,
       text:`Mal besar di tepi timur Jinji Lake, kompleks komersial-hiburan seluas ±210.000 m². Terkenal dengan kanopi LED sepanjang ±500m (salah satu terpanjang di dunia) yang menampilkan pertunjukan cahaya "daun teratai &amp; ikan berenang" setiap malam — jadi daya tarik tersendiri di luar belanja. <b>Akses:</b> Stasiun Times Square (Line 1) — tersambung langsung ke mal. <b>Jam Operasional:</b> toko umumnya ±10:00–22:00; pertunjukan kanopi LED tayang rutin tiap malam (jadwal spesifik bervariasi, cek on-site). <b>Tiket:</b> Gratis masuk (mal).`,
       wiki:`https://www.trip.com/travel-guide/shops/suzhou/yuanrong-times-square-10567883/`,
       yt:`https://www.youtube.com/results?search_query=Yuanrong+Times+Square+Suzhou`,
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ruiguang Tower (瑞光塔 · Ruìguāng Tǎ)`,
       nameEn:`Ruiguang Tower`,
       nameHanzi:`瑞光塔`,
       context:`Kenapa tidak dimasukkan: sudah termasuk dalam kunjungan Panmen Scenic Spots di Hari 4 (dilihat dari luar sebagai bagian kompleks) — TIDAK naik ke atas pagoda (pertimbangan lutut, tangga tanpa lift/eskalator).`,
       text:`Pagoda 7 lantai berbentuk oktagonal setinggi ±53,6m, dibangun era Dinasti Song Utara — bagian dari kompleks Panmen Scenic Spots, berdiri berdekatan dengan Wumen Bridge dan gerbang kota kuno. <b>Akses:</b> Sama dengan Panmen Scenic Spots — Stasiun Nanmen (Line 4 &amp; Line 5), persis 1 halte MRT dari hotel. <b>Jam Operasional:</b> 08:30–16:00 sepanjang tahun. <b>Tiket:</b> Termasuk tiket masuk Panmen (CNY 40/org); tambahan CNY 6/org untuk naik ke atas pagoda.`,
       wiki:`https://en.wikipedia.org/wiki/Ruiguang_Pagoda`,
       yt:`https://www.youtube.com/results?search_query=Ruiguang+Pagoda+Suzhou`,
       relatedDays:[4]},
