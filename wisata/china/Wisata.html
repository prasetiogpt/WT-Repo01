    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Wuxi`,
       nameEn:`Cerita Kota Wuxi`,
       text:`Wuxi pernah jadi ibu kota pertama Kerajaan Wu kuno, didirikan Taibo (paman Raja Wen dari Dinasti Zhou) di kawasan Meili sekitar abad ke-12 SM, bertahan ±600 tahun sebelum ibu kota dipindah ke Suzhou. Nama "Wuxi" (secara harfiah "Tanpa Timah") merujuk cadangan bijih timah di Gunung Xishan yang habis ditambang menjelang akhir Dinasti Han.`,
       wiki:`https://en.wikipedia.org/wiki/Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+China+history`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Musim gugur (Oktober) dianggap periode terbaik berkunjung ke Wuxi — sejuk &amp; kering dibanding musim panas yang lembap. ⚠️ Angka di ringkasan cuaca awal dokumen ini adalah rata-rata historis, BUKAN forecast real-time — cek forecast H-7 sebelum berangkat.`,
       wiki:`https://en.climate-data.org/asia/china/jiangsu/wuxi-3323/`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Bandara utama: <b>Sunan Shuofang International Airport (苏南硕放国际机场 · Sūnán Shuòfàng Guójì Jīchǎng)</b>. Stasiun HSR utama: <b>Wuxi Railway Station (无锡站 · Wúxī Zhàn)</b> di pusat kota (yang dipakai itinerary ini) dan <b>Wuxi East Railway Station (无锡东站 · Wúxī Dōng Zhàn)</b> untuk koneksi lebih jauh ke arah Shanghai/Beijing. ⚠️ Nama standar resmi, belum di-screenshot-verifikasi langsung dari halaman Amap.`,
       wiki:`https://en.wikipedia.org/wiki/Sunan_Shuofang_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Area <b>Taihu Square/Tanduqiao</b>, di jalur <b>Metro Line 1</b> — ±3,9km/12 menit dari Wuxi Railway Station (bukan jalan kaki, tapi 1 jalur tanpa transfer). Langsung di gerbang klaster Lihu/Taihu; ke Old City/Nanchan Temple &amp; stasiun tinggal Line 1 lurus; ke Huishan tetap perlu transfer Line 4.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Wuxi`,
       nameEn:`Destinasi Terkenal Lain di Wuxi`,
       text:`Di luar itinerary utama: <b>Lingshan Grand Buddha (灵山大佛 · Língshān Dàfó)</b> — patung Buddha berdiri 88m, salah satu ikon wisata religi terbesar di China Timur. <b>The Plum Garden/Meiyuan (梅园 · Méiyuán)</b> — terkenal saat ribuan pohon plum mekar di musim semi. Keduanya ada di bagian Cadangan dengan alasan tidak dimasukkan.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Wuxi+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Wuxi Spare Ribs (无锡排骨 · Wúxī Páigǔ)</b> — hidangan paling ikonik Wuxi, iga babi dimasak manis-gurih khas gaya Jiangnan, tapi cukup manis &amp; berlemak. <b>Wuxi Xiaolongbao</b> — versi lokal pangsit kuah dengan isian sedikit lebih manis dibanding versi Shanghai. <b>Liangxi Crispy Eel</b> — hidangan belut goreng-kecap dingin dengan sejarah lebih dari 1.000 tahun, salah satu hidangan "hidangan dingin" (leng pan) klasik Jiangsu.`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. 6–7 Oktober masih ekor Golden Week — kawasan pedestrian sempit &amp; ikonik (Huishan Old Street) diperkirakan masih ramai, itinerary ini sudah menjadwalkannya di hari yang lebih sepi (8 Okt).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram. Salinan paspor/visa (fisik &amp; digital).`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Lixi Park (蠡溪公园 · Líxī Gōngyuán, alias Binjiang Park)`,
       nameEn:`Lixi Park`,
       nameHanzi:`蠡溪公园`,
       text:`Taman tepi Lihu Lake di kawasan Lixi Road, Distrik Binhu — bagian dari rangkaian taman gratis di tepi Lihu Lake, rating 4.3 di Amap dengan 13 review. <b>Akses:</b> dari hotel, jalan kaki ke Tanduqiao (732m) → MRT Line 1 + transfer Line 2 → Stasiun <b>Heliekou</b> (area Lixi Road), 6 halte, ¥3/org, ±45 menit. ⚠️ Exit/gerbang taman terdekat dari stasiun belum terverifikasi, cek Amap on-site. <b>Jam Operasional:</b> area taman terbuka, gratis, mengikuti jam kawasan Lihu (±06:00–21:00). <b>Tiket:</b> Gratis.`,
       wiki:`https://ct-by.com/lihu-bridge-park-wuxi-ticket-price-opening-hours-location-and-highlights/`,
       yt:`https://www.youtube.com/results?search_query=Lixi+Park+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Central Lihu Park (蠡湖中央公园 · Líhú Zhōngyāng Gōngyuán)`,
       nameEn:`Central Lihu Park`,
       nameHanzi:`蠡湖中央公园`,
       text:`Taman pusat di persimpangan Huanhu Road/Shuanghong Bridge, dekat Baojie Bridge — ruang publik utama tempat warga lokal jalan santai &amp; olahraga tepi danau Lihu. <b>Akses:</b> ±4,5km dari Lixi Park via Didi (±1 jam jalan kaki, terverifikasi Amap — jalan kaki tidak disarankan). ±1,2km dari Liyuan Garden, ±2km dari Yuantouzhu — semua di sekitar danau Lihu yang sama, dikunjungi searah di hari yang sama (lihat tabel Hari 2). <b>Jam Operasional:</b> buka ±06:00–21:00, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.trip.com/travel-guide/attraction/wuxi/lihu-central-park-91749/`,
       yt:`https://www.youtube.com/results?search_query=Lihu+Central+Park+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Liyuan Garden (蠡园 · Lí Yuán)`,
       nameEn:`Liyuan Garden`,
       nameHanzi:`蠡园`,
       text:`Taman klasik tepi Li Lake (cabang utara Taihu Lake) di Distrik Binhu, dibangun awal abad ke-20 dengan gaya taman Jiangnan — terkenal dengan jembatan zigzag &amp; paviliun tepi air, sering dipaketkan bersama Taihu Yuantouzhu. <b>Akses:</b> jalan kaki ±1,2km dari Central Lihu Park (lanjutan rute Hari 2). <b>Jam Operasional:</b> ±07:30–17:30. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> ±CNY 45/org.`,
       wiki:`https://www.google.com/search?q=Liyuan+Garden+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Liyuan+Garden+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Gonghu Bay Wetland Park (贡湖湾湿地公园 · Gònghú Wān Shīdì Gōngyuán)`,
       nameEn:`Gonghu Bay Wetland Park`,
       nameHanzi:`贡湖湾湿地公园`,
       text:`Kawasan lindung ekologi tepi utara Danau Taihu di persimpangan Gonghu Avenue &amp; Hongzhou Road, Kec. Huazhuang — dibangun lewat proyek "mengembalikan lahan ke danau". Segmen paling scenic ±4km antara Gonghuwan East Gate dan Yanhu Wetland Park. <b>Akses:</b> ±17km dari Lixi Park/Central Lihu Park via Didi. ⚠️ Leg Liyuan Garden→Gonghu Bay (rute Hari 2 saat ini) memakai estimasi yang sama — belum di-Amap-kan spesifik, cek on-site. <b>Jam Operasional:</b> taman terbuka ±06:00–20:00, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis; sepeda sewa ±CNY 17/jam/org (opsional).`,
       wiki:`https://www.google.com/search?q=Gonghu+Bay+Wetland+Park+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Gonghu+Bay+Wetland+Park+Wuxi`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`Wuxi Binhu The Mixc (无锡滨湖万象城 · Wúxī Bīnhú Wànxiàng Chéng)`,
       nameEn:`Wuxi Binhu The Mixc`,
       nameHanzi:`无锡滨湖万象城`,
       context:`Kenapa jadi Plan-B: BUKAN destinasi utama (prinsip itinerary ini menghindari sesi belanja), tapi area rooftop/plaza luar bisa dinikmati gratis tanpa belanja — opsi berteduh yang layak kalau hujan deras, searah dengan rute Lihu/Taihu hari ini.`,
       text:`Kompleks urban kelas atas di tepi timur Lihu Lake, 1688 Taihu West Avenue — berada persis di persimpangan kawasan Lihu New City &amp; Taihu New City, dilengkapi rooftop garden &amp; plaza outdoor yang terintegrasi dengan promenade tepi danau. <b>Akses:</b> MRT Line 4, turun Stasiun Dajuyuan (Grand Theatre), jalan kaki singkat ke 1688 Taihu West Avenue. <b>Jam Operasional:</b> mal ±10:00–22:00 setiap hari, tidak ada hari libur. Area rooftop/plaza luar bisa diakses lebih fleksibel. <b>Tiket:</b> Gratis masuk (mal); area rooftop/plaza luar gratis diakses tanpa belanja.`,
       wiki:`https://en.wuxi.gov.cn/2018-03/16/c_465252.htm`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Binhu+The+Mixc`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Wuxi Huishan Old Street (惠山老街 · Huìshān Lǎojiē)`,
       nameEn:`Wuxi Huishan Old Street`,
       nameHanzi:`惠山老街`,
       text:`Jalan pedestrian tua di kaki Gunung Hui, pintu masuk ke kawasan Huishan Ancient Town — dipenuhi kios jajanan lokal &amp; toko kerajinan tradisional, jadi tempat terbaik merasakan suasana pagi kota lama Wuxi sebelum masuk ke kawasan kuil &amp; aula leluhur. <b>Akses:</b> MRT Line 1 → transfer Line 4 di <b>Liutan</b> (dari hotel Taihu Square, Liutan lebih dekat daripada Civic Center) → turun Stasiun Huishan Ancient Town, keluar Exit 6 — ±5 menit jalan kaki, langsung di tourist center kawasan. <b>Jam Operasional:</b> kios &amp; jalan buka ±07:00–18:00 (paling ramai jajanan pagi 07:00–10:00), gratis masuk. Tidak ada hari libur rutin. <b>Tiket:</b> Gratis masuk, bayar jajanan/toko saja.`,
       wiki:`https://www.google.com/search?q=Wuxi+Huishan+Old+Street`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Huishan+Old+Street`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Huishan Ancient Town Scenic Area (惠山古镇 · Huìshān Gǔzhèn)`,
       nameEn:`Huishan Ancient Town Scenic Area`,
       nameHanzi:`惠山古镇`,
       text:`Dijuluki "Museum Luar Ruangan Sejarah &amp; Budaya Wuxi", kawasan di kaki Gunung Hui ini menyimpan <b>118 aula leluhur (ancestral hall)</b> dari era Dinasti Tang hingga masa Republik China, mewakili sekitar 80 marga keluarga berbeda — jumlah &amp; keragamannya menjadikannya "Museum Aula Leluhur China" dan tujuan ziarah populer bagi wisatawan domestik. Sejak Dinasti Tang, kawasan ini sudah jadi tempat berkumpul sastrawan karena produksi teh upeti "Yangxian tea"; pada era Song, tradisi membangun aula leluhur untuk menghormati pendahulu mulai berkembang, mencapai puncaknya di era Ming-Qing. <b>Akses:</b> sama seperti Huishan Old Street (Exit 6 Stasiun Huishan Ancient Town) — kawasan ini persis menyambung dari jalan itu. <b>Jam Operasional:</b> area/atraksi bertiket (aula leluhur, dll) buka 08:00–17:30 (masuk terakhir 17:00), butuh tiket kombinasi ±CNY 70-80. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan/libur nasional. <b>Tiket:</b> Gratis jalan di area luar; aula leluhur &amp; atraksi dalam ±CNY 70-80 (tiket kombinasi, sama dengan Xihui Park/Jichang Garden).`,
       wiki:`https://en.wuxi.gov.cn/2020-02/26/c_455876.htm`,
       yt:`https://www.youtube.com/results?search_query=Huishan+Ancient+Town+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xihui Park Huishan (锡惠公园 · Xīhuì Gōngyuán)`,
       nameEn:`Xihui Park Huishan`,
       nameHanzi:`锡惠公园`,
       text:`Taman utama di kaki Gunung Hui yang menaungi beberapa situs terkenal, termasuk Huishan Spring — dikenal sebagai <b>"Mata Air Terbaik Kedua di Bawah Langit"</b> (Tianxia Dier Quan). Dibangun era Dinasti Tang (774-777), mata air ini diberi peringkat oleh "Dewa Teh" legendaris Lu Yu dalam kitab Cha Jing (Kitab Teh) — dari 20 kelas mata air di seluruh negeri, mata air ini diperingkat kedua terbaik. Sastrawan besar seperti Su Shi dan Bai Juyi pernah menulis puisi memujinya. Mata air terbagi jadi 3 kolam (atas, tengah, bawah), dengan kolam bawah digali sejak era Dinasti Song. <b>Akses:</b> menyambung jalan kaki dari Huishan Ancient Town, tetap di kawasan kaki Gunung Hui yang sama. <b>Jam Operasional:</b> 08:00–17:30 (masuk terakhir 17:00). Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> CNY 10/org.`,
       wiki:`https://en.wikipedia.org/wiki/Xihui_Park`,
       yt:`https://www.youtube.com/results?search_query=Xihui+Park+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Jichang Garden (寄畅园 · Jìchàng Yuán)`,
       nameEn:`Jichang Garden`,
       nameHanzi:`寄畅园`,
       text:`Juga dikenal sebagai "Qin Garden", dibangun tahun 1520 — taman klasik bergaya vila Jiangnan satu-satunya peninggalan Dinasti Ming di Wuxi. Awalnya adalah kediaman para biksu yang berafiliasi dengan Huishan Temple. Desain tamannya begitu dikagumi hingga Kaisar Qianlong dari Dinasti Qing meniru sebagian elemennya untuk membangun bagian dari Summer Palace di Beijing. <b>Akses:</b> persis di dalam Xihui Park, tidak perlu pindah lokasi. <b>Jam Operasional:</b> mengikuti jam Huishan Ancient Town (08:00–17:30, masuk terakhir 17:00). <b>Tiket:</b> termasuk dalam tiket kombinasi ±CNY 70-80 dengan Huishan Spring &amp; Huishan Temple, atau CNY 45/org kalau beli terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Jichang_Garden`,
       yt:`https://www.youtube.com/results?search_query=Jichang+Garden+Wuxi`},
      {group:`h3`, tag:`planb`, label:`Plan-B H3`, title:`Huishan Temple (Cultural Relics Area) (惠山寺 · Huìshān Sì)`,
       nameEn:`Huishan Temple`,
       nameHanzi:`惠山寺`,
       context:`Kenapa jadi Plan-B: persis di dalam area yang sama dengan Xihui Park (tiket kombinasi ±CNY 70), jadi alternatif kalau Jichang Garden terlalu ramai atau ingin fokus ke sisi sejarah kuil dibanding taman klasik.`,
       text:`Kuil dengan akar sejarah dari era Dinasti Selatan-Utara, awalnya bernama "Lishan Caotang" di bawah naungan Zhan Ting pada masa Dinasti Selatan — cikal bakal kawasan spiritual yang kelak berkembang jadi kompleks Xihui Park &amp; Huishan Ancient Town yang lebih luas. <b>Akses:</b> persis di dalam Xihui Park, sama seperti Jichang Garden. <b>Jam Operasional:</b> mengikuti jam Huishan Ancient Town/Xihui Park (08:00–17:30). <b>Tiket:</b> termasuk dalam tiket kombinasi ±CNY 70 (sama dengan Xihui Park/Jichang Garden).`,
       wiki:`https://en.wikipedia.org/wiki/Huishan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Huishan+Temple+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Nanchang Street Pedestrian Street (南长街 · Nán Cháng Jiē)`,
       nameEn:`Nanchang Street Pedestrian Street`,
       nameHanzi:`南长街`,
       text:`Bagian dari Situs Warisan Dunia UNESCO Grand Canal, membentang 5,5km dari gerbang selatan kota lama Wuxi hingga Xinguang Road, dengan kawasan inti di sekitar kanal kuno. Di masa kejayaannya, jalan ini adalah jantung perdagangan kota lama Wuxi — dipenuhi pabrik penggilingan beras, pabrik sutra, dermaga perahu, teater, dan restoran. Dikunjungi malam hari di itinerary ini, menyambung dari sesi Qingming Bridge. <b>Akses:</b> persis di sekitar Stasiun <b>Qingmingqiao</b> (Metro Line 1) — langsung 1 halte dari hotel (Taihu Square), tidak perlu jalan kaki jauh dari Nanchan Temple. <b>Jam Operasional:</b> jalan pedestrian &amp; kanal buka 24 jam, gratis. Kios/toko umumnya ±09:00–21:00 — pas untuk versi malam. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://en.wikipedia.org/wiki/Grand_Canal_(China)`,
       yt:`https://www.youtube.com/results?search_query=Nanchang+Street+Wuxi+night`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Qingming Bridge Ancient Canal Scenic Spot (清名桥古运河景区 · Qīngmíng Qiáo Gǔ Yùnhé Jǐngqū)`,
       nameEn:`Qingming Bridge Ancient Canal Scenic Spot`,
       nameHanzi:`清名桥古运河景区`,
       text:`Jembatan batu lengkung tertua &amp; terbesar yang masih bertahan di kawasan urban Wuxi, awalnya bernama "Qingning", dibangun era Wanli (Dinasti Ming) dari sumbangan dua putra tokoh Qin Yao — namanya diambil dari gabungan nama keduanya. Direkonstruksi tahun 1666 (era Kangxi, Dinasti Qing) oleh bupati Wuxi Wu Xingzuo, dan mengalami beberapa kali perbaikan di era Qianlong &amp; Tongzhi. Kawasan ini dan bangunan tepi sungainya berstatus cagar budaya tingkat provinsi — pemandangan malamnya dengan lampu kanal jadi salah satu ikon paling difoto di Wuxi. (Dijadwalkan malam hari (18:00–20:00) di Hari 3 — versi lampu kanal menyala penuh, bukan Hari 5 yang terikat jadwal kereta.) <b>Akses:</b> turun langsung di Stasiun <b>Qingmingqiao</b> (Metro Line 1) — 1 halte dari hotel (Taihu Square); dari Huishan, naik Metro Line 4 → Line 1 terus sampai Qingmingqiao (tidak perlu turun/jalan kaki dari Nanchan Temple). <b>Jam Operasional:</b> kawasan luar/jalan gratis, buka 24 jam. Area berbayar (kalau ada) ±08:30–17:00. Lampu kanal menyala penuh mulai ±19:00 — pas dengan jadwal kunjungan malam di itinerary ini. <b>Tiket:</b> Gratis jalan di kawasan luar/kanal; CNY 60/org untuk area scenic spot berbayar (kalau ingin masuk lebih dalam).`,
       wiki:`https://baike.baidu.com/en/item/Qingming%20Bridge%20and%20Riverside%20Buildings/114519`,
       yt:`https://www.youtube.com/results?search_query=Qingming+Bridge+Ancient+Canal+Wuxi+night`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Taihu Yuantouzhu Scenic Area (太湖鼋头渚 · Tàihú Yuántóuzhǔ)`,
       nameEn:`Taihu Yuantouzhu Scenic Area`,
       nameHanzi:`太湖鼋头渚`,
       text:`Salah satu spot paling ikonik untuk memandang Danau Taihu, semenanjung dengan taman bunga &amp; area foto populer. Nama "Yuantouzhu" berarti "pulau kepala kura-kura" karena bentuk semenanjungnya. <b>Akses:</b> Didi langsung dari hotel, ±9-10km/±30-40 menit — tidak ada MRT langsung. <b>Jam Operasional:</b> ±07:00–17:30. Tidak ada hari libur rutin. Jam puncak: akhir pekan &amp; musim bunga. <b>Tiket:</b> CNY 90/org (tiket reguler). Taihu Xiandao (dulu termasuk tiket terusan CNY 105) dipindah ke Cadangan — lihat entri terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Yuantouzhu`,
       yt:`https://www.youtube.com/results?search_query=Taihu+Yuantouzhu+Scenic+Area+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Lihu National Wetland Park (蠡湖国家湿地公园 · Líhú Guójiā Shīdì Gōngyuán)`,
       nameEn:`Lihu National Wetland Park`,
       nameHanzi:`蠡湖国家湿地公园`,
       text:`Nama payung yang mencakup 15 sub-taman gratis di sekitar Danau Lihu (termasuk Lihu Park, Central Lihu Park, Changguangxi Wetland), seluas 1.126 hektar. Legenda Fan Li &amp; Xi Shi (pejabat Kerajaan Yue, &gt;2.500 tahun lalu) terkait kawasan ini. POI spesifik bernama sama di Amap ada di area Xuelang, dekat Yuantouzhu (sisi barat danau). <b>Akses:</b> ⚠️ jarak persis dari Yuantouzhu belum terverifikasi — jalan kaki/Didi singkat, cek Amap on-site. <b>Jam Operasional:</b> ±06:00–21:00, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Lihu_Park`,
       yt:`https://www.youtube.com/results?search_query=Lihu+National+Wetland+Park+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Bogong Island Ecology Park (渤公岛生态公园 · Bógōng Dǎo Shēngtài Gōngyuán)`,
       nameEn:`Bogong Island Ecology Park`,
       nameHanzi:`渤公岛生态公园`,
       text:`Persis bersebelahan dengan Yuantouzhu, dibangun lewat proyek "mengembalikan lahan ke danau" di sisi timur bendungan Dushan lama — panjang ±1.700m, luas ±37 hektar. Dinamai untuk mengenang Zhang Bo, tokoh legendaris pengendali banjir. Bagian dari jalur wisata 38km lingkar Lihu, gabungan tema rekayasa air + alam + budaya. <b>Akses:</b> jalan kaki dari Yuantouzhu (bersebelahan langsung). Alternatif: bus 36/53/72/87/106 ke Halte Bogong Island, atau MRT Line 2 ke Rongxiang (Exit 4) lalu transfer bus 87. <b>Jam Operasional:</b> ⚠️ belum ditemukan jam operasional resmi spesifik — kemungkinan taman terbuka tanpa jam tutup ketat (umum untuk taman kota gratis), cek Amap on-site. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Bogong+Island+Ecology+Park+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Bogong+Island+Ecology+Park+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Taihu Lake Promenade (太湖广场滨湖步道 · Tàihú Guǎngchǎng Bīnhú Bùdào)`,
       nameEn:`Taihu Lake Promenade`,
       nameHanzi:`太湖广场滨湖步道`,
       text:`Jalur promenade publik di tepi Danau Taihu, danau air tawar terbesar ketiga di China. <b>Akses:</b> ⚠️ estimasi Didi singkat dari Bogong Island (rute Hari 4 saat ini), belum di-Amap-kan spesifik. <b>Jam Operasional:</b> promenade terbuka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Lake_Tai`,
       yt:`https://www.youtube.com/results?search_query=Taihu+Lake+Promenade+Wuxi`},
      // --- h5 ---
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Nanchan Temple (南禅寺 · Nán Chán Sì)`,
       nameEn:`Nanchan Temple`,
       nameHanzi:`南禅寺`,
       text:`Didirikan tahun 547 M pada masa pemerintahan Kaisar Wu dari Dinasti Liang (Dinasti Selatan), awalnya bernama Huguo Temple — kuil Buddha tertua yang masih berdiri di kawasan Jiangnan, dijuluki "yang pertama dari 480 kuil Dinasti Selatan". Direnovasi era Dinasti Song Utara (1023-1031) dan diberi nama resmi "Fushang Chan Temple", meski tetap populer disebut Nanchan Temple. Landmark utamanya, Pagoda Miaoguang (era Song Utara, tujuh lantai delapan sisi), termasuk salah satu dari "Delapan Pemandangan Wuxi". <b>Akses:</b> MRT Line 1, turun Stasiun Nanchan Temple (南禅寺站 · Nán Chán Sì Zhàn), keluar Exit 8, jalan kaki ±60m ke arah timur di Xiangyang Road. <b>Jam Operasional:</b> 07:00–16:45. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Nanchan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Nanchan+Temple+Wuxi`},
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Nanchan Temple Pedestrian Street (南禅寺步行街 · Nán Chán Sì Bùxíng Jiē)`,
       nameEn:`Nanchan Temple Pedestrian Street`,
       nameHanzi:`南禅寺步行街`,
       text:`Jalan pedestrian yang membentang dari gerbang selatan kota lama Wuxi, langsung terhubung dengan kompleks Nanchan Temple — bagian dari kawasan bersejarah Grand Canal yang sama dengan Qingming Bridge, meski di itinerary ini keduanya dikunjungi di hari berbeda (Qingming Bridge via akses langsung Stasiun Qingmingqiao di Hari 3 malam, bukan jalan kaki dari sini). <b>Akses:</b> persis di sebelah Nanchan Temple, Stasiun Nanchan Temple Exit 8 yang sama. <b>Jam Operasional:</b> jalan pedestrian buka 24 jam (gratis), kios/toko umumnya ±09:00–21:00. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://www.google.com/search?q=Nanchan+Temple+Pedestrian+Street+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Nanchan+Temple+Pedestrian+Street+Wuxi`},
      {group:`h5`, tag:`planb`, label:`Plan-B H5`, title:`Wuxi Museum (无锡博物院 · Wúxī Bówùyuàn)`,
       nameEn:`Wuxi Museum`,
       nameHanzi:`无锡博物院`,
       context:`Kenapa jadi Plan-B: indoor, gratis, sejalan tema sejarah kota dengan Nanchan Temple — pilihan aman kalau hujan deras, meski waktu Hari 5 sudah dipadatkan sehingga jarang ada slot untuk ini kecuali menggantikan Nanchan Temple sepenuhnya.`,
       text:`Museum modern yang memaparkan sejarah masyarakat Wu dari masa prasejarah hingga era China modern lewat empat lantai koleksi di sayap baratnya, dengan keterangan bahasa Inggris yang cukup lengkap. <b>Akses:</b> searah kawasan Old City, cek rute MRT terdekat saat akan berkunjung (tidak dipakai di itinerary utama). <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00). <b>Tutup setiap Senin</b>, kecuali libur nasional. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.tripadvisor.com/Attraction_Review-g297443-d1864917-Reviews-Wuxi_Museum-Wuxi_Jiangsu.html`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Museum`},
      // --- cadangan ---
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Taihu Xiandao (太湖仙岛 · Tàihú Xiāndǎo)`,
       nameEn:`Taihu Xiandao`,
       nameHanzi:`太湖仙岛`,
       context:`Kenapa tidak dimasukkan: instruksi eksplisit pengguna — tidak akan dikunjungi. Diganti Bogong Island Ecology Park (Hari 2) yang gratis &amp; bersebelahan langsung dengan Yuantouzhu, tanpa perlu naik perahu.`,
       text:`Juga disebut Pulau Sanshan, pulau di tengah Danau Taihu yang dicapai naik perahu ±15 menit dari dermaga Yuantouzhu — dipenuhi kuil &amp; paviliun bertema Taoisme, dengan "会仙桥" (jembatan kayu gantung) menghubungkan area utara-selatan pulau. Titik tertinggi pulau adalah Istana Lingxiao (凌霄宫) di puncak bukit. <b>Akses:</b> naik perahu dari dermaga Taihu Yuantouzhu (±15 menit), dulu termasuk tiket terusan Yuantouzhu. <b>Jam Operasional:</b> perahu beroperasi ±08:20–16:50 (jadwal terakhir naik pulau). Area pulau ±07:00–17:30. <b>Tiket:</b> dulu termasuk tiket terusan Yuantouzhu CNY 105/org — kalau ingin ke sini, beli tiket terusan (bukan tiket reguler CNY 90) di Yuantouzhu. <b>Catatan fisik:</b> area selatan/dermaga datar. Puncak Istana Lingxiao butuh menanjak, akses lift/eskalator belum terverifikasi.`,
       wiki:`https://www.google.com/search?q=Taihu+Xiandao+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Taihu+Xiandao+Wuxi`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Baojie Mountain Forest Park (宝界山森林公园 · Bǎojiè Shān Sēnlín Gōngyuán)`,
       nameEn:`Baojie Mountain Forest Park`,
       nameHanzi:`宝界山森林公园`,
       context:`Kenapa tidak dimasukkan: jalur menanjak, bertangga, dan curam — tidak sesuai kriteria fisik/lutut Anda.`,
       text:`Taman hutan pegunungan di pinggiran Wuxi dengan jalur hiking &amp; udara segar. <b>Akses:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan area Binhu/Baojie di selatan kota, dekat Baojie Bridge. Cek Amap langsung sebelum berangkat. <b>Jam Operasional:</b> belum ditemukan sumber jam operasional resmi yang solid — kemungkinan taman terbuka tanpa jam tutup ketat (umum untuk taman hutan pinggiran kota). Cek Amap langsung sebelum berangkat kalau tetap ingin ke sini. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan gratis (umum untuk taman hutan kota), cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.google.com/search?q=Baojie+Mountain+Forest+Park+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Baojie+Mountain+Forest+Park+Wuxi`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Xinzhou Ecological Garden (新洲生态园 · Xīnzhōu Shēngtài Yuán)`,
       nameEn:`Xinzhou Ecological Garden`,
       nameHanzi:`新洲生态园`,
       context:`Kenapa tidak dimasukkan: ditandai "jauh" di catatan Anda, di luar rute efisien klaster-klaster yang sudah disusun.`,
       text:`Taman ekologi di pinggiran Wuxi dengan area hijau luas. <b>Akses:</b> ⚠️ belum ditemukan sumber resmi — di luar rute klaster utama, cek Amap sebelum berangkat. <b>Jam Operasional:</b> belum ditemukan sumber resmi — cek Amap/Trip.com langsung sebelum berangkat kalau tertarik. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan gratis (taman ekologi publik), cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.google.com/search?q=Xinzhou+Ecological+Garden+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Xinzhou+Ecological+Garden+Wuxi`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Meili Ancient Town (梅里古镇 · Méilǐ Gǔzhèn)`,
       nameEn:`Meili Ancient Town`,
       nameHanzi:`梅里古镇`,
       context:`Kenapa tidak dimasukkan: jauh di timur kota, di luar jangkauan rute efisien klaster-klaster utama trip ini.`,
       text:`Kota kuno bersejarah di timur jauh Wuxi, terkait dengan asal-usul legenda Kerajaan Wu kuno. <b>Akses:</b> ⚠️ belum ditemukan sumber resmi — di timur jauh kota, kemungkinan tidak ada MRT langsung. Cek Amap sebelum berangkat. <b>Jam Operasional:</b> belum ditemukan sumber resmi — cek Amap/Trip.com langsung sebelum berangkat kalau tertarik. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.google.com/search?q=Meili+Ancient+Town+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Meili+Ancient+Town+Wuxi`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Lingshan Buddhist Scenic Spot (Grand Buddha) (灵山胜境 · Língshān Shèngjìng)`,
       nameEn:`Lingshan Buddhist Scenic Spot`,
       nameHanzi:`灵山胜境`,
       context:`Kenapa tidak dimasukkan: tiket sangat mahal, jauh dari kota, dan skalanya lebih ke wisata turis besar-besaran — tidak sesuai prinsip trip santai &amp; merakyat.`,

    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Suzhou`,
       nameEn:`Cerita Kota Suzhou`,
       text:`Suzhou didirikan tahun 514 SM oleh Raja Helü dari Kerajaan Wu sebagai ibu kota "Helü City" — jauh lebih tua dari Nanjing sebagai pusat kekuasaan di kawasan ini, dan menjadi cikal-bakal tata kota tua Suzhou yang masih terlihat sampai sekarang. Berkat jaringan kanalnya yang rumit dan taman-taman klasiknya, Suzhou dijuluki "Venice of the East" dan sering disebut bersama Hangzhou sebagai "surga di bumi" (上有天堂，下有苏州杭州).`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+China+history+canal+city`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Oktober adalah salah satu bulan terbaik berkunjung — sejuk (siang ±23°C, malam ±14-16°C), kelembapan ±71%, hujan ringan ±9-10 hari sepanjang bulan. ⚠️ September-Oktober juga musim topan paling mungkin di kawasan pesisir timur China — angka di atas rata-rata historis, BUKAN forecast real-time, cek forecast H-7 sebelum berangkat.`,
       wiki:`https://en.climate-data.org/asia/china/jiangsu/suzhou-2755/`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Suzhou tidak punya bandara besar sendiri — pelancong umumnya masuk lewat Shanghai (Hongqiao/Pudong) lalu HSR ke Suzhou. Stasiun HSR utama: <b>Suzhou Railway Station (苏州站 · Sūzhōu Zhàn)</b> di Gusu District, ±2,8km dari pusat kota — inilah yang dipakai untuk leg pulang ke Ningbo di itinerary ini. Ada juga <b>Suzhou North Railway Station (苏州北站 · Sūzhōu Běi Zhàn)</b> di Xiangcheng District, ±16km dari pusat kota — jauh lebih jauh, hanya relevan kalau transportasi datang/pergi dari stasiun itu.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_railway_station`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Gusu District sisi selatan, sekitar Shiquan Street/Nanmen</b> — strategis karena 1 halte MRT (Line 5) dari kluster Panmen, dan dekat jalur transfer ke Line 2/4 menuju kota tua bagian utara. Alternatif lain: sekitar Guanqian Street/Xuanmiao Temple untuk yang mengutamakan pusat kota tua yang lebih ramai &amp; komersial.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Suzhou`,
       nameEn:`Destinasi Terkenal Lain di Suzhou`,
       text:`Di luar itinerary utama: <b>Tiger Hill (虎丘 · Hǔqiū)</b> — bukit dengan pagoda miring ("Leaning Tower of China"), salah satu ikon Suzhou paling terkenal. <b>Zhouzhuang</b> dan <b>Tongli</b> — kota air kuno ±30-50 menit di luar Suzhou, populer sebagai day-trip terpisah tapi tidak masuk trip kali ini (terlalu jauh dari rute). <b>Suzhou Industrial Park</b> di sekitar Jinji Lake — wajah modern kota ini, kontras dengan kota tua.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Suzhou+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Songshu Guiyu (松鼠桂鱼 · Sōngshǔ Guìyú, "squirrel fish")</b> — hidangan ikon Suzhou, ikan mandarin digoreng berbentuk menyerupai tupai dengan saus asam-manis, cukup berminyak jadi perlu dibatasi. <b>Suzhou-style mooncake (苏式月饼 · Sū Shì Yuèbǐng)</b> — versi berlapis renyah, lebih ringan dari versi Kanton. <b>Zhagao (糖粥/赤豆糊 · Tángzhōu/Chìdòu Hú)</b> — bubur kacang merah manis, jajanan jalanan klasik. Masakan Suzhou umumnya masuk gaya "Jiangnan" yang cenderung manis-ringan dibanding daerah lain di China — relatif lebih ramah untuk lambung dibanding masakan pedas.`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. Taman-taman klasik (Humble Administrator's Garden, dll) cukup ramai di akhir pekan — datang lebih pagi kalau bisa. September-Oktober musim topan, cek forecast rutin.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram. Salinan paspor/visa (fisik &amp; digital).`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Shiquan Street (十全街 · Shíquán Jiē)`,
       nameEn:`Shiquan Street`,
       nameHanzi:`十全街`,
       text:`Jalan kuliner dan hiburan malam klasik Suzhou, membentang di sisi selatan kota tua persis di depan hotel — dikenal dengan restoran, bar, dan toko kerajinan tangan yang menyatu dengan suasana kanal &amp; arsitektur tradisional di sekitarnya. Nama hotel trip ini ("Shiquan Street·Wangshi Garden") merujuk langsung ke jalan ini. <b>Akses:</b> Langsung di depan/sangat dekat hotel — tidak perlu transportasi, cukup jalan kaki. <b>Jam Operasional:</b> jalan buka 24 jam; mayoritas resto/toko ±10:00–22:00 (beberapa bar buka lebih malam). <b>Tiket:</b> Gratis jalan di sepanjang jalan.`,
       wiki:`https://www.google.com/search?q=Shiquan+Street+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Shiquan+Street+Suzhou`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`The Oriental Gate / Gate of the Orient (东方之门 · Dōngfāng Zhī Mén)`,
       nameEn:`The Oriental Gate / Gate of the Orient`,
       nameHanzi:`东方之门`,
       text:`Gedung pencakar langit berbentuk gerbang raksasa (dijuluki warga lokal "celana panjang" karena bentuknya) yang jadi landmark arsitektur kontroversial-tapi-ikonik Suzhou modern, selesai dibangun 2015 di tepi Jinji Lake sebagai simbol gerbang masuk ke distrik bisnis baru. Dijadwalkan dilihat sore/malam (bukan pagi) di itinerary ini — gedung kaca ini lebih menarik dilihat saat lampu mulai menyala, dan lokasinya persis searah jalan ke titik nonton Music Fountain. <b>Akses:</b> Stasiun Dongfangzhimen (东方之门, Line 1) — gedung ini punya stasiun MRT sendiri, tersambung langsung. Sisi barat Jinji Lake. Dari hotel: Line 5 → Nanmen/Laodonglu → transfer ke Line 1 (±35-40 menit total). <b>Jam Operasional:</b> area luar/lihat dari luar bisa kapan saja; bangunan sendiri fungsinya hotel/kantor/residensial (bukan objek wisata dengan jam buka publik). Paling bagus dilihat menjelang malam saat lampu gedung menyala. <b>Tiket:</b> Gratis, lihat dari luar saja.`,
       wiki:`https://en.wikipedia.org/wiki/Gate_of_the_Orient`,
       yt:`https://www.youtube.com/results?search_query=Gate+of+the+Orient+Suzhou`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Jinji Lake (金鸡湖 · Jīnjī Hú)`,
       nameEn:`Jinji Lake`,
       nameHanzi:`金鸡湖`,
       text:`Danau alami seluas ±8.9 km² yang jadi jantung Suzhou Industrial Park — kawasan kota baru modern hasil kerja sama China-Singapura sejak 1994. Promenadenya menampilkan taman modern, gedung pencakar langit, dan jembatan-jembatan kontemporer, representasi wajah Suzhou masa kini. Lakeside Avenue di sisi barat sepanjang ±2km jadi jalur jalan kaki utama. <b>Akses:</b> Stasiun Dongfangzhimen (Line 1, sisi barat/West Gate) atau Stasiun Cultural Expo Center (sisi timur). <b>Jam Operasional:</b> promenade &amp; tepi danau buka 24 jam. <b>Tiket:</b> Gratis masuk &amp; jalan di tepi danau; wahana berbayar (Ferris wheel, cruise) terpisah dan tidak dihitung di itinerary ini.`,
       wiki:`https://en.wikipedia.org/wiki/Jinji_Lake`,
       yt:`https://www.youtube.com/results?search_query=Jinji+Lake+Suzhou+promenade`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Jinji Lake Music Fountain (金鸡湖音乐喷泉 · Jīnjī Hú Yīnyuè Pēnquán)`,
       nameEn:`Jinji Lake Music Fountain`,
       nameHanzi:`金鸡湖音乐喷泉`,
       text:`Salah satu air mancur musikal terbesar di Asia saat diresmikan, dengan pertunjukan cahaya &amp; air yang disinkronkan musik setiap malam — jadi daya tarik gratis paling populer di kawasan Jinji Lake untuk warga lokal maupun turis. <b>Akses:</b> Stasiun Dongfangzhimen (Line 1) — lokasi di persimpangan Suyalu Road &amp; Xingyang Street, kawasan Lakeside New World, dekat Gate of the Orient. <b>Jam Operasional:</b> ⚠️ jadwal bervariasi musiman &amp; sumbernya sedikit tidak konsisten — per sumber terbaru: Jumat &amp; Sabtu 19:30 (durasi ±30 menit), tambahan sesi saat libur nasional. Hari 2 itinerary ini sengaja jatuh di hari <b>Sabtu</b> supaya pertunjukan terjamin ada. Pertunjukan dibatalkan saat cuaca buruk. <b>Cek jadwal WeChat/website resmi Jinji Lake Scenic Area H-1</b> untuk konfirmasi terakhir. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Jinji+Lake+Music+Fountain`,
       yt:`https://www.youtube.com/results?search_query=Jinji+Lake+Music+Fountain+Suzhou`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`Suzhou Centre Plaza / Suzhou Center (苏州中心 · Sūzhōu Zhōngxīn)`,
       nameEn:`Suzhou Centre Plaza / Suzhou Center`,
       nameHanzi:`苏州中心`,
       context:`Kenapa jadi Plan-B: TIDAK termasuk destinasi wisata utama (prinsip itinerary ini menghindari sesi belanja), tapi lokasinya di tepi Jinji Lake — pilihan praktis untuk berteduh kalau hujan deras.`,
       text:`Mal besar di tepi Jinji Lake dengan atap gelombang khas ("cloud roof") yang jadi salah satu ikon arsitektur baru Suzhou, plus taman atap (rooftop garden) dengan pemandangan langsung ke Gate of the Orient. <b>Akses:</b> Stasiun Dongfangzhimen (Line 1), keluar Exit 3 — tersambung langsung ke mal, tidak perlu keluar ke jalan. <b>Jam Operasional:</b> 10:00–22:00 setiap hari. <b>Tiket:</b> Gratis masuk (mal), bukan sesi belanja di itinerary ini.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Center`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Center+Mall+Jinji+Lake`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Suzhou Museum (苏州博物馆 · Sūzhōu Bówùguǎn)`,
       nameEn:`Suzhou Museum`,
       nameHanzi:`苏州博物馆`,
       text:`Dirancang oleh arsitek kelahiran Suzhou I.M. Pei (juga arsitek Piramida Kaca Louvre), dibuka 2006 sebagai proyek terakhir karir panjangnya. Bangunan ini memadukan estetika taman klasik Suzhou (dinding putih, atap abu-abu, kolam batu) dengan garis geometris modern — letaknya pun sengaja bersebelahan dengan Humble Administrator's Garden supaya menyatu dengan lanskap kota tua. <b>Akses:</b> Stasiun Beisita (北寺塔, Line 4), keluar Exit 4, jalan kaki ±700m ke timur. Dari hotel: Nanyuanbeilu (Line 5) → Nanmen → transfer Line 4 → Beisita, ±25-30 menit. Alternatif: Stasiun Humble Administrator's Garden·Suzhou Museum (Line 6). <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00), tutup setiap Senin kecuali libur nasional. <b>Tiket:</b> Gratis (sejak 18 Mei 2008); sebagian pameran khusus mungkin berbayar terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Museum`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Museum+I.M.+Pei+tour`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Guanqian Street (观前街 · Guānqián Jiē)`,
       nameEn:`Guanqian Street`,
       nameHanzi:`观前街`,
       text:`Guanqian Street ('jalan di depan kelenteng') berkembang sejak Dinasti Song sebagai pusat perdagangan di depan Xuanmiao Temple, dan sekarang jadi salah satu pedestrian street belanja &amp; jajanan tersibuk di Suzhou. <b>Akses:</b> Stasiun Chayuanchang (察院场, Line 4), keluar Exit 2, jalan kaki ±450m ke utara — searah/lanjutan dari Beisita di rute Hari 3 ini. <b>Jam Operasional:</b> jalan pedestrian buka 24 jam (gratis); toko &amp; kios umumnya ±09:00–22:00. <b>Tiket:</b> Gratis jalan di pedestrian street.`,
       wiki:`https://en.wikipedia.org/wiki/Xuanmiao_Temple`,
       yt:`https://www.youtube.com/results?search_query=Guanqian+Street+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xuanmiao Temple (玄妙观 · Xuánmiào Guàn)`,
       nameEn:`Xuanmiao Temple`,
       nameHanzi:`玄妙观`,
       text:`Salah satu kelenteng Tao tertua &amp; terbesar di China, pertama dibangun tahun 276 M, terletak persis di tengah Guanqian Street. Aula utamanya, Sanqing Hall, adalah bangunan kayu Dinasti Song asli yang masih berdiri. <b>Akses:</b> Sama dengan Guanqian Street (lihat entri sebelumnya) — kelenteng ini persis di tengah jalan tersebut, Stasiun Chayuanchang (Line 4) Exit 2, ±450m jalan kaki. <b>Jam Operasional:</b> Mei–September 07:30–17:00 (masuk terakhir 16:45); Oktober–April 07:30–16:30 (masuk terakhir 16:15). <b>Tiket:</b> Pelataran luar gratis; masuk aula utama (Sanqing Hall) CNY 20/org (±Rp53.000/org).`,
       wiki:`https://en.wikipedia.org/wiki/Xuanmiao_Temple`,
       yt:`https://www.youtube.com/results?search_query=Xuanmiao+Temple+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Humble Administrator's Garden (拙政园 · Zhuōzhèng Yuán)`,
       nameEn:`Humble Administrator's Garden`,
       nameHanzi:`拙政园`,
       text:`Taman klasik terbesar di Suzhou (±5.2 hektar) dan situs UNESCO World Heritage, dibangun tahun 1509 oleh pejabat Dinasti Ming, Wang Xianchen, setelah pensiun kecewa dari birokrasi — namanya diambil dari puisi era Jin yang menyindir "mengurus kebun adalah politik orang bodoh". Desainnya berpusat pada kolam-kolam besar dengan paviliun, jembatan, dan koridor. <b>Akses:</b> Stasiun Zhuozhengyuan·Suzhou Museum (拙政园·苏州博物馆, Line 6), keluar Exit 1, jalan kaki ±450m — satu kompleks dengan Suzhou Museum, searah rute Hari 3 ini. <b>Jam Operasional:</b> 1 Maret–15 November 07:30–17:30; 16 November–akhir Februari 07:30–17:00. <b>Tiket:</b> Musim ramai (April–Mei, Juli–Oktober) CNY 80/org (±Rp212.000/org) — cocok dengan yang dipakai di itinerary ini; musim sepi CNY 70/org (±Rp185.500/org). Pelajar/lansia setengah harga.`,
       wiki:`https://en.wikipedia.org/wiki/Humble_Administrator%27s_Garden`,
       yt:`https://www.youtube.com/results?search_query=Humble+Administrator%27s+Garden+Suzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Pingjiang Road (平江路 · Píngjiāng Lù)`,
       nameEn:`Pingjiang Road`,
       nameHanzi:`平江路`,
       text:`Jalan kanal yang tata letaknya nyaris tidak berubah sejak peta kota era Dinasti Song (1229) — salah satu bukti tata kota kuno yang paling terjaga di China. Menyusuri kanal sepanjang ±1.6km dengan jembatan batu, rumah putih-abu tradisional, dan teahouse kecil. <b>Akses:</b> Stasiun Xiangmen (相门, Line 1), keluar Exit 3, jalan kaki ±350m. Dari kluster Beisita/Guanqian, transfer ke Line 1 dulu. <b>Jam Operasional:</b> jalan kanal buka 24 jam (gratis); mayoritas toko/teahouse tutup ±22:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Pingjiang_Road`,
       yt:`https://www.youtube.com/results?search_query=Pingjiang+Road+Suzhou+night`},
      {group:`h3`, tag:`planb`, label:`Plan-B H3`, title:`Huqiu Wetland Park (虎丘湿地公园 · Hǔqiū Shīdì Gōngyuán)`,
       nameEn:`Huqiu Wetland Park`,
       nameHanzi:`虎丘湿地公园`,
       context:`Kenapa jadi Plan-B: gratis, alternatif praktis kalau ingin mengurangi satu spot berbayar hari itu.`,
       text:`Taman lahan basah di sekitar kawasan Tiger Hill (Huqiu), dikembangkan sebagai ruang hijau publik gratis dengan jalur air &amp; vegetasi alami, luas ±12 km² — kontras dengan taman klasik berbayar di sekitarnya. Rumah bagi 200+ spesies burung. <b>Akses:</b> Stasiun Sunwu Memorial Museum (孙武纪念苑, Line 4), keluar Exit 2, jalan kaki ±15 menit — searah kluster Line 4 Hari 3 ini. <b>Jam Operasional:</b> ±06:00–20:00 setiap hari. <b>Tiket:</b> Gratis (beberapa aktivitas tambahan di dalam mungkin berbayar).`,
       wiki:`https://www.google.com/search?q=Huqiu+Wetland+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Huqiu+Wetland+Park+Suzhou`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Wumen Bridge (吴门桥 · Wúmén Qiáo)`,
       nameEn:`Wumen Bridge`,
       nameHanzi:`吴门桥`,
       text:`Jembatan batu tertinggi di Suzhou (dibangun awal abad ke-11), berdiri di dekat Panmen Gate — salah satu peninggalan arsitektur kanal kuno Suzhou yang menghubungkan area gerbang kota dengan permukiman sekitarnya, bebas dikunjungi sebagai bagian dari jalan santai kawasan Panmen. <b>Akses:</b> Satu kawasan dengan Panmen Scenic Spots (lihat entri berikutnya) — persis 1 halte MRT dari hotel via Nanmen (Line 5). <b>Jam Operasional:</b> area jembatan bisa dilihat/dilewati kapan saja sebagai bagian jalan umum; untuk masuk ke sisi dalam kompleks Panmen ikuti jam operasional Panmen. <b>Tiket:</b> Gratis (melihat/menyeberangi jembatan dari luar kompleks berbayar Panmen).`,
       wiki:`https://www.google.com/search?q=Wumen+Bridge+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Wumen+Bridge+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Panmen Scenic Spots (盘门景区 · Pánmén Jǐngqū)`,
       nameEn:`Panmen Scenic Spots`,
       nameHanzi:`盘门景区`,
       text:`Satu-satunya gerbang kota kuno di China yang menggabungkan gerbang air DAN gerbang darat dalam satu struktur — mencerminkan kota Suzhou yang sejak awal dibangun mengelilingi jaringan kanal. Sejarahnya bermula era Kerajaan Wu (abad ke-6 SM), dengan struktur yang berdiri sekarang direkonstruksi era Dinasti Yuan-Ming. Kompleksnya juga mencakup Ruiguang Pagoda dan Wumen Bridge. <b>Akses:</b> Stasiun Nanmen (南门, Line 4 &amp; Line 5) — persis <b>1 halte MRT dari hotel via Line 5</b> (koreksi dari draft lama yang mengasumsikan perjalanan lebih jauh), atau jalan kaki ±1,2km/17 menit. <b>Jam Operasional:</b> 07:30–17:30 setiap hari. <b>Tiket:</b> CNY 40/org (±Rp106.000/org) — cocok dengan yang dipakai di itinerary ini; beli online lebih murah beberapa yuan.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_city_wall`,
       yt:`https://www.youtube.com/results?search_query=Panmen+Gate+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Hanshan Temple (寒山寺 · Hánshān Sì)`,
       nameEn:`Hanshan Temple`,
       nameHanzi:`寒山寺`,
       text:`Kuil Buddha yang jadi terkenal berkat puisi Dinasti Tang "Malam Berlabuh di Maple Bridge" (枫桥夜泊 · Fēngqiáo Yèbó) karya Zhang Ji, yang menggambarkan suara lonceng kuil ini terdengar hingga ke perahu di kanal — puisi itu sendiri jadi salah satu karya sastra China paling dikenal. Kuil aslinya dibangun era Dinasti Liang (abad ke-6), sudah beberapa kali hancur &amp; dibangun ulang, terakhir era Qing. <b>Akses:</b> Stasiun Shantangjie (山塘街, Line 2), keluar Exit 3, jalan kaki ±15 menit. Dari hotel: Nanyuanbeilu (Line 5) → Laodonglu (3 halte) → transfer Line 2 → Shantangjie. <b>Jam Operasional:</b> 07:30–17:30 (masuk terakhir 16:30); tanggal 1 &amp; 15 penanggalan lunar buka lebih awal jam 07:00. <b>Tiket:</b> Musim ramai (April–Oktober) CNY 20/org dewasa, CNY 10/org pelajar/lansia (±Rp53.000/26.500); musim sepi (November–Maret) CNY 15/CNY 8/org (±Rp39.750/21.200).`,
       wiki:`https://en.wikipedia.org/wiki/Hanshan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Hanshan+Temple+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Fengqiao Scenic Area (枫桥景区 · Fēngqiáo Jǐngqū)`,
       nameEn:`Fengqiao Scenic Area`,
       nameHanzi:`枫桥景区`,
       text:`Kawasan Maple Bridge (Fengqiao) yang jadi latar puisi terkenal Zhang Ji di atas — bersebelahan langsung dengan Hanshan Temple. Area sekitar jembatan &amp; kanal bisa dinikmati gratis sambil membayangkan suasana yang diabadikan dalam puisi 1.200 tahun lalu. ⚠️ Catatan: meski sering dikira satu tempat dengan Hanshan Temple, keduanya scenic spot terpisah dengan tiket masing-masing. <b>Akses:</b> Persis bersebelahan dengan Hanshan Temple (lihat entri sebelumnya) — akses &amp; rute sama. <b>Jam Operasional:</b> Maret–Oktober 06:00–21:30; November–Februari 06:30–21:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Maple_Bridge`,
       yt:`https://www.youtube.com/results?search_query=Fengqiao+Scenic+Area+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Shantang Street (七里山塘 · Qīlǐ Shāntáng)`,
       nameEn:`Shantang Street`,
       nameHanzi:`七里山塘`,
       text:`Dijuluki "Jalan Kuno No.1 Suzhou", dibangun tahun 825 M atas perintah penyair sekaligus gubernur Bai Juyi untuk menghubungkan kota dengan Tiger Hill sepanjang ±7 li (±3.6km). Sepanjang kanal berjejer rumah tradisional, jembatan batu era Ming-Qing, dan toko-toko kecil. <b>Akses:</b> Stasiun Shantang Street (山塘街, Line 2), keluar Exit 3 — langsung di depan jalan, satu jalur dengan Hanshan Temple. <b>Jam Operasional:</b> jalan buka 24 jam (gratis); toko/atraksi umumnya ±09:00–22:00; boating 08:00–17:00 &amp; 18:00–20:00. <b>Tiket:</b> Gratis jalan di sepanjang jalan. Boat tour terpisah — lihat entri <b>Suzhou Ancient Canal Night Cruise</b> di bawah untuk versi malam yang dipakai di Hari 4.`,
       wiki:`https://en.wikipedia.org/wiki/Shantang_Street`,
       yt:`https://www.youtube.com/results?search_query=Shantang+Street+Suzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Suzhou Ancient Canal Night Cruise (苏州古运河夜游 · Sūzhōu Gǔ Yùnhé Yèyóu)`,
       nameEn:`Suzhou Ancient Canal Night Cruise`,
       nameHanzi:`苏州古运河夜游`,
       text:`Perahu wisata menyusuri kanal kuno Suzhou di malam hari, berangkat dari dermaga di kawasan Shantang Street (Baijuyi Wharf) — versi malam dijuluki "Oriental Venice" karena suasana lampion &amp; bangunan tepi kanal yang menyala. Cara paling santai untuk melihat kota tua dari sisi air, pelengkap jalan kaki di Shantang Street. <b>Akses:</b> Naik dari dermaga di Shantang Street (山塘街, Line 2, Exit 3) — sama persis dengan akses Shantang Street, tidak perlu transportasi tambahan. <b>Jam Operasional:</b> boating 08:00–17:00 (siang) &amp; 18:00–20:00 (malam); durasi tiap sesi ±40 menit–1 jam. <b>Tiket:</b> Siang CNY 55/org (±Rp145.750/org), malam "Oriental Venice" CNY 100/org (±Rp265.000/org) — versi malam yang dipakai di Hari 4 itinerary ini.`,
       wiki:`https://www.tripadvisor.com/AttractionProductReview-g297442-d20003384-Suzhou_Ancient_Grand_Canal_Cruise_Experience-Suzhou_Jiangsu.html`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Ancient+Canal+Night+Cruise+Shantang`},
      {group:`h4`, tag:`planb`, label:`Plan-B H4`, title:`Xiyuan Temple (西园寺 · Xīyuán Sì, kelenteng kucing)`,
       nameEn:`Xiyuan Temple`,
       nameHanzi:`西园寺`,
       context:`Kenapa jadi Plan-B: dekat Shantang Street, jalur datar, suasana tenang — alternatif kalau Hanshan Temple/Fengqiao terasa memutar dari rute utama.`,
       text:`Awalnya bagian dari taman pribadi keluarga bangsawan era Ming, diubah jadi kelenteng Buddha tahun 1635. Terkenal dengan kolam kura-kura besar dan Aula 500 Arhat berisi ratusan patung Buddha berlapis emas. <b>Akses:</b> TIDAK ada stasiun MRT persis di depan — naik bus 6/10/11/17/40/Y1/Y3 turun halte Xiyuan (西园站), searah kawasan Shantang Street. <b>Jam Operasional:</b> 07:30–17:30 setiap hari (loket tutup 17:00). <b>Tiket:</b> CNY 5/org (±Rp13.250/org).`,
       wiki:`https://en.wikipedia.org/wiki/Xiyuan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Xiyuan+Temple+Suzhou+turtle+pond`},
      // --- h5 ---
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Master of Nets Garden (网师园 · Wǎngshī Yuán)`,
       nameEn:`Master of Nets Garden`,
       nameHanzi:`网师园`,
       text:`Salah satu taman klasik terkecil tapi paling dipuji desainnya di Suzhou, pertama dibangun era Song (abad ke-12) oleh seorang pejabat yang pensiun dan menamainya "Wangshi Yuan" (taman tukang jaring ikan) sebagai sindiran rendah hati terhadap karir birokrasinya. Terkenal dengan pertunjukan "Night Garden" di musim panas-gugur yang menampilkan opera Kunqu di antara paviliun bercahaya lampion — situs UNESCO World Heritage. Nama hotel trip ini merujuk langsung ke taman ini, dan lokasinya memang persis di area yang sama. <b>Akses:</b> Persis di kawasan hotel/Shiquan Street — TIDAK ada stasiun MRT persis di depan, tapi jaraknya sangat dekat jalan kaki dari hotel (searah Shiquan Street). Alternatif: halte bus "Master of Nets Garden West" (bus 529/9003/9010). <b>Jam Operasional:</b> 21 April–20 Oktober 07:30–17:30 (loket tutup 17:00); 21 Oktober–20 April 07:30–17:00. Night Garden: pertengahan Maret–pertengahan November, setiap malam 19:30–22:00. <b>Tiket:</b> Siang CNY 40/org musim ramai, CNY 30/org musim sepi (±Rp106.000/79.500 per org). Night Garden CNY 100/org (±Rp265.000/org) — terpisah dari tiket siang, opsional di Hari 1 malam kalau masih berminat lihat versi lampion. Gratis untuk lansia 70+ (bawa identitas) &amp; anak di bawah 1,2m.`,
       wiki:`https://en.wikipedia.org/wiki/Master_of_the_Nets_Garden`,
       yt:`https://www.youtube.com/results?search_query=Master+of+the+Nets+Garden+Suzhou+night`},
      // --- cadangan ---
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Baoen Temple / North Pagoda (Beisi Ta) (北寺塔 · Běisì Tǎ)`,
       nameEn:`Baoen Temple / North Pagoda`,
       nameHanzi:`北寺塔`,
       context:`Kenapa tidak dimasukkan: searah Suzhou Museum tapi Hari 3 sudah cukup padat (Museum, Guanqian, Xuanmiao, Humble Administrator's Garden, Pingjiang Road) — bisa disisipkan kalau ternyata ada waktu ekstra.`,
       text:`Pagoda tertinggi di selatan Sungai Yangtze (±76m, 9 lantai kayu bersusun), berdiri di atas lahan kuil yang riwayatnya diperkirakan mundur hingga era Tiga Kerajaan (abad ke-3). Bangunan yang ada sekarang direkonstruksi era Dinasti Song (abad ke-12). Taman di sekelilingnya rindang dan tenang, cocok untuk jalan santai tanpa harus naik ke atas pagoda. <b>Akses:</b> Stasiun Beisita (北寺塔, Line 4) — pagoda punya stasiun MRT sendiri, langsung di depan gerbang. Persis sejalur dengan Suzhou Museum (Hari 3). <b>Jam Operasional:</b> ±08:00–18:00 setiap hari (loket tutup 17:30). Tidak ada hari libur rutin. <b>Tiket:</b> ⚠️ harga bervariasi antar sumber (CNY 25–40/org untuk naik ke atas pagoda, ±Rp66.250–106.000/org) — kalau dikunjungi, TIDAK naik ke atas (pertimbangan lutut), cukup nikmati taman &amp; pagoda dari luar yang <b>gratis</b>.`,
       wiki:`https://en.wikipedia.org/wiki/Bao%27en_Temple,_Suzhou`,
       yt:`https://www.youtube.com/results?search_query=North+Temple+Pagoda+Suzhou+Beisi+Ta`,
       relatedDays:[3]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Taihu Lake Wetland Park (苏州太湖湿地公园 · Sūzhōu Tàihú Shīdì Gōngyuán)`,
       nameEn:`Suzhou Taihu Lake Wetland Park`,
       nameHanzi:`苏州太湖湿地公园`,
       context:`Kenapa tidak dimasukkan: ±40-45 menit sekali jalan dari hotel — terlalu jauh untuk hari kepulangan (Hari 5), dan tidak ada hari lain yang tersisa untuk dedicated day khusus Taihu di trip 5-hari ini. Cocok jadi tambahan kalau durasi trip Suzhou diperpanjang di kesempatan lain.`,
       text:`Taman lahan basah di tepi Danau Taihu — danau terbesar ketiga di China, terkenal dengan batu-batu taihu (batu kapur berlubang khas) yang dulu banyak diambil untuk menghias taman klasik Suzhou. Jalur promenadenya datar dan luas, kontras menyegarkan dari padatnya kota tua. <b>Akses:</b> <b>Stasiun Taihu Xiangshan (太湖香山, Line 5) — LANGSUNG dari hotel TANPA transfer</b>, ±40-45 menit naik metro. Dari stasiun, taksi/bus singkat ±10-15 menit ke pintu masuk taman. <b>Jam Operasional:</b> 08:30–17:00 (masuk terakhir 16:00). <b>Tiket:</b> ⚠️ harga bervariasi antar sumber — CNY 60/org (±Rp159.000/org) hingga versi gratis/CNY 20/org tergantung sumber &amp; mungkin tergantung area spesifik yang dimaksud. Cek harga pasti di loket/Trip.com sebelum berangkat.`,
       wiki:`https://en.wikipedia.org/wiki/Lake_Tai`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Taihu+Lake+Wetland+Park`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Shoutao Lake Scenic Area (寿桃湖 · Shòutáo Hú)`,
       nameEn:`Shoutao Lake Scenic Area`,
       nameHanzi:`寿桃湖`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Taihu Lake Wetland Park (lihat entri di atas) yang sendiri sudah tidak masuk itinerary utama — hanya realistis kalau ada waktu ekstra dedicated ke kawasan Taihu.`,
       text:`Danau kecil (±400 mu/26.7 hektar, kedalaman maksimum 70m) hasil genangan air tanah alami sejak penambangan batu dilarang tahun 1999 di kawasan Wuzhong. Batu-batu di tengah danau menyerupai buah persik umur panjang (asal namanya), juga dijuluki "Guilin Mini"-nya Suzhou. Jadi spot foto yang relatif belum ramai turis. <b>Akses:</b> Satu kawasan resor dengan Taihu Xiangshan (Line 5) — taksi/Didi singkat dari stasiun, lokasi di kawasan Wuzhong dekat persimpangan Lingtian Road &amp; Zhangjingbang Road. <b>Jam Operasional:</b> buka sepanjang tahun, tidak ada jam tutup khusus (area publik terbuka). <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Shoutao+Lake+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Shoutao+Lake+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Wuzhong Taihu Tourist Zone (吴中太湖旅游度假区 · Wúzhōng Tàihú Lǚyóu Dùjiàqū)`,
       nameEn:`Suzhou Wuzhong Taihu Tourist Zone`,
       nameHanzi:`吴中太湖旅游度假区`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Taihu Lake Wetland Park — sama-sama tidak masuk itinerary utama karena Hari 5 sekarang fokus destinasi dekat hotel.`,
       text:`Kawasan wisata resmi 5A di tepi Danau Taihu, distrik Wuzhong, seluas ±250 km², mencakup beberapa taman &amp; area publik di sepanjang tepi danau (termasuk Taihu Park, Situ Temple, Lushan). <b>Akses:</b> Satu kawasan resor dengan Taihu Xiangshan (Line 5) — taksi/Didi singkat dari stasiun. <b>Jam Operasional:</b> area publik buka sepanjang hari; sub-atraksi berbayar (mis. Taihu Park, CNY 10/org) punya jam &amp; hari tutup sendiri (tutup Rabu April–Oktober, Selasa-Rabu November–Maret, kecuali libur nasional). <b>Tiket:</b> Gratis untuk area publik/promenade tepi danau.`,
       wiki:`https://www.google.com/search?q=Wuzhong+Taihu+Tourist+Zone`,
       yt:`https://www.youtube.com/results?search_query=Wuzhong+Taihu+Tourist+Zone`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dayangshan National Forest Park (大阳山国家森林公园 · Dàyángshān Guójiā Sēnlín Gōngyuán)`,
       nameEn:`Dayangshan National Forest Park`,
       nameHanzi:`大阳山国家森林公园`,
       context:`Kenapa tidak dimasukkan: redundant dengan Taihu Lake Wetland Park sebagai pilihan "alam", dan Taihu sendiri sudah tidak masuk itinerary utama karena keterbatasan hari.`,
       text:`Taman hutan nasional di pinggiran barat kota tua Suzhou, terbagi 2 area utama: Wenshu Monastery (dibangun era Dinasti Jin Timur) dan Botanical Garden dengan koleksi tanaman langka (yew, huanghuali, podocarpus). Jalur trekking ringan &amp; udara segar. <b>Akses:</b> TIDAK ada MRT langsung — taksi/Didi dari kota. <b>Jam Operasional:</b> 09:00–16:30. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi harga tiket — cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.google.com/search?q=Dayangshan+National+Forest+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Dayangshan+National+Forest+Park+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Tianpingshan Scenic Spot (天平山 · Tiānpíng Shān)`,
       nameEn:`Tianpingshan Scenic Spot`,
       nameHanzi:`天平山`,
       context:`Kenapa tidak dimasukkan: jalur hiking gunung cukup menanjak — untuk kondisi lutut, lebih aman hanya dicoba di area bawah/foothill saja, bukan pendakian penuh. Juga di luar musim daun maple terbaik (trip ini 10-14 Okt, puncak maple baru akhir Oktober).`,
       text:`Gunung kecil terkenal dengan pohon maple (paling indah saat musim gugur, sekitar akhir Oktober-awal Desember) dan mata air alami yang sudah jadi tempat rekreasi sejak Dinasti Song. <b>Akses:</b> MRT Line 1 ke Stasiun Mudu (木渎), transfer bus rute 4, turun halte Tianpingshan (天平山站), ±3.5km dari stasiun Mudu. <b>Jam Operasional:</b> 08:00–17:00 (loket &amp; masuk terakhir 16:30). <b>Tiket:</b> CNY 30/org dewasa, CNY 15/org lansia/anak (±Rp79.500/39.750 per org).`,
       wiki:`https://en.wikipedia.org/wiki/Tianping_Mountain`,
       yt:`https://www.youtube.com/results?search_query=Tianpingshan+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Culture &amp; Arts Centre (苏州文化艺术中心 · Sūzhōu Wénhuà Yìshù Zhōngxīn)`,
       nameEn:`Suzhou Culture & Arts Centre`,
       nameHanzi:`苏州文化艺术中心`,
       context:`Kenapa tidak dimasukkan: kontennya (galeri/teater indoor) kurang sesuai gaya jalan-jalan outdoor santai yang diprioritaskan trip ini — meski searah rute Hari 2, sengaja tidak ditambahkan supaya hari itu tidak terlalu padat.`,
       text:`Pusat seni &amp; budaya modern Suzhou rancangan arsitek Prancis Paul Andreu, dibuka 2007, seluas ±150.000 m² di tepi timur Jinji Lake — berisi grand theater, concert hall, bioskop IMAX, sekolah seni, dan Suzhou Jinji Lake Art Museum di dalamnya. <b>Akses:</b> Stasiun Cultural Expo Center (文化博览中心, Line 1), keluar Exit 1 — tersambung langsung, searah kawasan Jinji Lake (Hari 2). <b>Jam Operasional:</b> area pameran umumnya 10:00–20:00, tutup setiap Senin. <b>Tiket:</b> Gratis masuk gedung; harga tiket pertunjukan/pameran tertentu bervariasi per acara ⚠️.`,
       wiki:`https://www.google.com/search?q=Suzhou+Culture+%26+Arts+Centre`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Culture+and+Arts+Centre`,
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dongshahu Ecology Park (东沙湖生态园 · Dōngshāhú Shēngtài Yuán)`,
       nameEn:`Dongshahu Ecology Park`,
       nameHanzi:`东沙湖生态园`,
       context:`Kenapa tidak dimasukkan: redundant dengan Jinji Lake &amp; Taihu Lake Wetland Park sebagai pilihan "taman/danau" trip ini — dipilih yang lebih ikonik.`,
       text:`Taman ekologi terbuka terbesar di kawasan ini (±1,21 juta m², termasuk ±540.000 m² area air), tanpa pagar/tembok dengan banyak pintu masuk. Punya sistem 3 pulau (Cherry Blossom Island, Crabapple Island, Reed Island) memadukan bukit &amp; air. <b>Akses:</b> Stasiun Dongshahu (东沙湖, Line 1) — taman ini punya stasiun MRT sendiri, searah kawasan Jinji Lake (Hari 2). <b>Jam Operasional:</b> ⚠️ belum ditemukan sumber jam buka-tutup pasti — sebagai taman terbuka tanpa pagar, kemungkinan bisa diakses kapan saja. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Dongshahu+Ecology+Park+Suzhou`,
       yt:`https://www.youtube.com/results?search_query=Dongshahu+Ecology+Park+Suzhou`,
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Suzhou Amusement Land (苏州乐园 · Sūzhōu Lèyuán)`,
       nameEn:`Suzhou Amusement Land`,
       nameHanzi:`苏州乐园`,
       context:`Kenapa tidak dimasukkan: berbayar mahal dan berorientasi turis/hiburan, tidak sejalan dengan prinsip trip ini yang mengutamakan tempat gratis/merakyat dan suasana lokal otentik.`,
       text:`Taman hiburan skala besar dengan 3 zona utama (Water World, Forest World, Children's World), wahana modern termasuk roller coaster gantung terbesar di China, serta beberapa instalasi bertema landmark dunia (mis. replika Coliseum Romawi, tanda mirip "HOLLYWOOD"). <b>Akses:</b> Stasiun Suzhou Amusement Park (苏州乐园, Line 1), jalan kaki ±5 menit. <b>Jam Operasional:</b> ⚠️ bervariasi per zona/musim, cek jadwal spesifik hari kunjungan di Trip.com/website resmi sebelum berangkat. <b>Tiket:</b> CNY 200–260/org dewasa, CNY 150–180/org anak/lansia (±Rp530.000–689.000 / Rp397.500–477.000 per org) tergantung zona &amp; musim; paket combo dewasa+anak mulai CNY 198.`,
       wiki:`https://en.wikipedia.org/wiki/Suzhou_Amusement_Land`,
       yt:`https://www.youtube.com/results?search_query=Suzhou+Amusement+Land`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Lion Grove Garden (狮子林 · Shīzi Lín)`,
       nameEn:`Lion Grove Garden`,
       nameHanzi:`狮子林`,
       context:`Kenapa tidak dimasukkan: persis searah/dekat kluster Suzhou Museum &amp; Humble Administrator's Garden (Hari 3), tapi trip ini sudah cukup padat dengan Humble Administrator's Garden sebagai taman klasik utama hari itu — bisa disisipkan kalau ada waktu ekstra.`,
       text:`Salah satu 4 taman klasik terkenal Suzhou, dibangun tahun 1342 oleh biksu Buddha Tianru untuk menghormati gurunya — dijuluki "Lion Grove" karena batu-batu taihu-nya yang berbentuk menyerupai singa, dianggap kompleks batu buatan (rockery) terbesar &amp; paling rumit di antara taman-taman klasik Suzhou. Kublai Khan's descendant dan pelukis terkenal Ni Zan pernah terlibat dalam desainnya. <b>Akses:</b> Stasiun Humble Administrator's Garden·Suzhou Museum (Line 6), Exit 2, jalan kaki beberapa menit. Alternatif: Stasiun Beisita (Line 4), jalan kaki ±1km ke timur. No. 23 Yuanlin Road, Gusu District. <b>Jam Operasional:</b> 1 Maret–31 Oktober 07:30–17:30; 1 November–akhir Februari 07:30–17:00. <b>Tiket:</b> Musim ramai (April, Mei, Juli–Oktober) CNY 40/org (±Rp106.000/org); musim sepi (Januari–Maret, Juni, November–Desember) CNY 30/org (±Rp79.500/org).`,
       wiki:`https://en.wikipedia.org/wiki/Lion_Grove_Garden`,
       yt:`https://www.youtube.com/results?search_query=Lion+Grove+Garden+Suzhou`,
       relatedDays:[3]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`The Lingering Garden (留园 · Liú Yuán)`,
       nameEn:`The Lingering Garden`,
       nameHanzi:`留园`,
       context:`Kenapa tidak dimasukkan: lokasinya di barat kota (dekat Shi Road), tidak searah dengan kluster manapun di itinerary ini — situs UNESCO yang bagus, tapi butuh perjalanan tersendiri. Bisa jadi alternatif kalau ingin ganti Humble Administrator's Garden di kesempatan lain.`,
       text:`Salah satu 4 taman klasik terkenal China (bersama Humble Administrator's Garden, Summer Palace Beijing, dan Chengde Mountain Resort), pertama dibangun era Ming (1593) oleh pejabat Xu Taishi. Terkenal dengan koridor beratap sepanjang ±700m yang menghubungkan seluruh taman dan koleksi batu taihu raksasa termasuk "Cloud-Capped Peak" setinggi ±6,5m — situs UNESCO World Heritage. <b>Akses:</b> Stasiun Shi Road (石路, Line 2), Exit 1, jalan kaki ke utara ±300m via Guangji South Road. <b>Jam Operasional:</b> 1 Maret–31 Oktober 07:30–17:30 (loket tutup 17:00); 1 November–28 Februari 07:30–17:00 (loket tutup 16:30). <b>Tiket:</b> Musim ramai (April, Mei, Juli–Oktober) CNY 55/org (±Rp145.750/org); musim sepi (Januari–Maret, Juni, November–Desember) CNY 45/org (±Rp119.250/org).`,
       wiki:`https://en.wikipedia.org/wiki/Lingering_Garden`,
       yt:`https://www.youtube.com/results?search_query=Lingering+Garden+Suzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Yuanrong Times Square (圆融时代广场 · Yuánróng Shídài Guǎngchǎng)`,
       nameEn:`Yuanrong Times Square`,
       nameHanzi:`圆融时代广场`,
       context:`Kenapa tidak dimasukkan: sesi belanja/mal bukan prioritas trip ini (sama alasan seperti Suzhou Centre Plaza) — meski searah kawasan Jinji Lake (Hari 2), sengaja tidak ditambahkan supaya hari itu tetap fokus outdoor.`,
       text:`Mal besar di tepi timur Jinji Lake, kompleks komersial-hiburan seluas ±210.000 m². Terkenal dengan kanopi LED sepanjang ±500m (salah satu terpanjang di dunia) yang menampilkan pertunjukan cahaya "daun teratai &amp; ikan berenang" setiap malam — jadi daya tarik tersendiri di luar belanja. <b>Akses:</b> Stasiun Times Square (Line 1) — tersambung langsung ke mal. <b>Jam Operasional:</b> toko umumnya ±10:00–22:00; pertunjukan kanopi LED tayang rutin tiap malam (jadwal spesifik bervariasi, cek on-site). <b>Tiket:</b> Gratis masuk (mal).`,
       wiki:`https://www.trip.com/travel-guide/shops/suzhou/yuanrong-times-square-10567883/`,

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota`,
       nameEn:`Cerita Kota`,
       text:`Hong Kong berkembang dari desa nelayan kecil menjadi salah satu pusat finansial terbesar dunia setelah menjadi koloni Inggris tahun 1841, dikembalikan ke China tahun 1997 dengan status "Satu Negara, Dua Sistem" (Special Administrative Region). Perpaduan budaya Timur-Barat, skyline ikonik Victoria Harbour, dan kepadatan penduduk tertinggi di dunia jadi ciri khasnya.`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+history+documentary`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Awal November masuk musim kering — suhu siang ±27-28°C, malam ±17-22°C, kelembapan mulai turun dari puncak musim panas. ⚠️ Angka rata-rata historis, bukan forecast real-time — cek forecast H-7 sebelum berangkat.`,
       wiki:`https://weather-and-climate.com/averages-Hong-Kong-November`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Hong Kong International Airport (HKG) di Chek Lap Kok — terhubung ke kota via Airport Express (tercepat, ±24 menit ke Kowloon/Central) atau bus/taksi. Rute Ningbo→HK dilayani nonstop oleh Cathay Pacific, China Eastern, dan Hong Kong Express, ±2j35m.`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Tsim Sha Tsui (TST), Kowloon</b> — strategis karena dekat MTR interchange, Star Ferry, Avenue of Stars, dan jalur langsung ke Tung Chung (Lantau) tanpa banyak transfer. Alternatif: Mong Kok (lebih murah, sedikit lebih jauh dari harbour) atau Causeway Bay di sisi Hong Kong Island (dekat shopping &amp; Victoria Park).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain`,
       nameEn:`Destinasi Terkenal Lain`,
       text:`Di luar itinerary utama: <b>Hong Kong Disneyland</b> &amp; <b>Ocean Park</b> — taman hiburan besar, berbayar mahal, tidak sejalan prinsip trip ini. <b>Stanley Market &amp; Repulse Bay</b> — sisi selatan Hong Kong Island, pantai &amp; pasar suvenir, butuh perjalanan tersendiri. <b>Sai Kung</b> — dijuluki "the back garden of Hong Kong", jalur hiking &amp; pantai, di sisi timur jauh dari kota.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Hong+Kong`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, rekomendasi makan aktual tetap mengikuti kriteria ramah lambung. <b>Dim sum</b> — hidangan kukus kecil khas Cantonese (har gow, siu mai), biasanya untuk sarapan/brunch. <b>Wonton noodle soup (雲吞麵)</b> — mie tipis dengan pangsit udang dalam kuah bening. <b>Congee (粥)</b> — bubur nasi halus, sering dengan potongan ikan/ayam. Hong Kong juga terkenal dengan street food yang cenderung berminyak/pedas (curry fish balls, egg waffles) — dihindari sesuai kriteria trip ini.`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Jangan lupa beli Octopus Card di awal — hampir semua transportasi &amp; sebagian toko cashless via kartu ini. Hindari naik taksi jalanan tanpa alamat tertulis (kendala bahasa Kanton). Victoria Peak sangat ramai sore-malam weekend — datang siang hari kerja kalau ingin lebih tenang. Cek status Typhoon Signal sebelum aktivitas outdoor (Ngong Ping 360 &amp; Peak Tram tutup saat sinyal tinggi).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`Octopus Card (beli &amp; top-up di bandara/stasiun MTR). Hong Kong pakai HKD, sebagian tempat besar juga terima UnionPay/kartu kredit asing. VPN TIDAK diperlukan (Google/WhatsApp/Instagram semua normal di HK, beda dari China daratan). Salinan paspor/visa (fisik &amp; digital) — cek syarat visa Indonesia untuk Hong Kong sebelum berangkat.`},
