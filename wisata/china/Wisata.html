<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wisata China</title>
<style>
:root{
  --paper:#FAF7F0;
  --paper-raised:#FFFFFF;
  --ink:#1C2430;
  --ink-soft:#5B6472;
  --amber:#B9781F;
  --amber-ink:#7A5115;
  --amber-soft:#F1E0C4;
  --amber-soft-border:#E0C692;
  --amber-ink-light:#9C7238;
  --amber-soft-light:#F8EEDC;
  --amber-soft-light-border:#EDDBB0;
  --indigo:#2C4870;
  --indigo-ink:#FFFFFF;
  --indigo-soft:#E4EBF5;
  --jade:#4F7A6B;
  --jade-soft:#E1EDE7;
  --violet:#6B5CA5;
  --violet-soft:#EBE6F5;
  --border:#E4DDCC;
  --border-strong:#D2C8AE;
  --row-alt: rgba(44,72,112,.035);
  --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 16px rgba(28,36,48,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181F;
    --paper-raised:#1C222C;
    --ink:#EDE7DA;
    --ink-soft:#A7ADBB;
    --amber:#E0A354;
    --amber-ink:#F3D9AE;
    --amber-soft:#3A2E1A;
    --amber-soft-border:#5A4526;
    --amber-ink-light:#C9AD82;
    --amber-soft-light:#2A2416;
    --amber-soft-light-border:#443722;
    --indigo:#3E5F8F;
    --indigo-ink:#FFFFFF;
    --indigo-soft:#212C3D;
    --jade:#84BCA6;
    --jade-soft:#1D2E28;
    --violet:#B4A4E0;
    --violet-soft:#282137;
    --border:#2B323F;
    --border-strong:#3A4353;
    --row-alt: rgba(255,255,255,.03);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#14181F;
  --paper-raised:#1C222C;
  --ink:#EDE7DA;
  --ink-soft:#A7ADBB;
  --amber:#E0A354;
  --amber-ink:#F3D9AE;
  --amber-soft:#3A2E1A;
  --amber-soft-border:#5A4526;
  --amber-ink-light:#C9AD82;
  --amber-soft-light:#2A2416;
  --amber-soft-light-border:#443722;
  --indigo:#3E5F8F;
  --indigo-ink:#FFFFFF;
  --indigo-soft:#212C3D;
  --jade:#84BCA6;
  --jade-soft:#1D2E28;
  --border:#2B323F;
  --border-strong:#3A4353;
  --row-alt: rgba(255,255,255,.03);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:17px;}
html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;}
h1,h2,h3{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;
  text-wrap:balance;margin:0;
}
a{color:var(--indigo);}
button{font:inherit;}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 64px;}

/* page header */
header.top{
  position:fixed;top:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.top-inner{max-width:760px;margin:0 auto;padding:10px 14px 0;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.page-title{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;}
.page-title .page-sub-inline{font-weight:500;color:var(--ink-soft);font-size:.85rem;}
.top-actions{display:flex;gap:6px;flex:0 0 auto;}
.theme-toggle,.icon-btn{
  flex:0 0 auto;width:32px;height:32px;border-radius:9px;
  border:1px solid var(--border-strong);background:var(--paper-raised);
  color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.theme-toggle:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.theme-toggle svg,.icon-btn svg{width:16px;height:16px;}
.icon-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink);}
body.hide-reviewed .lampiran-item.reviewed{display:none;}
body.hide-reviewed table.itin tbody tr.done{display:none;}
.lampiran-item-head .lampiran-check{flex:0 0 auto;margin:0;}

/* city tabs (top hierarchy) */
.city-tabs{
  display:flex;gap:6px;overflow-x:auto;
  padding:8px 14px 8px;margin:0 -14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.city-tabs::-webkit-scrollbar{display:none;}
.city-tab{
  flex:0 0 auto;border:1px solid var(--border-strong);background:var(--paper-raised);
  color:var(--ink);padding:5px 13px;border-radius:99px;
  font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;
}
.city-tab.active{background:var(--indigo);color:var(--indigo-ink);border-color:var(--indigo);}
.city-tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

.search-row{margin:0 0 8px;}
.dest-search{
  width:100%;box-sizing:border-box;border:1px solid var(--border-strong);
  background:var(--paper-raised);color:var(--ink);border-radius:9px;
  padding:8px 12px;font-size:.85rem;font-family:inherit;
}
.dest-search::placeholder{color:var(--ink-soft);}
.dest-search:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
.search-hit{background:var(--amber-soft);outline:2px solid var(--amber);border-radius:4px;}

.city-panel{display:none;padding-top:12px;}
.city-panel.active{display:block;}
.city-dates{color:var(--ink-soft);font-size:.8rem;margin-bottom:12px;}

/* second-level: itinerary / lampiran (sticky, lives in header) */
.subtabs{display:flex;gap:5px;background:var(--paper-raised);border:1px solid var(--border);border-radius:9px;padding:3px;margin:0 0 8px;}
.subtab-btn{
  flex:1;border:none;background:transparent;color:var(--ink-soft);
  padding:6px 8px;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer;
}
.subtab-btn.active{background:var(--indigo);color:var(--indigo-ink);}
.subtab-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.subview{display:none;}
.subview.active{display:block;}

.section-heading{font-size:1.08rem;font-weight:700;margin:22px 0 10px;}
.section-heading:first-child{margin-top:0;}
.section-intro{color:var(--ink-soft);font-size:.88rem;margin-bottom:14px;line-height:1.6;}

/* ---- transport card, collapsible ---- */
details.transport{
  background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
}
details.transport > summary{
  list-style:none;cursor:pointer;padding:10px 12px;
  display:flex;align-items:center;gap:10px;
}
details.transport > summary::-webkit-details-marker{display:none;}
.transport-icon{
  flex:0 0 auto;width:32px;height:32px;border-radius:9px;
  background:var(--amber-soft);color:var(--amber-ink);
  display:flex;align-items:center;justify-content:center;
}
.transport-head-text{flex:1;min-width:0;}
.transport-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}
.transport-title{font-weight:700;font-size:.95rem;margin-top:1px;}
.transport-tag{flex:0 0 auto;font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:99px;}
.tag-ok{background:var(--jade-soft);color:var(--jade);}
.tag-tbd{background:var(--amber-soft);color:var(--amber-ink);}
.transport-body{border-top:1px solid var(--border);}
.chev{flex:0 0 auto;transition:transform .18s ease;color:var(--ink-soft);}
details[open] > summary .chev{transform:rotate(180deg);}

.flight-route{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;}
.route-city{text-align:left;}
.route-code{font-family:Georgia,serif;font-size:1.3rem;font-weight:700;letter-spacing:.02em;}
.route-name{font-size:.72rem;color:var(--ink-soft);margin-top:1px;}
.route-mid{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 8px;color:var(--amber);}
.route-line{width:100%;height:1px;background:var(--border-strong);position:relative;margin:3px 0;}
.route-line svg{position:absolute;right:-2px;top:-7px;}
.route-dur{font-size:.68rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.flight-meta{border-top:1px dashed var(--border-strong);display:grid;grid-template-columns:repeat(2,1fr);}
.flight-meta div{padding:8px 14px;border-bottom:1px solid var(--border);}
.flight-meta div:nth-last-child(-n+2){border-bottom:none;}
.flight-meta div:nth-child(odd){border-right:1px solid var(--border);}
.meta-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
.meta-value{font-size:.86rem;margin-top:2px;font-variant-numeric:tabular-nums;}
.flight-note{background:var(--indigo-soft);color:var(--ink);font-size:.82rem;padding:9px 14px;line-height:1.5;}
.flight-warn{background:var(--amber-soft);color:var(--amber-ink);font-size:.82rem;padding:9px 14px;line-height:1.5;border-top:1px solid var(--amber-soft-border);}
.transit-list{padding:8px 14px 2px;}
.transit-row{padding:7px 0;border-bottom:1px solid var(--border);}
.transit-row:last-child{border-bottom:none;}

/* ---- day table, collapsible ---- */
details.day{
  background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
}
details.day > summary{
  list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:12px;
  background:var(--jade-soft);
}
details.day > summary::-webkit-details-marker{display:none;}
.day-badge{
  flex:0 0 auto;width:40px;height:40px;border-radius:10px;
  background:var(--indigo);color:var(--indigo-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:700;font-size:1.1rem;
}
.day-head-text{flex:1;min-width:0;}
.day-toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.day-date{font-weight:700;font-size:1rem;}
.day-label{color:var(--ink-soft);font-size:.82rem;margin-top:1px;}
.day-progress{
  flex:0 0 auto;font-size:.72rem;font-variant-numeric:tabular-nums;
  color:var(--jade);background:var(--jade-soft);padding:3px 8px;border-radius:99px;font-weight:700;
}
.reserve-banner,.planb-banner,.info-banner{
  margin:12px 14px 14px;border:1px dashed var(--amber-soft-border);background:var(--amber-soft);
  color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.5;
}
.reserve-banner{margin:0 14px 12px;}
.info-banner{margin:0 14px 12px;}
.reserve-banner .banner-label,.planb-banner .banner-label,.info-banner .banner-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.cadangan-nearby{
  margin:0 14px 14px;border:1px dashed var(--amber-soft-light-border);background:var(--amber-soft-light);
  color:var(--amber-ink-light);border-radius:10px;padding:9px 12px;font-size:.82rem;line-height:1.5;
}
.cadangan-nearby .banner-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:var(--amber-ink-light);}

/* Hotel / Perhatian boxes inside a transport card's body (collapse with it) */
.hotel-banner{
  margin:12px 14px;border:1px dashed var(--amber-soft-border);background:var(--amber-soft);
  color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.5;
}
.warn-banner{
  margin:0 14px 14px;border:1px dashed var(--amber-soft-light-border);background:var(--amber-soft-light);
  color:var(--amber-ink-light);border-radius:10px;padding:9px 12px;font-size:.82rem;line-height:1.5;
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.table-scroll{overflow-x:auto;border-top:1px solid var(--border);-webkit-overflow-scrolling:touch;}
table.itin{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed;}
table.itin thead th{
  position:sticky;top:0;background:var(--indigo);color:var(--indigo-ink);
  font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
  text-align:left;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
table.itin thead th.col-pilih{text-align:center;padding-left:6px;padding-right:6px;}
table.itin thead th.col-num{text-align:right;}
table.itin tbody td{
  padding:11px 10px;font-size:.86rem;vertical-align:top;
  border-bottom:1px solid var(--border);
}
table.itin tbody tr:last-child td{border-bottom:none;}
table.itin tbody tr:nth-child(even){background:var(--row-alt);}
table.itin tbody tr.done td{color:var(--ink-soft);}
table.itin tbody tr.done .cell-dest{text-decoration:line-through;text-decoration-color:var(--border-strong);}
table.itin tfoot td{
  padding:10px 10px;font-size:.82rem;font-weight:700;border-top:2px solid var(--border-strong);
  background:var(--jade-soft);color:var(--jade);
}
table.itin tfoot .cell-valas,table.itin tfoot .cell-rupiah{font-variant-numeric:tabular-nums;text-align:right;}
.cell-pilih{text-align:center;padding-left:6px;padding-right:6px;}
.cell-pilih input{width:18px;height:18px;accent-color:var(--jade);cursor:pointer;}
.cell-jam{white-space:normal;overflow-wrap:break-word;word-break:break-word;padding-left:6px;padding-right:4px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.76rem;line-height:1.3;}
.cell-dest{overflow-wrap:break-word;word-break:break-word;}
.cell-ket{color:var(--ink);overflow-wrap:break-word;word-break:break-word;}
.cell-valas{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.cell-rupiah{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.dash{color:var(--border-strong);}

/* budget summary, collapsible */
details.budget-card{background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden;}
details.budget-card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
details.budget-card > summary::-webkit-details-marker{display:none;}
details.budget-card > summary h3{font-size:1rem;margin:0;}
.budget-card-body{padding:0 16px 16px;border-top:1px solid var(--border);}
.budget-sub{color:var(--ink-soft);font-size:.8rem;margin:12px 0;line-height:1.5;}
table.budget{border-collapse:collapse;width:100%;margin-bottom:14px;font-size:.87rem;}
table.budget th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:6px 4px;border-bottom:1px solid var(--border-strong);}
table.budget td{padding:7px 4px;border-bottom:1px solid var(--border);}
table.budget td:not(:first-child),table.budget th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;}
table.budget tr.grand td{font-weight:700;color:var(--jade);border-top:2px solid var(--border-strong);border-bottom:none;}
.budget-note{font-size:.8rem;color:var(--ink-soft);line-height:1.55;margin-top:2px;}

/* notes card, collapsible */
details.notes-card{background:var(--indigo-soft);border-radius:12px;font-size:.87rem;line-height:1.6;margin:16px 0;overflow:hidden;}
details.notes-card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;}
details.notes-card > summary::-webkit-details-marker{display:none;}
.notes-card-body{padding:0 16px 16px;}
.notes-card ul{margin:0;padding-left:18px;}
.notes-card li{margin-bottom:6px;}
.notes-card li:last-child{margin-bottom:0;}

/* Lampiran — every group (Sebelum Berangkat, Hari 1-4, Cadangan) is a
   collapsible box; places inside it are always expanded (simpler). */
.lampiran-group{background:var(--paper-raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.lampiran-group > summary{
  list-style:none;cursor:pointer;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.lampiran-group > summary::-webkit-details-marker{display:none;}
.lampiran-group[data-key^="h"] > summary{background:var(--jade-soft);}
.lampiran-group[data-key="cadangan"] > summary{background:var(--border);}
.lampiran-group-title{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;font-weight:700;font-size:1rem;}
.lampiran-group-body{border-top:1px solid var(--border);}

.lampiran-item{border-bottom:1px solid var(--border);padding:11px 16px 14px;}
.lampiran-item:last-child{border-bottom:none;}
.lampiran-item-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;cursor:pointer;}
.lampiran-item.intro .lampiran-item-head{cursor:default;}
.lampiran-item-head .place-tag{margin-bottom:0;flex:0 0 auto;}
.lampiran-item-title{flex:1;font-weight:400;font-size:.92rem;font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",serif;}
.item-toggle{
  flex:0 0 auto;border:none;background:none;cursor:pointer;padding:4px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}
.item-toggle:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.lampiran-item.open .item-toggle .chev{transform:rotate(180deg);}
.copy-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.copy-btn{
  font-size:.72rem;font-weight:700;line-height:1;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:99px;background:var(--paper-raised);
  color:var(--indigo);padding:5px 10px;display:inline-flex;align-items:center;gap:4px;
  transition:background .15s,color .15s,border-color .15s;
}
.copy-btn:hover{background:var(--indigo-soft);}
.copy-btn.copied{background:var(--jade);border-color:var(--jade);color:var(--indigo-ink);}
.lampiran-item-body{padding:0;display:none;}
.lampiran-item.open .lampiran-item-body{display:block;}
.lampiran-item-body p{font-size:.89rem;color:var(--ink-soft);line-height:1.62;margin:0 0 10px;}

.lampiran-item.intro{padding:9px 16px 12px;}
.lampiran-item.intro .lampiran-item-head{margin-bottom:2px;}
.lampiran-item.intro .lampiran-item-body{display:block;}
.lampiran-item.intro .lampiran-item-title{
  font-size:.88rem;font-weight:700;color:var(--violet);font-family:inherit;
}
.lampiran-item.intro .lampiran-item-body p{font-size:.85rem;line-height:1.55;}

.place-tag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;margin-bottom:8px;font-weight:700;}
.tag-main{background:var(--jade-soft);color:var(--jade);}
.tag-planb{background:var(--amber-soft);color:var(--amber-ink);}
.tag-food{background:var(--indigo-soft);color:var(--indigo);}
.tag-planc{background:var(--border);color:var(--ink-soft);}
.tag-info{background:var(--violet-soft);color:var(--violet);}
.card-context{
  font-size:.83rem;font-style:italic;color:var(--amber-ink);
  background:var(--amber-soft);border-radius:8px;padding:8px 10px;
  margin-bottom:10px;line-height:1.5;
}
.reserve-info{
  background:var(--indigo-soft);border-radius:8px;padding:9px 11px;
  font-size:.83rem;line-height:1.55;color:var(--ink);margin:0 0 10px;
}
.reserve-info .banner-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--indigo);}
.nearby{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0 0 10px;padding-top:8px;border-top:1px solid var(--border);}
.nearby b{color:var(--ink);font-weight:700;}
.hotels{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0 0 10px;padding-top:8px;border-top:1px solid var(--border);}
.hotels b{color:var(--ink);font-weight:700;}
.hotels a{color:var(--indigo);text-decoration:none;font-weight:600;}
.hotels a:hover{text-decoration:underline;}
.place-links{display:flex;gap:8px;flex-wrap:wrap;}
.place-links a{
  font-size:.8rem;font-weight:700;text-decoration:none;
  border:1px solid var(--border-strong);border-radius:99px;
  padding:6px 13px;display:inline-flex;align-items:center;gap:5px;color:var(--ink);
}
.place-links a:hover{background:var(--indigo-soft);border-color:var(--indigo);}


@media (prefers-reduced-motion: reduce){.chev{transition:none;}}
</style>

<header class="top">
  <div class="top-inner">

const THEME_KEY = 'wisata-theme';
function systemTheme(){ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.innerHTML = t === 'dark' ? MOON_ICON : SUN_ICON;
}
let currentTheme = 'light';
applyTheme(currentTheme);
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, currentTheme);
  applyTheme(currentTheme);
});

function syncHeaderOffset(){
  const header = document.querySelector('header.top');
  const wrap = document.querySelector('.wrap');
  if(header && wrap) wrap.style.paddingTop = header.offsetHeight + 'px';
}
syncHeaderOffset();
window.addEventListener('resize', syncHeaderOffset);
new ResizeObserver(syncHeaderOffset).observe(document.querySelector('header.top'));

function setAllDetails(open){
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  const activeSubview = activePanel.querySelector('.subview.active');
  if(!activeSubview) return;
  activeSubview.querySelectorAll('details').forEach(d=>{ d.open = open; });
}

function searchDestinations(query){
  document.querySelectorAll('.search-hit').forEach(el=>el.classList.remove('search-hit'));
  const q = query.trim().toLowerCase();
  if(!q) return;
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  const activeSubview = activePanel.querySelector('.subview.active');
  if(!activeSubview) return;
  const candidates = [...activeSubview.querySelectorAll('.cell-dest, .lampiran-item-title')];
  const matches = candidates.filter(el => el.textContent.toLowerCase().includes(q));
  matches.forEach(el=>{
    el.classList.add('search-hit');
    const det = el.closest('details');
    if(det) det.open = true;
  });
  if(matches.length) matches[0].scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('dest-search').addEventListener('input', (e)=> searchDestinations(e.target.value));
document.getElementById('collapse-all-btn').addEventListener('click', ()=>{
  setAllDetails(false);
  window.scrollTo(0,0);
});
document.getElementById('expand-all-btn').addEventListener('click', ()=> setAllDetails(true));

const HIDE_REVIEWED_KEY = 'wisata-hide-reviewed';
let hideReviewed = localStorage.getItem(HIDE_REVIEWED_KEY) === '1';
function applyHideReviewed(){
  document.body.classList.toggle('hide-reviewed', hideReviewed);
  const btn = document.getElementById('hide-reviewed-btn');
  btn.classList.toggle('active', hideReviewed);
  btn.setAttribute('aria-pressed', hideReviewed ? 'true' : 'false');
}
applyHideReviewed();
document.getElementById('hide-reviewed-btn').addEventListener('click', ()=>{
  hideReviewed = !hideReviewed;
  localStorage.setItem(HIDE_REVIEWED_KEY, hideReviewed ? '1' : '0');
  applyHideReviewed();
});

/* Downloads a static snapshot of the current page. The app rebuilds all
   its DOM from `destinations` + localStorage on every load, so baking
   `checked` attributes into cloned <input>s would just get discarded by
   that rebuild — instead, inject a tiny seed script (before the main
   script) that pre-populates localStorage with the CURRENT progress if
   the browser opening the file doesn't already have its own (so it
   carries over on a new device/browser, but won't clobber newer progress
   if this same downloaded file is reopened later). */
document.getElementById('download-html-btn').addEventListener('click', ()=>{
  const clone = document.documentElement.cloneNode(true);
  const seed = document.createElement('script');
  seed.textContent =
    'try{' +
    'if(!localStorage.getItem(' + JSON.stringify(STORE_KEY) + '))' +
    ' localStorage.setItem(' + JSON.stringify(STORE_KEY) + ',' + JSON.stringify(JSON.stringify(store)) + ');' +
    'if(!localStorage.getItem(' + JSON.stringify(LAMP_STORE_KEY) + '))' +
    ' localStorage.setItem(' + JSON.stringify(LAMP_STORE_KEY) + ',' + JSON.stringify(JSON.stringify(lampStore)) + ');' +
    '}catch(e){}';
  const mainScript = clone.querySelector('script');
  mainScript.parentNode.insertBefore(seed, mainScript);
  const html = '<!doctype html>\n' + clone.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Wisata.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* Copy-to-clipboard buttons for Lampiran place names (Amap/Google Maps).
   Values live in copyMap (plain JS strings, never HTML-embedded) so
   names with special characters can't break the markup — buttons only
   carry a numeric index into it. */
const copyMap = [];
function copyBtnsHtml(nameEn, nameHanzi){
  if(!nameEn) return '';
  const enIdx = copyMap.push(nameEn) - 1;
  let html = `<button type="button" class="copy-btn" data-copy-idx="${enIdx}" title="Salin nama Inggris untuk Google Maps">📋 EN</button>`;
  if(nameHanzi){
    const hzIdx = copyMap.push(nameHanzi) - 1;
    html += `<button type="button" class="copy-btn" data-copy-idx="${hzIdx}" title="Salin nama Hanzi untuk Amap">📋 中文</button>`;
  }
  return `<div class="copy-row">${html}</div>`;
}
function titleHtml(p){
  const t = p.title || '';
  if(p.nameEn){
    const enEsc = p.nameEn.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(t.startsWith(enEsc)) return `<b>${enEsc}</b>${t.slice(enEsc.length)}`;
  }
  return `<b>${t}</b>`;
}
function legacyCopy(text){
  // Fallback for contexts where navigator.clipboard is blocked (sandboxed
  // iframe without a "clipboard-write" Permissions-Policy allowance,
  // document not focused, older browsers, etc).
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const text = copyMap[+btn.dataset.copyIdx];
  if(text == null) return;
  const orig = btn.innerHTML;
  const showResult = ok=>{
    btn.textContent = ok ? 'Tersalin ✓' : 'Gagal, coba lagi';
    if(ok) btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML = orig; btn.classList.remove('copied'); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showResult(true)).catch(()=>showResult(legacyCopy(text)));
  } else {
    showResult(legacyCopy(text));
  }
});
function nearbyLine(items){
  // Plain text, no Google Maps link — names are already written in
  // Amap-searchable "English (Hanzi)" form in the source .md, meant for
  // the reader to copy-paste manually into Amap/Google Maps themselves.
  if(!items || !items.length) return '';
  return items.join(', ');
}
function tripComLink(name, city){
  return 'https://www.google.com/search?q=' + encodeURIComponent('site:trip.com ' + name + ' ' + city);
}
function hotelsLine(items, city){
  if(!items || !items.length) return '';
  return items.map(txt=>{
    const name = txt.split(' — ')[0].split(' (')[0];
    return `<a href="${tripComLink(name, city)}" target="_blank" rel="noopener">${txt}</a>`;
  }).join(', ');
}

    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Nanjing`,
       nameEn:`Cerita Kota Nanjing`,
       text:`Nanjing pernah menjadi ibu kota enam dinasti China — dikenal sebagai "Kota Enam Dinasti" — dari Wu Timur, Jin Timur, hingga awal Dinasti Ming sebelum ibu kota dipindah ke Beijing. Sungai Qinhuai yang membelah kota menjadi pusat kehidupan sejak zaman kuno, dan kawasan Fuzimiao (Kuil Konfusius) dulunya adalah pusat ujian kenegaraan (imperial examination) terbesar di China. Nanjing juga sempat jadi ibu kota Republik China (1912, lalu 1927-1937/1946-1949) sebelum akhirnya dipindah ke Beijing pasca 1949.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+China+history+documentary`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Musim gugur (September–November) adalah periode terbaik untuk berkunjung — sejuk, kering, minim hujan dibanding musim panas yang terkenal ekstrem (Nanjing termasuk salah satu dari "Tiga Kompor" China, bersama Wuhan dan Chongqing, dengan suhu bisa tembus 38-40°C Juli-Agustus). ⚠️ Angka di bawah rata-rata historis (1991-2021), BUKAN forecast real-time — cek forecast H-7 sebelum berangkat. Awal Oktober: siang ±24°C, malam ±14-16°C, kelembapan ~88-90%. Pertengahan-akhir Oktober: siang turun ke ±20-22°C, malam ±12-14°C. Hujan relatif jarang, tapi tetap bawa payung lipat. ⚠️ <b>Oktober cenderung KERING</b> — relevan untuk Xiaojiuzhaigou di Cadangan (efek "air terjun" tempat itu bergantung curah hujan deras baru-baru ini).`,
       wiki:`https://en.climate-data.org/asia/china/jiangsu/nanjing-2490/`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Bandara utama: <b>Nanjing Lukou International Airport (南京禄口国际机场 · Nánjīng Lùkǒu Guójì Jīchǎng)</b>. Stasiun HSR utama: <b>Nanjing South Railway Station (南京南站 · Nánjīng Nán Zhàn)</b>. ⚠️ Nama di atas adalah nama standar resmi (nama bandara/stasiun besar jarang bervariasi), namun belum di-screenshot-verifikasi langsung dari halaman Amap.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing_Lukou_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Sekitar Fuzimiao/Qinhuai atau Xinjiekou — dua pusat keramaian utama, saling terhubung lewat Metro Line 1/3. Fuzimiao lebih dekat ke kawasan wisata sejarah (Confucius Temple, Qinhuai River), sementara Xinjiekou lebih pusat kota/komersial (Deji Plaza, dll). Untuk fokus wisata seperti itinerary ini, area Fuzimiao/dekat jalur Line 3 lebih strategis — hampir semua destinasi terjangkau tanpa banyak transfer.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Nanjing`,
       nameEn:`Destinasi Terkenal Lain di Nanjing`,
       text:`Di luar itinerary utama, referensi tambahan kalau ada waktu ekstra: <b>Purple Mountain / Zijin Shan (紫金山 · Zǐjīn Shān)</b> — kompleks makam Sun Yat-sen, tapi 392 anak tangga curam tanpa lift, kurang cocok kriteria lutut (lihat Cadangan). <b>Xiaojiuzhaigou (小九寨沟 · Xiǎo Jiǔzhàigōu)</b> — spot air terjun bertingkat viral, juga di kawasan Purple Mountain (lihat Cadangan).`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Nanjing+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Nanjing Salted Duck (盐水鸭 · Yánshuǐ Yā)</b> — hidangan paling ikonik Jiangsu, relatif aman dicoba tapi cukup asin/berlemak. <b>Duck Blood Vermicelli Soup (鸭血粉丝汤 · Yāxiě Fěnsī Tāng)</b> — bisa minta versi tidak pedas. <b>Jiming Soup Steamed Buns &amp; Guotie</b> — jajanan khas Laomendong, guotie tergolong gorengan jadi perlu dibatasi. <b>Yang chun mian (阳春面 · Yángchūn Miàn)</b> — sup mie polos, pilihan paling aman untuk lambung.`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Jangan ke Fuzimiao pada akhir pekan/golden week tanpa tiket area dalam yang sudah dibeli online terlebih dahulu — antrian bisa lebih dari 1 jam. Hindari naik tangga Purple Mountain/Zijin Shan tanpa memastikan dulu ketersediaan shuttle/kereta gantung. Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — sering lambat/tidak akurat di China, gunakan Amap untuk navigasi lokal.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram (tidak bisa diaktifkan setelah masuk). Salinan paspor/visa (fisik &amp; digital) — beberapa reservasi wisata (museum, memorial hall) wajib nomor paspor.`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Laomendong Old Street (老门东 · Lǎoméndōng)`,
       nameEn:`Laomendong Old Street`,
       nameHanzi:`老门东`,
       text:`Kawasan bersejarah era Ming-Qing yang jadi kawasan hunian &amp; perdagangan ramai sejak dulu, persis di dalam tembok kota, tepat di belakang Zhonghua Gate. Sempat terbengkalai bertahun-tahun, direstorasi ulang sejak awal 2000an dengan tetap mempertahankan tata letak jalan &amp; arsitektur kayu tradisional aslinya, sambil menambahkan sentuhan modern. Jalan batu sepanjang 400m ini jadi surga jajanan — ada kios makanan legendaris berusia puluhan tahun berdampingan dengan kafe kreatif kekinian, penuh toko, seniman, dan bangunan bersejarah. <b>Akses:</b> Stasiun Wudingmen (Line 3) ±500m dari pintu barat — lebih dekat &amp; langsung dibanding lewat Zhonghua Gate. Dari hotel (Fuqiao), naik Line 3 langsung tanpa transfer. <b>Jam Operasional:</b> kawasan jalan buka 24 jam (gratis masuk), toko/kios umumnya ±09:00–21:30-22:00; sebagian buka dari jam 07:00. Aula pameran di dalam kawasan tutup setiap Senin. Jam puncak: malam hari (kawasan ini justru "hidup" setelah gelap karena lampion) dan akhir pekan — pas untuk kunjungan malam kedatangan. <b>Tiket:</b> Gratis masuk kawasan, cuma bayar jajanan/toko yang dikunjungi.`,
       wiki:`https://hereisnanjing.com/en/attractions/laomendong-historic-district/`,
       yt:`https://www.youtube.com/results?search_query=Laomendong+Old+Street+Nanjing`,
       nearby:[`Jiming Soup Steamed Buns (jiming tangbao)`,`Guotie (pangsit goreng isi daging sapi)`,`Kue wijen renyah &amp; bubur gula tradisional`]},
      {group:`h1`, tag:`food`, label:`Kuliner`, title:`Nanjing Salted Duck (kuliner)`,
       nameEn:`Nanjing Salted Duck`,
       text:`Hidangan paling ikonik dari Provinsi Jiangsu ini punya sejarah lebih dari 2.500 tahun, dengan catatan tertulis pertama dari periode Six Dynasties (222-589 M). Populer sejak awal Dinasti Ming dan konon jadi favorit Kaisar Zhu Yuanzhang sendiri — ada legenda dia sampai mengeluarkan dekrit membunuh semua ayam jantan di kota (kemungkinan untuk masalah kebisingan!). Dikenal juga sebagai "Osmanthus Duck", dengan kulit putih bersih &amp; rasa gurih lembut yang jadi ciri khas masakan Nanjing — sekarang berstatus produk Indikasi Geografis China.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing_salted_duck`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+salted+duck+recipe+history`,
       nearby:[`Han Fu Xing (韩复兴 · Hán Fùxīng, sejak 1866)`,`Meiyuan (梅苑 · Méiyuàn, restoran Huaiyang)`,`Jiangnan Salted Duck (dekat Confucius Temple)`]},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Nanjing Massacre Memorial Hall (侵华日军南京大屠杀遇难同胞纪念馆 · Qīnhuá Rìjūn Nánjīng Dàtúshā Yùnàn Tóngbāo Jìniànguǎn)`,
       nameEn:`Nanjing Massacre Memorial Hall`,
       nameHanzi:`侵华日军南京大屠杀遇难同胞纪念馆`,
       text:`Dibuka pertama kali 15 Agustus 1985, dibangun langsung di atas lokasi kuburan massal yang digali awal tahun 1980an. Memorial ini dibangun untuk mengenang lebih dari 300.000 warga sipil China yang terbunuh selama enam minggu kekejaman tentara Jepang di Nanjing (1937-1938). Di dalamnya, kerangka korban masih dibiarkan setengah terkubur di tanah dengan papan keterangan — dirancang bukan sekadar memaparkan fakta, tapi membuat pengunjung benar-benar merasakan beratnya sejarah ini. Tempat reflektif, bukan wisata santai — sebaiknya disiapkan mental sebelum masuk. <b>Akses:</b> MRT Line 2, turun Stasiun Yunjinlu, keluar Exit 2 — langsung berhadapan dengan Gate 1 (pintu masuk utama). Saat padat/hari libur nasional, petugas kadang mengarahkan ke Exit 3 (masih ke Gate 1 yang sama). <b>Jam Operasional:</b> 08:30–17:30 (masuk terakhir 16:30), ada 2 sesi kunjungan (pagi 08:30–12:30, siang 12:30–16:30). <b>Tutup setiap Senin</b>, kecuali libur nasional — Hari 2 (Minggu) aman dari risiko ini. Jam puncak: akhir pekan &amp; libur nasional — datang pas jam buka (08:30) untuk lebih longgar. <b>Tiket:</b> Gratis, tapi wajib reservasi online (lihat cara reservasi di bawah).`,
       reserveInfo:`website resmi 19371213.com.cn, atau WeChat official account resmi memorial. Booking 1–7 hari sebelumnya, slot dibuka jam 08:00 setiap hari. <b>1 orang BISA mewakili grup</b> — dalam satu akun/booking bisa tambahkan sampai 5 orang sekaligus (maksimal 3 dewasa + 2 anak di bawah 14 tahun), asal data identitas (nama+nomor paspor) semua anggota dimasukkan saat booking. Jadi untuk rombongan 3 dewasa, 1 booking oleh 1 orang sudah cukup.`,
       wiki:`https://en.wikipedia.org/wiki/Memorial_Hall_of_the_Victims_in_Nanjing_Massacre_by_Japanese_Invaders`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+Massacre+Memorial+Hall+documentary`,
       nearby:[`Peace Park (和平公园 · Hépíng Gōngyuán) — di dalam kompleks, area lebih tenang`,`Yunnan Road area — kafe tenang untuk istirahat sesudahnya`]},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Deji Plaza (德基广场 · Déjī Guǎngchǎng)`,
       nameEn:`Deji Plaza`,
       nameHanzi:`德基广场`,
       text:`Mal mewah di kawasan Xinjiekou. Fase 1 dibuka 2006, Fase 2 menyusul 2012, total luas 313.000 m². Tahun 2024 tercatat sebagai mal dengan penjualan tertinggi di China (24,5 miliar yuan) — mengalahkan SKP Beijing. Ada bioskop IMAX &amp; ice rink di dalamnya. Bukan sesi belanja — cukup jalan-jalan santai untuk berteduh dari panas siang, nyambung langsung dari Massacre Memorial Hall via Line 2. <b>Akses:</b> MRT Line 1/2, turun Stasiun Xinjiekou, keluar Exit 7 — tersambung langsung ke lantai -1 Deji Plaza, tidak perlu keluar ke jalan sama sekali. Dari Massacre Memorial Hall (Yunjinlu), langsung naik Line 2 ke sini (lewat Daxinggong tanpa keluar), tidak perlu balik hotel dulu. <b>Jam Operasional:</b> 10:00–22:00 setiap hari, tidak ada hari libur. Jam puncak: siang hari (sebelum jam 12:00 justru paling sepi kalau mau lebih longgar), akhir pekan lebih ramai dari hari kerja. <b>Tiket:</b> Gratis masuk (mal), bukan sesi belanja di itinerary ini.`,
       wiki:`https://en.wikipedia.org/wiki/Deji_Plaza`,
       yt:`https://www.youtube.com/results?search_query=Deji+Plaza+Nanjing`,
       nearby:[`Food court lantai bawah (banyak pilihan cepat)`]},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Mochou Lake Park (莫愁湖公园 · Mòchóu Hú Gōngyuán)`,
       nameEn:`Mochou Lake Park`,
       nameHanzi:`莫愁湖公园`,
       text:`Namanya berasal dari legenda gadis bernama Mochou di era Dinasti Selatan-Utara (386-589 M). Versi paling populer: ia menikah dan hidup bahagia, sampai suaminya direkrut jadi tentara dan tak pernah kembali. Saking rindunya, konon ia "berubah menjadi danau" dengan harapan airnya mengalir sampai ke tempat suaminya berada — makanya danau ini dinamai untuk mengenang kesetiaannya. Dulunya bagian dari Sungai Yangtze sebelum aliran sungai bergeser, taman ini resmi dibuka tahun 1929. <b>Akses:</b> MRT Line 2/7, turun Stasiun Mochouhu, keluar Exit 1 — langsung di depan loket taman. Dari Deji Plaza (Xinjiekou), naik Line 2 langsung ±15 menit, tanpa transfer. <b>Jam Operasional:</b> Juni–Agustus 06:30–21:30; September–Mei 07:00–21:00. Gratis, tidak perlu reservasi, tidak ada hari libur rutin (aula pameran di dalamnya 08:30–17:00). Jam puncak: pagi &amp; sore akhir pekan. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Mochou_Lake`,
       yt:`https://www.youtube.com/results?search_query=Mochou+Lake+Park+Nanjing`,
       nearby:[`Shengqi Building/rock garden di dalam taman`]},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Nanjing 1912 Block (南京1912 · Nánjīng 1912)`,
       nameEn:`Nanjing 1912 Block`,
       nameHanzi:`南京1912`,
       text:`Namanya diambil dari 1 Januari 1912 — hari Sun Yat-sen dilantik jadi presiden sementara Republik China di Nanjing. Dulunya kawasan elite era Republik, sekarang berubah jadi kawasan bar &amp; restoran ramai dengan 19 bangunan bata abu-abu bergaya Republik (1912-1949) yang tetap dipertahankan, mengingatkan pada suasana Shanghai/Beijing lama. Resmi dibuka Desember 2004, sekarang punya lebih dari 30 bar, kafe, dan resto — kawasan ini justru paling hidup setelah gelap, jadi penutup malam Hari 2 yang pas. <b>Akses:</b> persis di Stasiun Daxinggong (Line 2/3) — dari Mochou Lake Park, naik Line 2 dari Mochouhu langsung ke Daxinggong, lanjut Line 3 satu stasiun ke Fuqiao/hotel sesudahnya. <b>Jam Operasional:</b> kawasan buka 24 jam, tapi mayoritas bar baru buka ±17:00–18:00, beberapa sampai dini hari (02:00–06:30). Tidak ada hari libur. Jam puncak: malam Jumat–Sabtu mulai ±21:00. <b>Tiket:</b> Gratis masuk kawasan; bar/resto di dalamnya bayar sendiri sesuai menu.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing_1912`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+1912+Block+bar+street`,
       nearby:[`Deretan café &amp; resto gaya Republik di sepanjang jalan utama`]},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Jiming Temple (古鸡鸣寺 · Gǔ Jīmíng Sì)`,
       nameEn:`Jiming Temple`,
       nameHanzi:`古鸡鸣寺`,
       text:`Salah satu kuil Buddha tertua di Nanjing, berusia lebih dari 1.700 tahun. Awalnya kuil Tao dibangun tahun 300 M, baru berkembang jadi tempat ibadah Buddha penting tahun 527 M. Sempat hancur saat Pemberontakan Taiping (1851-1860) lalu dibangun ulang. Landmark-nya, Pagoda Bhaisajyaguru setinggi 44.8m, baru selesai dibangun tahun 1991. <b>Akses:</b> MRT Line 3/4, turun Stasiun Jimingsi, keluar Exit 5, jalan kaki ±500m ke Jiefang Gate — persis di area yang sama dengan Xuanwu Lake Park. Tiket masuk kuil dibeli di loket depan gerbang kuil. <b>Jam Operasional:</b> ±07:30–17:00. Tidak ada hari libur rutin. Jam puncak: akhir pekan pagi. <b>Tiket:</b> CNY 10/org (gratis untuk anak di bawah 1,4m dan lansia 70+).`,
       wiki:`https://en.wikipedia.org/wiki/Jiming_Temple`,
       yt:`https://www.youtube.com/results?search_query=Jiming+Temple+Nanjing`,
       nearby:[`Baiweizhai Vegetarian Noodle Restaurant — mi vegetarian terkenal di dalam kompleks`]},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xuanwu Lake Park (玄武湖景区 · Xuánwǔ Hú Jǐngqū)`,
       nameEn:`Xuanwu Lake Park`,
       nameHanzi:`玄武湖景区`,
       text:`Menurut legenda, danau ini sengaja dibuat atas perintah Kaisar Sun Quan di abad ke-3. Namanya "Xuanwu" berasal dari mitos naga hitam (perpaduan kura-kura &amp; ular) yang konon pernah terlihat di sini, dipercaya sebagai dewa air oleh penganut Tao. Selama berabad-abad danau ini punya fungsi berubah-ubah: tempat latihan berburu keluarga kaisar, arena latihan perang laut di masa Dinasti Song, sampai gudang catatan sensus &amp; pajak negara ('Gudang Registrasi Kuning') di masa Dinasti Ming. Baru pada 1911 diubah jadi taman publik seperti sekarang. <b>Akses:</b> MRT Line 3/4, turun Stasiun Jimingsi, keluar Exit 5, jalan kaki ±500m ke Jiefang Gate (salah satu pintu masuk taman). Tiket trolley listrik keliling danau dibeli langsung di loket dekat dermaga, bukan online. <b>Jam Operasional:</b> ±06:00–21:00 setiap hari, gratis, tidak ada hari libur rutin. Jam puncak: pagi hari (warga lokal olahraga) dan sore/malam akhir pekan. <b>Tiket:</b> Gratis masuk taman; trolley listrik keliling danau CNY 30/org (opsional).`,
       wiki:`https://en.wikipedia.org/wiki/Xuanwu_Lake`,
       yt:`https://www.youtube.com/results?search_query=Xuanwu+Lake+Nanjing`,
       nearby:[`Cuizhou Islet (翠洲 · Cuìzhōu) — pulau paling populer`,`Trolley listrik keliling 5 pulau (CNY 30)`]},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Confucius Temple Pedestrian Street &amp; Qinhuai River (夫子庙秦淮风光带 · Fūzǐmiào Qínhuái Fēngguāng Dài)`,
       nameEn:`Confucius Temple Pedestrian Street & Qinhuai River`,
       nameHanzi:`夫子庙秦淮风光带`,
       text:`Kawasan ini bermula dari Universitas Kekaisaran Nanjing yang didirikan tahun 337 M di tepi Sungai Qinhuai. Kuil Konfusius pertama dibangun tahun 384 M, lalu dibangun ulang secara resmi tahun 1034 (Dinasti Song) sebagai tempat pemujaan Konfusius — salah satu yang paling terjaga di China untuk jenisnya. Bangunan yang berdiri sekarang berasal dari abad ke-19 (Dinasti Qing), setelah kompleks aslinya dibakar habis tentara Jepang tahun 1937. Direstorasi ulang tahun 1985 dengan gaya Ming-Qing, dan sekarang jadi kawasan pedestrian street budaya paling ikonik di Nanjing — terkenal dengan suasana malamnya yang dihiasi lampion di sepanjang sungai. <b>Akses:</b> MRT Line 3, turun Stasiun Fuzimiao, keluar Exit 2, jalan kaki ±300m ke arah barat daya. Tiket masuk kompleks kuil (opsional) dibeli di loket dekat gerbang utama, tidak perlu online. <b>Jam Operasional:</b> area pedestrian street &amp; kanal buka 24 jam (gratis, tidak ada jam tutup); kompleks kuil ±08:00–21:00. Boat cruise malam ±18:30–22:00. <b>Jam puncak: 10:00–14:00 dan malam akhir pekan/libur nasional</b> — datang pagi (buka) atau setelah jam 15:00 kalau ingin lebih longgar; night view tetap ramai tapi itu justru daya tariknya. <b>Tiket:</b> Gratis jalan di pedestrian street &amp; tepi kanal; opsional masuk kompleks kuil CNY 30/org.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing_Fuzimiao`,
       yt:`https://www.youtube.com/results?search_query=Confucius+Temple+Qinhuai+River+Nanjing+night`,
       nearby:[`Duck Blood Vermicelli Soup versi tidak pedas (minta tanpa cabai)`,`Qinhuai River night boat cruise`]},
      {group:`h3`, tag:`planb`, label:`Plan-B H3`, title:`Presidential Palace (总统府 · Zǒngtǒng Fǔ)`,
       nameEn:`Presidential Palace`,
       nameHanzi:`总统府`,
       context:`Kenapa jadi Plan-B: sejarahnya menarik, tapi Hari 3 sudah difokuskan ke taman &amp; pedestrian street (Xuanwu Lake, Confucius Temple) — jadi opsi tambahan kalau masih ada waktu/minat, cuma 1 stasiun dari Fuqiao ke Daxinggong.`,
       text:`Kompleks ini menyimpan sejarah 6 abad China dalam satu tempat. Berawal sebagai kediaman kerajaan di era Dinasti Ming, lalu jadi kantor gubernur di era Qing. Tahun 1853 sempat jadi istana "Raja Surgawi" saat Pemberontakan Taiping. Momen paling bersejarah: 1 Januari 1912, di sinilah Sun Yat-sen dilantik sebagai Presiden Sementara Republik China pertama. Sempat jadi markas tentara Jepang (1937), lalu direbut kembali tentara pembebasan tahun 1949. Sekarang jadi museum sejarah modern China. <b>Catatan:</b> tutup setiap Senin (kecuali libur nasional). <b>Akses:</b> MRT Line 3, turun Stasiun Daxinggong (1 stasiun dari Fuqiao), ikuti papan petunjuk ke Presidential Palace — masuk lewat pintu di sisi barat gerbang (per Desember 2024, gerbang utama/gatehouse ditutup permanen untuk pengunjung). <b>Jam Operasional:</b> musim ramai (1 Maret–14 Oktober) 08:30–18:00 (tiket terakhir 17:00); musim sepi (15 Oktober–28/29 Feb) 08:30–17:00. <b>Tutup setiap Senin</b>, kecuali libur nasional. Jam puncak: 10:00–14:00 akhir pekan. <b>Tiket:</b> ±CNY 40/org.`,
       wiki:`https://en.wikipedia.org/wiki/Presidential_Palace_(Nanjing)`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+Presidential+Palace+Zongtongfu`,
       nearby:[`Xu Garden (煦园 · Xù Yuán) — juga disebut "West Garden", di dalam kompleks, bagian terindah`,`Nanjing 1912 Block (南京1912 · Nánjīng 1912) — persis sebelahan`]},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Nanjing Museum (南京博物院 · Nánjīng Bówùyuàn)`,
       nameEn:`Nanjing Museum`,
       nameHanzi:`南京博物院`,
       text:`Salah satu museum tertua &amp; terbesar di China, menyimpan koleksi ribuan tahun sejarah — mulai dari keramik kuno, kaligrafi, lukisan, sampai relik kekaisaran. Koleksi paling terkenal: Han Dynasty Gold Jade Burial Suit, jubah pemakaman dari ribuan lempeng giok yang dijahit dengan benang emas. Di basement ada replika skala penuh jalanan Nanjing era Republik. Banyak pengunjung menghabiskan 3-6 jam di sini karena kontennya sangat kaya, tapi jadwal Hari 4 hanya mengalokasikan ±2 jam — fokus ke koleksi utama &amp; replika Republic Street saja. <b>Catatan:</b> tutup setiap Senin (kecuali libur nasional). <b>Akses:</b> MRT Line 2, turun Stasiun Minggugong, keluar Exit 2 — persis sebelahan dengan Ming Palace Ruins Park (lihat Cadangan). <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00); <b>Senin HANYA buka pagi 09:00–12:00</b> (masuk terakhir 11:00), kecuali libur nasional (buka penuh). Jam puncak: akhir pekan &amp; libur nasional, terutama siang hari — datang pagi begitu buka lebih longgar. <b>Tiket:</b> Gratis, tapi wajib reservasi terpisah — tiket habis cepat, sering ludes H-7 di hari yang sama.`,
       reserveInfo:`website resmi njmuseum.com, atau WeChat mini-program resmi "南京博物院". Tiket dilepas H-7 jam 18:00, habis terjual saat itu juga. <b>1 orang BISA mewakili grup</b> — 1 akun WeChat bisa booking sampai 5 orang.`,
       wiki:`https://en.wikipedia.org/wiki/Nanjing_Museum`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+Museum+tour`,
       nearby:[`Republic Street replika (basement, wajib lihat)`,`Special Exhibition Hall &amp; Art Gallery`,`Museum café di area lobby`]},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Kexiang Food Street (科巷 · Kē Xiàng)`,
       nameEn:`Kexiang Food Street`,
       nameHanzi:`科巷`,
       text:`Nama "Kexiang" berasal dari "Kejuzhixiang" (科举之巷 · Kējǔ Zhī Xiàng), lokasi barak militer untuk ujian kenegaraan cabang militer di masa lampau. Pasar becek "Kexiang Caichang" yang dibangun 1958 lama-lama jadi salah satu pasar tradisional paling legendaris di Nanjing, lalu direnovasi total tahun 2020 jadi "Kexiang Xin Shiji" (pasar baru) — lebih bersih &amp; tertata tapi tetap murah dan ramai penduduk lokal, bukan kawasan turis. Terkenal dengan jajanan khas Jinling, gorengan, dan daging kecap braised — makan siang Hari 4 di sini, jadi opsi paling ramah lambung yang dipilih (bukan gorengan). <b>Akses:</b> MRT Line 2/3, turun Stasiun Daxinggong — persis di jalur pulang dari Nanjing Museum (Minggugong) menuju hotel (Fuqiao). <b>Jam Operasional:</b> pasar &amp; kios buka dari pagi, paling ramai jajanan siap saji siang-sore ±11:00–20:00. Tidak ada hari libur rutin. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/belanjaan saja.`,
       wiki:`http://www.njkexiang.com/`,
       yt:`https://www.youtube.com/results?search_query=Kexiang+Food+Street+Nanjing`},
      // --- cadangan ---
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Niushoushan (牛首山文化旅游区 · Niúshǒushān Wénhuà Lǚyóu Qū)`,
       nameEn:`Niushoushan`,
       nameHanzi:`牛首山文化旅游区`,
       context:`Kenapa tidak dimasukkan: cukup jauh dari pusat kota (±16km, tidak ada MRT langsung, Didi/bus ±45-60 menit sekali jalan) dan tiketnya paling mahal di antara semua destinasi trip ini — digantikan Massacre Memorial Hall (Hari 2) yang gratis dan lebih searah dengan rute Line 2 hari itu.`,
       text:`Niushoushan ("Gunung Kepala Sapi") adalah kawasan budaya-religi Buddhis besar di pinggiran Nanjing, terkenal dengan Usnisa Palace (佛顶宫 · Fódǐng Gōng) — kompleks bawah tanah megah yang dibangun untuk menyimpan relik tulang tengkorak Buddha (parietal bone relic) yang ditemukan di reruntuhan kuil kuno di lokasi ini tahun 2008. Dua puncak kembar gunung ini disebut menyerupai sepasang tanduk sapi, asal-usul namanya. Dari West Gate (pintu masuk yang lebih dekat), lokasi pusat kompleks ada di tengah gunung — bisa jalan kaki ±15 menit atau naik mobil wisata (CNY 10/org). <b>Akses:</b> TIDAK ada MRT langsung — naik bus 712/755/Y2 dari kota (±45-60 menit sekali jalan) atau Didi/taksi (disarankan, lebih cepat &amp; tidak perlu transfer bus). Di dalam Usnisa Palace tersedia eskalator turun ke level bawah tanah &amp; lift di dalam pagoda — gunakan jalur ini semaksimal mungkin untuk yang punya keterbatasan lutut, meski tetap ada beberapa anak tangga di sela ruangan. <b>Jam Operasional:</b> 08:30–17:30 setiap hari (masuk terakhir 16:30), diperpanjang jadi 08:00–17:30 saat libur panjang seperti Golden Week. Tidak ada hari libur rutin. Jam puncak: SANGAT ramai saat Golden Week + akhir pekan — datang tepat jam buka kalau tetap ingin ke sini. <b>Tiket:</b> CNY 145/org (±Rp384.250/org).`,
       wiki:`https://sightdoing.net/usnisa-palace-nanjing/`,
       yt:`https://www.youtube.com/results?search_query=Niushoushan+Nanjing+Usnisa+Palace`,
       nearby:[`Usnisa Palace (佛顶宫 · Fódǐng Gōng) — bagian utama kompleks, tiket terusan`]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Jinling Xiaocheng — Wenxin Pavilion (金陵小城·文心阁 · Jīnlíng Xiǎochéng · Wénxīn Gé)`,
       nameEn:`Jinling Xiaocheng — Wenxin Pavilion`,
       nameHanzi:`金陵小城文心阁`,
       context:`Kenapa tidak dimasukkan: satu kompleks dengan Niushoushan yang sendirinya sudah tidak dimasukkan ke itinerary utama (lihat entri Niushoushan) — murni kota tiruan modern untuk spot foto, menambah biaya (CNY 50/org) dan butuh menunggu golden hour untuk hasil terbaik.`,
       text:`Jinling Xiaocheng adalah kawasan kota tiruan bergaya kuno dengan atap khas "Jinling Blue" (biru keabu-abuan), dibangun di kaki Niushoushan sisi barat. Wenxin Pavilion (文心阁 · Wénxīn Gé) adalah paviliun utamanya, jadi spot favorit untuk foto golden hour/blue hour dan pertunjukan cahaya (light show) di malam hari — banyak pengunjung sengaja datang sore untuk lihat matahari terbenam lalu lanjut nikmati lampu malam dari Lingxiao Terrace di dekatnya. <b>Akses:</b> sama dengan Niushoushan (lihat Cadangan) — di kaki gunung sisi barat, jalan kaki dari kompleks utama, TIDAK ada MRT langsung. <b>Jam Operasional:</b> bervariasi per musim — April-Oktober: weekday 14:00–21:30, weekend 09:30–21:30; November-Maret: weekday 13:30–21:00, weekend 09:30–21:00 (masuk terakhir 30 menit sebelum tutup). Jam puncak: sore menjelang blue hour (paling ramai untuk foto). <b>Tiket:</b> CNY 50/org (±Rp132.500/org, pelajar setengah harga).`,
       wiki:`https://us.trip.com/travel-guide/attraction/nanjing/jinling-xiaocheng-123120422/`,
       yt:`https://www.youtube.com/results?search_query=Jinling+Xiaocheng+Wenxin+Pavilion+Nanjing+night`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Xiaojiuzhaigou (小九寨沟 · Xiǎo Jiǔzhàigōu)`,
       nameEn:`Xiaojiuzhaigou`,
       nameHanzi:`小九寨沟`,
       context:`Kenapa tidak dimasukkan: dua alasan utama. (1) <b>Efek "air terjun bertingkat" yang jadi daya tarik utamanya bergantung pada hujan deras baru-baru ini</b> — Oktober di Nanjing cenderung KERING (lihat bagian Cuaca di atas), jadi ada risiko cukup besar tempat ini terlihat biasa saja/kering saat kunjungan kalian, bukan seperti foto-foto viral yang biasanya diambil setelah hujan. (2) Lokasinya di kawasan Purple Mountain, TIDAK searah dengan rute Hari manapun di itinerary utama (Hari 1 Laomendong, Hari 2 Niushoushan, Hari 3 Line 3 Xuanwu Lake/Confucius Temple, Hari 4 Line 2 Massacre Memorial/Deji Plaza/Mochou Lake) — butuh perjalanan khusus tersendiri. Kalau tetap penasaran, cek dulu kabar hujan H-3 sebelum berangkat — kalau baru hujan deras, worth dipertimbangkan sebagai tambahan dadakan (searah dengan Sun Yat-sen Mausoleum/Ming Xiaoling di bawah, sama-sama via Muxuyuan).`,
       text:`Bekas saluran pelimpah banjir Danau Qianhu di kaki Gunung Zijin (Purple Mountain), sepanjang ±750m, di kawasan Zhongshan Scenic Area dekat Zhongshan Gate. Sekitar 2019 direnovasi jadi ruang rekreasi dengan lanskap air bertingkat — setelah hujan deras, airnya mengalir deras berundak-undak menyerupai Jiuzhaigou (makanya dijuluki "Jiuzhaigou Mini"), jadi spot foto viral warga lokal. <b>Akses:</b> MRT Line 2, turun Stasiun Muxuyuan (sama seperti akses Sun Yat-sen Mausoleum, lihat entri di bawah), lanjut jalan kaki/Didi singkat ke kawasan Zhongshan Gate/Jl. Meihuagu. <b>Jam Operasional:</b> ⚠️ belum ditemukan sumber resmi jam bukanya — sebagai area publik terbuka (bukan objek wisata berbayar formal), kemungkinan buka sepanjang hari. Cek Amap langsung sebelum berkunjung. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan gratis (bagian dari area publik Zhongshan Scenic Area), tapi belum terverifikasi.`,
       wiki:`https://you.ctrip.com/sight/nanjing9/145156344.html`,
       yt:`https://www.youtube.com/results?search_query=南京小九寨沟+Xiaojiuzhaigou+Nanjing`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ming Palace Ruins Park (明故宫遗址公园 · Míng Gùgōng Yízhǐ Gōngyuán)`,
       nameEn:`Ming Palace Ruins Park`,
       nameHanzi:`明故宫遗址公园`,
       context:`Kenapa tidak dimasukkan: persis sebelahan dengan Nanjing Museum (Hari 4), tapi jadwal Hari 4 sudah cukup padat (Nanjing Museum + Kexiang Food Street + buffer ketat sebelum HSR 15:00) — kurang prioritas untuk trip kali ini, tapi sangat mudah disisipkan kalau ternyata masih ada waktu luang persis di Exit 2 Minggugong yang sama.`,
       text:`Zhu Yuanzhang — pendiri Dinasti Ming — mulai membangun istana ini tahun 1367, setahun sebelum dia resmi memproklamasikan Dinasti Ming. Istana ini jadi pusat politik nasional untuk 3 kaisar awal Ming, dan desainnya kelak jadi "cetak biru arsitektur" untuk Forbidden City di Beijing. Dulu dijuluki "Forbidden City Nanjing" karena tidak sembarang orang boleh keluar-masuk tanpa izin kaisar. Setelah ibu kota dipindah ke Beijing, istana ini perlahan terbengkalai dan hancur oleh serangkaian kebakaran (puncaknya tahun 1449). Yang tersisa sekarang cuma pondasi batu, dasar kolom, dan Gerbang Wu yang masih bisa dinaiki — suasana tenang, jadi tempat jalan santai yang syarat sejarah. <b>Akses:</b> MRT Line 2, turun Stasiun Minggugong (nama stasiun sama arti dengan taman ini), keluar Exit 2 — langsung di pintu masuk taman. Persis sebelahan dengan Nanjing Museum. <b>Jam Operasional:</b> taman terbuka luas ±06:30–22:30, gratis, tidak ada hari libur rutin. Area utara &amp; selatan taman terpisah (tidak nyambung langsung), masing-masing butuh reservasi masuk sendiri (gratis, via WeChat/loket). Jam puncak: pagi (sebelum panas) dan sore menjelang matahari terbenam. <b>Tiket:</b> Gratis (reservasi via WeChat/loket, gratis juga).`,
       wiki:`https://www.historyhit.com/locations/the-old-ming-palace/`,
       yt:`https://www.youtube.com/results?search_query=Ming+Palace+Ruins+Park+Nanjing`,
       nearby:[`Wu Gate (午门 · Wǔ Mén) — bisa dinaiki, area foto terbaik`],
       relatedDays:[4]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ming Xiaoling Sacred Way (明孝陵神道 · Míng Xiàolíng Shén Dào)`,
       nameEn:`Ming Xiaoling Sacred Way`,
       nameHanzi:`明孝陵神道`,
       context:`Kenapa tidak dimasukkan: tidak searah dengan rute Line 3 (Hari 3) atau Line 2 (Hari 2/4) yang dipakai itinerary ini — kawasan Purple Mountain/Muxuyuan butuh perjalanan tersendiri, mirip kasus Sun Yat-sen Mausoleum.`,
       text:`Jalan sepanjang 600m menuju makam Zhu Yuanzhang, pendiri sekaligus kaisar pertama Dinasti Ming, dan permaisurinya Ma (makam dinamai "Xiaoling" atau "Makam Berbakti" untuk menghormatinya). Di sepanjang jalan berjejer patung batu singa, unta, gajah, dan kuda yang dipercaya mengusir roh jahat sekaligus menjaga makam. Situs ini bagian dari UNESCO World Heritage. <b>Akses:</b> MRT Line 2, turun Stasiun Muxuyuan, keluar Exit 1, lanjut jalan kaki ±1,6km atau naik shuttle wisata (CNY 10/org) — satu kawasan dengan Sun Yat-sen Mausoleum. <b>Jam Operasional:</b> ±06:30–18:30 (Feb–Nov) / 07:00–17:30 (Des–Jan), bagian dari kompleks Ming Xiaoling Mausoleum. Tidak ada hari libur rutin. Jam puncak: akhir pekan pagi. <b>Tiket:</b> CNY 70/org (tiket Ming Xiaoling Mausoleum, termasuk Sacred Way). Ada tiket kombinasi 2 hari CNY 100/org yang juga mencakup Linggu Temple, Meiling Palace, dan Music Stage.`,
       wiki:`https://en.wikipedia.org/wiki/Ming_Xiaoling_Mausoleum`,
       yt:`https://www.youtube.com/results?search_query=Ming+Xiaoling+Sacred+Way+Nanjing`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Zhonghua Gate (中华门 · Zhōnghuá Mén)`,
       nameEn:`Zhonghua Gate`,
       nameHanzi:`中华门`,
       context:`Kenapa tidak dimasukkan: kurang prioritas dibanding Laomendong yang lebih santai (jalan-jalan+jajan) untuk malam kedatangan Hari 1 — dan bagian atas tembok (kalau tertarik) berupa tangga curam tanpa lift, tidak disarankan untuk kondisi lutut. Kalau tetap ingin mampir bagian bawah/ekshibisi saja, gampang disisipkan karena persis sebelahan dengan Laomendong.`,
       text:`Gerbang berbenteng terbesar di China, dibangun era Kaisar Hongwu (Zhu Yuanzhang) sejak 1366, bagian dari tembok kota Nanjing sepanjang 33,6km. Punya 27 ruang tersembunyi yang bisa menampung hingga 3.000 tentara, dengan 3 halaman tertutup berlapis yang dirancang untuk menjebak musuh yang berhasil menembus pintu depan. Bagian bawah/ekshibisi (jalur relatif datar) bisa dikunjungi tanpa naik ke atas tembok; naik ke atas tembok berarti tangga curam tanpa lift. <b>Akses:</b> MRT Line 3, turun Stasiun Fuzimiao, keluar Exit 2, jalan kaki ±800m. <b>Loket tiket HANYA ada di sisi Gerbang Utara</b> — cari pintu masuk pengunjung di sana. Persis sebelahan dengan Laomendong Old Street (Hari 1) — masuk dari pintu barat Laomendong, jalan ±600m ke arah selatan. <b>Jam Operasional:</b> 08:30–18:00 (loket tutup 17:30). Ada sesi malam khusus di Gerbang Utara: April–Oktober 17:00–22:00 (loket tutup 21:30). Tidak ada hari libur rutin. Jam puncak: siang akhir pekan/libur nasional. <b>Tiket:</b> tiket kombinasi resmi (Dongshuiguan–Jiqing Gate, termasuk Zhonghua Gate) CNY 50/org. Bagian atas tembok, kalau dipilih, tiket bervariasi per seksi ±CNY 30-50/org tambahan.`,
       wiki:`https://en.wikipedia.org/wiki/Zhonghua_Gate,_Nanjing`,
       yt:`https://www.youtube.com/results?search_query=Zhonghua+Gate+Nanjing+inside+exhibition`,
       nearby:[`Taicheng section (台城 · Tái Chéng) — seksi tembok lain dekat Xuanwu Lake, akses lebih landai`],
       relatedDays:[1]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nanjing Folk Museum / Former Residence of Gan Xi (甘熙故居 · Gān Xī Gùjū)`,
       nameEn:`Nanjing Folk Museum / Former Residence of Gan Xi`,
       nameHanzi:`甘熙故居`,
       context:`Kenapa tidak dimasukkan: supaya Hari 1 tidak terlalu berat ke museum di malam kedatangan — Laomendong yang lebih santai (jalan-jalan+jajan) dipilih sebagai fokus utama. Bisa jadi opsi Plan-B kalau Laomendong ternyata tutup lebih awal dari perkiraan.`,
       text:`Dibangun era Kaisar Jiaqing, Dinasti Qing (1796-1820), rumah ini awalnya milik ayah Gan Xi — seorang sastrawan &amp; kolektor buku ternama akhir Dinasti Qing. Dikenal warga lokal sebagai "99,5 kamar" (padahal sebenarnya ada 162 kamar), rumah ini memadukan gaya arsitektur elegan China Selatan dengan kesederhanaan kokoh China Utara. Baru ditemukan &amp; didata sebagai cagar budaya tahun 1982, sekarang jadi museum yang menampilkan budaya &amp; tradisi rakyat Nanjing. <b>Akses:</b> di Zhongshan South Road, Qinhuai District — MRT Line 3, turun Stasiun Wuding Men atau Zhonghuamen (belum diverifikasi exit spesifik), lanjut jalan kaki — satu kawasan dengan Laomendong Old Street (Hari 1). <b>Jam Operasional:</b> 09:00–17:30 (masuk terakhir 17:00). <b>Tutup setiap Senin</b>, kecuali libur nasional/musim panas. Jam puncak: akhir pekan siang. <b>Tiket:</b> CNY 20/org (dewasa), setengah harga untuk anak &amp; lansia.`,
       wiki:`https://en.wikipedia.org/wiki/Former_Residence_of_Gan_Xi`,
       yt:`https://www.youtube.com/results?search_query=Ganxi+Former+Residence+Nanjing+Folk+Museum`,
       nearby:[`Pertunjukan opera Nanjing tradisional (kalau jadwalnya pas)`],
       relatedDays:[1]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Sun Yat-sen Mausoleum (中山陵景区 · Zhōngshān Líng Jǐngqū)`,
       nameEn:`Sun Yat-sen Mausoleum`,
       nameHanzi:`中山陵景区`,
       context:`Kenapa tidak dimasukkan: 392 anak tangga tanpa lift/eskalator ini tidak aman untuk kondisi lutut Anda — kalau tetap penasaran, pertimbangkan hanya lihat dari kaki tangga tanpa naik ke puncak.`,
       text:`Dibangun 1926-1929 untuk Sun Yat-sen, tokoh yang menumbangkan Dinasti Qing dan jadi presiden pertama Republik China (1912). Sesuai wasiatnya sendiri (diucapkan tahun 1912 saat berburu di Purple Mountain), ia dimakamkan di sini pada 1929. Atap biru-putihnya sengaja dipilih untuk melambangkan bendera Kuomintang — simbol berbeda dari atap kuning yang biasa dipakai untuk makam kaisar-kaisar sebelumnya. Untuk mencapai puncak (patung Dr. Sun Yat-sen) harus menaiki 392 anak tangga tanpa lift. <b>Akses:</b> MRT Line 2, turun Stasiun Muxuyuan, keluar Exit 1 — lanjut jalan kaki ±20-25 menit ke area makam, atau naik shuttle wisata (CNY 10/org) langsung ke area gerbang. Satu kawasan dengan Ming Xiaoling Sacred Way dan Xiaojiuzhaigou (lihat entri di atas). <b>Jam Operasional:</b> 08:30–17:00, Selasa–Minggu (Aula Persembahan &amp; Ruang Makam tutup tiap Senin, area luar tetap bisa dimasuki). Gratis, tapi kuota 10.000 tiket/hari, reservasi pakai paspor. Jam puncak: 10:00–14:00 akhir pekan/libur nasional — datang pas buka (08:30) atau setelah jam 16:00 kalau tetap ingin ke sana. <b>Tiket:</b> Gratis (kuota 10.000 tiket/hari, reservasi wajib pakai paspor).`,
       wiki:`https://en.wikipedia.org/wiki/Sun_Yat-sen_Mausoleum`,
       yt:`https://www.youtube.com/results?search_query=Sun+Yat-sen+Mausoleum+Nanjing`,
       nearby:[`Linggu Temple/Pagoda (灵谷寺 · Línggǔ Sì) — dekat, sama-sama Purple Mountain, jalur lebih landai`]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nanjing City Wall — Bagian Atas Tembok (南京城墙 · Nánjīng Chéngqiáng)`,
       nameEn:`Nanjing City Wall — Bagian Atas Tembok`,
       nameHanzi:`南京城墙`,
       context:`Kenapa tidak dimasukkan: akses naik ke ATAS tembok berupa tangga curam tanpa lift — tidak disarankan untuk lutut Anda.`,
       text:`Pembangunan dimulai 1366 di bawah Kaisar Hongwu (Zhu Yuanzhang), dirancang oleh ahli strategi Liu Bowen dan sebagian didanai pedagang kaya, selesai 27 tahun kemudian (1393). Total panjang 33,6km, menjadikannya tembok kota melingkar terpanjang di dunia. <b>Akses:</b> bervariasi per seksi, loket beda-beda di tiap gerbang — seksi Taicheng (dekat Xuanwu Lake) via MRT Line 3/4 Stasiun Jimingsi; seksi Zhonghua Gate via Stasiun Fuzimiao (lihat entri Zhonghua Gate). <b>Jam Operasional:</b> bervariasi per seksi, umumnya ±08:30–17:30, sebagian seksi (termasuk Zhonghua Gate) punya sesi malam sampai 21:00-22:00. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan/libur nasional. <b>Tiket:</b> bervariasi per seksi, umumnya ±CNY 30-50/org tergantung segmen tembok yang dinaiki.`,
       wiki:`https://en.wikipedia.org/wiki/Zhonghua_Gate,_Nanjing`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+City+Wall+Zhonghua+Gate`,
       nearby:[`Taicheng section (台城 · Tái Chéng) — dekat Xuanwu Lake, akses lebih landai`],
       relatedDays:[1]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Zifeng Tower (紫峰大厦 · Zǐfēng Dàshà)`,
       nameEn:`Zifeng Tower`,
       nameHanzi:`紫峰大厦`,
       context:`Kenapa tidak dimasukkan: tiket naik ke observation deck cukup mahal untuk sekadar city view — tidak sejalan dengan prinsip menghindari pengeluaran besar untuk hal yang bisa digantikan pemandangan gratis (mis. dari Xuanwu Lake atau jalan malam Qinhuai River).`,
       text:`Pembangunan dimulai 2005, selesai 2010, dengan tinggi 450m &amp; 66 lantai — gedung tertinggi di Nanjing &amp; Provinsi Jiangsu. Dirancang oleh arsitek Adrian Smith (Skidmore, Owings &amp; Merrill), bentuknya terinspirasi dari Sungai Yangtze, taman hijau kota, dan naga dalam budaya China. Observation deck di lantai 72 (281,8m) punya jendela kaca panorama 360 derajat, plus kedai minuman &amp; kantor pos tertinggi di kota. <b>Akses:</b> MRT Line 1/4, turun Stasiun Gulou, keluar Exit 4B — langsung ke Zifeng Tower. Alternatif: Stasiun Xinjiekou (Line 1/2), jalan kaki singkat — satu kawasan dengan Deji Plaza (Hari 2). <b>Jam Operasional:</b> observation deck ±09:00–21:00 setiap hari, tidak ada hari libur rutin. Jam puncak: akhir pekan 14:00–16:00 — disarankan reservasi dulu karena kuota pengunjung dibatasi. <b>Tiket:</b> ±CNY 100-120/org untuk observation deck lantai 72.`,
       wiki:`https://en.wikipedia.org/wiki/Zifeng_Tower`,
       yt:`https://www.youtube.com/results?search_query=Zifeng+Tower+Nanjing+observation+deck`,
       nearby:[`Zifeng Tower (紫峰大厦 · Zǐfēng Dàshà) mall/food court di lantai bawah — kalau tetap mau mampir tanpa naik observation deck`],
       relatedDays:[2]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Java Forest Valley Cafe (爪哇森谷咖啡 · Zhǎowā Sēngǔ Kāfēi)`,
       nameEn:`Java Forest Valley Cafe`,
       nameHanzi:`爪哇森谷咖啡`,
       context:`Kenapa tidak dimasukkan: ±30 menit dari pusat kota (Jiangning), butuh Didi/taksi khusus (tidak ada akses MRT), dan bukan searah destinasi manapun di itinerary ini — cocok sebagai trip terpisah kalau punya waktu ekstra, bukan disisipkan di sela-sela hari yang sudah padat.`,
       text:`Kafe bertema hutan tropis "gaya Jawa" yang tersembunyi di lembah perbukitan Jiangning, di dalam kawasan taman hiburan yang oleh warganet dijuluki "versi Nanjing dari Wizard of Oz" karena suasananya yang dramatis — tangga hijau berselimut kabut buatan, air terjun bertingkat dengan kolam dangkal berwarna zamrud, dan bangunan kafe utama berbentuk rumah pohon kabin kayu dua lantai dengan teras pemandangan luas. <b>Akses:</b> TIDAK ada MRT — Didi/taksi khusus dari kota, ±30 menit sekali jalan ke kawasan Jiangning. <b>Jam Operasional:</b> belum ditemukan sumber resmi jam operasional pastinya — sebagai kafe di dalam taman hiburan, kemungkinan mengikuti jam taman (siang-sore) dan lebih ramai akhir pekan. Cek Amap/Trip.com langsung sebelum berangkat. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan hanya bayar menu kafe (tanpa tiket masuk terpisah), tapi taman hiburan di sekitarnya bisa jadi berbayar. Cek Amap/Trip.com langsung sebelum berangkat.`,
       wiki:`https://www.trip.com/moments/detail/nanjing-9-147756694/`,
       yt:`https://www.youtube.com/results?search_query=爪哇森林谷咖啡+南京+Java+Forest+Valley+Cafe+Nanjing`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Sun Yat-sen Mausoleum Music Stage (中山陵音乐台 · Zhōngshān Líng Yīnyuètái)`,
       nameEn:`Sun Yat-sen Mausoleum Music Stage`,
       nameHanzi:`中山陵音乐台`,
       context:`Kenapa tidak dimasukkan: aksesnya landai (tidak perlu naik 392 tangga seperti makam utama), TAPI tetap 1 kawasan Purple Mountain yang jauh dari rute itinerary manapun — butuh effort &amp; ongkos ekstra hanya untuk 1 spot foto.`,
       text:`Amfiteater terbuka yang dibangun 1932-1933, bagian dari kompleks Sun Yat-sen Mausoleum di kaki Purple Mountain, awalnya untuk upacara, pertunjukan musik, dan pidato massal — akustiknya terkenal bagus untuk bangunan seusia ini. Sekarang jadi favorit karena puluhan merpati putih jinak yang berkeliaran di sekitar panggung; pengunjung bisa beli pakan burung dari kios sekitar dan foto-foto dikelilingi merpati terbang serempak. <b>Akses:</b> sama dengan Sun Yat-sen Mausoleum (lihat entri sebelumnya) — MRT Line 2 Stasiun Muxuyuan Exit 1, jalan kaki atau shuttle wisata (CNY 10/org). <b>Jam Operasional:</b> mengikuti jam kawasan Sun Yat-sen Mausoleum, ±08:30–17:00. Jam puncak: pagi hari akhir pekan (merpati juga lebih aktif pagi hari). <b>Tiket:</b> CNY 10/org (pelajar CNY 5); pakan merpati dibeli terpisah di kios sekitar.`,
       wiki:`https://en.wikipedia.org/wiki/Sun_Yat-sen_Mausoleum_Music_Stage`,
       yt:`https://www.youtube.com/results?search_query=Sun+Yat-sen+Mausoleum+Music+Stage+pigeons+Nanjing`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Wen Shu Archway &amp; Double Dragon Screen Wall di Pan Pond (天下文枢坊·双龙戏珠照壁·泮池 · Tiānxià Wénshū Fāng · Shuānglóng Xìzhū Zhàobì · Pàn Chí)`,
       nameEn:`Wen Shu Archway & Double Dragon Screen Wall di Pan Pond`,
       nameHanzi:`天下文枢坊双龙戏珠照壁泮池`,
       context:`Kenapa tidak dimasukkan: BUKAN destinasi terpisah — ketiganya sudah otomatis terlewati saat jalan santai di Confucius Temple Pedestrian Street (Hari 3). Dicatat di sini sebagai pengingat spot foto spesifik yang jangan sampai terlewat.`,
       text:`Tiga elemen ikonik di depan gerbang utama Confucius Temple (lihat entri Confucius Temple Pedestrian Street &amp; Qinhuai River, Hari 3): "Tian Xia Wen Shu" (天下文枢 · Tiānxià Wénshū, "Pusat Sastra Dunia") adalah gapura besar yang jadi pintu gerbang pertama kompleks. Persis di seberang sungai berdiri Zhaobi (照壁 · Zhàobì) sepanjang 110m — dibangun 1575, diukir motif "dua naga berebut mutiara" (双龙戏珠 · Shuānglóng Xìzhū), diklaim sebagai dinding penutup pandang terpanjang di China. Di antara keduanya ada Panchi (泮池 · Pàn Chí, "Kolam Bulan Sabit") — satu-satunya Panchi di seluruh kuil Konfusius China yang airnya benar-benar mengalir dari sumber alami (Sungai Qinhuai). <b>Akses:</b> sama dengan Confucius Temple Pedestrian Street (lihat entri di atas) — MRT Line 3, Stasiun Fuzimiao, Exit 2. <b>Jam Operasional:</b> area terbuka/luar kompleks (gratis dilihat dari pedestrian street), mengikuti jam kawasan Confucius Temple. <b>Tiket:</b> Gratis — ketiganya ada di area luar/terbuka kompleks, tidak perlu tiket masuk kuil.`,
       wiki:`https://www.travelchinaguide.com/attraction/jiangsu/nanjing/fuzimiao.htm`,
       yt:`https://www.youtube.com/results?search_query=Fuzimiao+screen+wall+Pan+Pond+Nanjing`,
       relatedDays:[3]},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nanjing Eye Footbridge (南京眼步行桥 · Nánjīng Yǎn Bùxíng Qiáo)`,
       nameEn:`Nanjing Eye Footbridge`,
       nameHanzi:`南京眼步行桥`,
       context:`Kenapa tidak dimasukkan: di kawasan Hexi/Olympic Center, beda arah total dari rute itinerary ini — night view alternatifnya (Qinhuai River, Hari 3) sudah cukup dan lebih dekat dari hotel.`,
       text:`Jembatan pejalan kaki sepanjang 827,5m yang membentang di atas cabang Sungai Yangtze, dibangun untuk Youth Olympic Games 2014 dan jadi landmark baru kawasan Hexi/Binjiang. Namanya diambil dari dua struktur lingkaran oval besar menyerupai "mata" yang jadi ciri khasnya. Malam hari, lampu LED di sepanjang jembatan berubah warna bergantian — jadi salah satu spot night view paling fotogenik di Nanjing, alternatif dari Qinhuai River. <b>Akses:</b> MRT Line 2, turun Stasiun Yuantong, keluar Exit 4, lanjut naik bus 102/109 ±4 halte (jembatan tidak persis di sebelah stasiun). <b>Jam Operasional:</b> ±09:00–22:00, gratis, tidak ada hari libur rutin. Jam puncak: setelah matahari terbenam (untuk lihat LED menyala) terutama akhir pekan. <b>Tiket:</b> Gratis.`,
       wiki:`https://baike.baidu.com/en/item/Nanjing%20Eye%20Footbridge/928561`,
       yt:`https://www.youtube.com/results?search_query=Nanjing+Eye+Footbridge+night+LED`},
    ],

    notes:[
      `<b>Fisik/lutut:</b> semua jalur datar (taman kota, tepi danau, pedestrian street, promenade). Tempat menanjak (Baojie Mountain Forest Park) sengaja tidak dimasukkan, lihat Cadangan.`,
      `<b>Makanan:</b> tidak pedas, tidak asam, tidak berminyak/gorengan.`,
      `<b>Transportasi:</b> hotel di Taihu Square (Line 1), 1 halte dari Qingmingqiao. Klaster Lihu Timur (Hari 2, hari penuh s/d ±21:00): Line 1 + transfer Line 2 ke Heliekou, lanjut Didi/jalan kaki antar taman, Didi khusus ke Gonghu Bay di sore hari. Klaster Lihu Barat (Hari 4, hari penuh s/d ±21:00): Didi langsung dari hotel ke Yuantouzhu (±9-10km, tidak ada MRT). <b>Hari 5:</b> koper dititip di hotel setelah checkout, diambil siang sebelum ke stasiun. Metro Line 1 jalur utama (+transfer Line 4 di <b>Liutan</b> untuk Huishan).`,
      `<b>Tempat berbayar</b> (Xihui Park, Jichang Garden, Liyuan Garden, Taihu Yuantouzhu) ditandai jelas &amp; sebagian opsional untuk hemat biaya.`,
      `<b>Golden Week:</b> Huishan (rawan macet) di 8 Okt setelah liburan usai; klaster Lihu Timur (area luas, tahan ramai) di 7 Okt. Klaster Lihu Barat termasuk <b>Yuantouzhu</b> (destinasi populer) ditaruh 9 Okt — sudah lewat Golden Week, jadi lebih tenang.`,
      `<b>Jadwal:</b> tiba 18:00 (6 Okt), pulang 15:00 (10 Okt) via HSR ke Suzhou. Qingming Bridge/Nanchang Street versi malam di Hari 3.`,
      `<b>Itinerary kota ini independen</b> — tidak menyambung otomatis ke jadwal Nanjing/Suzhou; penyambungan antar kota diatur terpisah oleh Anda.`,
