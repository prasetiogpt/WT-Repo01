      note:`Hotel berada persis di <b>Stasiun Taihu Square</b>, kawasan Old Canal, Liangxi District — bukan satu kompleks dengan Tanduqiao seperti tercatat sebelumnya, melainkan 1 halte terpisah (¥2, ±7 menit). Urutan stasiun Line 1 (selatan→utara): <b>Qingmingqiao → Taihu Square (hotel) → Tanduqiao → Nanchan Temple → Sanyang Plaza → Shenglimen → Wuxi Railway Station → ... → Liutan</b> (transfer Line 4), semua searah tanpa backtrack — rute penuh terverifikasi Amap 2026-09-22. Ke <b>Huishan (Hari 3)</b>: Line 1 ke Liutan (transfer dalam-stasiun 219m/±4 menit) lanjut Line 4, total 12 halte, ¥3/org (terverifikasi). Ke <b>klaster Lihu Timur (Hari 2 — Lixi Park, Central Lihu Park, Liyuan Garden, Gonghu Bay Wetland Park)</b>: Line 1 ke Sanyang Plaza (3 halte) + transfer <b>Line 2</b> ke Stasiun <b>Heliekou</b> (4 halte lagi, total 7 halte), lanjut Didi/jalan kaki antar taman, Didi khusus ke Gonghu Bay di sore hari, pulang via Didi langsung dari Gonghu Bay. Ke <b>klaster Lihu Barat (Hari 4 — Taihu Yuantouzhu, Lihu National Wetland Park, Bogong Island)</b>: Didi langsung dari hotel ke Yuantouzhu (±9-10km, tidak ada MRT langsung — ada alternatif MRT+sepeda ±1j5m/¥4 kalau ingin hemat, lihat Lampiran), lanjut sewa sepeda antar-lokasi (Yuantouzhu→Lihu Wetland Park 3,7km, lalu ke Bogong Island), pulang via Didi langsung dari Bogong Island.`,

      `<b>Fisik/lutut:</b> semua jalur datar (taman kota, tepi danau, pedestrian street, promenade). Tempat menanjak (Baojie Mountain Forest Park) sengaja tidak dimasukkan, lihat Cadangan.`,

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Area <b>Taihu Square</b>, di jalur <b>Metro Line 1</b> — ±4,8km/24 menit naik mobil dari Wuxi Railway Station, atau 5 halte MRT langsung tanpa transfer (¥2, ±10 menit). Berada di kawasan Old Canal/Nanchan Temple, ±9km (11 halte Line 1) dari tepi Danau Lihu/Taihu — ke klaster Lihu/Taihu perlu Didi atau Line 1 + transfer; ke Old City/Nanchan Temple &amp; stasiun tinggal Line 1 lurus (1 halte ke Qingmingqiao ke arah selatan); ke Huishan perlu transfer Line 4 di Liutan.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain di Wuxi`,
       nameEn:`Destinasi Terkenal Lain di Wuxi`,
       text:`Di luar itinerary utama: <b>Lingshan Grand Buddha (灵山大佛 · Língshān Dàfó)</b> — patung Buddha berdiri 88m, salah satu ikon wisata religi terbesar di China Timur. <b>The Plum Garden/Meiyuan (梅园 · Méiyuán)</b> — terkenal saat ribuan pohon plum mekar di musim semi. Keduanya ada di bagian Cadangan dengan alasan tidak dimasukkan.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Wuxi+China`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Wuxi Spare Ribs (无锡排骨 · Wúxī Páigǔ)</b> — hidangan paling ikonik Wuxi, iga babi dimasak manis-gurih khas gaya Jiangnan, tapi cukup manis &amp; berlemak. <b>Wuxi Xiaolongbao</b> — versi lokal pangsit kuah dengan isian sedikit lebih manis dibanding versi Shanghai. <b>Liangxi Crispy Eel</b> — hidangan belut goreng-kecap dingin dengan sejarah lebih dari 1.000 tahun, salah satu hidangan "hidangan dingin" (leng pan) klasik Jiangsu.`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. 6–7 Oktober masih ekor Golden Week — kawasan pedestrian sempit &amp; ikonik (Huishan Old Street) diperkirakan masih ramai, itinerary ini sudah menjadwalkannya di hari yang lebih sepi (8 Okt).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram. Salinan paspor/visa (fisik &amp; digital).`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Lixi Park (蠡溪公园 · Líxī Gōngyuán, alias Binjiang Park)`,
       nameEn:`Lixi Park`,
       nameHanzi:`蠡溪公园`,
       text:`Taman tepi Lihu Lake di kawasan Lixi Road, Distrik Binhu — bagian dari rangkaian taman gratis di tepi Lihu Lake, rating 4.3 di Amap dengan 13 review. <b>Akses:</b> dari hotel (Taihu Square) → MRT Line 1 (3 halte ke Sanyang Plaza) + transfer Line 2 (4 halte) → Stasiun <b>Heliekou, keluar Exit 6</b> (area Lixi Road) — exit terverifikasi Amap; total 7 halte, ¥3/org (estimasi), ±45 menit. <b>Jam Operasional:</b> area taman terbuka, gratis, mengikuti jam kawasan Lihu (±06:00–21:00). <b>Tiket:</b> Gratis.`,
       wiki:`https://ct-by.com/lihu-bridge-park-wuxi-ticket-price-opening-hours-location-and-highlights/`,
       yt:`https://www.youtube.com/results?search_query=Lixi+Park+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Central Lihu Park (蠡湖中央公园 · Líhú Zhōngyāng Gōngyuán)`,
       nameEn:`Central Lihu Park`,
       nameHanzi:`蠡湖中央公园`,
       text:`Taman pusat di persimpangan Huanhu Road/Shuanghong Bridge, dekat Baojie Bridge — ruang publik utama tempat warga lokal jalan santai &amp; olahraga tepi danau Lihu. <b>Akses:</b> ±4,5km dari Lixi Park via Didi (±1 jam jalan kaki, terverifikasi Amap — jalan kaki tidak disarankan). ±1,2km dari Liyuan Garden, ±2km dari Yuantouzhu — semua di sekitar danau Lihu yang sama, dikunjungi searah di hari yang sama (lihat tabel Hari 2). <b>Jam Operasional:</b> buka ±06:00–21:00, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.trip.com/travel-guide/attraction/wuxi/lihu-central-park-91749/`,
       yt:`https://www.youtube.com/results?search_query=Lihu+Central+Park+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Liyuan Garden (蠡园 · Lí Yuán)`,
       nameEn:`Liyuan Garden`,
       nameHanzi:`蠡园`,
       text:`Taman klasik tepi Li Lake (cabang utara Taihu Lake) di Distrik Binhu, dibangun awal abad ke-20 dengan gaya taman Jiangnan — terkenal dengan jembatan zigzag &amp; paviliun tepi air, sering dipaketkan bersama Taihu Yuantouzhu. <b>Akses:</b> jalan kaki ±1,2km dari Central Lihu Park (lanjutan rute Hari 2). <b>Jam Operasional:</b> ±07:30–17:30. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> ±CNY 45/org.`,
       wiki:`https://www.google.com/search?q=Liyuan+Garden+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Liyuan+Garden+Wuxi`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Gonghu Bay Wetland Park (贡湖湾湿地公园 · Gònghú Wān Shīdì Gōngyuán)`,
       nameEn:`Gonghu Bay Wetland Park`,
       nameHanzi:`贡湖湾湿地公园`,
       text:`Kawasan lindung ekologi tepi utara Danau Taihu di persimpangan Gonghu Avenue &amp; Hongzhou Road, Kec. Huazhuang — dibangun lewat proyek "mengembalikan lahan ke danau". Segmen paling scenic ±4km antara Gonghuwan East Gate dan Yanhu Wetland Park. <b>Akses:</b> dari <b>Liyuan Garden</b> (rute Hari 2 saat ini) via Didi, <b>±13-14km/±19-22 menit — terverifikasi Amap</b> (rute populer 14km/19min, alternatif 13km/22min). Tarif Didi tetap estimasi ±CNY 35/2 org (belum ada angka fare langsung dari Amap). ✅ <b>Konfirmasi penempatan hari (2026-09-20):</b> dari Bogong Island (klaster Hari 4) jaraknya <b>18-19km/27-28 menit — lebih jauh lagi</b> — jadi tetap lebih dekat &amp; tepat dikunjungi bersama klaster Hari 2 (Lixi Park/Central Lihu Park/Liyuan Garden) daripada dipindah ke klaster Hari 4. <b>Jam Operasional:</b> taman terbuka ±06:00–20:00, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis; sepeda sewa ±CNY 17/jam/org (opsional).`,
       wiki:`https://www.google.com/search?q=Gonghu+Bay+Wetland+Park+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Gonghu+Bay+Wetland+Park+Wuxi`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`Wuxi Binhu The Mixc (无锡滨湖万象城 · Wúxī Bīnhú Wànxiàng Chéng)`,
       nameEn:`Wuxi Binhu The Mixc`,
       nameHanzi:`无锡滨湖万象城`,
       context:`Kenapa jadi Plan-B: BUKAN destinasi utama (prinsip itinerary ini menghindari sesi belanja), tapi area rooftop/plaza luar bisa dinikmati gratis tanpa belanja — opsi berteduh yang layak kalau hujan deras, searah dengan rute Lihu/Taihu hari ini.`,
       text:`Kompleks urban kelas atas di tepi timur Lihu Lake, 1688 Taihu West Avenue — berada persis di persimpangan kawasan Lihu New City &amp; Taihu New City, dilengkapi rooftop garden &amp; plaza outdoor yang terintegrasi dengan promenade tepi danau. <b>Akses:</b> MRT Line 4, turun Stasiun Dajuyuan (Grand Theatre), jalan kaki singkat ke 1688 Taihu West Avenue. <b>Jam Operasional:</b> mal ±10:00–22:00 setiap hari, tidak ada hari libur. Area rooftop/plaza luar bisa diakses lebih fleksibel. <b>Tiket:</b> Gratis masuk (mal); area rooftop/plaza luar gratis diakses tanpa belanja.`,
       wiki:`https://en.wuxi.gov.cn/2018-03/16/c_465252.htm`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Binhu+The+Mixc`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Wuxi Huishan Old Street (惠山老街 · Huìshān Lǎojiē)`,
       nameEn:`Wuxi Huishan Old Street`,
       nameHanzi:`惠山老街`,
       text:`Jalan pedestrian tua di kaki Gunung Hui, pintu masuk ke kawasan Huishan Ancient Town — dipenuhi kios jajanan lokal &amp; toko kerajinan tradisional, jadi tempat terbaik merasakan suasana pagi kota lama Wuxi sebelum masuk ke kawasan kuil &amp; aula leluhur. <b>Akses:</b> MRT Line 1 dari hotel (Taihu Square) → transfer dalam-stasiun ke Line 4 di <b>Liutan</b> (219m/±4 menit) → Guangshi Road → Huangxiang → Sheng'an → Huishan Ancient Town, Exit 6 — total 12 halte, ¥3/org, rute terverifikasi Amap 2026-09-22; ±5 menit jalan kaki dari Exit 6, langsung di tourist center kawasan. <b>Jam Operasional:</b> kios &amp; jalan buka ±07:00–18:00 (paling ramai jajanan pagi 07:00–10:00), gratis masuk. Tidak ada hari libur rutin. <b>Tiket:</b> Gratis masuk, bayar jajanan/toko saja.`,
       wiki:`https://www.google.com/search?q=Wuxi+Huishan+Old+Street`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Huishan+Old+Street`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Huishan Ancient Town Scenic Area (惠山古镇 · Huìshān Gǔzhèn)`,
       nameEn:`Huishan Ancient Town Scenic Area`,
       nameHanzi:`惠山古镇`,
       text:`Dijuluki "Museum Luar Ruangan Sejarah &amp; Budaya Wuxi", kawasan di kaki Gunung Hui ini menyimpan <b>118 aula leluhur (ancestral hall)</b> dari era Dinasti Tang hingga masa Republik China, mewakili sekitar 80 marga keluarga berbeda — jumlah &amp; keragamannya menjadikannya "Museum Aula Leluhur China" dan tujuan ziarah populer bagi wisatawan domestik. Sejak Dinasti Tang, kawasan ini sudah jadi tempat berkumpul sastrawan karena produksi teh upeti "Yangxian tea"; pada era Song, tradisi membangun aula leluhur untuk menghormati pendahulu mulai berkembang, mencapai puncaknya di era Ming-Qing. <b>Akses:</b> sama seperti Huishan Old Street (Exit 6 Stasiun Huishan Ancient Town) — kawasan ini persis menyambung dari jalan itu. <b>Jam Operasional:</b> area/atraksi bertiket (aula leluhur, dll) buka 08:00–17:30 (masuk terakhir 17:00), butuh tiket kombinasi ±CNY 70-80. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan/libur nasional. <b>Tiket:</b> Gratis jalan di area luar; aula leluhur &amp; atraksi dalam ±CNY 70-80 (tiket kombinasi, sama dengan Xihui Park/Jichang Garden).`,
       wiki:`https://en.wuxi.gov.cn/2020-02/26/c_455876.htm`,
       yt:`https://www.youtube.com/results?search_query=Huishan+Ancient+Town+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Xihui Park Huishan (锡惠公园 · Xīhuì Gōngyuán)`,
       nameEn:`Xihui Park Huishan`,
       nameHanzi:`锡惠公园`,
       text:`Taman utama di kaki Gunung Hui yang menaungi beberapa situs terkenal, termasuk Huishan Spring — dikenal sebagai <b>"Mata Air Terbaik Kedua di Bawah Langit"</b> (Tianxia Dier Quan). Dibangun era Dinasti Tang (774-777), mata air ini diberi peringkat oleh "Dewa Teh" legendaris Lu Yu dalam kitab Cha Jing (Kitab Teh) — dari 20 kelas mata air di seluruh negeri, mata air ini diperingkat kedua terbaik. Sastrawan besar seperti Su Shi dan Bai Juyi pernah menulis puisi memujinya. Mata air terbagi jadi 3 kolam (atas, tengah, bawah), dengan kolam bawah digali sejak era Dinasti Song. <b>Akses:</b> menyambung jalan kaki dari Huishan Ancient Town, tetap di kawasan kaki Gunung Hui yang sama. <b>Jam Operasional:</b> 08:00–17:30 (masuk terakhir 17:00). Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> CNY 10/org.`,
       wiki:`https://en.wikipedia.org/wiki/Xihui_Park`,
       yt:`https://www.youtube.com/results?search_query=Xihui+Park+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Jichang Garden (寄畅园 · Jìchàng Yuán)`,
       nameEn:`Jichang Garden`,
       nameHanzi:`寄畅园`,
       text:`Juga dikenal sebagai "Qin Garden", dibangun tahun 1520 — taman klasik bergaya vila Jiangnan satu-satunya peninggalan Dinasti Ming di Wuxi. Awalnya adalah kediaman para biksu yang berafiliasi dengan Huishan Temple. Desain tamannya begitu dikagumi hingga Kaisar Qianlong dari Dinasti Qing meniru sebagian elemennya untuk membangun bagian dari Summer Palace di Beijing. <b>Akses:</b> persis di dalam Xihui Park, tidak perlu pindah lokasi. <b>Jam Operasional:</b> mengikuti jam Huishan Ancient Town (08:00–17:30, masuk terakhir 17:00). <b>Tiket:</b> termasuk dalam tiket kombinasi ±CNY 70-80 dengan Huishan Spring &amp; Huishan Temple, atau CNY 45/org kalau beli terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Jichang_Garden`,
       yt:`https://www.youtube.com/results?search_query=Jichang+Garden+Wuxi`},
      {group:`h3`, tag:`planb`, label:`Plan-B H3`, title:`Huishan Temple (Cultural Relics Area) (惠山寺 · Huìshān Sì)`,
       nameEn:`Huishan Temple`,
       nameHanzi:`惠山寺`,
       context:`Kenapa jadi Plan-B: persis di dalam area yang sama dengan Xihui Park (tiket kombinasi ±CNY 70), jadi alternatif kalau Jichang Garden terlalu ramai atau ingin fokus ke sisi sejarah kuil dibanding taman klasik.`,
       text:`Kuil dengan akar sejarah dari era Dinasti Selatan-Utara, awalnya bernama "Lishan Caotang" di bawah naungan Zhan Ting pada masa Dinasti Selatan — cikal bakal kawasan spiritual yang kelak berkembang jadi kompleks Xihui Park &amp; Huishan Ancient Town yang lebih luas. <b>Akses:</b> persis di dalam Xihui Park, sama seperti Jichang Garden. <b>Jam Operasional:</b> mengikuti jam Huishan Ancient Town/Xihui Park (08:00–17:30). <b>Tiket:</b> termasuk dalam tiket kombinasi ±CNY 70 (sama dengan Xihui Park/Jichang Garden).`,
       wiki:`https://en.wikipedia.org/wiki/Huishan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Huishan+Temple+Wuxi`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Nanchang Street Pedestrian Street (南长街 · Nán Cháng Jiē)`,
       nameEn:`Nanchang Street Pedestrian Street`,
       nameHanzi:`南长街`,
       text:`Bagian dari Situs Warisan Dunia UNESCO Grand Canal, membentang 5,5km dari gerbang selatan kota lama Wuxi hingga Xinguang Road, dengan kawasan inti di sekitar kanal kuno. Di masa kejayaannya, jalan ini adalah jantung perdagangan kota lama Wuxi — dipenuhi pabrik penggilingan beras, pabrik sutra, dermaga perahu, teater, dan restoran. Dikunjungi malam hari di itinerary ini, menyambung dari sesi Qingming Bridge. <b>Akses:</b> persis di sekitar Stasiun <b>Qingmingqiao</b> (Metro Line 1) — langsung 1 halte dari hotel (Taihu Square), tidak perlu jalan kaki jauh dari Nanchan Temple. <b>Jam Operasional:</b> jalan pedestrian &amp; kanal buka 24 jam, gratis. Kios/toko umumnya ±09:00–21:00 — pas untuk versi malam. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://en.wikipedia.org/wiki/Grand_Canal_(China)`,
       yt:`https://www.youtube.com/results?search_query=Nanchang+Street+Wuxi+night`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Qingming Bridge Ancient Canal Scenic Spot (清名桥古运河景区 · Qīngmíng Qiáo Gǔ Yùnhé Jǐngqū)`,
       nameEn:`Qingming Bridge Ancient Canal Scenic Spot`,
       nameHanzi:`清名桥古运河景区`,
       text:`Jembatan batu lengkung tertua &amp; terbesar yang masih bertahan di kawasan urban Wuxi, awalnya bernama "Qingning", dibangun era Wanli (Dinasti Ming) dari sumbangan dua putra tokoh Qin Yao — namanya diambil dari gabungan nama keduanya. Direkonstruksi tahun 1666 (era Kangxi, Dinasti Qing) oleh bupati Wuxi Wu Xingzuo, dan mengalami beberapa kali perbaikan di era Qianlong &amp; Tongzhi. Kawasan ini dan bangunan tepi sungainya berstatus cagar budaya tingkat provinsi — pemandangan malamnya dengan lampu kanal jadi salah satu ikon paling difoto di Wuxi. (Dijadwalkan malam hari (18:00–20:00) di Hari 3 — versi lampu kanal menyala penuh, bukan Hari 5 yang terikat jadwal kereta.) <b>Akses:</b> turun langsung di Stasiun <b>Qingmingqiao</b> (Metro Line 1) — 1 halte dari hotel (Taihu Square); dari Huishan, naik Metro Line 4 → Line 1 terus sampai Qingmingqiao (tidak perlu turun/jalan kaki dari Nanchan Temple). <b>Jam Operasional:</b> kawasan luar/jalan gratis, buka 24 jam. Area berbayar (kalau ada) ±08:30–17:00. Lampu kanal menyala penuh mulai ±19:00 — pas dengan jadwal kunjungan malam di itinerary ini. <b>Tiket:</b> Gratis jalan di kawasan luar/kanal; CNY 60/org untuk area scenic spot berbayar (kalau ingin masuk lebih dalam).`,
       wiki:`https://baike.baidu.com/en/item/Qingming%20Bridge%20and%20Riverside%20Buildings/114519`,
       yt:`https://www.youtube.com/results?search_query=Qingming+Bridge+Ancient+Canal+Wuxi+night`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Taihu Yuantouzhu Scenic Area (太湖鼋头渚 · Tàihú Yuántóuzhǔ)`,
       nameEn:`Taihu Yuantouzhu Scenic Area`,
       nameHanzi:`太湖鼋头渚`,
       text:`Salah satu spot paling ikonik untuk memandang Danau Taihu, semenanjung dengan taman bunga &amp; area foto populer. Nama "Yuantouzhu" berarti "pulau kepala kura-kura" karena bentuk semenanjungnya. Jalur promenade tepi danau <b>sudah termasuk di dalam kawasan berbayar ini</b> — bukan destinasi terpisah (koreksi 2026-09-20: entri lama "Taihu Lake Promenade" di dokumen ini kemungkinan besar merujuk ke jalur yang sama, dihapus sebagai stop terpisah karena tidak ditemukan sebagai POI berdiri sendiri di Amap). <b>Akses:</b> Didi langsung dari hotel, ±9-10km/±30-40 menit — tidak ada MRT langsung. <b>Jam Operasional:</b> ±07:00–17:30. Tidak ada hari libur rutin. Jam puncak: akhir pekan &amp; musim bunga. <b>Tiket:</b> CNY 90/org (tiket reguler). Taihu Xiandao (dulu termasuk tiket terusan CNY 105) dipindah ke Cadangan — lihat entri terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Yuantouzhu`,
       yt:`https://www.youtube.com/results?search_query=Taihu+Yuantouzhu+Scenic+Area+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Lihu National Wetland Park (蠡湖国家湿地公园 · Líhú Guójiā Shīdì Gōngyuán)`,
       nameEn:`Lihu National Wetland Park`,
       nameHanzi:`蠡湖国家湿地公园`,
       text:`Nama payung yang mencakup 15 sub-taman gratis di sekitar Danau Lihu (termasuk Lihu Park, Central Lihu Park, Changguangxi Wetland), seluas 1.126 hektar. Legenda Fan Li &amp; Xi Shi (pejabat Kerajaan Yue, &gt;2.500 tahun lalu) terkait kawasan ini. POI spesifik bernama sama di Amap ada di area Xuelang, dekat Yuantouzhu (sisi barat danau). <b>Akses:</b> Sewa sepeda dari Yuantouzhu, <b>3,7km — terverifikasi Amap</b>, jalur tepi danau relatif datar (Meituan/Hellobike, umumnya tersedia di area wisata Wuxi). <b>Jam Operasional:</b> ±06:00–21:00, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Lihu_Park`,
       yt:`https://www.youtube.com/results?search_query=Lihu+National+Wetland+Park+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Bogong Island Ecology Park (渤公岛生态公园 · Bógōng Dǎo Shēngtài Gōngyuán)`,
       nameEn:`Bogong Island Ecology Park`,
       nameHanzi:`渤公岛生态公园`,
       text:`Berada ±2,1km dari Yuantouzhu (bukan bersebelahan — lihat Akses), dibangun lewat proyek "mengembalikan lahan ke danau" di sisi timur bendungan Dushan lama — panjang ±1.700m, luas ±37 hektar. Dinamai untuk mengenang Zhang Bo, tokoh legendaris pengendali banjir. Bagian dari jalur wisata 38km lingkar Lihu, gabungan tema rekayasa air + alam + budaya. <b>Akses:</b> ⚠️ <b>Koreksi</b>: BUKAN jalan kaki bersebelahan langsung dengan Yuantouzhu — terverifikasi Amap, Yuantouzhu→Bogong Island <b>2,1km</b> (rute muter lewat jalan sekitar danau). Jarak persis dari Lihu National Wetland Park (rute Hari 4 saat ini) belum di-Amap-kan. <b>Sewa sepeda</b> (lanjutan dari Lihu Wetland Park) — jarak segini nyaman untuk sepeda, jalur relatif datar. Alternatif: bus 36/53/72/87/106 ke Halte Bogong Island, atau MRT Line 2 ke Rongxiang (Exit 4) lalu transfer bus 87. <b>Jam Operasional:</b> ⚠️ belum ditemukan jam operasional resmi spesifik — kemungkinan taman terbuka tanpa jam tutup ketat (umum untuk taman kota gratis), cek Amap on-site. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.google.com/search?q=Bogong+Island+Ecology+Park+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Bogong+Island+Ecology+Park+Wuxi`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Taihu Lake Promenade — DIHAPUS dari itinerary (2026-09-20)`,

       text:`Sebelumnya dijadwalkan sebagai stop gratis terpisah di akhir Hari 4. <b>Dihapus</b> karena: (1) pengguna cek langsung di Amap dan nama ini <b>tidak ditemukan</b> sebagai POI berdiri sendiri; (2) riset lanjutan menunjukkan "Taihu Lake Promenade" kemungkinan besar merujuk ke jalur promenade <b>di dalam kawasan tiket Taihu Yuantouzhu Scenic Area sendiri</b> (lihat entri Yuantouzhu di atas), bukan tempat gratis terpisah di luar. Waktu yang tadinya dialokasikan untuk sesi ini sekarang dipakai memperpanjang kunjungan Bogong Island Ecology Park, dan Hari 4 selesai lebih awal (±18:40, bukan 21:40).`},

      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Nanchan Temple (南禅寺 · Nán Chán Sì)`,
       nameEn:`Nanchan Temple`,
       nameHanzi:`南禅寺`,
       text:`Didirikan tahun 547 M pada masa pemerintahan Kaisar Wu dari Dinasti Liang (Dinasti Selatan), awalnya bernama Huguo Temple — kuil Buddha tertua yang masih berdiri di kawasan Jiangnan, dijuluki "yang pertama dari 480 kuil Dinasti Selatan". Direnovasi era Dinasti Song Utara (1023-1031) dan diberi nama resmi "Fushang Chan Temple", meski tetap populer disebut Nanchan Temple. Landmark utamanya, Pagoda Miaoguang (era Song Utara, tujuh lantai delapan sisi), termasuk salah satu dari "Delapan Pemandangan Wuxi". <b>Akses:</b> MRT Line 1, turun Stasiun Nanchan Temple (南禅寺站 · Nán Chán Sì Zhàn), keluar Exit 8, jalan kaki ±60m ke arah timur di Xiangyang Road. <b>Jam Operasional:</b> 07:00–16:45. Tidak ada hari libur rutin. Jam puncak: siang akhir pekan. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Nanchan_Temple`,
       yt:`https://www.youtube.com/results?search_query=Nanchan+Temple+Wuxi`},
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Nanchan Temple Pedestrian Street (南禅寺步行街 · Nán Chán Sì Bùxíng Jiē)`,
       nameEn:`Nanchan Temple Pedestrian Street`,
       nameHanzi:`南禅寺步行街`,
       text:`Jalan pedestrian yang membentang dari gerbang selatan kota lama Wuxi, langsung terhubung dengan kompleks Nanchan Temple — bagian dari kawasan bersejarah Grand Canal yang sama dengan Qingming Bridge, meski di itinerary ini keduanya dikunjungi di hari berbeda (Qingming Bridge via akses langsung Stasiun Qingmingqiao di Hari 3 malam, bukan jalan kaki dari sini). <b>Akses:</b> persis di sebelah Nanchan Temple, Stasiun Nanchan Temple Exit 8 yang sama. <b>Jam Operasional:</b> jalan pedestrian buka 24 jam (gratis), kios/toko umumnya ±09:00–21:00. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://www.google.com/search?q=Nanchan+Temple+Pedestrian+Street+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Nanchan+Temple+Pedestrian+Street+Wuxi`},
      {group:`h5`, tag:`planb`, label:`Plan-B H5`, title:`Wuxi Museum (无锡博物院 · Wúxī Bówùyuàn)`,
       nameEn:`Wuxi Museum`,
       nameHanzi:`无锡博物院`,
       context:`Kenapa jadi Plan-B: indoor, gratis, sejalan tema sejarah kota dengan Nanchan Temple — pilihan aman kalau hujan deras, meski waktu Hari 5 sudah dipadatkan sehingga jarang ada slot untuk ini kecuali menggantikan Nanchan Temple sepenuhnya.`,
       text:`Museum modern yang memaparkan sejarah masyarakat Wu dari masa prasejarah hingga era China modern lewat empat lantai koleksi di sayap baratnya, dengan keterangan bahasa Inggris yang cukup lengkap. <b>Akses:</b> searah kawasan Old City, cek rute MRT terdekat saat akan berkunjung (tidak dipakai di itinerary utama). <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00). <b>Tutup setiap Senin</b>, kecuali libur nasional. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.tripadvisor.com/Attraction_Review-g297443-d1864917-Reviews-Wuxi_Museum-Wuxi_Jiangsu.html`,
       yt:`https://www.youtube.com/results?search_query=Wuxi+Museum`},

      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Taihu Xiandao (太湖仙岛 · Tàihú Xiāndǎo)`,
       nameEn:`Taihu Xiandao`,
       nameHanzi:`太湖仙岛`,
       context:`Kenapa tidak dimasukkan: instruksi eksplisit pengguna — tidak akan dikunjungi. Diganti Bogong Island Ecology Park (Hari 4) yang gratis, ±2,1km dari Yuantouzhu (terjangkau sepeda), tanpa perlu naik perahu.`,
       text:`Juga disebut Pulau Sanshan, pulau di tengah Danau Taihu yang dicapai naik perahu ±15 menit dari dermaga Yuantouzhu — dipenuhi kuil &amp; paviliun bertema Taoisme, dengan "会仙桥" (jembatan kayu gantung) menghubungkan area utara-selatan pulau. Titik tertinggi pulau adalah Istana Lingxiao (凌霄宫) di puncak bukit. <b>Akses:</b> naik perahu dari dermaga Taihu Yuantouzhu (±15 menit), dulu termasuk tiket terusan Yuantouzhu. <b>Jam Operasional:</b> perahu beroperasi ±08:20–16:50 (jadwal terakhir naik pulau). Area pulau ±07:00–17:30. <b>Tiket:</b> dulu termasuk tiket terusan Yuantouzhu CNY 105/org — kalau ingin ke sini, beli tiket terusan (bukan tiket reguler CNY 90) di Yuantouzhu. <b>Catatan fisik:</b> area selatan/dermaga datar. Puncak Istana Lingxiao butuh menanjak, akses lift/eskalator belum terverifikasi.`,
       wiki:`https://www.google.com/search?q=Taihu+Xiandao+Wuxi`,
       yt:`https://www.youtube.com/results?search_query=Taihu+Xiandao+Wuxi`},

       text:`Taman hutan pegunungan di pinggiran Wuxi dengan jalur hiking &amp; udara segar. <b>Akses:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan area Binhu/Baojie di selatan kota, dekat Baojie Bridge. Cek Amap langsung sebelum berangkat. <b>Jam Operasional:</b> belum ditemukan sumber jam operasional resmi yang solid — kemungkinan taman terbuka tanpa jam tutup ketat (umum untuk taman hutan pinggiran kota). Cek Amap langsung sebelum berangkat kalau tetap ingin ke sini. <b>Tiket:</b> ⚠️ belum ditemukan sumber resmi — kemungkinan gratis (umum untuk taman hutan kota), cek Amap/Trip.com langsung sebelum berangkat.`,

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota Ningbo`,
       nameEn:`Cerita Kota Ningbo`,
       text:`Ningbo adalah salah satu kota pelabuhan tertua di China, dengan sejarah lebih dari 7.000 tahun (situs Hemudu di dekatnya adalah bukti peradaban Neolitikum). Pernah jadi salah satu dari sedikit pelabuhan yang dibuka untuk perdagangan asing di era Dinasti Ming-Qing, dan kini jadi salah satu pelabuhan kontainer tersibuk di dunia (Ningbo-Zhoushan Port). Kota ini juga terkenal sebagai kampung halaman Chiang Kai-shek (Xikou) dan pusat budaya Zhejiang Timur (Yongjiang/Siming Culture).`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,

       text:`Bandara utama: <b>Ningbo Lishe International Airport (宁波栎社国际机场 · Níngbō Lìshè Guójì Jīchǎng)</b>. Stasiun HSR utama: <b>Ningbo Railway Station (宁波站 · Níngbō Zhàn)</b>. Ningbo Rail Transit (MRT) sudah punya 8 jalur aktif per pertengahan 2026, jaringan cukup luas untuk menjangkau sebagian besar destinasi utama kota.`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo_Lishe_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Untuk kunjungan singkat, kawasan <b>Tianyi Square/Ximenkou</b> (pusat kota lama, Line 1) atau <b>Old Bund/Sanjiangkou</b> (Line 2) paling strategis — dekat mayoritas destinasi utama &amp; jalur MRT. Untuk trip ini, tempat tinggal sudah fixed di <b>Yinzhou District</b> (area Taikang Road, anchor Line 8), sedikit lebih jauh dari pusat kota tapi tetap terhubung via transfer Line 8 ke destinasi timur (Dongqian Lake, Ashoka Temple, Tiantong Temple).`},

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, karena rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (tidak pedas/asam/gorengan/berminyak). <b>Ningbo Tangyuan (宁波汤圆 · Níngbō Tāngyuán)</b> — bola ketan isi wijen hitam manis dalam kuah hangat, hidangan paling ikonik kota ini. <b>Ikan Layur Kukus (清蒸带鱼)</b> — hidangan seafood segar khas, dimasak sederhana dengan jahe &amp; daun bawang. <b>Kue Beras Ningbo (年糕)</b> — kue beras giling khas, biasa ditumis atau direbus dalam sup ringan.`,
       yt:`https://www.youtube.com/results?search_query=Ningbo+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Hindari taksi jalanan biasa karena kendala bahasa — gunakan Didi (versi internasional) atau MRT. Jangan andalkan Google Maps/Google service tanpa VPN — gunakan Amap untuk navigasi lokal. Untuk day-trip jauh (Xikou/Qiantong/Hemudu/Xiangshan), cek jadwal bus H-1 karena beberapa rute belum terverifikasi presisi di dokumen ini.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan (Khusus China)`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`App WeChat Pay/Alipay (tautkan kartu asing) — banyak tempat cashless total. Terjemahan offline (unduh paket bahasa Mandarin di Google Translate). Power bank &amp; adaptor tipe A/I. VPN aktif SEBELUM masuk China kalau butuh akses Google/WhatsApp/Instagram.`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Ningbo Museum (宁波博物馆 · Níngbō Bówùguǎn)`,
       nameEn:`Ningbo Museum`,
       nameHanzi:`宁波博物馆`,
       text:`Dirancang oleh arsitek pemenang Pritzker Prize Wang Shu (Amateur Architecture Studio), museum ini terkenal dengan fasad "wa pian qiang" (瓦爿墙) — dinding yang dibangun dari bata &amp; genteng bekas bangunan-bangunan tua yang dibongkar di sekitar Ningbo, sebagai bentuk pelestarian memori kota. Bentuk bangunannya terinspirasi dari lanskap gunung &amp; pola desa tradisional Zhejiang, memenangkan berbagai penghargaan arsitektur internasional sejak dibuka 2008. <b>Akses:</b> Stasiun Yinzhou Government (鄞州区政府站) atau area sekitar via Line 3/5 — persis sebelahan dengan Yinzhou Park. ⚠️ Titik transfer dari Line 8 (rumah) belum terverifikasi presisi. <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:00 (masuk terakhir 16:00). Tutup setiap Senin, kecuali libur nasional. <b>Tiket:</b> Gratis (reservasi via WeChat mini-program disarankan untuk akhir pekan).`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo_Museum`,
       yt:`https://www.youtube.com/results?search_query=Ningbo+Museum+Wang+Shu`,
       nearby:[`Yinzhou Park (persis di seberang museum)`]},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Yinzhou Park (鄞州公园 · Yínzhōu Gōngyuán)`,
       nameEn:`Yinzhou Park`,
       nameHanzi:`鄞州公园`,
       text:`Dijuluki "Central Park"-nya Ningbo — taman kota luas dengan pepohonan rindang, danau kecil untuk cruise boat, dan area olahraga warga lokal. Jadi salah satu ruang publik favorit warga Yinzhou District untuk bersantai sore hari, persis di seberang Ningbo Museum yang ikonik. <b>Akses:</b> persis sebelahan dengan Ningbo Museum, akses transportasi sama. <b>Jam Operasional:</b> taman terbuka ±06:00–22:00, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis; cruise boat di dalam taman berbayar terpisah (opsional).`,
       wiki:`https://en.wikipedia.org/wiki/Yinzhou_District`,
       yt:`https://www.youtube.com/results?search_query=Yinzhou+Park+Ningbo`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Cixi Bay Wetland Park (慈溪杭州湾湿地公园 · Cíxī Hángzhōu Wān Shīdì Gōngyuán)`,
       nameEn:`Cixi Bay Wetland Park`,
       nameHanzi:`慈溪杭州湾湿地公园`,
       text:`Taman lahan basah luas di pesisir utara Cixi (satu wilayah prefektur Ningbo), terkenal dengan burung migran dan pemandangan Jembatan Teluk Hangzhou — salah satu jembatan lintas laut terpanjang di dunia — dari kejauhan. Resmi bernama Hangzhou Bay National Wetland Park. <b>Akses:</b> bus wisata khusus 298 dari Ningbo South Bus Station, atau bus Cixi 299 / Hangzhouwan 107 turun di halte Wetland Park (⚠️ ±1–1,5 jam, belum diverifikasi Amap). <b>Jam Operasional:</b> 08:30–17:00 (April–Oktober), 08:30–16:30 (November–Maret); sebagian sumber 08:00–17:00 dengan masuk terakhir 16:00. <b>Tiket:</b> ±CNY 54–75/org (⚠️ sumber bervariasi).`,
       wiki:`https://en.wikipedia.org/wiki/Cixi,_Zhejiang`,
       yt:`https://www.youtube.com/results?search_query=Cixi+Hangzhou+Bay+Wetland+Park`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Youngor Zoo (雅戈尔动物园 · Yǎgēěr Dòngwùyuán)`,
       nameEn:`Youngor Zoo`,
       nameHanzi:`雅戈尔动物园`,
       text:`Kebun binatang safari terbesar di Zhejiang, dikelola grup fashion Youngor — pengunjung bisa naik bus safari melewati area singa, harimau, dan satwa liar lainnya di kawasan luas. <b>Akses:</b> bus 106 dari Ningbo Railway Station ke Gerbang Utara; bus 963 dari East Bus Station ke Gerbang Selatan. Alternatif Line 1 ke stasiun terdekat lalu becak listrik ±CNY 30. Belum ada MRT langsung. <b>Jam Operasional:</b> Mei–Oktober 08:00–16:00 (masuk terakhir ±15:30); November–April 08:30–16:30. <b>Tiket:</b> ±CNY 130/org (⚠️ sebagian sumber menyebut ¥170).`,
       wiki:`https://govt.chinadaily.com.cn/s/201712/15/WS5cdb651b498e079e68020e4c/ningbo-youngor-zoo.html`,
       yt:`https://www.youtube.com/results?search_query=Youngor+Zoo+Ningbo`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Mount Putuo (普陀山 · Pǔtuóshān)`,
       nameEn:`Mount Putuo`,
       nameHanzi:`普陀山`,
       text:`Salah satu dari empat gunung suci Buddha di China (bersama Wutai, Emei, Jiuhua), didedikasikan untuk Bodhisattva Guanyin — pulau ini dipenuhi kuil megah (Puji Temple, Purple Bamboo Grove) dan patung Guanyin Nanhai, tujuan ziarah penting Asia Timur. <b>Akses:</b> dari Ningbo South Bus Station naik bus ke Zhujiajian Wugongzhi Wharf (±2,5 jam, ¥44–47/org, bus 06:30–19:30), lanjut feri ±10 menit ke pulau (¥30–100/org). Speedboat terakhir pulang ±16:40. ⚠️ harga/jadwal dari sumber sebelum 2026. <b>Jam Operasional:</b> ±06:00–17:00 (bervariasi musim). <b>Tiket:</b> ±CNY 160/org masuk pulau + feri terpisah (⚠️ estimasi, cek sumber resmi).`,
       wiki:`https://en.wikipedia.org/wiki/Mount_Putuo`,
       yt:`https://www.youtube.com/results?search_query=Mount+Putuo+Zhoushan`},
      // --- h5 ---
      {group:`h5`, tag:`main`, label:`Itin H5`, title:`Xiangshan Global Studios (象山影视城 · Xiàngshān Yǐngshì Chéng)`,
       nameEn:`Xiangshan Global Studios`,
       nameHanzi:`象山影视城`,
       text:`Taman lokasi syuting yang merekonstruksi arsitektur kuno berbagai dinasti China — set istana, kota kuno, dan kapal perang replika, dipakai untuk syuting ratusan drama &amp; film sejarah; populer bagi penggemar drama China. <b>Akses:</b> bus dari Ningbo South Bus Station ke Xiangshan (Dancheng), ±2 jam, ¥38/org, bus 06:50–17:50 tiap ±20 menit; lanjut shuttle Dancheng → Film City (⚠️ jadwal web 08:10, 09:10, 13:00, 14:00) atau Didi. <b>Jam Operasional:</b> 08:00–17:00. <b>Tiket:</b> ±CNY 150/org (⚠️ cek Trip.com).`,
       wiki:`https://govt.chinadaily.com.cn/s/201712/15/WS5b78547f498e855160e8d83d/xiangshan-film-and-television-city.html`,
       yt:`https://www.youtube.com/results?search_query=Xiangshan+Global+Studios+Ningbo`},
      // --- h6 ---
      {group:`h6`, tag:`main`, label:`Itin H6`, title:`Dongqian Lake (东钱湖 · Dōngqián Hú)`,
       nameEn:`Dongqian Lake`,
       nameHanzi:`东钱湖`,
       text:`Danau air tawar terbesar di Zhejiang, ±3× luas West Lake Hangzhou, terletak di kaki perbukitan timur Ningbo. Selama berabad-abad jadi tempat inspirasi sastrawan &amp; pejabat era Song-Ming, dengan berbagai pulau kecil, causeway, dan kuil kuno tersebar di sekitarnya — sering dijuluki "West Lake versi liar" karena suasananya yang lebih tenang &amp; kurang komersial dibanding Hangzhou. <b>Akses:</b> dari rumah (Southern Business District): Line 8 (3 halte ke Miaoyan) → Line 5 (4 halte ke South Higher Education Park) → Line 4 (3 halte, Exit A) — total 10 halte, 2× transfer, ¥4/org, ±55 menit, rute terverifikasi Amap 2026-09-22. <b>Jam Operasional:</b> kawasan danau terbuka 24 jam, gratis. Wahana (sepeda sewa, boating) mengikuti jam operasional masing-masing operator, umumnya ±08:00–17:00. <b>Tiket:</b> Gratis masuk kawasan; sepeda sewa ±CNY 20/org/2 jam, boating ±CNY 40/org (opsional).`,
       wiki:`https://en.wikipedia.org/wiki/Dongqian_Lake`,
       yt:`https://www.youtube.com/results?search_query=Dongqian+Lake+Ningbo`,
       nearby:[`Xiaoputuo causeway`,`Fuquan Mountain (lihat Hari 18)`]},
      // --- h7 ---
      {group:`h7`, tag:`main`, label:`Itin H7`, title:`Ashoka Temple (阿育王寺 · Āyùwáng Sì)`,
       nameEn:`Ashoka Temple`,
       nameHanzi:`阿育王寺`,
       text:`Kuil berusia lebih dari 1.700 tahun yang menyimpan relik Buddha paling berharga di China — fragmen tulang tengkorak Sakyamuni (pendiri agama Buddha), diklaim dibawa dari India oleh biksu di era Dinasti Jin (280 M). Namanya diambil dari Kaisar Ashoka, penguasa Buddha terkenal dari Kekaisaran Maurya India, dan arsitekturnya memadukan gaya Tang dengan lanskap perbukitan Taibai Mountain di sekelilingnya. <b>Akses:</b> MRT Line 1, turun Stasiun Baochuang, jalan kaki ±10 menit. <b>Jam Operasional:</b> ±06:00–17:00. Tidak ada hari libur rutin. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/King_Ashoka_Temple`,
       yt:`https://www.youtube.com/results?search_query=Ashoka+Temple+Ningbo`,
       nearby:[`Tiantong Temple (±10km, bus/Didi)`]},
      {group:`h7`, tag:`main`, label:`Itin H7`, title:`Tiantong Temple (天童寺 · Tiāntóng Sì)`,
       nameEn:`Tiantong Temple`,
       nameHanzi:`天童寺`,
       text:`Salah satu dari sepuluh kuil paling suci sekte Chan (Zen) di China, dibangun tahun 300 M era Dinasti Jin Barat — berusia lebih dari 1.600 tahun. Terletak di kaki Taibai Mountain, kompleksnya mencakup 730 ruangan bergaya arsitektur Dinasti Ming, dan jadi tujuan ziarah penting bagi praktisi Buddha Zen dari seluruh Asia Timur, termasuk Jepang (aliran Soto Zen Jepang melacak akarnya ke kuil ini). <b>Akses:</b> dari Ashoka Temple, bus lokal/Didi ±10km (±20-30 menit). Tidak ada MRT langsung. <b>Jam Operasional:</b> ±06:00–17:00. Tidak ada hari libur rutin. <b>Tiket:</b> ±CNY 10/org (⚠️ estimasi, cek loket).`,
       wiki:`https://en.wikipedia.org/wiki/Tiantong_Temple`,
       yt:`https://www.youtube.com/results?search_query=Tiantong+Temple+Ningbo`},
      // --- h8 ---
      {group:`h8`, tag:`main`, label:`Itin H8`, title:`Tianyi Pavilion (天一阁 · Tiānyī Gé)`,
       nameEn:`Tianyi Pavilion`,
       nameHanzi:`天一阁`,
       text:`Dibangun tahun 1561 oleh Fan Qin, Wakil Menteri Perang Dinasti Ming, sebagai perpustakaan pribadi tertua yang masih berdiri di China — salah satu dari tiga perpustakaan keluarga tertua di dunia. Menyimpan lebih dari 300.000 volume buku kuno (80.000 di antaranya edisi langka), dengan desain arsitektur unik anti-api, anti-lembap, dan anti-serangga yang jadi contoh terbaik arsitektur perpustakaan kuno China. <b>Akses:</b> dari rumah: Line 8 (9 halte) → transfer di Zemin (dalam-stasiun 466m/±7 menit) → Line 1 (2 halte, Exit D) — total 11 halte, ¥5/org, ±49 menit, rute terverifikasi Amap 2026-09-22. <b>Jam Operasional:</b> ±08:30–17:00 (musim panas sampai 17:30). Tidak ada hari libur rutin. <b>Tiket:</b> CNY 30/org; tiket kombinasi CNY 50/org termasuk Yintai Mansion &amp; titik lain di kawasan.`,
       wiki:`https://en.wikipedia.org/wiki/Tianyi_Chamber`,
       yt:`https://www.youtube.com/results?search_query=Tianyi+Pavilion+Ningbo`,
       nearby:[`Yuehu Lake (persis sebelahan)`]},
      {group:`h8`, tag:`main`, label:`Itin H8`, title:`Yuehu Lake (月湖 · Yuè Hú)`,
       nameEn:`Yuehu Lake`,
       nameHanzi:`月湖`,
       text:`Digali sejak era Tang Zhenguan (±1.400 tahun lalu), danau ini jadi pusat akademik penting di era Song ketika para cendekiawan seperti Wang Anshi mengajar di tepiannya — melahirkan lanskap "Sepuluh Pulau" dan "Tiga Bendungan Tujuh Jembatan" yang jadi ciri khasnya hingga kini. Dikelilingi paviliun &amp; bangunan kuno, danau ini jadi jantung budaya Zhejiang Timur selama berabad-abad. <b>Akses:</b> persis sebelahan dengan Tianyi Pavilion, Stasiun Ximenkou (Line 1). <b>Jam Operasional:</b> taman terbuka 24 jam, gratis, tidak ada hari libur rutin. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.loongwander.com/en-US/article/tianyi-pavilion-and-yuehu-lake-scenic-area`,
       yt:`https://www.youtube.com/results?search_query=Yuehu+Lake+Ningbo`},
      // --- h9 ---
      {group:`h9`, tag:`main`, label:`Itin H9`, title:`Old Bund / Laowaitan (老外滩 · Lǎo Wàitān)`,
       nameEn:`Old Bund / Laowaitan`,
       nameHanzi:`老外滩`,
       text:`Kawasan tepi sungai bersejarah sejak 1844, salah satu dari lima pelabuhan pertama China yang dibuka untuk perdagangan asing setelah Perang Candu Pertama — lebih tua dari The Bund Shanghai yang lebih terkenal. Arsitektur bergaya Inggris, Jerman, Belanda, dan Prancis masih berdiri, termasuk Gereja Katolik Jiangbei bergaya Gothic, kini jadi kawasan bar &amp; resto trendi tepi sungai. <b>Akses:</b> dari rumah: Line 8 (7 halte ke Liyuan South Rd) → transfer Line 2 (5 halte, Exit C) — total 12 halte, ¥4/org, ±40 menit, rute terverifikasi Amap 2026-09-22 (nama stasiun dikoreksi dari "Waitan Daqiao" jadi <b>Waitan Bridge</b>). <b>Jam Operasional:</b> kawasan jalan terbuka 24 jam, gratis. Bar/resto umumnya buka sore-malam. <b>Tiket:</b> Gratis masuk kawasan.`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,
       yt:`https://www.youtube.com/results?search_query=Old+Bund+Ningbo+Laowaitan`,
       nearby:[`Sanjiangkou (jalan kaki dari sini)`]},
      {group:`h9`, tag:`main`, label:`Itin H9`, title:`Sanjiangkou (三江口 · Sān Jiāng Kǒu)`,
       nameEn:`Sanjiangkou`,
       nameHanzi:`三江口`,
       text:`Titik pertemuan tiga sungai — Yong, Yao, dan Fenghua — yang secara historis jadi alasan Ningbo berkembang sebagai kota pelabuhan penting sejak ribuan tahun lalu. Area tepi sungai ini jadi salah satu spot foto &amp; jalan santai paling populer di kota, terutama saat senja ketika ketiga sungai memantulkan cahaya kota. <b>Akses:</b> jalan kaki dari Old Bund, tetap di kawasan Stasiun Waitan Bridge (Line 2). <b>Jam Operasional:</b> area terbuka 24 jam, gratis. <b>Tiket:</b> Gratis. (Untuk versi malam dengan kapal, lihat Sanjiangkou Night Cruise di Hari 19.)`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,
       yt:`https://www.youtube.com/results?search_query=Sanjiangkou+Ningbo`},
      {group:`h9`, tag:`main`, label:`Itin H9`, title:`Tianyi Square (天一广场 · Tiānyī Guǎngchǎng)`,
       nameEn:`Tianyi Square`,
       nameHanzi:`天一广场`,
       text:`Alun-alun pusat kota modern Ningbo, dinamai dari Tianyi Pavilion yang lokasinya tak jauh dari sini. Jadi ruang publik utama warga Ningbo untuk berkumpul, terutama malam hari dengan air mancur &amp; lampu kota yang ramai — meski dikelilingi pusat perbelanjaan, area terbuka alun-alunnya sendiri gratis dinikmati tanpa perlu belanja. <b>Akses:</b> MRT Line 1/2, area pusat kota — dekat dari Old Bund via jalan kaki/MRT singkat. <b>Jam Operasional:</b> area luar buka 24 jam, gratis. Pusat perbelanjaan di sekitarnya ±10:00–22:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,
       yt:`https://www.youtube.com/results?search_query=Tianyi+Square+Ningbo+night`},
      // --- h10 ---
      {group:`h10`, tag:`main`, label:`Itin H10`, title:`Nantang Old Street (南塘老街 · Nántáng Lǎojiē)`,
       nameEn:`Nantang Old Street`,
       nameHanzi:`南塘老街`,
       text:`Jalan pedestrian sepanjang 500+ meter yang direstorasi dengan mempertahankan arsitektur kuno khas Zhejiang Timur, kini jadi pusat jajanan &amp; suvenir lokal paling populer di Ningbo. Terkenal dengan berbagai jajanan legendaris seperti hairy tofu goreng dan kue beras Ningbo, jalan ini jadi representasi terbaik suasana kota lama yang hidup, bukan sekadar museum terbuka. <b>Akses:</b> MRT Line 2, turun Ningbo Railway Station, jalan kaki ±15 menit. <b>Jam Operasional:</b> kawasan jalan buka 24 jam (gratis), kios/toko umumnya ±09:00–21:30. <b>Tiket:</b> Gratis masuk kawasan, bayar jajanan/toko saja.`,
       wiki:`https://www.travelchinaguide.com/cityguides/zhejiang/ningbo/things-to-do.htm`,
       yt:`https://www.youtube.com/results?search_query=Nantang+Old+Street+Ningbo`},
      // --- h11 ---
      {group:`h11`, tag:`main`, label:`Itin H11`, title:`Baoguo Temple (保国寺 · Bǎoguó Sì)`,
       nameEn:`Baoguo Temple`,
       nameHanzi:`保国寺`,
       text:`Salah satu struktur kayu tertua &amp; paling terjaga di China, berusia lebih dari 1.000 tahun, dibangun TANPA menggunakan satu paku pun — sambungan kayunya murni memakai teknik dougong (bracket) tradisional. Aula utamanya (dibangun 1013, era Song Utara) jadi contoh langka arsitektur kayu era awal yang selamat dari kebakaran &amp; perang selama satu milenium. <b>Akses:</b> TIDAK ada MRT langsung — Didi/mobil ±30 menit dari pusat kota, sedikit lebih jauh lagi dari Yinzhou. Alternatif bus 332 (⚠️ jadwal belum terverifikasi presisi). <b>Jam Operasional:</b> ±08:00–16:30. Tidak ada hari libur rutin. <b>Tiket:</b> ±CNY 15/org (⚠️ estimasi, cek loket).`,
       wiki:`https://en.wikipedia.org/wiki/Baoguo_Temple_(Ningbo)`,
       yt:`https://www.youtube.com/results?search_query=Baoguo+Temple+Ningbo`},
      // --- h12 ---
      {group:`h12`, tag:`main`, label:`Itin H12`, title:`Xikou Ancient Town (溪口古镇 · Xīkǒu Gǔzhèn)`,
       nameEn:`Xikou Ancient Town`,
       nameHanzi:`溪口古镇`,
       text:`Kampung halaman Chiang Kai-shek dan putranya Chiang Ching-kuo — dua tokoh penting Republik China yang kelak memimpin Taiwan. Kota kuno ini menyimpan kediaman keluarga Chiang yang terpelihara baik, termasuk Wenchang Pavilion (perpustakaan pribadi Chiang &amp; istrinya Soong Mei-ling dari era Qing), jadi tujuan ziarah sejarah populer dari seluruh dunia berbahasa Mandarin. <b>Akses:</b> Bus antar-kota dari Ningbo South Bus Station (dekat Stasiun Ningbo, Line 2), ±1 jam perjalanan. <b>Jam Operasional:</b> ±08:00–17:00. Tidak ada hari libur rutin. <b>Tiket:</b> ±CNY 120/org untuk tiket kombinasi beberapa titik dalam kawasan (dipakai di tabel Hari 12, ⚠️ estimasi, cek loket) — ATAU paket tur ±CNY 200/org dari beberapa sumber yang sudah termasuk transport; dua opsi berbeda, bukan kontradiksi.`,
       wiki:`https://www.topchinatravel.com/china-attractions/xikou-town.htm`,
       yt:`https://www.youtube.com/results?search_query=Xikou+Ancient+Town+Ningbo`,
       nearby:[`Xuedou Temple (bus/Didi ±20 menit)`]},
      {group:`h12`, tag:`main`, label:`Itin H12`, title:`Xuedou Temple (雪窦寺 · Xuědòu Sì)`,
       nameEn:`Xuedou Temple`,
       nameHanzi:`雪窦寺`,
       text:`Terletak di jantung Xuedou Mountain, kuil ini merupakan salah satu dari lima gunung Zen paling terkenal di China dan salah satu dari sepuluh kuil Zen terbaik yang diakui secara nasional. Chiang Kai-shek sendiri sering mengunjungi kuil ini semasa hidupnya karena kedekatannya dengan kampung halaman Xikou, menjadikannya bagian tak terpisahkan dari narasi sejarah keluarga Chiang di kawasan ini. <b>Akses:</b> dari Xikou, bus lokal/Didi ±20 menit naik ke Xuedou Mountain. <b>Jam Operasional:</b> ±07:00–17:00. Tidak ada hari libur rutin. <b>Tiket:</b> ±CNY 10/org (⚠️ estimasi, cek loket).`,
       wiki:`https://en.wikipedia.org/wiki/Xuedou_Mountain`,
       yt:`https://www.youtube.com/results?search_query=Xuedou+Temple+Ningbo`},
      // --- h13 ---
      {group:`h13`, tag:`main`, label:`Itin H13`, title:`Qiantong Ancient Town (前童古镇 · Qiántóng Gǔzhèn)`,
       nameEn:`Qiantong Ancient Town`,
       nameHanzi:`前童古镇`,
       text:`Desa kuno seperti labirin di Ninghai County, dengan tata letak rumah-rumah era Ming-Qing yang saling terhubung lewat gang sempit &amp; kanal air kecil — dijuluki "museum rakyat hidup" karena penduduk lokal masih benar-benar tinggal &amp; beraktivitas sehari-hari di dalamnya, bukan sekadar situs wisata kosong. Terkenal dengan kerajinan tradisional yang masih dipraktikkan warganya, dari pembuatan tahu hingga anyaman bambu. <b>Akses:</b> bus antar-kota dari Ningbo South Bus Station ke Ninghai, lanjut minibus lokal ke Qiantong (±25 menit, berangkat tiap ±10 menit). <b>Jam Operasional:</b> ±08:00–17:00. Tidak ada hari libur rutin. <b>Tiket:</b> ±CNY 100/org (⚠️ estimasi, cek loket).`,
       wiki:`https://www.travelchinaguide.com/cityguides/zhejiang/ningbo/things-to-do.htm`,
       yt:`https://www.youtube.com/results?search_query=Qiantong+Ancient+Town+Ningbo`},
      // --- h14 ---
      {group:`h14`, tag:`main`, label:`Itin H14`, title:`Hemudu Site Museum (河姆渡遗址博物馆 · Hémǔdù Yízhǐ Bówùguǎn)`,
       nameEn:`Hemudu Site Museum`,
       nameHanzi:`河姆渡遗址博物馆`,
       text:`Situs arkeologi Neolitikum berusia 7.000-5.000 tahun dekat Yuyao — salah satu bukti tertua peradaban pertanian padi basah di dunia. Penggalian di sini menemukan tembikar, perkakas tulang, dan struktur rumah panggung kayu yang direkonstruksi skala penuh di museum, memberi gambaran nyata kehidupan manusia prasejarah China Selatan ribuan tahun sebelum Dinasti pertama berdiri. <b>Akses:</b> kereta regional/bus dari Ningbo ke Yuyao East Bus Station, lanjut bus lokal 333 ke Hemudu (berangkat tiap jam). <b>Jam Operasional:</b> ±08:30–16:30. Tutup Senin, kecuali libur nasional. <b>Tiket:</b> Gratis (museum negeri).`,
       wiki:`https://en.wikipedia.org/wiki/Hemudu_culture`,
       yt:`https://www.youtube.com/results?search_query=Hemudu+Site+Museum+Ningbo`},
      // --- h15 ---
      {group:`h15`, tag:`main`, label:`Itin H15`, title:`Cicheng Ancient Town (慈城古镇 · Cíchéng Gǔzhèn)`,
       nameEn:`Cicheng Ancient Town`,
       nameHanzi:`慈城古镇`,
       text:`Kota kuno terjaga baik di ujung barat Ningbo, pernah jadi pusat administratif county Cixi kuno selama lebih dari 1.000 tahun sebelum pusat pemerintahan dipindah. Arsitektur Ming-Qing-nya termasuk yang paling utuh di Zhejiang Timur, dengan tata kota grid tradisional yang masih terlihat jelas — jadi lokasi syuting populer untuk drama sejarah China. <b>Akses:</b> MRT Line 4, turun Stasiun Cicheng (ujung barat jalur ini, sama jalur dengan Dongqian Lake di ujung timur). <b>Jam Operasional:</b> kawasan jalan gratis, buka 24 jam. Beberapa rumah bersejarah ±08:30–17:00. <b>Tiket:</b> Gratis jalan kawasan; beberapa rumah bersejarah ±CNY 10-20/org (opsional).`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,
       yt:`https://www.youtube.com/results?search_query=Cicheng+Ancient+Town+Ningbo`},
      // --- h16 ---
      {group:`h16`, tag:`main`, label:`Itin H16`, title:`Zhaobao Mountain &amp; Zhenhai Coastal Defense History Memorial Hall (招宝山·镇海口海防历史纪念馆 · Zhāobǎo Shān · Zhènhǎi Kǒu Hǎifáng Lìshǐ Jìniànguǎn)`,
       nameEn:`Zhaobao Mountain & Zhenhai Coastal Defense History Memorial Hall`,
       nameHanzi:`招宝山镇海口海防历史纪念馆`,
       text:`Pertahanan pesisir Ningbo bermula sejak tahun 132 M (era Dinasti Han Barat) di kawasan Zhenhaikou ini, menjadikannya salah satu titik strategis militer tertua di China. Memorial hall yang dibangun 1997 ini memaparkan sejarah panjang pertahanan pesisir dari era kuno hingga Perang Candu, sementara Zhaobao Mountain di atasnya menawarkan pemandangan muara sungai &amp; laut yang jadi alasan lokasi ini strategis secara militer. <b>Akses:</b> MRT Line 2, turun Stasiun Zhaobaoshan — akses langsung tanpa transfer jauh. <b>Jam Operasional:</b> ±08:30–16:30. Tutup Senin, kecuali libur nasional — Hari 16 di itinerary ini adalah <b>Minggu 25 Oktober</b>, jadi aman. <b>Tiket:</b> Gratis (museum negeri); naik Zhaobao Mountain gratis.`,
       wiki:`https://zh.wikipedia.org/zh-hans/%E9%95%87%E6%B5%B7%E5%8F%A3%E6%B5%B7%E9%98%B2%E9%81%97%E5%9D%80`,
       yt:`https://www.youtube.com/results?search_query=Zhenhai+Ningbo+coastal+defense`},
      // --- h17 ---
      {group:`h17`, tag:`main`, label:`Itin H17`, title:`Shipu Ancient Fishing Port (石浦渔港古城 · Shípǔ Yúgǎng Gǔchéng)`,
       nameEn:`Shipu Ancient Fishing Port`,
       nameHanzi:`石浦渔港古城`,
       text:`Salah satu pelabuhan nelayan tertua &amp; terbesar di China, di Xiangshan County — kawasan pesisir ini masih jadi pusat kehidupan nelayan otentik dengan dermaga tua, kuil-kuil nelayan lokal, dan seafood segar langsung dari kapal. Berbeda dari destinasi kota Ningbo lainnya yang lebih historis-formal, Shipu menawarkan suasana laut &amp; budaya maritim yang lebih hidup &amp; sehari-hari. <b>Akses:</b> bus antar-kota dari Ningbo South Bus Station, ±2 jam perjalanan — day trip terjauh di itinerary ini. <b>Jam Operasional:</b> kawasan kota lama &amp; dermaga buka 24 jam, gratis. <b>Tiket:</b> Gratis jalan kawasan; beberapa area bertiket ±CNY 30-40/org (⚠️ estimasi, opsional).`,
       wiki:`https://en.wikipedia.org/wiki/Xiangshan_County`,
       yt:`https://www.youtube.com/results?search_query=Shipu+Ancient+Fishing+Port+Xiangshan`},
      // --- h18 ---
      {group:`h18`, tag:`main`, label:`Itin H18`, title:`Xiaoputuo (小普陀 · Xiǎo Pǔtuó)`,
       nameEn:`Xiaoputuo`,
       nameHanzi:`小普陀`,
       text:`Causeway kecil di Dongqian Lake yang menghubungkan tepi danau dengan pulau mini berisi replika kuil Guanyin — namanya ("Putuo Kecil") merujuk pada Mount Putuo, gunung suci Buddha sesungguhnya yang jauh lebih besar di kepulauan Zhoushan. Jadi spot foto &amp; jalan santai populer bagi warga lokal yang ingin merasakan suasana spiritual tanpa perlu menyeberang ke pulau sungguhan. <b>Akses:</b> bagian dari kawasan Dongqian Lake, Stasiun Dongqian Lake (Line 4) lanjut jalan kaki/Didi singkat ke sisi Xiaoputuo. <b>Jam Operasional:</b> kawasan terbuka, mengikuti jam Dongqian Lake (±06:00–21:00), gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Dongqian_Lake`,
       yt:`https://www.youtube.com/results?search_query=Xiaoputuo+Dongqian+Lake`},
      {group:`h18`, tag:`main`, label:`Itin H18`, title:`Fuquan Mountain (福泉山 · Fúquán Shān)`,
       nameEn:`Fuquan Mountain`,
       nameHanzi:`福泉山`,
       text:`Bukit pemandangan di tepi Dongqian Lake yang menawarkan panorama danau dari ketinggian — jalur pendakiannya relatif landai dibanding gunung-gunung lain di sekitar Ningbo, cocok untuk jalan santai tanpa perlu stamina ekstrem. Namanya berarti "Gunung Mata Air Rejeki", merujuk pada mata air alami di kawasan ini yang dipercaya warga lokal membawa keberuntungan. <b>Akses:</b> bagian dari kawasan Dongqian Lake, akses sama seperti Xiaoputuo. <b>Jam Operasional:</b> ±07:00–18:00. <b>Tiket:</b> Gratis; beberapa area puncak ±CNY 20/org (⚠️ estimasi).`,
       wiki:`https://en.wikipedia.org/wiki/Dongqian_Lake`,
       yt:`https://www.youtube.com/results?search_query=Fuquan+Mountain+Ningbo`},
      // --- h19 ---
      {group:`h19`, tag:`main`, label:`Itin H19`, title:`Tianfeng Pagoda (天封塔 · Tiānfēng Tǎ)`,
       nameEn:`Tianfeng Pagoda`,
       nameHanzi:`天封塔`,
       text:`Pagoda ikonik di jantung Distrik Haishu, pusat kota lama Ningbo — namanya diambil dari era pembangunannya (Tianfeng, Dinasti Tang, akhir abad ke-7). Meski sudah direnovasi berkali-kali sepanjang sejarah, pagoda ini tetap jadi salah satu landmark paling dikenali kota, terutama saat malam hari ketika lampu-lampunya menyala. <b>Akses:</b> area pusat kota Haishu, dekat kawasan Ximenkou (Line 1) — naik bus lokal turun halte "Tianfeng Pagoda" atau jalan kaki dari Ximenkou. <b>Jam Operasional:</b> ±08:30–16:00. <b>Tiket:</b> CNY 5/org (pelajar setengah harga).`,
       wiki:`https://en.wikipedia.org/wiki/Ningbo`,
       yt:`https://www.youtube.com/results?search_query=Tianfeng+Pagoda+Ningbo`},
      {group:`h19`, tag:`main`, label:`Itin H19`, title:`Sanjiangkou Night Cruise (三江夜游 · Sān Jiāng Yèyóu)`,
       nameEn:`Sanjiangkou Night Cruise`,
       nameHanzi:`三江夜游`,
       text:`Kapal wisata malam yang menyusuri pertemuan tiga sungai (Yong, Yao, Fenghua) dari dermaga Old Bund — jendela kaca besar di kapal memberi pemandangan panorama gedung-gedung tepi sungai yang menyala warna-warni di malam hari. Pengalaman ini jadi cara populer warga &amp; wisatawan menikmati wajah modern Ningbo yang kontras dengan kota tuanya di siang hari. <b>Akses:</b> dermaga Old Bund (Waima Road 195, seberang bekas City Exhibition Hall), Stasiun Waitan Bridge (Line 2). <b>Jam Operasional:</b> 19:00–21:45 setiap hari, keberangkatan kapal 19:00 &amp; 20:00 (⚠️ jadwal bisa berubah, cek di lokasi/aplikasi resmi). <b>Tiket:</b> CNY 98/org ke atas — disarankan beli online lebih dulu saat akhir pekan/musim ramai.`,
       wiki:`https://www.dahepiao.com/lvyounews1/20220822292069.html`,
       yt:`https://www.youtube.com/results?search_query=Sanjiangkou+Night+Cruise+Ningbo`},
      // --- h20 ---
      {group:`h20`, tag:`main`, label:`Itin H20`, title:`Ningbo City God Temple (府城隍庙 · Fǔ Chénghuáng Miào)`,
       nameEn:`Ningbo City God Temple`,
       nameHanzi:`府城隍庙`,
       text:`Kuil rakyat bersejarah di pusat kota lama Ningbo, didedikasikan untuk dewa pelindung kota dalam kepercayaan rakyat Tionghoa — arsitekturnya memadukan elemen kuil Tao tradisional dengan ukiran kayu halus khas Zhejiang Timur. Kuil semacam ini biasanya jadi pusat kehidupan komunitas lokal sejak era kekaisaran, tempat warga berdoa untuk keselamatan &amp; kemakmuran kota. <b>Akses:</b> area pusat kota Haishu, dekat Ximenkou (Line 1) &amp; Zhongshan Road. <b>Jam Operasional:</b> ±08:00–17:00 (⚠️ estimasi). <b>Tiket:</b> ±CNY 10/org (⚠️ estimasi, cek loket).`,
       wiki:`https://www.google.com/search?q=Ningbo+City+God+Temple`,
       yt:`https://www.youtube.com/results?search_query=Ningbo+City+God+Temple`},
      {group:`h20`, tag:`main`, label:`Itin H20`, title:`Zhongshan Road (中山路 · Zhōngshān Lù)`,
       nameEn:`Zhongshan Road`,
       nameHanzi:`中山路`,
       text:`Jalan utama pusat kota lama Ningbo, dinamai untuk menghormati Sun Yat-sen (Zhongshan) seperti banyak jalan utama kota-kota China lainnya. Sepanjang jalan ini berjejer perpaduan bangunan lama &amp; modern, kafe, dan toko buku — jadi tempat yang pas untuk jalan santai penutup tanpa tujuan spesifik, menikmati ritme kehidupan sehari-hari warga Ningbo. <b>Akses:</b> pusat kota Haishu, dekat Ximenkou (Line 1). <b>Jam Operasional:</b> jalan terbuka 24 jam, gratis. Toko/kafe umumnya ±09:00–21:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://airial.travel/attractions/china/ning-bo-shi/zhongshan-road-ningbo-AOxvots6`,
       yt:`https://www.youtube.com/results?search_query=Zhongshan+Road+Ningbo`},
      // --- h21 ---
      {group:`h21`, tag:`main`, label:`Itin H21`, title:`Yushan Islands (渔山列岛 · Yúshān Lièdǎo)`,
       nameEn:`Yushan Islands`,
       nameHanzi:`渔山列岛`,
       text:`Kepulauan karang terpencil di tenggara Ningbo, dijuluki "No.1 Fishing Site di Asia" — terkenal dengan mercusuar tua, formasi batu alami, dan seafood segar di rumah nelayan; masih sangat alami dan belum terlalu komersial. Waktu terbaik: Oktober (musim ikan dibuka September). <b>Akses:</b> bus ke Shipu (Xiangshan) ±2–2,5 jam, lalu speedboat dari pelabuhan Shipu ±1,5 jam (kapal lambat ±2,5 jam). Booking H-7 lewat WeChat "Xiangshan Shipu Port" di musim ramai. <b>Jam Operasional:</b> mengikuti jadwal kapal, bukan jam buka-tutup tetap (⚠️ cek jadwal pulang terakhir). <b>Tiket:</b> kapal ±¥160–220/org sekali jalan (⚠️ sumber bervariasi); tiket pulau ⚠️ belum ditemukan.`,
       wiki:`https://www.trip.com/travel-guide/attraction/xiangshan/yushan-island-87960/`,
       yt:`https://www.youtube.com/results?search_query=Yushan+Islands+Ningbo`},
      // --- h22 ---
      {group:`h22`, tag:`main`, label:`Itin H22`, title:`Beilun Port Viewing Deck (北仑港观景台 · Běilún Gǎng Guānjǐngtái)`,
       nameEn:`Beilun Port Viewing Deck`,
       nameHanzi:`北仑港观景台`,
       text:`Area pandang untuk melihat aktivitas Ningbo-Zhoushan Port, salah satu pelabuhan kontainer tersibuk di dunia — kontras dengan sisi historis kota. Kemungkinan area publik informal, bukan atraksi wisata formal. <b>Akses:</b> ⚠️ belum terverifikasi — area industri Beilun District, MRT Line 1 lalu Didi. <b>Jam Operasional:</b> ⚠️ belum ditemukan sumber resmi. <b>Tiket:</b> ⚠️ kemungkinan gratis (area publik), belum terverifikasi.`,
       wiki:`https://en.wikipedia.org/wiki/Port_of_Ningbo-Zhoushan`,
       yt:`https://www.youtube.com/results?search_query=Ningbo+Zhoushan+Port`},

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota`,
       nameEn:`Cerita Kota`,
       text:`Hong Kong berkembang dari desa nelayan kecil menjadi salah satu pusat finansial terbesar dunia setelah menjadi koloni Inggris tahun 1841, dikembalikan ke China tahun 1997 dengan status "Satu Negara, Dua Sistem" (Special Administrative Region). Perpaduan budaya Timur-Barat, skyline ikonik Victoria Harbour, dan kepadatan penduduk tertinggi di dunia jadi ciri khasnya.`,

      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,

       text:`Awal November masuk musim kering — suhu siang ±27-28°C, malam ±17-22°C, kelembapan mulai turun dari puncak musim panas. ⚠️ Angka rata-rata historis, bukan forecast real-time — cek forecast H-7 sebelum berangkat.`,

       text:`Hong Kong International Airport (HKG) di Chek Lap Kok — terhubung ke kota via Airport Express (tercepat, ±24 menit ke Kowloon/Central) atau bus/taksi. Rute Ningbo→HK dilayani nonstop oleh Cathay Pacific, China Eastern, dan Hong Kong Express, ±2j35m.`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong_International_Airport`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Tsim Sha Tsui (TST), Kowloon</b> — strategis karena dekat MTR interchange, Star Ferry, Avenue of Stars, dan jalur langsung ke Tung Chung (Lantau) tanpa banyak transfer. Alternatif: Mong Kok (lebih murah, sedikit lebih jauh dari harbour) atau Causeway Bay di sisi Hong Kong Island (dekat shopping &amp; Victoria Park).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain`,
       nameEn:`Destinasi Terkenal Lain`,
       text:`Di luar itinerary utama: <b>Hong Kong Disneyland</b> &amp; <b>Ocean Park</b> — taman hiburan besar, berbayar mahal, tidak sejalan prinsip trip ini. <b>Stanley Market &amp; Repulse Bay</b> — sisi selatan Hong Kong Island, pantai &amp; pasar suvenir, butuh perjalanan tersendiri. <b>Sai Kung</b> — dijuluki "the back garden of Hong Kong", jalur hiking &amp; pantai, di sisi timur jauh dari kota.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Hong+Kong`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, rekomendasi makan aktual tetap mengikuti kriteria ramah lambung. <b>Dim sum</b> — hidangan kukus kecil khas Cantonese (har gow, siu mai), biasanya untuk sarapan/brunch. <b>Wonton noodle soup (雲吞麵)</b> — mie tipis dengan pangsit udang dalam kuah bening. <b>Congee (粥)</b> — bubur nasi halus, sering dengan potongan ikan/ayam. Hong Kong juga terkenal dengan street food yang cenderung berminyak/pedas (curry fish balls, egg waffles) — dihindari sesuai kriteria trip ini.`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Jangan lupa beli Octopus Card di awal — hampir semua transportasi &amp; sebagian toko cashless via kartu ini. Hindari naik taksi jalanan tanpa alamat tertulis (kendala bahasa Kanton). Victoria Peak sangat ramai sore-malam weekend — datang siang hari kerja kalau ingin lebih tenang. Cek status Typhoon Signal sebelum aktivitas outdoor (Ngong Ping 360 &amp; Peak Tram tutup saat sinyal tinggi).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`Octopus Card (beli &amp; top-up di bandara/stasiun MTR). Hong Kong pakai HKD, sebagian tempat besar juga terima UnionPay/kartu kredit asing. VPN TIDAK diperlukan (Google/WhatsApp/Instagram semua normal di HK, beda dari China daratan). Salinan paspor/visa (fisik &amp; digital) — cek syarat visa Indonesia untuk Hong Kong sebelum berangkat.`},

      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Hong Kong Park (香港公園 · Xiānggǎng Gōngyuán)`,
       nameEn:`Hong Kong Park`,
       nameHanzi:`香港公園`,
       text:`Taman kota seluas ±8 hektar di tengah distrik bisnis Admiralty/Central, dibuka 1991 di bekas markas militer Victoria Barracks — memadukan taman modern dengan bangunan kolonial bersejarah, air terjun buatan, dan aviary burung tropis. <b>Akses:</b> MTR Admiralty (Exit C1) — dari Tsim Sha Tsui 1 halte via Tsuen Wan Line lintas pelabuhan (±4 menit), lalu jalan kaki ±5-10 menit ke pintu masuk taman. Ke Central Pier 7 (untuk Star Ferry) jalan kaki ±1,5km lewat jembatan penyeberangan, atau MTR Admiralty → Central 1 halte. <b>Jam Operasional:</b> taman 06:00–23:00 setiap hari (area tertentu dirawat 07:00–13:00 pada Senin pertama &amp; ketiga tiap bulan); Edward Youde Aviary 09:00–17:00; Flagstaff House Museum of Tea Ware 10:00–18:00, tutup Selasa. ⚠️ Cek jam terbaru sebelum berangkat. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong_Park`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+Park`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Star Ferry (天星小輪 · Tiānxīng Xiǎolún)`,
       nameEn:`Star Ferry`,
       nameHanzi:`天星小輪`,
       text:`Layanan feri lintas Victoria Harbour yang beroperasi sejak 1888, salah satu moda transportasi tertua &amp; paling ikonik Hong Kong — National Geographic pernah menobatkannya sebagai salah satu "50 places of a lifetime". Tarifnya sangat murah untuk pemandangan skyline sekelas ini. <b>Akses:</b> Pier di Tsim Sha Tsui (dekat Avenue of Stars) dan Pier 7 di Central. Itinerary ini memakai rute Central → TST saat senja. <b>Jam Operasional:</b> rute TST-Central beroperasi ±06:30–23:30, tiap ±10 menit. <b>Tiket:</b> ±HKD 2,70–5/org tergantung dek &amp; hari (weekday/weekend), dibayar via Octopus Card.`,
       wiki:`https://www.starferry.com.hk/en/service`,
       yt:`https://www.youtube.com/results?search_query=Star+Ferry+Hong+Kong`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Avenue of Stars (星光大道 · Xīngguāng Dàdào)`,
       nameEn:`Avenue of Stars`,
       nameHanzi:`星光大道`,
       text:`Promenade tepi Victoria Harbour di Tsim Sha Tsui, didedikasikan untuk industri film Hong Kong — menampilkan cap tangan bintang film lokal (termasuk Bruce Lee) di sepanjang jalan. Pemandangan skyline Hong Kong Island dari sisi ini jadi salah satu spot foto paling ikonik kota. <b>Akses:</b> Jalan kaki dari MTR Tsim Sha Tsui (Exit E/J), ±5-10 menit ke arah harbour. <b>Jam Operasional:</b> buka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.avenueofstars.com.hk/en/`,
       yt:`https://www.youtube.com/results?search_query=Avenue+of+Stars+Hong+Kong`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`A Symphony of Lights (幻彩詠香江 · Huàncǎi Yǒng Xiāngjiāng)`,
       nameEn:`A Symphony of Lights`,
       nameHanzi:`幻彩詠香江`,
       text:`Pertunjukan cahaya &amp; laser multimedia yang menyinkronkan pencahayaan ±44 gedung di kedua sisi Victoria Harbour dengan musik, tayang setiap malam pukul 20:00 selama ±10 menit — pernah masuk Guinness World Records sebagai "Permanent Light and Sound Show" terbesar di dunia. <b>Akses:</b> Sama dengan Avenue of Stars — titik nonton terbaik sepanjang promenade TST. <b>Jam Operasional:</b> setiap malam 20:00, ±10 menit. Dibatalkan otomatis kalau ada sinyal topan No.3+ atau sinyal hujan badai Merah/Hitam setelah jam 15:00 hari itu. <b>Tiket:</b> Gratis.`,

      {group:`h1`, tag:`planb`, label:`Plan-B H1`, title:`Man Mo Temple (文武廟 · Wénwǔ Miào)`,
       nameEn:`Man Mo Temple`,
       nameHanzi:`文武廟`,
       context:`Kenapa jadi Plan-B: sebagian besar di bawah atap (aula dupa berasap) dan searah Central-Sheung Wan — pengganti kalau hujan atau Hong Kong Park terganggu, jalan kaki ±10 menit dari MTR Sheung Wan.`,
       text:`Salah satu kuil tertua &amp; paling terkenal Hong Kong, dibangun era 1840-an, didedikasikan untuk Dewa Sastra (Man) dan Dewa Perang (Mo). Terkenal dengan gulungan-gulungan dupa spiral besar yang menggantung dari langit-langit, menciptakan suasana khas berkabut asap dupa. <b>Akses:</b> MTR Sheung Wan (Island Line), Exit A2, jalan kaki ±10 menit via Hollywood Road. <b>Jam Operasional:</b> setiap hari 08:00–18:00. Paling ramai tanggal 1 &amp; 15 penanggalan lunar. <b>Tiket:</b> Gratis.`,

      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Chi Lin Nunnery (志蓮淨苑 · Zhìlián Jìngyuàn)`,
       nameEn:`Chi Lin Nunnery`,
       nameHanzi:`志蓮淨苑`,
       text:`Kompleks biara Buddha bergaya Dinasti Tang, dibangun 1934 &amp; direkonstruksi 1998 tanpa satu paku pun (konstruksi kayu tradisional interlocking) — salah satu contoh arsitektur Tang terbesar di luar daratan China. <b>Akses:</b> MTR Diamond Hill, Exit C2 (Plaza Hollywood), jalan kaki ±5 menit. Dari Tsim Sha Tsui: jalan bawah tanah ke East Tsim Sha Tsui (±10 menit) lalu Tuen Ma Line ±9 menit ke Diamond Hill. <b>Jam Operasional:</b> setiap hari 09:00–16:30 (tutup lebih cepat, jadwalkan pagi). <b>Tiket:</b> Gratis.`,

      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Nan Lian Garden (南蓮園池 · Nánlián Yuánchí)`,
       nameEn:`Nan Lian Garden`,
       nameHanzi:`南蓮園池`,
       text:`Taman klasik gaya Dinasti Tang seluas ±3,5 hektar, dibangun bersebelahan dengan Chi Lin Nunnery — memadukan kolam, batu, dan paviliun kayu dengan filosofi taman klasik China, jadi kontras hijau di tengah padatnya Kowloon. <b>Akses:</b> Sama dengan Chi Lin Nunnery — persis bersebelahan. <b>Jam Operasional:</b> setiap hari 07:00–21:00. <b>Tiket:</b> Gratis.`,

      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Wong Tai Sin Temple (黃大仙祠 · Huáng Dàxiān Cí)`,
       nameEn:`Wong Tai Sin Temple`,
       nameHanzi:`黃大仙祠`,
       text:`Kelenteng paling ramai dikunjungi di Hong Kong (±3 juta pengunjung/tahun), memadukan ajaran Taoisme, Buddhisme, dan Konfusianisme — terkenal dengan tradisi kau cim (mengocok batang ramalan bambu) untuk memohon petunjuk/keberuntungan. <b>Akses:</b> MTR Wong Tai Sin (Kwun Tong Line), Exit B2, jalan kaki ±3 menit. Dari Diamond Hill 1 halte; ke hotel (TST) lewat Yau Ma Tei dengan transfer Tsuen Wan Line. Ada ramp di pintu masuk utama (⚠️ dilaporkan cukup curam) menuju area utama kuil — sebagian besar area terjangkau tanpa tangga; hanya area patung zodiac yang perlu naik beberapa anak tangga tanpa ramp (opsional, bisa dilewati). <b>Jam Operasional:</b> setiap hari 07:30–16:30 (Good Wish Garden 08:00–16:30) — tutup lebih cepat, datang sebelum jam 15:30. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Wong_Tai_Sin_Temple`,
       yt:`https://www.youtube.com/results?search_query=Wong+Tai+Sin+Temple+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Temple Street Night Market (廟街 · Miào Jiē)`,
       nameEn:`Temple Street Night Market`,
       nameHanzi:`廟街`,
       text:`Pasar malam legendaris Hong Kong sejak era 1920-an di kawasan Yau Ma Tei/Jordan — deretan kios jajanan, suvenir, dan peramal jalanan yang jadi salah satu simbol kehidupan malam Kowloon lama. <b>Akses:</b> MTR Jordan (Exit A) atau Yau Ma Tei (Exit C), jalan kaki ±5 menit — 2 halte MTR Tsuen Wan Line dari Tsim Sha Tsui. Dari Wong Tai Sin: Kwun Tong Line langsung ke Yau Ma Tei. <b>Jam Operasional:</b> paling ramai ±18:00–24:00, sebagian kios buka dari sore. <b>Tiket:</b> Gratis masuk, jajan sesuai selera.`,
       wiki:`https://en.wikipedia.org/wiki/Temple_Street`,
       yt:`https://www.youtube.com/results?search_query=Temple+Street+Night+Market+Hong+Kong`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`Hong Kong Museum of History (香港歷史博物館 · Xiānggǎng Lìshǐ Bówùguǎn)`,
       nameEn:`Hong Kong Museum of History`,
       nameHanzi:`香港歷史博物館`,
       context:`Kenapa jadi Plan-B: indoor dan buka Senin — pengganti M+ Museum yang tutup hari itu, cocok kalau hujan deras menyulitkan Diamond Hill/Wong Tai Sin.`,
       text:`Museum sejarah utama Hong Kong di Tsim Sha Tsui East — pameran permanen "The Hong Kong Story" (dibuka kembali 1 April 2026 setelah renovasi hampir 6 tahun) menelusuri sejarah Hong Kong dari masa prasejarah hingga penyerahan 1997, termasuk rekonstruksi jalanan lama. <b>Akses:</b> MTR East Tsim Sha Tsui (Tuen Ma Line), Exit P2, jalan kaki ±10 menit ke Chatham Road South; dari hotel jalan bawah tanah TST → East TST ±10 menit. <b>Jam Operasional:</b> Senin &amp; Rabu–Jumat 10:00–18:00 (masuk terakhir 17:30); Sabtu, Minggu &amp; libur 10:00–19:00 (masuk terakhir 18:30); tutup Selasa. <b>Tiket:</b> Gratis (pameran khusus bisa berbayar).`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong_Museum_of_History`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+Museum+of+History`},

       nameHanzi:`九龍公園`,
       text:`Taman kota seluas ±13 hektar persis di jantung Tsim Sha Tsui, dibangun di bekas Whitfield Barracks era militer Inggris (1910) — punya kolam flamingo, aviary burung, dan kolam renang publik, jadi oase hijau di tengah kepadatan Kowloon. <b>Akses:</b> Persis sebelah MTR Tsim Sha Tsui (Exit A1), jalan kaki dari kawasan hotel manapun di TST. <b>Jam Operasional:</b> 05:00–24:00 setiap hari. <b>Tiket:</b> Gratis.`,

       nameEn:`Victoria Peak`,
       nameHanzi:`太平山`,
       context:`Kenapa tidak dimasukkan: satu-satunya tiket berbayar (±HKD 149/org) dan butuh setengah hari di Hong Kong Island — rencana disusun ulang jadi rute Kowloon gratis. Bisa disisipkan kalau waktu &amp; budget longgar; datang siang hari kerja lebih tenang.`,
       text:`Puncak tertinggi Hong Kong Island (±552m), jadi kawasan elit sejak era kolonial Inggris karena udaranya lebih sejuk. Pemandangan skyline &amp; Victoria Harbour dari atas jadi salah satu ikon foto paling terkenal di dunia, terutama saat malam hari dengan lampu gedung menyala. <b>Akses:</b> Peak Tram lower terminus di Garden Road, ±10 menit jalan kaki dari Central. Tram naik ±7 menit ke Peak Tower. <b>Jam Operasional:</b> Peak Tram 07:00–24:00 setiap hari; Sky Terrace 428 08:30–22:00. <b>Tiket:</b> Round-trip tram + Sky Terrace ±HKD 149/org (±Rp342.700/org).`,
       wiki:`https://en.wikipedia.org/wiki/Victoria_Peak`,

       text:`Sistem eskalator luar ruangan terpanjang di dunia (±800m, naik ±135m), dibangun 1993 untuk membantu komuter Mid-Levels turun ke Central tanpa kendaraan. Melewati SoHo, Hollywood Road, dan berbagai kawasan bersejarah — jadi atraksi tersendiri, bukan cuma transportasi. <b>Akses:</b> Titik awal dekat Central Market/Hang Seng Bank HQ, ±5 menit jalan kaki dari Star Ferry Pier Central. <b>Jam Operasional:</b> turun 06:00–10:00, naik 10:20–24:00 (arah berbalik tiap hari). <b>Tiket:</b> Gratis.`,

       nameEn:`PMQ`,
       nameHanzi:`元創方`,
       context:`Kenapa tidak dimasukkan: Hari 1 sudah penuh — searah Central-Sheung Wan (dekat Man Mo Temple), bisa disisipkan kalau ada waktu ekstra.`,
       text:`Bekas asrama polisi menikah era 1951 (Police Married Quarters) yang direvitalisasi tahun 2014 jadi hub seni &amp; desain — sekarang berisi puluhan studio desainer lokal, galeri, dan ruang pameran, dibangun di atas situs sekolah pertama Hong Kong untuk warga lokal (Central School, 1889). <b>Akses:</b> Di Staunton Street, ±5 menit jalan kaki dari Central-Mid-Levels Escalator (turun di sekitar Shelley Street/Hollywood Road) atau dari Man Mo Temple. <b>Jam Operasional:</b> area umum 07:00–23:00; jam buka studio/toko individual bervariasi, umumnya 11:00–19:00. <b>Tiket:</b> Gratis masuk area umum.`,

      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`M+ Museum (M+博物館 · M+ Bówùguǎn)`,
       nameEn:`M+ Museum`,
       nameHanzi:`M+博物館`,
       context:`Kenapa tidak dimasukkan: tutup Senin (Hari 2), berbayar ±HKD 120/org, dan di West Kowloon jauh dari rute Diamond Hill. Bisa dipertimbangkan kalau ada hari lain (Selasa–Minggu) yang longgar.`,
       text:`Museum seni visual, desain, arsitektur, dan moving image kontemporer terbesar di Asia, dibuka 2021 di West Kowloon Cultural District — bangunan modern karya Herzog &amp; de Meuron dengan koleksi mencakup seni Asia &amp; internasional. <b>Akses:</b> MTR Kowloon (Austin), Exit C, jalan kaki ±10 menit — searah TST/West Kowloon. <b>Jam Operasional:</b> Selasa-Kamis &amp; weekend 10:00–18:00, Jumat 10:00–22:00, tutup Senin. <b>Tiket:</b> ±HKD 120/org dewasa (±Rp276.000/org), gratis untuk pemegang kartu tertentu.`,
       wiki:`https://en.wikipedia.org/wiki/M%2B`,
       yt:`https://www.youtube.com/results?search_query=M+Plus+Museum+Hong+Kong`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ngong Ping 360 Cable Car (昂坪360 · Ángpíng 360)`,
       nameEn:`Ngong Ping 360 Cable Car`,
       nameHanzi:`昂坪360`,
       context:`Kenapa tidak dimasukkan: trip dipersingkat jadi 2 malam — hanya 1 hari penuh tersisa (Hari 2), sudah dipakai untuk rute Kowloon timur (Diamond Hill–Wong Tai Sin–Temple Street), sedangkan Lantau butuh 1 hari dedicated sendiri.`,
       text:`Sistem cable car sepanjang ±5,7km yang menghubungkan Tung Chung dengan dataran tinggi Ngong Ping di Lantau Island, dibuka 2006 — perjalanan ±25 menit menyuguhkan pemandangan Laut China Selatan, Bandara HKIA, dan Jembatan Hong Kong-Zhuhai-Macau dari udara. <b>Akses:</b> MTR Tung Chung Station, Exit B, jalan kaki ±5 menit ke terminal cable car. <b>Jam Operasional:</b> Senin-Jumat 10:00–18:00; weekend &amp; libur nasional 09:00–18:30. <b>Tiket:</b> Round-trip standard cabin ±HKD 235/org (±Rp540.500/org); Crystal Cabin (lantai kaca) ±HKD 315/org.`,
       wiki:`https://en.wikipedia.org/wiki/Ngong_Ping_360`,
       yt:`https://www.youtube.com/results?search_query=Ngong+Ping+360+Cable+Car`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Tian Tan Buddha / Big Buddha (天壇大佛 · Tiāntán Dàfó)`,
       nameEn:`Tian Tan Buddha / Big Buddha`,
       nameHanzi:`天壇大佛`,
