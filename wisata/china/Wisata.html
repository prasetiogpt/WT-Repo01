      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Avenue of Stars (星光大道 · Xīngguāng Dàdào)`,
       nameEn:`Avenue of Stars`,
       nameHanzi:`星光大道`,
       text:`Promenade tepi Victoria Harbour di Tsim Sha Tsui, didedikasikan untuk industri film Hong Kong — menampilkan cap tangan bintang film lokal (termasuk Bruce Lee) di sepanjang jalan. Pemandangan skyline Hong Kong Island dari sisi ini jadi salah satu spot foto paling ikonik kota. <b>Akses:</b> Jalan kaki dari MTR Tsim Sha Tsui (Exit E/J), ±5-10 menit ke arah harbour. <b>Jam Operasional:</b> buka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.avenueofstars.com.hk/en/`,
       yt:`https://www.youtube.com/results?search_query=Avenue+of+Stars+Hong+Kong`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`A Symphony of Lights (幻彩詠香江 · Huàncǎi Yǒng Xiāngjiāng)`,
       nameEn:`A Symphony of Lights`,
       nameHanzi:`幻彩詠香江`,
       text:`Pertunjukan cahaya &amp; laser multimedia yang menyinkronkan pencahayaan ±44 gedung di kedua sisi Victoria Harbour dengan musik, tayang setiap malam pukul 20:00 selama ±10 menit — pernah masuk Guinness World Records sebagai "Permanent Light and Sound Show" terbesar di dunia. <b>Akses:</b> Sama dengan Avenue of Stars — titik nonton terbaik sepanjang promenade TST. <b>Jam Operasional:</b> setiap malam 20:00, ±10 menit. Dibatalkan otomatis kalau ada sinyal topan No.3+ atau sinyal hujan badai Merah/Hitam setelah jam 15:00 hari itu. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.avenueofstars.com.hk/en/a-symphony-of-lights/`,
       yt:`https://www.youtube.com/results?search_query=Symphony+of+Lights+Hong+Kong`},
      {group:`h1`, tag:`planb`, label:`Plan-B H1`, title:`Temple Street Night Market (廟街 · Miào Jiē)`,
       nameEn:`Temple Street Night Market`,
       nameHanzi:`廟街`,
       context:`Kenapa jadi Plan-B: alternatif kalau Symphony of Lights dibatalkan cuaca, atau ingin suasana malam yang lebih ramai/lokal dibanding promenade harbour.`,
       text:`Pasar malam legendaris Hong Kong sejak era 1920-an di kawasan Yau Ma Tei/Jordan — deretan kios jajanan, suvenir, dan peramal jalanan yang jadi salah satu simbol kehidupan malam Kowloon lama. <b>Akses:</b> MTR Jordan (Exit A) atau Yau Ma Tei (Exit C), jalan kaki ±5 menit — ±15-20 menit jalan kaki atau 2 halte MTR dari TST. <b>Jam Operasional:</b> paling ramai ±18:00–24:00, sebagian kios buka dari sore. <b>Tiket:</b> Gratis masuk, jajan sesuai selera.`,
       wiki:`https://en.wikipedia.org/wiki/Temple_Street`,
       yt:`https://www.youtube.com/results?search_query=Temple+Street+Night+Market+Hong+Kong`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Star Ferry (天星小輪 · Tiānxīng Xiǎolún)`,
       nameEn:`Star Ferry`,
       nameHanzi:`天星小輪`,
       text:`Layanan feri lintas Victoria Harbour yang beroperasi sejak 1888, salah satu moda transportasi tertua &amp; paling ikonik Hong Kong — National Geographic pernah menobatkannya sebagai salah satu "50 places of a lifetime". Tarifnya sangat murah untuk pemandangan skyline sekelas ini. <b>Akses:</b> Pier di Tsim Sha Tsui (dekat Avenue of Stars) dan Pier 7 di Central. <b>Jam Operasional:</b> rute TST-Central beroperasi ±06:30–23:30, tiap ±10 menit. <b>Tiket:</b> ±HKD 2,70–5/org tergantung dek &amp; hari (weekday/weekend), dibayar via Octopus Card.`,
       wiki:`https://www.starferry.com.hk/en/service`,
       yt:`https://www.youtube.com/results?search_query=Star+Ferry+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Man Mo Temple (文武廟 · Wénwǔ Miào)`,
       nameEn:`Man Mo Temple`,
       nameHanzi:`文武廟`,
       text:`Salah satu kuil tertua &amp; paling terkenal Hong Kong, dibangun era 1840-an, didedikasikan untuk Dewa Sastra (Man) dan Dewa Perang (Mo). Terkenal dengan gulungan-gulungan dupa spiral besar yang menggantung dari langit-langit, menciptakan suasana khas berkabut asap dupa. <b>Akses:</b> MTR Sheung Wan (Island Line), Exit A2, jalan kaki ±10 menit via Hollywood Road. <b>Jam Operasional:</b> setiap hari 08:00–18:00. Paling ramai tanggal 1 &amp; 15 penanggalan lunar. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Man_Mo_Temple,_Sheung_Wan`,
       yt:`https://www.youtube.com/results?search_query=Man+Mo+Temple+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Central-Mid-Levels Escalator (中環至半山自動扶梯系統 · Zhōnghuán Zhì Bànshān Zìdòng Fútī Xìtǒng)`,
       nameEn:`Central-Mid-Levels Escalator`,
       nameHanzi:`中環至半山自動扶梯系統`,
       text:`Sistem eskalator luar ruangan terpanjang di dunia (±800m, naik ±135m), dibangun 1993 untuk membantu komuter Mid-Levels turun ke Central tanpa kendaraan. Melewati SoHo, Hollywood Road, dan berbagai kawasan bersejarah — jadi atraksi tersendiri, bukan cuma transportasi. <b>Akses:</b> Titik awal dekat Central Market/Hang Seng Bank HQ, ±5 menit jalan kaki dari Star Ferry Pier Central. <b>Jam Operasional:</b> turun 06:00–10:00, naik 10:20–24:00 (arah berbalik tiap hari). <b>Tiket:</b> Gratis.`,
       wiki:`https://www.discoverhongkong.com/eng/place-to-go/travel.guide-central-mid-levels-escalator.html`,
       yt:`https://www.youtube.com/results?search_query=Central+Mid-Levels+Escalator+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`PMQ (元創方 · Yuán Chuàng Fāng)`,
       nameEn:`PMQ`,
       nameHanzi:`元創方`,
       text:`Bekas asrama polisi menikah era 1951 (Police Married Quarters) yang direvitalisasi tahun 2014 jadi hub seni &amp; desain — sekarang berisi puluhan studio desainer lokal, galeri, dan ruang pameran, dibangun di atas situs sekolah pertama Hong Kong untuk warga lokal (Central School, 1889). <b>Akses:</b> Di Staunton Street, ±5 menit jalan kaki dari Central-Mid-Levels Escalator (turun di sekitar Shelley Street/Hollywood Road) atau dari Man Mo Temple. <b>Jam Operasional:</b> area umum 07:00–23:00; jam buka studio/toko individual bervariasi, umumnya 11:00–19:00. <b>Tiket:</b> Gratis masuk area umum.`,
       wiki:`https://en.wikipedia.org/wiki/PMQ_(Hong_Kong)`,
       yt:`https://www.youtube.com/results?search_query=PMQ+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Victoria Peak (太平山 · Tàipíng Shān)`,
       nameEn:`Victoria Peak`,
       nameHanzi:`太平山`,
       text:`Puncak tertinggi Hong Kong Island (±552m), jadi kawasan elit sejak era kolonial Inggris karena udaranya lebih sejuk. Pemandangan skyline &amp; Victoria Harbour dari atas jadi salah satu ikon foto paling terkenal di dunia, terutama saat malam hari dengan lampu gedung menyala. <b>Akses:</b> Peak Tram lower terminus di Garden Road, ±10 menit jalan kaki dari Central. Tram naik ±7 menit ke Peak Tower. <b>Jam Operasional:</b> Peak Tram 07:00–24:00 setiap hari; Sky Terrace 428 08:30–22:00. <b>Tiket:</b> Round-trip tram + Sky Terrace ±HKD 149/org (±Rp342.700/org).`,
       wiki:`https://en.wikipedia.org/wiki/Victoria_Peak`,
       yt:`https://www.youtube.com/results?search_query=Victoria+Peak+Hong+Kong`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Hong Kong Park (香港公園 · Xiānggǎng Gōngyuán)`,
       nameEn:`Hong Kong Park`,
       nameHanzi:`香港公園`,
       text:`Taman kota seluas ±8 hektar di tengah distrik bisnis Admiralty/Central, dibuka 1991 di bekas markas militer Victoria Barracks — memadukan taman modern dengan bangunan kolonial bersejarah, air terjun buatan, dan aviary burung tropis. <b>Akses:</b> MTR Admiralty (Exit C1) atau jalan kaki ±10 menit turun dari area Peak Tram lower terminus. <b>Jam Operasional:</b> 06:00–23:00 setiap hari. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Hong_Kong_Park`,
       yt:`https://www.youtube.com/results?search_query=Hong+Kong+Park`},
      {group:`h2`, tag:`planb`, label:`Plan-B H2`, title:`M+ Museum (M+博物館 · M+ Bówùguǎn)`,
       nameEn:`M+ Museum`,
       nameHanzi:`M+博物館`,
       context:`Kenapa jadi Plan-B: indoor, cocok kalau cuaca berkabut/hujan bikin Victoria Peak tidak worth dikunjungi hari itu.`,
       text:`Museum seni visual, desain, arsitektur, dan moving image kontemporer terbesar di Asia, dibuka 2021 di West Kowloon Cultural District — bangunan modern karya Herzog &amp; de Meuron dengan koleksi mencakup seni Asia &amp; internasional. <b>Akses:</b> MTR Kowloon (Austin), Exit C, jalan kaki ±10 menit — searah TST/West Kowloon. <b>Jam Operasional:</b> Selasa-Kamis &amp; weekend 10:00–18:00, Jumat 10:00–22:00, tutup Senin. <b>Tiket:</b> ±HKD 120/org dewasa (±Rp276.000/org), gratis untuk pemegang kartu tertentu.`,
       wiki:`https://en.wikipedia.org/wiki/M%2B`,
       yt:`https://www.youtube.com/results?search_query=M+Plus+Museum+Hong+Kong`},

       nameEn:`Kowloon Park`,
       nameHanzi:`九龍公園`,
       text:`Taman kota seluas ±13 hektar persis di jantung Tsim Sha Tsui, dibangun di bekas Whitfield Barracks era militer Inggris (1910) — punya kolam flamingo, aviary burung, dan kolam renang publik, jadi oase hijau di tengah kepadatan Kowloon. <b>Akses:</b> Persis sebelah MTR Tsim Sha Tsui (Exit A1), jalan kaki dari kawasan hotel manapun di TST. <b>Jam Operasional:</b> 05:00–24:00 setiap hari. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Kowloon_Park`,
       yt:`https://www.youtube.com/results?search_query=Kowloon+Park+Hong+Kong`},

      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ngong Ping 360 Cable Car (昂坪360 · Ángpíng 360)`,
       nameEn:`Ngong Ping 360 Cable Car`,
       nameHanzi:`昂坪360`,
       context:`Kenapa tidak dimasukkan: trip dipersingkat jadi 2 malam — hanya 1 hari penuh tersisa, dan kluster Hong Kong Island dipilih karena lebih dekat/efisien dari TST dibanding Lantau yang butuh 1 hari dedicated sendiri.`,
       text:`Sistem cable car sepanjang ±5,7km yang menghubungkan Tung Chung dengan dataran tinggi Ngong Ping di Lantau Island, dibuka 2006 — perjalanan ±25 menit menyuguhkan pemandangan Laut China Selatan, Bandara HKIA, dan Jembatan Hong Kong-Zhuhai-Macau dari udara. <b>Akses:</b> MTR Tung Chung Station, Exit B, jalan kaki ±5 menit ke terminal cable car. <b>Jam Operasional:</b> Senin-Jumat 10:00–18:00; weekend &amp; libur nasional 09:00–18:30. <b>Tiket:</b> Round-trip standard cabin ±HKD 235/org (±Rp540.500/org); Crystal Cabin (lantai kaca) ±HKD 315/org.`,
       wiki:`https://en.wikipedia.org/wiki/Ngong_Ping_360`,
       yt:`https://www.youtube.com/results?search_query=Ngong+Ping+360+Cable+Car`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Tian Tan Buddha / Big Buddha (天壇大佛 · Tiāntán Dàfó)`,
       nameEn:`Tian Tan Buddha / Big Buddha`,
       nameHanzi:`天壇大佛`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Ngong Ping 360 (lihat entri di atas) — sama-sama tidak masuk karena Lantau tidak lagi dapat slot hari penuh.`,
       text:`Patung Buddha perunggu duduk terbesar di dunia saat selesai dibangun tahun 1993, tinggi ±34m, menghadap ke utara — berbeda dari kebanyakan patung Buddha yang menghadap selatan, sebagai simbol menjaga rakyat China. Terletak di dataran tinggi Ngong Ping, satu kompleks dengan Po Lin Monastery. <b>Akses:</b> Ngong Ping Village (turun dari cable car), jalan kaki ±5 menit ke halaman bawah patung. <b>Jam Operasional:</b> area halaman &amp; monastery ±09:00–18:00 setiap hari. <b>Tiket:</b> Gratis lihat dari halaman bawah. ⚠️ Naik ke platform dekat patung via 268 anak tangga tanpa lift — TIDAK disarankan untuk kondisi lutut, cukup nikmati dari bawah.`,
       wiki:`https://en.wikipedia.org/wiki/Tian_Tan_Buddha`,
       yt:`https://www.youtube.com/results?search_query=Tian+Tan+Buddha+Big+Buddha+Hong+Kong`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Tai O Fishing Village (大澳漁村 · Dà'ào Yúcūn)`,
       nameEn:`Tai O Fishing Village`,
       nameHanzi:`大澳漁村`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Ngong Ping 360/Lantau — sama-sama tidak masuk karena keterbatasan hari.`,
       text:`Desa nelayan tertua di Hong Kong, dihuni etnis Tanka sejak berabad lalu — terkenal dengan rumah-rumah panggung kayu (stilt houses) di atas sungai pasang-surut, dijuluki "Venice of the Orient". Masih jadi tempat produksi terasi udang &amp; ikan asin tradisional. <b>Akses:</b> Bus 21 dari Ngong Ping (±20 menit) atau bus 11 langsung dari Tung Chung (±30-45 menit). <b>Jam Operasional:</b> desa &amp; jalan buka 24 jam (gratis); toko/warung umumnya ±09:00–18:00. <b>Tiket:</b> Gratis jalan-jalan; boat tour opsional melihat lumba-lumba merah muda ±HKD 25/org.`,
       wiki:`https://en.wikipedia.org/wiki/Tai_O`,
       yt:`https://www.youtube.com/results?search_query=Tai+O+Fishing+Village+Hong+Kong`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Chi Lin Nunnery (志蓮淨苑 · Zhìlián Jìngyuàn)`,
       nameEn:`Chi Lin Nunnery`,
       nameHanzi:`志蓮淨苑`,
       context:`Kenapa tidak dimasukkan: awalnya disiapkan sebagai Plan-B kalau Lantau dibatalkan cuaca, tapi Lantau sendiri sudah tidak masuk itinerary utama setelah trip dipersingkat — bisa disisipkan kalau ada waktu ekstra di Hari 2 atau Hari 3.`,
       text:`Kompleks biara Buddha bergaya Dinasti Tang, dibangun 1934 &amp; direkonstruksi 1998 tanpa satu paku pun (konstruksi kayu tradisional interlocking) — salah satu contoh arsitektur Tang terbesar di luar daratan China. <b>Akses:</b> MTR Diamond Hill, Exit C2 (Plaza Hollywood), jalan kaki ±5-10 menit. <b>Jam Operasional:</b> setiap hari 09:00–16:30. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Chi_Lin_Nunnery`,
       yt:`https://www.youtube.com/results?search_query=Chi+Lin+Nunnery+Hong+Kong`},

       wiki:`https://en.wikipedia.org/wiki/Nan_Lian_Garden`,
       yt:`https://www.youtube.com/results?search_query=Nan+Lian+Garden+Hong+Kong`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Wong Tai Sin Temple (黃大仙祠 · Huáng Dàxiān Cí)`,
       nameEn:`Wong Tai Sin Temple`,
       nameHanzi:`黃大仙祠`,

       text:`Kelenteng paling ramai dikunjungi di Hong Kong (±3 juta pengunjung/tahun), memadukan ajaran Taoisme, Buddhisme, dan Konfusianisme — terkenal dengan tradisi kau cim (mengocok batang ramalan bambu) untuk memohon petunjuk/keberuntungan. <b>Akses:</b> MTR Wong Tai Sin (Kwun Tong Line), Exit B2/B3, jalan kaki ±3 menit. <b>Jam Operasional:</b> 07:00–17:30 setiap hari. <b>Tiket:</b> Gratis.`,

       text:`Taman hiburan Disney yang dibuka 2005 di Lantau Island, versi terkecil dari taman Disney di seluruh dunia — tetap punya wahana ikonik seperti Sleeping Beauty Castle &amp; Mystic Manor. <b>Akses:</b> MTR Disneyland Resort Line dari Sunny Bay, ±10 menit dari Tung Chung Line. <b>Jam Operasional:</b> umumnya 10:30–20:30, bervariasi musiman. <b>Tiket:</b> ±HKD 639/org dewasa (±Rp1.469.700/org).`,

       yt:`https://www.youtube.com/results?search_query=Hong+Kong+Disneyland`},

       text:`Taman hiburan &amp; taman laut yang dibuka 1977 di Southern District Hong Kong Island — memadukan wahana dengan akuarium &amp; konservasi satwa laut, salah satu yang tertua di Asia. <b>Akses:</b> MTR South Island Line ke Ocean Park Station, langsung di depan pintu masuk. <b>Jam Operasional:</b> umumnya 10:00–19:00, bervariasi musiman. <b>Tiket:</b> ±HKD 498/org dewasa (±Rp1.145.400/org).`,

       text:`Kawasan pasar suvenir waterfront (Stanley) dan pantai pasir putih populer (Repulse Bay) di sisi selatan Hong Kong Island — kontras dari hiruk-pikuk kota, suasana lebih santai &amp; kolonial. <b>Akses:</b> Bus 6/6X/260 dari Central (Exchange Square), ±30-40 menit — tidak ada MTR langsung. <b>Jam Operasional:</b> area pasar &amp; pantai buka sepanjang hari; toko umumnya 10:00–18:00. <b>Tiket:</b> Gratis jalan-jalan pasar &amp; pantai.`,

       text:`Dijuluki "the back garden of Hong Kong" — kawasan pesisir timur dengan jalur hiking, pantai, dan pelabuhan nelayan yang terkenal dengan seafood segar, jauh dari kepadatan kota utama. <b>Akses:</b> MTR Hang Hau (Tseung Kwan O Line), lanjut minibus ±15-20 menit — tidak ada MTR langsung ke pusat Sai Kung. <b>Jam Operasional:</b> area terbuka 24 jam; restoran seafood umumnya 11:00–22:00. <b>Tiket:</b> Gratis (kecuali menyewa boat trip ke outlying islands).`,

       text:`Shenzhen berubah dari desa nelayan kecil populasi ±30.000 jiwa tahun 1980 menjadi salah satu kota metropolitan terbesar dunia (&gt;17 juta jiwa) setelah ditetapkan sebagai Zona Ekonomi Khusus pertama China oleh Deng Xiaoping — kini dijuluki "Silicon Valley China", markas Tencent, Huawei, DJI, dan BYD.`,

       text:`Di luar itinerary utama: <b>Shenzhen Safari Park</b> &amp; <b>Splendid China Folk Culture Village</b> — taman hiburan/tematik besar, butuh perjalanan &amp; waktu tersendiri. <b>Xiaomeisha Beach</b> — pantai populer di sisi timur (Yantian), kini terhubung Metro Line 8, cocok untuk trip khusus pantai. <b>Wutong Mountain</b> — puncak tertinggi Shenzhen, jalur hiking populer warga lokal.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Shenzhen`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, rekomendasi makan aktual tetap mengikuti kriteria ramah lambung. <b>Cantonese dim sum</b> — sama tradisinya dengan Hong Kong/Guangzhou, hidangan kukus untuk sarapan/brunch. <b>Congee (粥)</b> — bubur nasi halus. Shenzhen juga terkenal dengan masakan pedas Sichuan/Hunan (karena banyak pendatang dari provinsi lain) — dihindari sesuai kriteria trip ini.`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+must+try+food`},

       text:`Siapkan WeChat Pay/Alipay sebelum berangkat — banyak tempat makan kecil/warung tidak menerima kartu kredit asing atau uang tunai. VPN WAJIB dipasang sebelum masuk Tiongkok (Google/WhatsApp/Instagram tidak bisa diakses tanpa VPN, beda dari Hong Kong). Hindari taksi jalanan tanpa alamat tertulis dalam Hanzi (kendala bahasa Mandarin).`},

       nameEn:`OCT-LOFT`,
       nameHanzi:`华侨城创意文化园`,
       text:`Bekas kawasan pabrik era 1980-an yang direvitalisasi jadi distrik kreatif — galeri seni kontemporer, studio desainer independen, dan kafe/bar bergaya industrial, sering disebut versi Shenzhen dari 798 Art District Beijing. <b>Akses:</b> Dari hotel (Shixia), metro Line 3 ke Laojie lalu transfer Line 1 ke Stasiun Qiaocheng East (侨城东站), Exit A, ±5 menit jalan kaki — total ±45 menit. <b>Jam Operasional:</b> area terbuka 24 jam, gratis; toko/galeri umumnya 10:00–22:00, ramai &amp; hidup sore-malam. <b>Tiket:</b> Gratis masuk area.`,

       nameHanzi:`深圳图书馆`,
       text:`Perpustakaan utama kota, bagian dari Shenzhen Cultural Center — salah satu perpustakaan publik paling megah di China, arsitekturnya sendiri jadi daya tarik meski hanya lewat sebentar. <b>Akses:</b> Persis sebelahan Civic Center Cultural Plaza &amp; Shenzhen Museum — jalan kaki, satu kompleks. <b>Jam Operasional:</b> setiap hari 09:00–21:00, kecuali Senin tutup. <b>Tiket:</b> Gratis.`,

       context:`Kenapa tidak dimasukkan: digantikan Shuiwei Night Market (Hari 3) yang lebih otentik (jajanan Chaoshan, bukan mal) dan sama-sama 1 halte dari hotel — jadi Plan-B malam kalau Shuiwei tidak sesuai selera.`,

       nameEn:`Huaqiangbei`,
       nameHanzi:`华强北`,
       context:`Kenapa tidak dimasukkan: murni kawasan belanja elektronik, bukan wisata jalan santai/budaya — tidak sejalan prinsip trip ini yang menghindari sesi mal/belanja kecuali kondisi cuaca buruk.`,
       text:`Kawasan pusat elektronik terbesar Asia — deretan mal khusus komponen elektronik, gadget, dan aksesoris sejak era 1980-an, jadi simbol kebangkitan industri teknologi Shenzhen ("Silicon Valley China"). <b>Akses:</b> MTR Huaqiang North Station (Line 2/7) atau Huaqiang Road Station (Line 1). Dari hotel (Shixia): Line 7 langsung ke Huaqiang North, <b>tanpa transfer</b>, ±25-30 menit (7 halte). <b>Jam Operasional:</b> toko umumnya 10:00–20:00 setiap hari. <b>Tiket:</b> Gratis jalan-jalan (murni kawasan belanja).`,

       yt:`https://www.youtube.com/results?search_query=Huaqiangbei+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nantou Ancient City (南头古城 · Nántóu Gǔchéng)`,
       nameEn:`Nantou Ancient City`,
       nameHanzi:`南头古城`,
       context:`Kenapa tidak dimasukkan: genuinely menarik (old town, sesuai kriteria "pusat pejalan kaki" skill), tapi butuh transfer &amp; waktu tempuh jauh dari kluster manapun di itinerary ini — cocok jadi dedicated half-day kalau trip diperpanjang.`,
       text:`Kota berbenteng berusia lebih dari 1.700 tahun di Nanshan — pernah jadi pusat administratif wilayah yang kini jadi Shenzhen &amp; Hong Kong, direvitalisasi jadi kawasan jalan-jalan bersejarah dengan puluhan bar/kafe di antara bangunan tua yang dipugar. <b>Akses:</b> MTR Nantou Ancient City Station (Line 12), Exit C langsung ke gerbang kota (ada lift). Dari hotel (Shixia): butuh transfer ke Line 12, ±45-50 menit — beda arah dari kluster Nanshan (OCT-LOFT) Hari 2. <b>Jam Operasional:</b> area terbuka 24 jam, gratis; beberapa museum kecil di dalamnya berbayar ±CNY 20-50. <b>Tiket:</b> Gratis masuk kawasan; museum kecil di dalamnya berbayar terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Nantou_Ancient_City_station`,
       yt:`https://www.youtube.com/results?search_query=Nantou+Ancient+City+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`MixC Shenzhen Bay (深圳湾万象城 · Shēnzhèn Wān Wànxiàng Chéng)`,

       nameHanzi:`深圳湾万象城`,
       context:`Kenapa tidak dimasukkan: murni mal — tidak sejalan prinsip trip ini yang menghindari sesi belanja kecuali cuaca buruk, dan jauh dari semua kluster utama.`,
       text:`Cabang MixC di kawasan Shenzhen Bay, Nanshan — bersebelahan dengan Shenzhen Bay Cultural Plaza yang baru dibuka, jadi satu kompleks perbelanjaan-budaya-pesisir baru yang sedang naik daun. (Ada juga cabang MixC asli di Hi-Tech Park, Line 1 — kalau maksud pengguna itu, lokasinya beda, jauh dari kluster Shenzhen Bay ini.) <b>Akses:</b> MTR Talent Park Station (Line 13), Exit B1. Dari hotel (Shixia): butuh transfer, ±45-50 menit. <b>Jam Operasional:</b> umumnya 10:00–22:00 setiap hari. <b>Tiket:</b> Gratis masuk (murni mal/pusat belanja).`,
       wiki:`https://en.wikipedia.org/wiki/MixC_World_(Shenzhen)`,
       yt:`https://www.youtube.com/results?search_query=MixC+Shenzhen+Bay`},

       nameHanzi:`深圳湾文化广场`,
       context:`Kenapa tidak dimasukkan: satu kawasan dengan Shenzhen Bay Park (lihat entri sebelumnya) — jauh dari kluster Futian/Luohu itinerary ini, cocok jadi dedicated half-day di Nanshan kalau trip diperpanjang.`,
       text:`Landmark budaya terbaru Shenzhen, baru dibuka November 2025 — dirancang arsitek Ma Yansong (MAD Architects) terinspirasi batu karang pesisir, jadi museum desain terbesar di dunia dengan 9 bangunan pameran, teater, dan ruang seni. Bersebelahan dengan Shenzhen Bay Park &amp; MixC Shenzhen Bay. <b>Akses:</b> MTR Talent Park Station (Line 13), Exit B1 — langsung di depan. Dari hotel (Shixia): butuh transfer, ±45-50 menit, satu kawasan dengan Shenzhen Bay Park. <b>Jam Operasional:</b> belum terverifikasi penuh, cek sebelum berangkat. <b>Tiket:</b> Area plaza &amp; sebagian pameran gratis; pameran khusus (kolaborasi Tate/Design Museum London) kemungkinan berbayar.`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen_Bay_Cultural_Plaza`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Bay+Cultural+Plaza`},

       nameEn:`Sea World`,

const STORE_KEY = "wisata-china-checks-v3";
const store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* Independent "sudah ditinjau" checklist for Lampiran entries — not
   linked to the Itinerary tab's checkboxes (different meaning: for
   Cadangan it means "reviewed and confirmed not visiting", not "done"). */
const LAMP_STORE_KEY = "wisata-china-lampiran-reviewed-v1";
const lampStore = JSON.parse(localStorage.getItem(LAMP_STORE_KEY) || "{}");
function saveLamp(){ localStorage.setItem(LAMP_STORE_KEY, JSON.stringify(lampStore)); }
function lampiranKey(destId, title){ return destId + "::" + title; }

function cell(v, cls){
  return v ? `<td class="${cls}">${v}</td>` : `<td class="${cls} dash">&ndash;</td>`;
}

function formatJam(jam){
  // "14:25–15:15" -> "14:25–" / "15:15" on two lines so the column can stay narrow
  const i = jam.indexOf('–');
  if(i !== -1) return jam.slice(0,i+1) + '<br>' + jam.slice(i+1);
  // non-range labels like "Sore/malam" have no natural break point for the
  // narrow column — break after "/" too, otherwise it can overflow into
  // the next cell instead of wrapping.
  const j = jam.indexOf('/');
  if(j !== -1) return jam.slice(0,j+1) + '<br>' + jam.slice(j+1);
  return jam;
}

function updateProgress(dayEl){
  const boxes = dayEl.querySelectorAll('input[type=checkbox]');
  const done = [...boxes].filter(b=>b.checked).length;
  dayEl.querySelector('.day-progress').textContent = done+"/"+boxes.length;
}

function renderTransport(t){
  const isFlight = t.mode === "flight";
  const icon = isFlight ? PLANE_ICON : TRANSIT_ICON;
  const tagClass = t.tag === "ok" ? "tag-ok" : "tag-tbd";
  const tagText = t.tag === "ok" ? "Confirmed" : "Belum pasti";

  let body = "";
  if(isFlight){
    body = `
      <div class="flight-route">
        <div class="route-city"><div class="route-code">${t.from.code}</div><div class="route-name">${t.from.name}</div></div>
        <div class="route-mid">
          <div class="route-dur">${t.duration}</div>
          <div class="route-line"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></svg></div>
          <div class="route-dur">${t.code}</div>
        </div>
        <div class="route-city" style="text-align:right"><div class="route-code">${t.to.code}</div><div class="route-name">${t.to.name}</div></div>
      </div>
      <div class="flight-meta">${t.meta.map(([l,v])=>`<div><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.note ? `<div class="flight-note">${t.note}</div>` : ``}
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  } else {
    body = `
      <div class="transit-list">${t.items.map(([l,v])=>`<div class="transit-row"><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  }

  const det = document.createElement('details');
  det.className = 'transport';
  det.innerHTML = `
    <summary>
      <div class="transport-icon">${icon}</div>
      <div class="transport-head-text">
        <div class="transport-kicker">${t.kicker}</div>
        <div class="transport-title">${t.title}</div>
      </div>
      <div class="transport-tag ${tagClass}">${tagText}</div>
      ${CHEV}
    </summary>
    <div class="transport-body">${body}</div>
  `;
  return det;
}

function renderDay(d, dest){
  const destId = dest.id;
  const det = document.createElement('details');
  det.className = 'day';

  const rows = d.items.map((it,ii)=>{
    const [jam,destName,ket,catatan,valas,rupiah] = it;
    const key = destId+"-"+d.id+"-"+ii;
    const checked = store[key] ? 'checked' : '';
    const doneClass = store[key] ? 'done' : '';
    return `<tr class="${doneClass}" data-key="${key}">
      <td class="cell-pilih"><input type="checkbox" ${checked} aria-label="Tandai selesai: ${destName}"></td>
      <td class="cell-jam">${formatJam(jam)}</td>
      <td class="cell-dest">${destName}</td>
      ${cell(ket,'cell-ket')}
      ${cell(valas,'cell-valas')}
      ${cell(rupiah,'cell-rupiah')}
    </tr>`;
  }).join('');

  const footRow = d.total ? `<tfoot><tr>
      <td></td><td></td><td>TOTAL HARI ${d.num}</td><td></td>
      <td class="cell-valas">${d.total.cny}</td><td class="cell-rupiah">${d.total.idr}</td>
    </tr></tfoot>` : '';

  const cadanganNearby = (dest.lampiran || []).filter(p =>
    p.tag === 'planc' && p.relatedDays && p.relatedDays.includes(d.num));
  const cadanganNearbyHtml = cadanganNearby.length ? `
    <div class="cadangan-nearby">
      <span class="banner-label">Tempat sekitar lain (lihat Lampiran → Cadangan)</span>
      ${cadanganNearby.map(p => p.title).join(', ')}
    </div>` : '';

  det.innerHTML = `
    <summary>
      <div class="day-badge">${d.num}</div>
      <div class="day-head-text">
        <div class="day-toprow">
          <div class="day-date">${d.date}</div>
          <div class="day-progress">0/${d.items.length}</div>
        </div>
        <div class="day-label">${d.label}</div>
      </div>
      ${CHEV}
    </summary>
    ${d.reserve ? `<div class="reserve-banner"><span class="banner-label">Reservasi wajib</span>${d.reserve}</div>` : ``}
    ${d.advisory ? `<div class="info-banner"><span class="banner-label">Perhatian</span>${d.advisory}</div>` : ``}
    <div class="table-scroll">
      <table class="itin">
        <colgroup>
          <col style="width:28px"><col style="width:72px"><col style="width:215px"><col style="width:215px"><col style="width:52px"><col style="width:98px">
        </colgroup>
        <thead><tr>
          <th class="col-pilih"><span class="sr-only">Pilih</span></th><th>Jam</th><th>Destinasi</th><th>Keterangan</th><th class="col-num">${dest.currency || 'CNY'}</th><th class="col-num">IDR</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        ${footRow}
      </table>
    </div>
    ${d.planb ? `<div class="planb-banner"><span class="banner-label">Plan-B hari ini</span>${d.planb}</div>` : ``}
    ${cadanganNearbyHtml}
  `;

  det.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const row = cb.closest('tr');
      const key = row.dataset.key;
      store[key] = cb.checked;
      row.classList.toggle('done', cb.checked);
      save();
      updateProgress(det);
    });
  });

  return det;
}

function renderBudget(b, currency){
  const el = document.createElement('details');
  el.className = 'budget-card';
  const dayRows = b.byDay.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  const catRows = b.byCategory.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  el.innerHTML = `
    <summary><h3 class="serif">Ringkasan Budget Total</h3>${CHEV}</summary>
    <div class="budget-card-body">
      <div class="budget-sub">${b.note}</div>
      <table class="budget">
        <thead><tr><th>Hari</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${dayRows}<tr class="grand"><td>${b.grand[0]}</td><td>${b.grand[1]}</td><td>${b.grand[2]}</td></tr></tbody>
      </table>
      <table class="budget">
        <thead><tr><th>Kategori</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${catRows}<tr class="grand"><td>TOTAL</td><td>${b.catTotal[1]}</td><td>${b.catTotal[2]}</td></tr></tbody>
      </table>
      <div class="budget-note">${b.caveat}</div>
    </div>
  `;
  return el;
}

function renderCity(dest){
  const panel = document.createElement('div');
  panel.className = 'city-panel';
  panel.id = 'panel-'+dest.id;

  panel.innerHTML = `
    <div class="subview itinerary active"></div>
    <div class="subview lampiran"></div>
  `;

  const itinView = panel.querySelector('.subview.itinerary');
  itinView.appendChild(renderTransport(dest.transportPergi));

  dest.days.forEach(d=>{
    const dayEl = renderDay(d, dest);
    itinView.appendChild(dayEl);
    updateProgress(dayEl);
  });

  if(dest.budget) itinView.appendChild(renderBudget(dest.budget, dest.currency || 'CNY'));

  const notesCard = document.createElement('details');
  notesCard.className = 'notes-card';
  notesCard.innerHTML = `<summary>Catatan Penting Lainnya${CHEV}</summary><div class="notes-card-body"><ul>${dest.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  itinView.appendChild(notesCard);

  if(dest.transportPulang) itinView.appendChild(renderTransport(dest.transportPulang));

  const lampiranView = panel.querySelector('.subview.lampiran');
  lampiranView.innerHTML = '';

  const tagClass = {main:'tag-main',planb:'tag-planb',food:'tag-food',planc:'tag-planc',info:'tag-info'};
  const groupDefs = dest.lampiranGroups && dest.lampiranGroups.length
    ? dest.lampiranGroups
    : dest.days.map(d=>({key:d.id, heading:d.date+' — '+d.label})).concat([{key:'cadangan', heading:'Cadangan'}]);

  function placeLinks(p){
    return (p.wiki || p.yt) ? `<div class="place-links">
        ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Foto &amp; info →</a>` : ``}
        ${p.yt ? `<a href="${p.yt}" target="_blank" rel="noopener">Video referensi →</a>` : ``}
      </div>` : ``;
  }

  groupDefs.forEach((g,gi)=>{
    const entries = dest.lampiran.filter(p=>p.group===g.key);
    if(!entries.length) return;
    const isIntro = g.key === 'intro';

    const groupEl = document.createElement('details');
    groupEl.className = 'lampiran-group';
    groupEl.dataset.key = g.key;

    const itemsHtml = entries.map(p=>{
      const noBody = !p.text && !p.wiki && !p.yt && !p.reserveInfo && (!p.nearby || !p.nearby.length) && (!p.hotels || !p.hotels.length);
      const lampKey = lampiranKey(dest.id, p.title);
      const lampChecked = lampStore[lampKey] ? 'checked' : '';
      const lampDoneClass = !isIntro && lampStore[lampKey] ? ' reviewed' : '';
      return `
        <div class="lampiran-item${isIntro?' intro':''}${lampDoneClass}"${!isIntro?` data-lamp-key="${lampKey}"`:``}>
          <div class="lampiran-item-head">
            ${!isIntro ? `<input type="checkbox" class="lampiran-check" ${lampChecked} aria-label="Tandai sudah ditinjau: ${p.title}">` : ``}
            ${!isIntro ? `<span class="place-tag ${tagClass[p.tag]}">${p.label}</span>` : ``}
            <span class="lampiran-item-title">${titleHtml(p)}</span>
            ${!isIntro ? `<button type="button" class="item-toggle" aria-label="Buka/tutup detail">${CHEV}</button>` : ``}
          </div>
          <div class="lampiran-item-body">
            ${!isIntro && p.tag !== 'food' ? copyBtnsHtml(p.nameEn, p.nameHanzi) : ``}
            ${p.context ? `<div class="card-context"${noBody?' style="margin-bottom:0;"':''}>${p.context}</div>` : ``}
            ${p.text ? `<p>${p.text}</p>` : ``}
            ${p.reserveInfo ? `<div class="reserve-info"><span class="banner-label">Cara reservasi</span>${p.reserveInfo}</div>` : ``}
            ${p.nearby && p.nearby.length ? `<div class="nearby"><b>Rekomendasi tempat sekitar:</b> ${nearbyLine(p.nearby)}</div>` : ``}
            ${p.hotels && p.hotels.length ? `<div class="hotels"><b>Rekomendasi Hotel (Trip.com):</b> ${hotelsLine(p.hotels, dest.name)}</div>` : ``}
            ${placeLinks(p)}
          </div>
        </div>`;
    }).join('');

    groupEl.innerHTML = `
      <summary><span class="lampiran-group-title">${g.heading}</span>${CHEV}</summary>
      <div class="lampiran-group-body">${itemsHtml}</div>
    `;
    lampiranView.appendChild(groupEl);
  });

  lampiranView.querySelectorAll('.lampiran-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const item = cb.closest('.lampiran-item');
      const key = item.dataset.lampKey;
      lampStore[key] = cb.checked;
      item.classList.toggle('reviewed', cb.checked);
      saveLamp();
    });
  });

  lampiranView.querySelectorAll('.lampiran-item-head').forEach(head=>{
    const item = head.closest('.lampiran-item');
    if(item.classList.contains('intro')) return;
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.lampiran-check')) return;
      item.classList.toggle('open');
    });
  });

  return panel;
}

const cityTabsWrap = document.getElementById('city-tabs');
const cityPanelsWrap = document.getElementById('city-panels');

const AIRPORT_CODES = {nanjing:'NKG', wuxi:'WUX', hongkong:'HKG'};
destinations.forEach((dest,i)=>{
  const tabBtn = document.createElement('button');
  tabBtn.className = 'city-tab' + (i===0 ? ' active' : '');
  tabBtn.textContent = AIRPORT_CODES[dest.id] || dest.name.replace(/\s+/g,'').slice(0,3).toUpperCase();
  tabBtn.title = dest.name;
  tabBtn.setAttribute('aria-label', dest.name);
  tabBtn.dataset.city = dest.id;
  tabBtn.addEventListener('click', ()=>{
    document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
    tabBtn.classList.add('active');
    document.querySelectorAll('.city-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+dest.id).classList.add('active');
    setGlobalSubview('itinerary');
  });
  cityTabsWrap.appendChild(tabBtn);

  const panel = renderCity(dest);
  if(i===0) panel.classList.add('active');
  cityPanelsWrap.appendChild(panel);
});

/* Itinerary/Lampiran toggle lives once in the sticky header and controls
   whichever city panel is currently active — stays visible while scrolling. */
function setGlobalSubview(view){
  document.querySelectorAll('#global-subtabs .subtab-btn').forEach(b=>{
    const active = b.dataset.view === view;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  activePanel.querySelectorAll('.subview').forEach(v=>v.classList.remove('active'));
  activePanel.querySelector('.subview.'+view).classList.add('active');
  document.getElementById('dest-search').value = '';
  document.querySelectorAll('.search-hit').forEach(el=>el.classList.remove('search-hit'));
}
document.querySelectorAll('#global-subtabs .subtab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> setGlobalSubview(btn.dataset.view));
});
</script>
