       text:`Patung Buddha perunggu duduk terbesar di dunia saat selesai dibangun tahun 1993, tinggi ±34m, menghadap ke utara — berbeda dari kebanyakan patung Buddha yang menghadap selatan, sebagai simbol menjaga rakyat China. Terletak di dataran tinggi Ngong Ping, satu kompleks dengan Po Lin Monastery. <b>Akses:</b> Ngong Ping Village (turun dari cable car), jalan kaki ±5 menit ke halaman bawah patung. <b>Jam Operasional:</b> area halaman &amp; monastery ±09:00–18:00 setiap hari. <b>Tiket:</b> Gratis lihat dari halaman bawah. ⚠️ Naik ke platform dekat patung via 268 anak tangga tanpa lift — TIDAK disarankan untuk kondisi lutut, cukup nikmati dari bawah.`,
       wiki:`https://en.wikipedia.org/wiki/Tian_Tan_Buddha`,

       context:`Kenapa tidak dimasukkan: satu kawasan dengan Ngong Ping 360/Lantau — sama-sama tidak masuk karena keterbatasan hari.`,
       text:`Desa nelayan tertua di Hong Kong, dihuni etnis Tanka sejak berabad lalu — terkenal dengan rumah-rumah panggung kayu (stilt houses) di atas sungai pasang-surut, dijuluki "Venice of the Orient". Masih jadi tempat produksi terasi udang &amp; ikan asin tradisional. <b>Akses:</b> Bus 21 dari Ngong Ping (±20 menit) atau bus 11 langsung dari Tung Chung (±30-45 menit). <b>Jam Operasional:</b> desa &amp; jalan buka 24 jam (gratis); toko/warung umumnya ±09:00–18:00. <b>Tiket:</b> Gratis jalan-jalan; boat tour opsional melihat lumba-lumba merah muda ±HKD 25/org.`,

       text:`Taman hiburan Disney yang dibuka 2005 di Lantau Island, versi terkecil dari taman Disney di seluruh dunia — tetap punya wahana ikonik seperti Sleeping Beauty Castle &amp; Mystic Manor. <b>Akses:</b> MTR Disneyland Resort Line dari Sunny Bay, ±10 menit dari Tung Chung Line. <b>Jam Operasional:</b> umumnya 10:30–20:30, bervariasi musiman. <b>Tiket:</b> ±HKD 639/org dewasa (±Rp1.469.700/org).`,

       text:`Taman hiburan &amp; taman laut yang dibuka 1977 di Southern District Hong Kong Island — memadukan wahana dengan akuarium &amp; konservasi satwa laut, salah satu yang tertua di Asia. <b>Akses:</b> MTR South Island Line ke Ocean Park Station, langsung di depan pintu masuk. <b>Jam Operasional:</b> umumnya 10:00–19:00, bervariasi musiman. <b>Tiket:</b> ±HKD 498/org dewasa (±Rp1.145.400/org).`,

       text:`Dijuluki "the back garden of Hong Kong" — kawasan pesisir timur dengan jalur hiking, pantai, dan pelabuhan nelayan yang terkenal dengan seafood segar, jauh dari kepadatan kota utama. <b>Akses:</b> MTR Hang Hau (Tseung Kwan O Line), lanjut minibus ±15-20 menit — tidak ada MTR langsung ke pusat Sai Kung. <b>Jam Operasional:</b> area terbuka 24 jam; restoran seafood umumnya 11:00–22:00. <b>Tiket:</b> Gratis (kecuali menyewa boat trip ke outlying islands).`,

    lampiran:[
      // --- intro ---
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cerita Kota`,
       nameEn:`Cerita Kota`,
       text:`Shenzhen berubah dari desa nelayan kecil populasi ±30.000 jiwa tahun 1980 menjadi salah satu kota metropolitan terbesar dunia (&gt;17 juta jiwa) setelah ditetapkan sebagai Zona Ekonomi Khusus pertama China oleh Deng Xiaoping — kini dijuluki "Silicon Valley China", markas Tencent, Huawei, DJI, dan BYD.`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+history+documentary`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Cuaca, Iklim &amp; Suhu`,
       nameEn:`Cuaca, Iklim & Suhu`,
       text:`Awal November masuk musim kering subtropis — suhu siang ±27-29°C, malam ±19-22°C, kelembapan mulai turun dari puncak musim panas. ⚠️ Angka rata-rata historis, bukan forecast real-time — cek forecast H-7 sebelum berangkat.`,
       wiki:`https://weather-and-climate.com/averages-Shenzhen-November`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Dari Hong Kong, HSR West Kowloon → Futian adalah rute tercepat (±14 menit, ±47 keberangkatan/hari) — imigrasi Tiongkok diselesaikan di West Kowloon (co-location) sebelum naik kereta, jadi begitu turun di Futian langsung berada di Shenzhen tanpa pemeriksaan tambahan.`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen%E2%80%93Hong_Kong_high-speed_train`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Huaqiangbei, Futian District</b> — hotel dipilih di sini (<b>Tourism Trend Hotel</b>) karena berada di antara 2 stasiun (Yannan &amp; Huaqiang North, Line 2/8), searah dengan Civic Center dan Futian Station, dan dekat kawasan elektronik Huaqiangbei itu sendiri. Ke klaster Nanshan (Shenzhen Bay/Shekou) tetap butuh 1x transfer dan waktu tempuh lebih panjang (±50 menit–1 jam).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain`,
       nameEn:`Destinasi Terkenal Lain`,
       text:`Di luar itinerary utama: <b>Shenzhen Safari Park</b>, <b>Splendid China Folk Culture Village</b>, dan <b>Window of the World</b> — taman hiburan/tematik besar dan berbayar, butuh perjalanan &amp; waktu tersendiri. <b>Xiaomeisha Beach</b> — pantai populer di sisi timur (Yantian). <b>Wutong Mountain</b> — puncak tertinggi Shenzhen, jalur hiking populer warga lokal. <b>Dafen Oil Painting Village</b> — desa seni otentik di Longgang, terisolasi dari kluster lain.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Shenzhen`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita/budaya kuliner khas kota — bukan berarti otomatis masuk itinerary, rekomendasi makan aktual tetap mengikuti kriteria ramah lambung. <b>Cantonese dim sum</b> — sama tradisinya dengan Hong Kong/Guangzhou, hidangan kukus untuk sarapan/brunch. <b>Congee (粥)</b> — bubur nasi halus. Shenzhen juga terkenal dengan masakan pedas Sichuan/Hunan (karena banyak pendatang dari provinsi lain) — dihindari sesuai kriteria trip ini.`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Siapkan WeChat Pay/Alipay sebelum berangkat — banyak tempat makan kecil/warung tidak menerima kartu kredit asing atau uang tunai. VPN WAJIB dipasang sebelum masuk Tiongkok (Google/WhatsApp/Instagram tidak bisa diakses tanpa VPN, beda dari Hong Kong). Hindari taksi jalanan tanpa alamat tertulis dalam Hanzi (kendala bahasa Mandarin).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`VPN aktif sebelum masuk perbatasan. WeChat Pay/Alipay (tautkan kartu asing atau top-up tunai). Shenzhen pakai CNY (Renminbi/RMB) — beda mata uang dari Hong Kong (HKD), jangan tertukar. Salinan paspor/visa Tiongkok (fisik &amp; digital) — cek syarat visa Indonesia untuk Tiongkok daratan sebelum berangkat (beda dari syarat masuk Hong Kong SAR).`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Huaqiangbei (华强北 · Huáqiángběi)`,
       nameEn:`Huaqiangbei`,
       nameHanzi:`华强北`,
       text:`Kawasan pusat elektronik terbesar Asia — deretan mal khusus komponen elektronik, gadget, dan aksesoris sejak era 1980-an, jadi simbol kebangkitan industri teknologi Shenzhen ("Silicon Valley China"). <b>Akses:</b> dari hotel, jalan 328m/7 menit ke Yannan Exit C → Line 2(Line 8) arah Chiwan, 1 halte → <b>Huaqiang North Exit D1</b> — sangat dekat, tanpa transfer, rute terverifikasi Amap 2026-09-23. Searah menuju Civic Center (2 halte lagi di jalur yang sama). <b>Jam Operasional:</b> toko umumnya 10:00–20:00 setiap hari. <b>Tiket:</b> Gratis jalan-jalan (murni kawasan belanja, disisipkan sebagai persinggahan singkat, bukan sesi belanja penuh).`,
       wiki:`https://www.travelchinaguide.com/cityguides/guangdong/shenzhen/huaqiangbei-electronics-market.htm`,
       yt:`https://www.youtube.com/results?search_query=Huaqiangbei+Shenzhen`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Shenzhen Museum (深圳博物馆 · Shēnzhèn Bówùguǎn)`,
       nameEn:`Shenzhen Museum`,
       nameHanzi:`深圳博物馆`,
       text:`Museum utama kota yang memaparkan sejarah Shenzhen dari desa nelayan kecil hingga jadi kota metropolitan raksasa dalam kurun kurang dari 50 tahun — koleksi mencakup sejarah, seni, dan budaya rakyat (folk culture) Guangdong. <b>Akses:</b> Civic Center Station (Line 2/4), Exit C, jalan kaki ke kompleks Civic Center — satu kawasan dengan Cultural Plaza &amp; Library. Dari hotel: Line 2(8) langsung, 3 halte (via Huaqiang North, Gangxia North), ±15 menit + tunggu, ¥2/org — rute terverifikasi Amap (koreksi dari raw lama yang salah lewat Children's Palace/Line 4). <b>Jam Operasional:</b> Selasa–Minggu 10:00–18:00, tutup Senin. Tidak perlu reservasi sejak Juli 2024. <b>Tiket:</b> Gratis.`,
       wiki:`https://shenzhenmuseum.com/museum/html/aboutus/visit-service.html`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Museum`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Civic Center Cultural Plaza (市民中心文化广场 · Shìmín Zhōngxīn Wénhuà Guǎngchǎng)`,
       nameEn:`Civic Center Cultural Plaza`,
       nameHanzi:`市民中心文化广场`,
       text:`Ruang publik terbuka di depan gedung Civic Center Shenzhen — jadi salah satu plaza foto paling populer warga lokal, dengan latar gedung pemerintahan berbentuk atap melengkung ikonik ("bird's wings"). <b>Akses:</b> Dari hotel: Line 2(8) arah Chiwan, 3 halte → Civic Center Exit C, ±15 menit + tunggu, ¥2/org — rute terverifikasi Amap. Persis sebelahan Shenzhen Museum &amp; Library, jalan kaki, tidak perlu transportasi tambahan. <b>Jam Operasional:</b> area terbuka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://nowshenzhen.com/places/cultural-attractions/shenzhen-civic-center/`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Civic+Center+Plaza`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Shenzhen Library (深圳图书馆 · Shēnzhèn Túshūguǎn)`,
       nameEn:`Shenzhen Library`,
       nameHanzi:`深圳图书馆`,
       text:`Perpustakaan utama kota, bagian dari Shenzhen Cultural Center — salah satu perpustakaan publik paling megah di China, arsitekturnya sendiri jadi daya tarik meski hanya lewat sebentar. <b>Akses:</b> Persis sebelahan Civic Center Cultural Plaza &amp; Shenzhen Museum — jalan kaki, satu kompleks. <b>Jam Operasional:</b> setiap hari 09:00–21:00, kecuali Senin tutup. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen_Library`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Library+Civic+Center`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Lianhua Mountain Park (莲花山公园 · Liánhuā Shān Gōngyuán)`,
       nameEn:`Lianhua Mountain Park`,
       nameHanzi:`莲花山公园`,
       text:`Taman kota di jantung Futian, dengan bukit setinggi ±100m yang mudah didaki — di puncaknya ada patung Deng Xiaoping dan plaza luas yang jadi salah satu spot terbaik memandang skyline CBD Futian, terutama saat lampu kota menyala malam hari. <b>Akses:</b> Dari Civic Center: Line 4 ke Children's Palace, 1 halte, ±3 menit. Dari hotel langsung: jalan 811m/14 menit (atau sepeda ±5 menit) ke Tongxinling Exit A1 → Line 3 arah Futian Bonded Area, 2 halte (Huaxin) → <b>Lianhuacun Exit D</b> — total ±24 menit, ¥2/org, tanpa transfer, rute terverifikasi Amap. Stasiun Children's Palace punya Exit A–D dan F — pilih Exit F ke arah gerbang barat taman ⚠️ (cek papan petunjuk "Lianhua Mountain"), lalu jalan kaki ±5 menit. <b>Jam Operasional:</b> setiap hari 06:00–23:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://us.trip.com/moments/poi-lian-hua-shan-park-83245/`,
       yt:`https://www.youtube.com/results?search_query=Lianhua+Mountain+Park+Shenzhen`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Shenzhen Bay Park (深圳湾公园 · Shēnzhèn Wān Gōngyuán)`,
       nameEn:`Shenzhen Bay Park`,
       nameHanzi:`深圳湾公园`,
       text:`Taman pesisir sepanjang ±13km di sisi barat Shenzhen, dengan jalur mangrove boardwalk ±2km dan lebih dari 189 spesies burung — jadi salah satu spot sunset &amp; bersepeda favorit warga lokal, memandang langsung ke Hong Kong di seberang teluk. <b>Akses:</b> Dari hotel: jalan 328m/7 menit ke Yannan Exit C → Line 2(8) arah Chiwan, 6 halte → transfer Jingtian (26m/4 menit) → Line 9 arah Qianwan, 4 halte → Shenzhen Bay Park Exit A. Total ±51 menit, ¥4/org, 1x transfer — rute terverifikasi Amap 2026-09-23. Ini klaster terjauh dari hotel di itinerary ini. <b>Jam Operasional:</b> taman buka 24 jam, gratis. Sepeda sewaan ±CNY 30/jam (dilarang naik weekend/libur 09:00-18:00 kecuali sepeda pribadi). <b>Tiket:</b> Gratis.`,
       wiki:`https://intotravelchina.com/attractions/shenzhen_attraction/shenzhen_bay_park.html`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Bay+Park`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Shenzhen Bay Cultural Plaza (深圳湾文化广场 · Shēnzhèn Wān Wénhuà Guǎngchǎng)`,
       nameEn:`Shenzhen Bay Cultural Plaza`,
       nameHanzi:`深圳湾文化广场`,
       text:`Landmark budaya terbaru Shenzhen, baru dibuka November 2025 — dirancang arsitek Ma Yansong (MAD Architects) terinspirasi batu karang pesisir, jadi museum desain terbesar di dunia dengan 9 bangunan pameran, teater, dan ruang seni. Bersebelahan dengan Shenzhen Bay Park &amp; MixC Shenzhen Bay. <b>Akses:</b> Dari Shenzhen Bay Park: jalan 1,6km/28 menit (atau sepeda ±8 menit) ke Houhai Exit M → Line 13 arah Shenzhen Bay Checkpoint, 1 halte → Talent Park Exit B1, langsung di depan. Total ±39 menit, ¥2/org — rute terverifikasi Amap; sepeda disarankan untuk memangkas jalan kaki 1,6km. <b>Jam Operasional:</b> belum terverifikasi penuh, cek sebelum berangkat. <b>Tiket:</b> Area plaza &amp; sebagian pameran gratis; pameran khusus (kolaborasi Tate/Design Museum London) kemungkinan berbayar.`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen_Bay_Cultural_Plaza`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Bay+Cultural+Plaza`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`MixC Shenzhen Bay (深圳湾万象城 · Shēnzhèn Wān Wànxiàng Chéng)`,
       nameEn:`MixC Shenzhen Bay`,
       nameHanzi:`深圳湾万象城`,
       text:`Cabang MixC di kawasan Shenzhen Bay, Nanshan — bersebelahan dengan Shenzhen Bay Cultural Plaza yang baru dibuka, jadi satu kompleks perbelanjaan-budaya-pesisir baru yang sedang naik daun. (Ada juga cabang MixC asli di Hi-Tech Park, Line 1 — kalau maksud pengguna itu, lokasinya beda, jauh dari kluster Shenzhen Bay ini.) <b>Akses:</b> MTR Talent Park Station (Line 13), Exit B1 — sama dengan akses Shenzhen Bay Cultural Plaza di atas, persis bersebelahan. <b>Jam Operasional:</b> umumnya 10:00–22:00 setiap hari. <b>Tiket:</b> Gratis masuk (murni mal/pusat belanja, disisipkan sekadar lihat-lihat).`,
       wiki:`https://en.wikipedia.org/wiki/MixC_World_(Shenzhen)`,
       yt:`https://www.youtube.com/results?search_query=MixC+Shenzhen+Bay`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Sea World (海上世界 · Hǎishàng Shìjiè)`,
       nameEn:`Sea World`,
       nameHanzi:`海上世界`,
       text:`Kawasan hiburan &amp; kuliner waterfront di Shekou, Nanshan — namanya diambil dari kapal pesiar tua "Minghua" yang jadi hotel/landmark permanen di tepi laut, sekarang jadi salah satu titik nongkrong ekspatriat paling populer di Shenzhen. <b>Akses:</b> MTR Sea World Station (Line 2/12), Exit A, ±500m jalan kaki. Dari hotel: jalan 328m/7 menit ke Yannan Exit C → Line 2(8) arah Chiwan, 22 halte (lewat Civic Center, Futian, Qiaocheng North, Window of the World, Houhai, Shuiwan) → Sea World Exit A. Total ±1 jam 10 menit, ¥6/org — rute terverifikasi Amap, simetris dengan arah pulang. <b>Jam Operasional:</b> area terbuka 24 jam; toko/restoran umumnya 10:00–22:00. <b>Tiket:</b> Gratis jalan-jalan.`,
       wiki:`https://en.wikipedia.org/wiki/Sea_World_station`,
       yt:`https://www.youtube.com/results?search_query=Sea+World+Shekou+Shenzhen`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`K11 ECOAST (深圳K11 ECOAST)`,
       nameEn:`K11 ECOAST`,
       nameHanzi:`深圳K11 ECOAST`,
       text:`Kompleks ritel &amp; budaya waterfront baru di Shekou (dibuka April 2025) — bagian dari brand K11, memadukan seni instalasi, ritel premium, dan pemandangan laut, salah satu landmark terbaru Shenzhen. <b>Akses:</b> MTR Taiziwan Station (Line 12), Exit B1/C, atau Shekou Port Station (Line 2), Exit C — satu kawasan dengan Sea World, jalan kaki dari sana. <b>Jam Operasional:</b> umumnya 10:00–22:00 (bervariasi, masih baru). <b>Tiket:</b> Gratis masuk (mal/kawasan ritel-budaya, sekadar lihat-lihat).`,
       wiki:`https://en.wikipedia.org/wiki/K11_ECOAST`,
       yt:`https://www.youtube.com/results?search_query=K11+ECOAST+Shenzhen`},

      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Shenzhen Science and Technology Museum (深圳科技馆/深圳科学技术馆 · Shēnzhèn Kēxué Jìshùguǎn)`,
       nameEn:`Shenzhen Science and Technology Museum`,
       nameHanzi:`深圳科技馆/深圳科学技术馆`,
       text:`Museum sains-teknologi baru Shenzhen, dibuka <b>1 Mei 2025</b> di jantung Guangming Science City, Distrik Guangming — dirancang Zaha Hadid Architects dengan bentuk menyerupai pesawat antariksa raksasa, luas bangunan ±128.300-130.000 m² (6 lantai + 2 lantai basement). Tema "Digital Civilization · Innovation · Future" dengan tujuh zona: pameran teknologi, bioskop sains, praktik inovasi, pertukaran teknologi, layanan publik, manajemen bisnis, dan taman sains luar ruangan. <b>Akses:</b> MTR Line 6, Stasiun Guangming, Exit C/D, tersambung langsung lewat koridor lantai 2 ke gerbang selatan/utara museum (atau bus feeder M151/M574/D53). Dari hotel: jalan 833m/14 menit ke Science Museum Exit B (interchange Line 1/6) → Line 6 ±18 halte ke Guangming — ⚠️ total ±90 menit sekali jalan, belum diverifikasi Amap (mohon screenshot Amap hotel → Guangming). Rute ±27 menit ke stasiun "Science Museum" di Futian adalah untuk gedung LAMA, bukan museum baru ini. <b>Jam Operasional:</b> Selasa–Jumat 10:00–17:00 (penjualan tiket hari-H berhenti 16:00); akhir pekan/libur 09:30–18:00 (Nov–Apr) atau 09:30–18:30 (Mei–Okt); tutup Senin. <b>Tiket:</b> wajib reservasi online (mini-program WeChat resmi "深圳科学技术馆", real-name, tiket sempat habis dalam ±10 menit saat hari pertama buka — booking beberapa hari sebelumnya). Pameran tetap CNY 50/org reguler, CNY 32/org kategori khusus (pelajar/lansia); bioskop sains &amp; pameran sementara dibeli/direservasi terpisah.`,
       reserveInfo:`mini-program WeChat resmi "深圳科学技术馆" (real-name, pakai paspor), buka beberapa hari sebelumnya; tiket sering habis ±10 menit setelah rilis.`,
       wiki:`https://www.zha.com/projects/architecture/shenzhen-science-technology-museum`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Science+and+Technology+Museum+Guangming`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Shuiwei Night Market (水围夜市 · Shuǐwéi Yèshì)`,
       nameEn:`Shuiwei Night Market`,
       nameHanzi:`水围夜市`,
       text:`Kawasan jajanan malam &amp; food street di Shuiwei Village, Futian — bagian dari "Shuiwei 1368 Cultural District", dengan lebih dari 30 kios kuliner khas Chaoshan (Teochew) plus kafe &amp; bar kreatif, salah satu night market paling dianjurkan di Shenzhen dan persis dekat area Futian Port. <b>Akses:</b> MTR Huanggangcun Station (Line 7), Exit B2. Dari hotel: jalan 810m/14 menit ke Huaqiang North Exit E2 → Line 7 arah SZU Lihu Campus, 5 halte → Huanggangcun Exit B2, ±36 menit, ¥3/org — rute terverifikasi Amap. <b>Jam Operasional:</b> mulai buka/setup dari 16:00, ramai penuh 17:00 hingga tengah malam. <b>Tiket:</b> Gratis masuk, jajan sesuai selera.`,
       wiki:`https://www.eastchinatrip.com/shuiwei-night-market-travel-guide/`,
       yt:`https://www.youtube.com/results?search_query=Shuiwei+Night+Market+Shenzhen`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Dongmen Pedestrian Street (东门步行街 · Dōngmén Bùxíng Jiē)`,
       nameEn:`Dongmen Pedestrian Street`,
       nameHanzi:`东门步行街`,
       text:`Kawasan pasar pejalan kaki tertua &amp; terbesar Shenzhen di Distrik Luohu — pusat perbelanjaan murah, jajanan kaki lima, dan suasana lokal otentik sejak sebelum era reformasi ekonomi Shenzhen. <b>Akses:</b> MTR Laojie Station (Line 1/3), Exit D, langsung di pintu masuk kawasan. Dari hotel: jalan 833m/14 menit ke Science Museum Exit B → Line 1 arah Luohu, 2 halte (Grand Theater) → Laojie Exit D. Total 2 stasiun, ¥2/org, ±24 menit — rute terverifikasi Amap (koreksi dari raw lama yang salah lewat Shixia/8 halte). <b>Jam Operasional:</b> area terbuka sepanjang hari; toko/jajanan umumnya ±10:00–22:00, paling ramai sore-malam. <b>Tiket:</b> Gratis jalan-jalan, jajan sesuai selera.`,
       wiki:`https://en.wikipedia.org/wiki/Dongmen,_Shenzhen`,
       yt:`https://www.youtube.com/results?search_query=Dongmen+Pedestrian+Street+Shenzhen`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Xinghe COCO Park (星河COCO Park · Xīnghé COCO Park)`,
       nameEn:`Xinghe COCO Park`,
       nameHanzi:`星河COCO Park`,
       text:`Pusat perbelanjaan terbuka (open-air mall) populer di Futian, dikenal dengan plaza tengah, deretan restoran, dan kawasan nongkrong yang ramai malam hari — salah satu tujuan makan/santai favorit warga Futian, beda dari MixC (Shenzhen Bay) yang lebih ke arah ritel premium. <b>Akses:</b> MTR Shopping Park Station (Line 1), keluar langsung ke kawasan. Dari Dongmen (Laojie): lanjut Line 1 arah Airport East (sebaliknya dari arah datang), lewat Grand Theater, Science Museum, Huaqiang Rd, Gangxia, Convention &amp; Exhibition Center, ke Shopping Park — tanpa turun/transfer, tapi ⚠️ <b>segmen ini estimasi ±30 menit, ¥3/org</b>, belum di-Amap-kan spesifik. <b>Jam Operasional:</b> umumnya 10:00–22:00, restoran bisa lebih malam. <b>Tiket:</b> Gratis masuk (mal terbuka, sekadar lihat-lihat &amp; makan).`,
       wiki:`https://en.wikipedia.org/wiki/Shenzhen (referensi umum, belum ada halaman khusus terverifikasi)`,
       yt:`https://www.youtube.com/results?search_query=Xinghe+COCO+Park+Shenzhen`},

      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`He Xiangning Art Museum (何香凝美术馆 · Hé Xiāngníng Měishùguǎn)`,
       nameEn:`He Xiangning Art Museum`,
       nameHanzi:`何香凝美术馆`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna (revisi 2026-09-23)</b> — kluster Qiaocheng East tidak searah dengan klaster lain manapun di itinerary ini, dan mengeluarkannya memberi ruang untuk memecah klaster Shenzhen Bay/Shekou (yang berat transportasinya) jadi 2 hari terpisah lebih santai tanpa menambah malam lagi.`,
       text:`Museum seni yang didedikasikan untuk pelukis &amp; aktivis politik He Xiangning (salah satu pendiri Kuomintang, kemudian tokoh penting RRT awal) — koleksi lukisan tradisional China gaya Lingnan, persis bersebelahan dengan OCT-LOFT. <b>Akses:</b> Metro Line 1 Qiaocheng East (Exit A). Dari hotel: jalan 833m/14 menit (atau sepeda ±5 menit) ke Science Museum Exit B → Line 1 arah Airport East, 8 halte → Qiaocheng East Exit A. Total ±51 menit, ¥4/org — rute terverifikasi Amap 2026-09-22. <b>Jam Operasional:</b> umumnya Selasa–Minggu 10:00–17:30, tutup Senin. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/He_Xiangning_Art_Museum`,
       yt:`https://www.youtube.com/results?search_query=He+Xiangning+Art+Museum+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`OCT-LOFT (华侨城创意文化园 · Huáqiáochéng Chuàngyì Wénhuà Yuán)`,
       nameEn:`OCT-LOFT`,
       nameHanzi:`华侨城创意文化园`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna (revisi 2026-09-23)</b> — sama seperti He Xiangning di atas, kluster Qiaocheng East dikeluarkan supaya klaster Shenzhen Bay/Shekou bisa dipecah jadi 2 hari lebih santai tanpa menambah malam lagi.`,
       text:`Bekas kawasan pabrik era 1980-an yang direvitalisasi jadi distrik kreatif — galeri seni kontemporer, studio desainer independen, dan kafe/bar bergaya industrial, sering disebut versi Shenzhen dari 798 Art District Beijing. <b>Akses:</b> Stasiun Qiaocheng East (侨城东站, Line 1), Exit A, ±5 menit jalan kaki. Rute dari hotel sama dengan He Xiangning Art Museum di atas — ±51 menit, ¥4/org. <b>Jam Operasional:</b> area terbuka 24 jam, gratis; toko/galeri umumnya 10:00–22:00, ramai &amp; hidup sore-malam. <b>Tiket:</b> Gratis masuk area.`,
       wiki:`https://www.eastchinatrip.com/shenzhen-oct-loft-creative-culture-park-guide/`,
       yt:`https://www.youtube.com/results?search_query=OCT-LOFT+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nantou Ancient City (南头古城 · Nántóu Gǔchéng)`,
       nameEn:`Nantou Ancient City`,
       nameHanzi:`南头古城`,
       context:`Kenapa tidak dimasukkan: genuinely menarik (old town, sesuai kriteria "pusat pejalan kaki" skill), tapi tidak termasuk dalam daftar revisi terbaru pengguna dan trip 4 hari sudah padat dengan destinasi lain — cocok jadi dedicated half-day kalau trip diperpanjang lagi.`,
       text:`Kota berbenteng berusia lebih dari 1.700 tahun di Nanshan — pernah jadi pusat administratif wilayah yang kini jadi Shenzhen &amp; Hong Kong, direvitalisasi jadi kawasan jalan-jalan bersejarah dengan puluhan bar/kafe di antara bangunan tua yang dipugar. <b>Akses:</b> MTR Nantou Ancient City Station (Line 12), Exit C langsung ke gerbang kota (ada lift). Dari hotel: butuh transfer ke Line 12, ⚠️ rute persis dari hotel baru belum diverifikasi Amap, estimasi ±45-50 menit — beda arah dari kluster Nanshan Hari 2 &amp; 3. <b>Jam Operasional:</b> area terbuka 24 jam, gratis; beberapa museum kecil di dalamnya berbayar ±CNY 20-50. <b>Tiket:</b> Gratis masuk kawasan; museum kecil di dalamnya berbayar terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Nantou_Ancient_City_station`,
       yt:`https://www.youtube.com/results?search_query=Nantou+Ancient+City+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dutch Flower Town (荷蘭花卉小鎮 · Hélán Huāhuì Xiǎozhèn)`,
       nameEn:`Dutch Flower Town`,
       nameHanzi:`荷蘭花卉小鎮`,
       context:`Kenapa tidak dimasukkan: jauh di Nanshan bagian utara, tidak searah kluster manapun di itinerary ini, dan fokus utamanya foto-foto (bukan prioritas trip ini — lihat poin 1 skill).`,
       text:`Kawasan bertema Belanda dengan kincir angin &amp; lanskap bunga musiman di Nanshan — dibangun untuk memperingati kerja sama pertanian Belanda-Tiongkok, populer untuk foto-foto meski relatif jauh dari pusat kota. <b>Akses:</b> MTR Daxin Station (Line 1), Exit B, ±15-20 menit jalan kaki. Dari hotel: ⚠️ belum diverifikasi dari anchor baru, estimasi ±45-50 menit dengan transfer. <b>Jam Operasional:</b> area terbuka 24 jam, gratis. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.echinacities.net/shenzhen/city-guide/Go-Dutch-at-the-Netherlands-Flower-Town-in-Shenzhen`,
       yt:`https://www.youtube.com/results?search_query=Dutch+Flower+Town+Shenzhen`},

       nameHanzi:`虹桥公园`,
       context:`Kenapa tidak dimasukkan: distrik Guangming jauh dari semua kluster itinerary ini (Futian/Nanshan/Luohu) — butuh perjalanan khusus terpisah.`,
       text:`Taman di Distrik Guangming, dilayani stasiun metro baru (dibuka September 2025) di Line 6 Branch. <b>Akses:</b> MTR Hongqiao Park Station (Line 6 Branch), Distrik Guangming. <b>Jam Operasional:</b> belum terverifikasi. <b>Tiket:</b> belum terverifikasi.`,
       wiki:`https://en.wikipedia.org/wiki/Hongqiao_Park_station`,
       yt:`https://www.youtube.com/results?search_query=Hongqiao+Park+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Window of the World (世界之窗 · Shìjiè Zhī Chuāng)`,
       nameEn:`Window of the World`,
       nameHanzi:`世界之窗`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna</b> dari daftar kandidat (2026-09-23) — tiket CNY 220/org tergolong mahal untuk konsep trip merakyat, dan redundan dengan Splendid China (sama-sama taman miniatur). Bisa disisipkan kalau budget &amp; waktu longgar di kunjungan berikutnya.`,
       text:`Taman tematik yang dibuka 1994, menampilkan ±130 replika miniatur landmark dunia — Menara Eiffel, Menara Pisa, Piramida Giza, Sydney Opera House, Air Terjun Niagara, dan lainnya — dalam skala 1:3 hingga 1:15, salah satu taman tema paling ikonik China. <b>Akses:</b> Metro Line 1, Stasiun Window of the World — keluar stasiun langsung di pintu masuk utama. Juga terlewati di rute Sea World→Hotel Hari 2 (Line 2/8), tapi tidak singgah. <b>Jam Operasional:</b> 09:30–21:30 setiap hari; sesi malam mulai 18:00 dengan tiket lebih murah. <b>Tiket:</b> Tiket harian ±CNY 220/org (±Rp583.000/org); tiket sesi malam saja ±CNY 120/org.`,
       wiki:`https://thingstodoinshenzhen.com/landmark/window-of-the-world/`,
       yt:`https://www.youtube.com/results?search_query=Window+of+the+World+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Ping An Finance Center — Free Sky 116 (平安金融中心 · Píng'ān Jīnróng Zhōngxīn)`,
       nameEn:`Ping An Finance Center — Free Sky 116`,
       nameHanzi:`平安金融中心`,
       context:`Kenapa tidak dimasukkan: prioritas tempat gratis sesuai prinsip trip ini (skill poin 3) — tiket CNY 280/org termasuk mahal, dan Lianhua Mountain (Hari 1) sudah menyediakan city view malam yang gratis. Bisa jadi splurge opsional kalau ingin skyline dari ketinggian ekstrem.`,
       text:`Gedung pencakar langit tertinggi Shenzhen (±600m) dan salah satu tertinggi dunia — dek observasi "Free Sky" di lantai 116 (±548m di atas permukaan laut) punya lantai kaca menggantung dengan pemandangan 360° kota, spektakuler saat sunset/malam hari. <b>Akses:</b> Dekat Convention &amp; Exhibition Center Station (Line 4) atau jalan kaki dari kawasan Civic Center, ±10-15 menit. <b>Jam Operasional:</b> umumnya 10:00–22:00 (jam terakhir masuk bervariasi, cek saat pembelian). <b>Tiket:</b> ±CNY 280/org (±Rp742.000/org), booking via loket/WeChat mini-program.`,
       wiki:`https://www.klook.com/en-US/activity/10507-ping-an-financial-center-in-shenzhen-guangdong/`,
       yt:`https://www.youtube.com/results?search_query=Ping+An+Finance+Center+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Splendid China Folk Culture Village (锦绣中华·中国民俗文化村 · Jǐnxiù Zhōnghuá · Zhōngguó Mínsú Wénhuà Cūn)`,
       nameEn:`Splendid China Folk Culture Village`,
       nameHanzi:`锦绣中华中国民俗文化村`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna</b> dari daftar kandidat (2026-09-23) — satu kawasan dengan Window of the World (juga di Cadangan), mirip konsep (miniatur landmark) dan berbayar, tidak sejalan prioritas tempat gratis trip ini.`,
       text:`Taman tematik ganda: "Splendid China" (miniatur 82 landmark terkenal China dalam skala kecil) dan "Folk Culture Village" (replika desa etnis minoritas China dengan pertunjukan budaya) — dibuka 1989, salah satu taman miniatur pertama &amp; terbesar di dunia. <b>Akses:</b> Metro Line 1, Stasiun Overseas Chinese Town (华侨城站), Exit D, ±5 menit jalan kaki. Satu kawasan dengan Window of the World/OCT-LOFT. <b>Jam Operasional:</b> 10:00–21:30 setiap hari (last entry 20:30); weekend &amp; musim panas sampai 22:00-22:30. <b>Tiket:</b> ±CNY 169/org (±Rp447.850/org).`,
       wiki:`https://www.chinadiscovery.com/guangdong/shenzhen/splendid-china-folk-village.html`,
       yt:`https://www.youtube.com/results?search_query=Splendid+China+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Dafen Oil Painting Village (大芬油画村 · Dàfēn Yóuhuà Cūn)`,
       nameEn:`Dafen Oil Painting Village`,
       nameHanzi:`大芬油画村`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna</b> dari daftar kandidat (2026-09-23) — di Distrik Longgang, terisolasi dari kluster Futian/Nanshan/Luohu manapun di itinerary ini, butuh perjalanan tersendiri ±45-60 menit dari hotel. Genuinely bagus (desa seni otentik, jalan kaki, sesuai kriteria skill), layak dipertimbangkan lagi kalau ada waktu ekstra atau kunjungan berikutnya.`,
       text:`Desa yang berkembang sejak 1989 jadi pusat produksi lukisan minyak reproduksi terbesar dunia — ribuan seniman/pengrajin memproduksi replika karya master dunia (Van Gogh, Monet) untuk ekspor, kini juga jadi galeri seni orisinal lokal. <b>Akses:</b> Metro Line 3, Stasiun Dafen, Exit A1, jalan kaki ±500m ke arah barat daya. <b>Jam Operasional:</b> studio buka ±09:00–21:00; Dafen Art Museum Selasa–Minggu 09:30–17:30, tutup Senin. <b>Tiket:</b> Gratis masuk desa &amp; museum (kecuali pameran khusus).`,
       wiki:`https://www.eastchinatrip.com/shenzhen-dafen-oil-painting-village-guide/`,
       yt:`https://www.youtube.com/results?search_query=Dafen+Oil+Painting+Village`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Xiaomeisha Beach (小梅沙 · Xiǎoméishā)`,
       nameEn:`Xiaomeisha Beach`,
       nameHanzi:`小梅沙`,
       context:`Kenapa tidak dimasukkan: di sisi timur jauh (Yantian), butuh ±1 jam perjalanan dari hotel — cocok untuk trip khusus pantai sehari penuh, di luar fokus itinerary 4 hari ini.`,
       text:`Pantai populer di sisi timur Shenzhen (Distrik Yantian), pasir putih dan air lebih jernih dibanding pantai kota lain di China — kini terhubung Metro Line 8 sejak 2023, jadi jauh lebih mudah dijangkau dibanding sebelumnya. <b>Akses:</b> Metro Line 8, Stasiun Xiaomeisha (turun langsung di area pantai). <b>Jam Operasional:</b> area pantai umumnya 24 jam; fasilitas berbayar (payung/kursi) buka siang hari. <b>Tiket:</b> Pantai gratis masuk; fasilitas tambahan (Xiaomeisha Sea World, dll) berbayar terpisah.`,
       wiki:`https://en.wikipedia.org/wiki/Xiaomeisha`,
       yt:`https://www.youtube.com/results?search_query=Xiaomeisha+Beach+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Shenzhen Safari Park (深圳野生动物园 · Shēnzhèn Yěshēng Dòngwùyuán)`,
       nameEn:`Shenzhen Safari Park`,
       nameHanzi:`深圳野生动物园`,
       context:`Kenapa tidak dimasukkan: butuh setengah-hari penuh tersendiri dan berbayar cukup mahal — tidak sejalan prioritas trip ini yang mengutamakan kluster jalan kaki/metro efisien.`,
       text:`Kebun binatang safari terbuka di kaki bukit Nanshan, dibuka 1993 — pengunjung bisa naik kendaraan safari melihat satwa berkeliaran bebas (singa, harimau, jerapah) di area drive-through, plus zona jalan kaki untuk satwa lebih kecil. <b>Akses:</b> Metro Line 7, Stasiun Xili Lake, Exit B, jalan kaki ±10 menit. <b>Jam Operasional:</b> umumnya 09:30–17:30, bervariasi musiman. <b>Tiket:</b> ±CNY 260-320/org dewasa (±Rp689.000-848.000/org).`,
       wiki:`https://www.eastchinatrip.com/safari-park-shenzhen-guide/`,
       yt:`https://www.youtube.com/results?search_query=Shenzhen+Safari+Park`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Wutong Mountain (梧桐山 · Wútóng Shān)`,
       nameEn:`Wutong Mountain`,
       nameHanzi:`梧桐山`,
       context:`Kenapa tidak dimasukkan: butuh stamina &amp; waktu setengah-hari penuh untuk hiking, tidak sejalan dengan itinerary jalan santai/lutut-ramah trip ini.`,
       text:`Puncak tertinggi Shenzhen (±944m), jalur hiking terpopuler warga lokal di akhir pekan — pemandangan kota dari atas dan udara segar jauh dari kepadatan, terkenal juga dengan kebun teh dan bunga sakura liar di musim semi. <b>Akses:</b> Metro Line 3, Stasiun Wutong Mountain (turun langsung di gerbang taman). <b>Jam Operasional:</b> taman buka pagi-sore (bervariasi musiman, umumnya 07:00–18:00); pendakian penuh ke puncak butuh ±3-4 jam pulang-pergi. <b>Tiket:</b> Gratis masuk taman.`,
       wiki:`https://en.wikipedia.org/wiki/Wutong_Mountain`,
       yt:`https://www.youtube.com/results?search_query=Wutong+Mountain+Shenzhen`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Shenzhen Natural History Museum (深圳自然博物馆 · Shēnzhèn Zìrán Bówùguǎn)`,
       nameEn:`Shenzhen Natural History Museum`,

       text:`Awal November masuk musim kering — suhu siang ±26–27°C, malam ±17–19°C, kelembapan ±66%, hujan jarang (±35 mm/bulan). ⚠️ Angka rata-rata historis, bukan forecast real-time — cek forecast H-7 sebelum berangkat.`,
       wiki:`https://weather-and-climate.com/guangzhou-November-averages`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Transportasi Masuk Kota`,
       nameEn:`Transportasi Masuk Kota`,
       text:`Dari Shenzhen, HSR Futian → Guangzhou South ±30–45 menit (rata-rata ±29 menit di jalur tercepat); dari Guangzhou South, Line 2 (dan Line 7) ke pusat kota. Bandara utama: Guangzhou Baiyun International Airport (CAN).`,
       wiki:`https://en.wikipedia.org/wiki/Guangzhou_South_railway_station`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Area Menginap yang Disarankan`,
       nameEn:`Area Menginap yang Disarankan`,
       text:`Kawasan <b>Gongyuanqian / Beijing Road, Yuexiu District</b> — pusat kota lama, jalan kaki ke Beijing Road, satu jalur Line 2 dari Guangzhou South, Line 1 ke Xiguan, Line 6 ke Sacred Heart. Alternatif: Zhujiang New Town (Tianhe) lebih modern tapi lebih jauh dari kota lama.`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Destinasi Terkenal Lain`,
       nameEn:`Destinasi Terkenal Lain`,
       text:`Di luar itinerary utama: <b>Canton Tower</b> (dek observasi berbayar), <b>Pearl River Night Cruise</b>, <b>Baiyun Mountain</b>, <b>Chimelong</b> (taman hiburan besar berbayar), dan <b>Foshan Ancestral Temple</b> (perjalanan sehari ke kota tetangga) — lihat Cadangan.`,
       yt:`https://www.youtube.com/results?search_query=top+attractions+Guangzhou`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Makanan Wajib Dikunjungi &amp; Dicoba`,
       nameEn:`Makanan Wajib Dikunjungi & Dicoba`,
       text:`Cerita kuliner Cantonese — <b>dim sum</b> (hidangan kukus), <b>congee</b> (bubur), <b>double-skin milk</b> (puding susu khas Shunde), roast goose, dan claypot rice. Rekomendasi makan aktual tetap mengikuti kriteria ramah lambung (kukus/sup/bubur).`,
       yt:`https://www.youtube.com/results?search_query=Guangzhou+must+try+food`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Hal yang Sebaiknya Dihindari`,
       nameEn:`Hal yang Sebaiknya Dihindari`,
       text:`Siapkan WeChat Pay/Alipay dan VPN sebelum berangkat. Hindari taksi jalanan tanpa alamat tertulis Hanzi. Hindari kunjungan Senin ke museum &amp; katedral (tutup).`},
      {group:`intro`, tag:`info`, label:`Sebelum Berangkat`, title:`Yang Perlu Disiapkan`,
       nameEn:`Yang Perlu Disiapkan`,
       text:`VPN aktif, WeChat Pay/Alipay, salinan paspor, adaptor tipe A/I, payung lipat, baterai cadangan.`},
      // --- h1 ---
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Beijing Road Pedestrian Street (北京路步行街 · Běijīng Lù Bùxíng Jiē)`,
       nameEn:`Beijing Road Pedestrian Street`,
       nameHanzi:`北京路步行街`,
       text:`Jalan pejalan kaki tertua di Guangzhou, pusat perdagangan selama ±2.000 tahun — di bawah panel kaca di tengah jalan terlihat reruntuhan jalan kuno "Qiannian Gudao" berlapis dari era Song, Yuan, hingga Ming. Sangat hidup malam hari. <b>Akses:</b> MTR Beijing Road (北京路, Line 6) atau Gongyuanqian (Line 1/2), jalan kaki ±600–900 m ⚠️ jarak belum diverifikasi Amap. <b>Jam Operasional:</b> area terbuka sepanjang hari; toko umumnya 10:00–22:00, paling ramai malam. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Beijing_Road`,
       yt:`https://www.youtube.com/results?search_query=Beijing+Road+Pedestrian+Street+Guangzhou`},
      {group:`h1`, tag:`main`, label:`Itin H1`, title:`Dafo Temple (大佛寺 · Dàfó Sì)`,
       nameEn:`Dafo Temple`,
       nameHanzi:`大佛寺`,
       text:`Kuil Buddha yang berakar dari era Southern Han (917–971 M), berada di tengah Beijing Road — salah satu kuil paling ikonik Guangzhou dengan patung Buddha tembaga besar. <b>Akses:</b> Di dalam kawasan Beijing Road Pedestrian Street, dari Beijing Road Station (Line 6) atau Gongyuanqian, jalan kaki. <b>Jam Operasional:</b> ⚠️ sumber menyebut 08:00–21:30 (bervariasi, cek sebelum berangkat). <b>Tiket:</b> Gratis.`,
       wiki:`https://guangzhouinsider.info/attractions/dafo-temple/`,
       yt:`https://www.youtube.com/results?search_query=Dafo+Temple+Guangzhou`},
      // --- h2 ---
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Sacred Heart Cathedral (石室圣心大教堂 · Shíshì Shèngxīn Dàjiàotáng)`,
       nameEn:`Sacred Heart Cathedral`,
       nameHanzi:`石室圣心大教堂`,
       text:`Katedral Katolik bergaya Gothic yang seluruhnya dibangun dari granit (1863–1888), dijuluki "Notre-Dame dari Timur" — salah satu katedral Gothic granit terbesar di Asia. <b>Akses:</b> MTR Yide Road (Line 6), Exit B, jalan ±5 menit; alamat No. 56 Yide Road. Dari hotel ±1,3 km (data Trip.com). <b>Jam Operasional:</b> Selasa–Jumat 08:30–11:30 &amp; 14:30–17:30; Sabtu–Minggu 08:30–17:30; <b>tutup Senin</b>. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/sacred-heart-cathedral.htm`,
       yt:`https://www.youtube.com/results?search_query=Sacred+Heart+Cathedral+Guangzhou`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Yongqing Fang (永庆坊 · Yǒngqìng Fāng)`,
       nameEn:`Yongqing Fang`,
       nameHanzi:`永庆坊`,
       text:`Kawasan gang tua Xiguan di Enning Road, Distrik Liwan — direvitalisasi jadi distrik budaya dengan arsitektur Lingnan, kafe, toko kerajinan, dan Museum Opera Kanton. <b>Akses:</b> MTR Huangsha (Line 1/6), Exit B, No. 99 Enning Road. <b>Jam Operasional:</b> area terbuka 24 jam; toko/venue 10:00–22:30; Museum Opera Kanton tutup Senin. <b>Tiket:</b> Gratis masuk kawasan; museum di dalamnya ⚠️ berbayar terpisah, cek di lokasi.`,
       wiki:`https://www.eastchinatrip.com/yong-qing-fang-guangzhou-travel-guide/`,
       yt:`https://www.youtube.com/results?search_query=Yongqing+Fang+Guangzhou`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Shamian Island (沙面岛 · Shāmiàn Dǎo)`,
       nameEn:`Shamian Island`,
       nameHanzi:`沙面岛`,
       text:`Pulau kecil di tepi Sungai Mutiara yang jadi konsesi Inggris &amp; Prancis pada abad ke-19 — bangunan bergaya Eropa, jalan rindang, dan Gereja Our Lady of Lourdes (1890), sekarang salah satu spot foto &amp; jalan santai terbaik Guangzhou. <b>Akses:</b> MTR Huangsha (Line 1/6), Exit F, jalan kaki ke pulau. <b>Jam Operasional:</b> pulau terbuka umum 24 jam; Gereja Lourdes Sabtu/libur 06:00–17:30, hari kerja 06:00–11:00 &amp; 14:30–17:30. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/shamian-island.htm`,
       yt:`https://www.youtube.com/results?search_query=Shamian+Island+Guangzhou`},
      {group:`h2`, tag:`main`, label:`Itin H2`, title:`Shangxiajiu Pedestrian Street (上下九步行街 · Shàngxiàjiǔ Bùxíng Jiē)`,
       nameEn:`Shangxiajiu Pedestrian Street`,
       nameHanzi:`上下九步行街`,
       text:`Jalan pejalan kaki arkade Lingnan klasik di Xiguan — pusat kuliner Cantonese dan salah satu jalan belanja tertua Guangzhou, menyambung Yongqing Fang dan Shamian Island. <b>Akses:</b> kawasan Xiguan, dekat Line 1 (Changshou Road) / Line 6 ⚠️ belum diverifikasi stasiun terdekat &amp; jarak dari Shamian. <b>Jam Operasional:</b> area terbuka sepanjang hari; toko/kuliner ±10:00–22:00. <b>Tiket:</b> Gratis.`,
       wiki:`https://www.newsgd.com/node_99363c4f3b/0d0dfa02d8.shtml`,
       yt:`https://www.youtube.com/results?search_query=Shangxiajiu+Pedestrian+Street+Guangzhou`},
      // --- h3 ---
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Guangzhou Library (广州图书馆 · Guǎngzhōu Túshūguǎn)`,
       nameEn:`Guangzhou Library`,
       nameHanzi:`广州图书馆`,
       text:`Perpustakaan kota di tengah Huacheng Square, buka penuh sejak 2013 — bangunan modern dengan 11,8 juta koleksi dan ±4.500 kursi baca, arsitekturnya sendiri jadi daya tarik. <b>Akses:</b> No. 4 Zhujiang East Road, dari Zhujiang New Town (Line 3/5) ⚠️ jarak jalan kaki belum diverifikasi. <b>Jam Operasional:</b> ⚠️ sumber bertentangan — Selasa–Minggu 09:00–21:00 (Senin tutup) atau tutup Rabu; Minggu aman untuk keduanya, cek sebelum berangkat. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Guangzhou_Library`,
       yt:`https://www.youtube.com/results?search_query=Guangzhou+Library+Zhujiang+New+Town`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Huacheng Square (花城广场 · Huāchéng Guǎngchǎng)`,
       nameEn:`Huacheng Square`,
       nameHanzi:`花城广场`,
       text:`Plaza publik terbesar Guangzhou (±56 hektare) di jantung Zhujiang New Town — sumbu kota baru yang menghubungkan Guangdong Museum, Guangzhou Library, Opera House, dan Canton Tower; terbaik saat lampu menyala malam hari. <b>Akses:</b> MTR Zhujiang New Town (Line 3/5), Exit B1, jalan ±1 km ke plaza ⚠️. <b>Jam Operasional:</b> area terbuka 24 jam. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Zhujiang_New_City`,
       yt:`https://www.youtube.com/results?search_query=Huacheng+Square+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Haixinsha Island (海心沙 · Hǎixīnshā)`,
       nameEn:`Haixinsha Island`,
       nameHanzi:`海心沙`,
       text:`Pulau buatan di Sungai Mutiara yang jadi lokasi upacara pembukaan Asian Games 2010 — kini plaza terbuka dengan pemandangan langsung ke Canton Tower dan sumbu kota baru; pengganti gratis untuk dek observasi Canton Tower. <b>Akses:</b> jembatan pejalan kaki dari Huacheng Square, atau APM ke Opera House lalu jalan ±450 m ⚠️. <b>Jam Operasional:</b> area terbuka sepanjang hari. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Haixinsha`,
       yt:`https://www.youtube.com/results?search_query=Haixinsha+Island+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Haixin Bridge (海心桥 · Hǎixīn Qiáo)`,
       nameEn:`Haixin Bridge`,
       nameHanzi:`海心桥`,
       text:`Jembatan pejalan kaki pertama yang melintasi Sungai Mutiara di Guangzhou, dibuka 25 Juni 2021 — panjang total ±488 m, lebar 15 m, berbentuk lengkung miring; menghubungkan kawasan Ersha Island/Huacheng Square di utara dengan Canton Tower dan International Media Harbor di selatan, jadi bagian sumbu pejalan kaki pusat kota. <b>Akses:</b> dari Huacheng Square/Haixinsha jalan kaki ke ujung utara jembatan; ujung selatan di dekat Canton Tower (MTR Canton Tower, Line 3/APM) ⚠️ jarak persis belum diverifikasi Amap. <b>Jam Operasional:</b> terbuka umum sepanjang hari (jam malam menyesuaikan pencahayaan) ⚠️ belum ditemukan jam resmi. <b>Tiket:</b> Gratis.`,
       wiki:`https://en.wikipedia.org/wiki/Haixin_Bridge`,
       yt:`https://www.youtube.com/results?search_query=Haixin+Bridge+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Canton Tower Observation Deck (广州塔 · Guǎngzhōu Tǎ)`,
       nameEn:`Canton Tower Observation Deck`,
       nameHanzi:`广州塔`,
       text:`Menara TV setinggi 604 m (antena) di tepi Sungai Mutiara, dibuka 2010 — dek observasi di ketinggian ±433–488 m dengan pemandangan 360° kota, wahana bubble tram, dan ferris wheel horizontal. <b>Akses:</b> MTR Canton Tower (Line 3/APM) ⚠️, dekat Haixinsha Island. <b>Jam Operasional:</b> ⚠️ umumnya siang–malam; sunset sekitar 16:30–17:00 di awal November, tiba sebelum pukul 15:30. <b>Tiket:</b> gratis menikmati menara dari area luar/sekitar; dek observasi berbayar ±CNY 135–228/org — <b>tidak dipakai</b> (keputusan pengguna 2026-09-25, cukup menikmati pemandangan dari sekitar).`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/canton-tower.htm`,
       yt:`https://www.youtube.com/results?search_query=Canton+Tower+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Tianhe Shopping Area (天河路商圈 · Tiānhé Lù Shāngquān)`,
       nameEn:`Tianhe Shopping Area`,
       nameHanzi:`天河路商圈`,
       text:`Kawasan komersial terbesar di Guangzhou di sepanjang Tianhe Road — Grandview Mall (Zhengjia Plaza), Teemall, dan Parc Central berdiri berdampingan dan bisa dijalani kaki, ditambah lorong belanja bawah tanah di bawah Tianhe Sports Center (±25.000 m², 540+ toko). <b>Akses:</b> MTR Tiyu Xilu (体育西路, Line 1 &amp; 3), Exit B/C/D, langsung tersambung ke mal dan lorong bawah tanah. Dari Canton Tower via Line 3 ⚠️ ±20 menit, belum diverifikasi Amap. <b>Jam Operasional:</b> mal umumnya 10:00–22:00 setiap hari; lorong bawah tanah mengikuti jam toko. <b>Tiket:</b> Gratis masuk (kawasan mal, dipakai hanya untuk lihat-lihat sesuai permintaan pengguna).`,
       wiki:`https://en.wikivoyage.org/wiki/Guangzhou/Tianhe`,
       yt:`https://www.youtube.com/results?search_query=Tianhe+Road+shopping+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Parc Central (天环广场 · Tiānhuán Guǎngchǎng)`,
       nameEn:`Parc Central`,
       nameHanzi:`天环广场`,
       text:`Mal modern seluas ±110.000 m² di Tianhe Road, dikembangkan Sun Hung Kai Properties — tersambung langsung ke stasiun Tiyu Xilu, dengan restoran dan area santai; berdampingan dengan Grandview Mall dan Teemall. <b>Akses:</b> MTR Tiyu Xilu (Line 1 &amp; 3), Exit D langsung masuk mal (atau Exit B/C) — alamat Tianhe Road ⚠️ (nomor bervariasi antar sumber). <b>Jam Operasional:</b> 10:00–22:00 setiap hari (Jumat–Sabtu/libur sampai ±22:30). <b>Tiket:</b> Gratis masuk (mal; hanya lihat-lihat dan makan malam).`,
       wiki:`https://www.parccentral.com.hk/en`,
       yt:`https://www.youtube.com/results?search_query=Parc+Central+Guangzhou`},
      {group:`h3`, tag:`main`, label:`Itin H3`, title:`Pearl River Night Cruise (珠江夜游 · Zhūjiāng Yèyóu)`,
       nameEn:`Pearl River Night Cruise`,
       nameHanzi:`珠江夜游`,
       text:`Pelayaran malam di Sungai Mutiara melewati skyline Zhujiang New Town, Canton Tower berlampu, dan jembatan-jembatan kota — 70–90 menit, salah satu pengalaman malam klasik Guangzhou. <b>Akses:</b> dermaga Tianzi Pier (kota lama) atau Canton Tower Terminal — ⚠️ stasiun MTR terdekat belum diverifikasi. <b>Jam Operasional:</b> malam hari, beberapa keberangkatan (durasi 70–90 menit) ⚠️ cek jadwal. <b>Tiket:</b> gratis menikmati dari tepi sungai/dermaga; tiket kapal ±CNY 90–300/org — <b>tidak dipakai</b> (keputusan pengguna 2026-09-25, tidak naik cruise).`,
       wiki:`https://www.trip.com/travel-guide/attraction/guangzhou/pearl-river-night-cruise-tianzi-pier-10758762/`,
       yt:`https://www.youtube.com/results?search_query=Pearl+River+Night+Cruise+Guangzhou`},
      // --- h4 ---
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Sun Yat-sen Memorial Hall (中山纪念堂 · Zhōngshān Jìniàntáng)`,
       nameEn:`Sun Yat-sen Memorial Hall`,
       nameHanzi:`中山纪念堂`,
       text:`Aula memorial berarsitektur istana China berkubah biru-oktagon, dibangun 1931 untuk mengenang Dr. Sun Yat-sen, bapak Republik China; kini gedung pertunjukan &amp; landmark kota. <b>Akses:</b> MTR Memorial Hall (Line 2), Exit C. <b>Jam Operasional:</b> 08:00–18:00. <b>Tiket:</b> ±CNY 10/org.`,
       wiki:`https://en.wikipedia.org/wiki/Sun_Yat-sen_Memorial_Hall_(Guangzhou)`,
       yt:`https://www.youtube.com/results?search_query=Sun+Yat-sen+Memorial+Hall+Guangzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Yuexiu Park (越秀公园 · Yuèxiù Gōngyuán)`,
       nameEn:`Yuexiu Park`,
       nameHanzi:`越秀公园`,
       text:`Taman kota terbesar di pusat Guangzhou (±86 hektare) di lereng Bukit Yuexiu — rumah Patung Lima Kambing (Wǔyáng Shíxiàng, simbol kota), Zhenhai Tower, tembok kota Ming, dan tiga danau buatan. <b>Akses:</b> MTR Yuexiu Park (Line 2), Exit B1 ke gerbang utama; Exit A paling dekat Five Rams. Jalan ±10 menit dari Sun Yat-sen Memorial Hall. <b>Jam Operasional:</b> 06:00–22:00. <b>Tiket:</b> Gratis (Zhenhai Tower ±¥10 terpisah).`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/yuexiu.htm`,
       yt:`https://www.youtube.com/results?search_query=Yuexiu+Park+Guangzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Liurong Temple (六榕寺 · Liùróng Sì)`,
       nameEn:`Liurong Temple`,
       nameHanzi:`六榕寺`,
       text:`Kuil dari tahun 537 M dengan Pagoda Bunga (Huātǎ, 57,6 m) berlapis delapan sisi — namanya dari enam pohon banyan yang dulu tumbuh di halaman; salah satu situs Buddha tertua Guangzhou. <b>Akses:</b> MTR Gongyuanqian (Line 1/2), Exit B, jalan ±600–700 m ke No. 87 Liurong Road ⚠️. <b>Jam Operasional:</b> 08:00–17:00 (⚠️ sebagian sumber menyebut 17:30). <b>Tiket:</b> ±CNY 15/org ⚠️ (kuil ±¥5 + pagoda ±¥10, bervariasi per pintu masuk).`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/six_tree.htm`,
       yt:`https://www.youtube.com/results?search_query=Liurong+Temple+Guangzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Chen Clan Ancestral Hall (陈家祠 · Chénjiā Cí)`,
       nameEn:`Chen Clan Ancestral Hall`,
       nameHanzi:`陈家祠`,
       text:`Kompleks aula leluhur marga Chen yang dibangun 1888–1894 — mahakarya arsitektur Lingnan dengan ukiran kayu, batu, keramik, dan plester berwarna, kini juga jadi Guangdong Folk Art Museum. <b>Akses:</b> MTR Chen Clan Academy (陈家祠站), Line 1 Exit D atau Line 8 Exit E, langsung di depan pintu masuk. <b>Jam Operasional:</b> 08:30–17:30 (masuk terakhir 17:00). <b>Tiket:</b> ±CNY 10/org.`,
       wiki:`https://en.wikipedia.org/wiki/Chen_Clan_Ancestral_Hall`,
       yt:`https://www.youtube.com/results?search_query=Chen+Clan+Ancestral+Hall+Guangzhou`},
      {group:`h4`, tag:`main`, label:`Itin H4`, title:`Liwan Lake Park (荔湾湖公园 · Lìwān Hú Gōngyuán)`,
       nameEn:`Liwan Lake Park`,
       nameHanzi:`荔湾湖公园`,
       text:`Taman air di jantung Xiguan (Distrik Liwan) — danau, jembatan batu, paviliun, dan rumah-rumah gaya Lingnan di tepi air, sering disebut "kota air Lingnan"; salah satu ruang santai warga Xiguan dan pas untuk jalan sore. <b>Akses:</b> No. 155 Longjin West Road, Liwan District. MTR Line 5 Zhongshanba (Exit A, ±300 m) atau Line 6 Ruyifang ⚠️ belum diverifikasi Amap. Dari Chen Clan Academy ±1,5–2 km (⚠️ sepeda/jalan datar atau Didi singkat). <b>Jam Operasional:</b> 06:00–22:30 setiap hari. <b>Tiket:</b> Gratis (perahu/wahana tertentu di dalam berbayar terpisah, tidak dipakai).`,
       wiki:`https://us.trip.com/travel-guide/attraction/guangzhou/liwan-lake-park-83765/`,
       yt:`https://www.youtube.com/results?search_query=Liwan+Lake+Park+Guangzhou`},
      // --- cadangan ---
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Zhenhai Tower (镇海楼 · Zhènhǎi Lóu)`,
       nameEn:`Zhenhai Tower`,
       nameHanzi:`镇海楼`,
       context:`Kenapa tidak dimasukkan: kategori Secondary pilihan pengguna — tutup Senin (Hari 4 = Senin, satu-satunya hari di Yuexiu Park) dan tanjakan menuju menara lebih berat untuk lutut.`,
       text:`Menara lima lantai era Ming (1380) di puncak Yuexiu Hill, kini Guangzhou Museum — memajang sejarah kota dan pemandangan kota dari atas, ikon Yuexiu Park. <b>Akses:</b> di dalam Yuexiu Park, dari Yuexiu Park Station (Line 2) — jalan menanjak landai ⚠️. <b>Jam Operasional:</b> 09:00–17:30, tutup Senin. <b>Tiket:</b> ±CNY 10/org.`,
       wiki:`https://www.travelchinaguide.com/attraction/guangdong/guangzhou/museum.htm`,
       yt:`https://www.youtube.com/results?search_query=Zhenhai+Tower+Guangzhou`},
      {group:`cadangan`, tag:`planc`, label:`Plan C`, title:`Nanyue King Museum (西汉南越王博物馆 · Xīhàn Nányuèwáng Bówùguǎn)`,
       nameEn:`Nanyue King Museum`,
       nameHanzi:`西汉南越王博物馆`,
       context:`Kenapa tidak dimasukkan: <b>tidak dipilih pengguna (2026-09-24)</b> — masuk daftar Skip; juga tutup Senin, satu-satunya hari di Yuexiu Park.`,
       text:`Museum di atas makam Raja Wen dari Kerajaan Nanyue (±122 SM), ditemukan 1983 — koleksi jubah giok berbenang sutra, cap emas, dan lebih dari 1.000 artefak; museum nasional kelas satu. <b>Akses:</b> MTR Yuexiu Park (Line 2), Exit E, jalan singkat. Situs makam: No. 867 Jiefang North Road. <b>Jam Operasional:</b> Selasa–Minggu 09:00–17:30 (tiket berhenti 17:00), <b>tutup Senin</b>. <b>Tiket:</b> ±CNY 10/org ⚠️; wajib reservasi online &amp; bawa paspor asli.`,

const STORE_KEY = "wisata-china-checks-v3";
const store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

/* Independent "sudah ditinjau" checklist for Lampiran entries — not
   linked to the Itinerary tab's checkboxes (different meaning: for
   Cadangan it means "reviewed and confirmed not visiting", not "done"). */
const LAMP_STORE_KEY = "wisata-china-lampiran-reviewed-v1";
const lampStore = JSON.parse(localStorage.getItem(LAMP_STORE_KEY) || "{}");
function saveLamp(){ localStorage.setItem(LAMP_STORE_KEY, JSON.stringify(lampStore)); }
function lampiranKey(destId, title){ return destId + "::" + title; }

function cell(v, cls){
  return v ? `<td class="${cls}">${v}</td>` : `<td class="${cls} dash">&ndash;</td>`;
}

function formatJam(jam){
  // "14:25–15:15" -> "14:25–" / "15:15" on two lines so the column can stay narrow
  const i = jam.indexOf('–');
  if(i !== -1) return jam.slice(0,i+1) + '<br>' + jam.slice(i+1);
  // non-range labels like "Sore/malam" have no natural break point for the
  // narrow column — break after "/" too, otherwise it can overflow into
  // the next cell instead of wrapping.
  const j = jam.indexOf('/');
  if(j !== -1) return jam.slice(0,j+1) + '<br>' + jam.slice(j+1);
  return jam;
}

function updateProgress(dayEl){
  const boxes = dayEl.querySelectorAll('input[type=checkbox]');
  const done = [...boxes].filter(b=>b.checked).length;
  dayEl.querySelector('.day-progress').textContent = done+"/"+boxes.length;
}

function renderTransport(t){
  const isFlight = t.mode === "flight";
  const isTrain = t.mode === "train";
  const icon = isFlight ? PLANE_ICON : isTrain ? TRAIN_ICON : TRANSIT_ICON;
  const tagClass = t.tag === "ok" ? "tag-ok" : "tag-tbd";
  const tagText = t.tag === "ok" ? "Confirmed" : "Belum pasti";

  let body = "";
  if(isFlight || isTrain){
    body = `
      <div class="flight-route">
        <div class="route-city"><div class="route-code">${t.from.code}</div><div class="route-name">${t.from.name}</div></div>
        <div class="route-mid">
          <div class="route-dur">${t.duration}</div>
          <div class="route-line"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></svg></div>
          <div class="route-dur">${t.code}</div>
        </div>
        <div class="route-city" style="text-align:right"><div class="route-code">${t.to.code}</div><div class="route-name">${t.to.name}</div></div>
      </div>
      <div class="flight-meta">${t.meta.map(([l,v])=>`<div><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.note ? `<div class="flight-note">${t.note}</div>` : ``}
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  } else {
    body = `
      <div class="transit-list">${t.items.map(([l,v])=>`<div class="transit-row"><div class="meta-label">${l}</div><div class="meta-value">${v}</div></div>`).join('')}</div>
      ${t.hotel ? `<div class="hotel-banner">${t.hotel}</div>` : ``}
      ${t.warn ? `<div class="warn-banner">${t.warn}</div>` : ``}
    `;
  }

  const det = document.createElement('details');
  det.className = 'transport';
  det.innerHTML = `
    <summary>
      <div class="transport-icon">${icon}</div>
      <div class="transport-head-text">
        <div class="transport-kicker">${t.kicker}</div>
        <div class="transport-title">${t.title}</div>
      </div>
      <div class="transport-tag ${tagClass}">${tagText}</div>
      ${CHEV}
    </summary>
    <div class="transport-body">${body}</div>
  `;
  return det;
}

function renderDay(d, dest){
  const destId = dest.id;
  const det = document.createElement('details');
  det.className = 'day';

  const rows = d.items.map((it,ii)=>{
    const [jam,destName,ket,catatan,valas,rupiah] = it;
    const key = destId+"-"+d.id+"-"+ii;
    const checked = store[key] ? 'checked' : '';
    const doneClass = store[key] ? 'done' : '';
    return `<tr class="${doneClass}" data-key="${key}">
      <td class="cell-pilih"><input type="checkbox" ${checked} aria-label="Tandai selesai: ${destName}"></td>
      <td class="cell-jam">${formatJam(jam)}</td>
      <td class="cell-dest">${destName}</td>
      ${cell(ket,'cell-ket')}
      ${cell(valas,'cell-valas')}
      ${cell(rupiah,'cell-rupiah')}
    </tr>`;
  }).join('');

  const footRow = d.total ? `<tfoot><tr>
      <td></td><td></td><td>TOTAL HARI ${d.num}</td><td></td>
      <td class="cell-valas">${d.total.cny}</td><td class="cell-rupiah">${d.total.idr}</td>
    </tr></tfoot>` : '';

  const cadanganNearby = (dest.lampiran || []).filter(p =>
    p.tag === 'planc' && p.relatedDays && p.relatedDays.includes(d.num));
  const cadanganNearbyHtml = cadanganNearby.length ? `
    <div class="cadangan-nearby">
      <span class="banner-label">Tempat sekitar lain (lihat Lampiran → Cadangan)</span>
      ${cadanganNearby.map(p => p.title).join(', ')}
    </div>` : '';

  det.innerHTML = `
    <summary>
      <div class="day-badge">${d.num}</div>
      <div class="day-head-text">
        <div class="day-toprow">
          <div class="day-date">${d.date}</div>
          <div class="day-progress">0/${d.items.length}</div>
        </div>
        <div class="day-label">${d.label}</div>
      </div>
      ${CHEV}
    </summary>
    ${d.reserve ? `<div class="reserve-banner"><span class="banner-label">Reservasi wajib</span>${d.reserve}</div>` : ``}
    ${d.advisory ? `<div class="info-banner"><span class="banner-label">Perhatian</span>${d.advisory}</div>` : ``}
    <div class="table-scroll">
      <table class="itin">
        <colgroup>
          <col style="width:28px"><col style="width:72px"><col style="width:215px"><col style="width:215px"><col style="width:52px"><col style="width:98px">
        </colgroup>
        <thead><tr>
          <th class="col-pilih"><span class="sr-only">Pilih</span></th><th>Jam</th><th>Destinasi</th><th>Keterangan</th><th class="col-num">${dest.currency || 'CNY'}</th><th class="col-num">IDR</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        ${footRow}
      </table>
    </div>
    ${d.planb ? `<div class="planb-banner"><span class="banner-label">Plan-B hari ini</span>${d.planb}</div>` : ``}
    ${cadanganNearbyHtml}
  `;

  det.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const row = cb.closest('tr');
      const key = row.dataset.key;
      store[key] = cb.checked;
      row.classList.toggle('done', cb.checked);
      save();
      updateProgress(det);
    });
  });

  return det;
}

function renderBudget(b, currency){
  const el = document.createElement('details');
  el.className = 'budget-card';
  const dayRows = b.byDay.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  const catRows = b.byCategory.map(([l,c,i])=>`<tr><td>${l}</td><td>${c}</td><td>${i}</td></tr>`).join('');
  el.innerHTML = `
    <summary><h3 class="serif">Ringkasan Budget Total</h3>${CHEV}</summary>
    <div class="budget-card-body">
      <div class="budget-sub">${b.note}</div>
      <table class="budget">
        <thead><tr><th>Hari</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${dayRows}<tr class="grand"><td>${b.grand[0]}</td><td>${b.grand[1]}</td><td>${b.grand[2]}</td></tr></tbody>
      </table>
      <table class="budget">
        <thead><tr><th>Kategori</th><th>${currency}</th><th>IDR</th></tr></thead>
        <tbody>${catRows}<tr class="grand"><td>TOTAL</td><td>${b.catTotal[1]}</td><td>${b.catTotal[2]}</td></tr></tbody>
      </table>
      <div class="budget-note">${b.caveat}</div>
    </div>
  `;
  return el;
}

function renderCity(dest){
  const panel = document.createElement('div');
  panel.className = 'city-panel';

  panel.innerHTML = `

  if(dest.budget) itinView.appendChild(renderBudget(dest.budget, dest.currency || 'CNY'));

  const notesCard = document.createElement('details');

  notesCard.innerHTML = `<summary>Catatan Penting Lainnya${CHEV}</summary><div class="notes-card-body"><ul>${dest.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;

  if(dest.transportPulang) itinView.appendChild(renderTransport(dest.transportPulang));

  const lampiranView = panel.querySelector('.subview.lampiran');
  lampiranView.innerHTML = '';

  const tagClass = {main:'tag-main',planb:'tag-planb',food:'tag-food',planc:'tag-planc',info:'tag-info'};
  const groupDefs = dest.lampiranGroups && dest.lampiranGroups.length
    ? dest.lampiranGroups
    : dest.days.map(d=>({key:d.id, heading:d.date+' — '+d.label})).concat([{key:'cadangan', heading:'Cadangan'}]);

  function placeLinks(p){

      </div>` : ``;
  }

  groupDefs.forEach((g,gi)=>{
    const entries = dest.lampiran.filter(p=>p.group===g.key);
    if(!entries.length) return;
    const isIntro = g.key === 'intro';

    const groupEl = document.createElement('details');
    groupEl.className = 'lampiran-group';
    groupEl.dataset.key = g.key;

    const itemsHtml = entries.map(p=>{
      const noBody = !p.text && !p.wiki && !p.yt && !p.reserveInfo && (!p.nearby || !p.nearby.length) && (!p.hotels || !p.hotels.length);
      const lampKey = lampiranKey(dest.id, p.title);
      const isDestList = isIntro && /^Destinasi Terkenal Lain/.test(p.title || '');
      const lampChecked = lampStore[lampKey] ? 'checked' : '';
      const lampDoneClass = !isIntro && lampStore[lampKey] ? ' reviewed' : '';
      return `
        <div class="lampiran-item${isIntro?' intro':''}${lampDoneClass}"${!isIntro?` data-lamp-key="${lampKey}"`:``}>
          <div class="lampiran-item-head">
            ${!isIntro ? `<input type="checkbox" class="lampiran-check" ${lampChecked} aria-label="Tandai sudah ditinjau: ${p.title}">` : ``}
            ${!isIntro ? `<span class="place-tag ${tagClass[p.tag]}">${p.label}</span>` : ``}
            <span class="lampiran-item-title">${isDestList ? '<b>Destinasi</b>' : titleHtml(p)}</span>
            ${!isIntro ? `<button type="button" class="item-toggle" aria-label="Buka/tutup detail">${CHEV}</button>` : ``}
          </div>
          <div class="lampiran-item-body">
            ${isDestList ? copyAllBtnsHtml(dest.id) : ``}
            ${!isIntro && p.tag !== 'food' ? copyBtnsHtml(p.nameEn, p.nameHanzi) : ``}
            ${p.context ? `<div class="card-context"${noBody?' style="margin-bottom:0;"':''}>${p.context}</div>` : ``}
            ${p.text ? `<p>${p.text}</p>` : ``}
            ${p.reserveInfo ? `<div class="reserve-info"><span class="banner-label">Cara reservasi</span>${p.reserveInfo}</div>` : ``}
            ${p.nearby && p.nearby.length ? `<div class="nearby"><b>Rekomendasi tempat sekitar:</b> ${nearbyLine(p.nearby)}</div>` : ``}
            ${p.hotels && p.hotels.length ? `<div class="hotels"><b>Rekomendasi Hotel (Trip.com):</b> ${hotelsLine(p.hotels, dest.name)}</div>` : ``}
            ${placeLinks(p)}
          </div>
        </div>`;
    }).join('');

    groupEl.innerHTML = `
      <summary><span class="lampiran-group-title">${g.heading}</span>${CHEV}</summary>
      <div class="lampiran-group-body">${itemsHtml}</div>
    `;
    lampiranView.appendChild(groupEl);
  });

  lampiranView.querySelectorAll('.lampiran-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const item = cb.closest('.lampiran-item');
      const key = item.dataset.lampKey;
      lampStore[key] = cb.checked;
      item.classList.toggle('reviewed', cb.checked);
      saveLamp();
    });
  });

  lampiranView.querySelectorAll('.lampiran-item-head').forEach(head=>{
    const item = head.closest('.lampiran-item');
    if(item.classList.contains('intro')) return;
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.lampiran-check')) return;
      item.classList.toggle('open');
    });
  });

  return panel;
}

const cityTabsWrap = document.getElementById('city-tabs');
const cityPanelsWrap = document.getElementById('city-panels');

const AIRPORT_CODES = {nanjing:'NKG', wuxi:'WUX', hongkong:'HKG', xiamen:'XIA', ningbo2:'NB2'};
// Pengaman: kosongkan wadah dulu supaya tab/panel tidak dobel kalau HTML
// yang dibuka adalah salinan DOM yang sudah terender.
cityTabsWrap.innerHTML = '';
cityPanelsWrap.innerHTML = '';
destinations.forEach((dest,i)=>{
  const tabBtn = document.createElement('button');
  tabBtn.className = 'city-tab' + (i===0 ? ' active' : '');
  tabBtn.textContent = AIRPORT_CODES[dest.id] || dest.name.replace(/\s+/g,'').slice(0,3).toUpperCase();
  tabBtn.title = dest.name;
  tabBtn.setAttribute('aria-label', dest.name);
  tabBtn.dataset.city = dest.id;
  tabBtn.addEventListener('click', ()=>{
    document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
    tabBtn.classList.add('active');
    document.querySelectorAll('.city-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+dest.id).classList.add('active');
    setGlobalSubview('itinerary');
  });
  cityTabsWrap.appendChild(tabBtn);

  const panel = renderCity(dest);
  if(i===0) panel.classList.add('active');
  cityPanelsWrap.appendChild(panel);
});

/* Itinerary/Lampiran toggle lives once in the sticky header and controls
   whichever city panel is currently active — stays visible while scrolling. */
function setGlobalSubview(view){
  document.querySelectorAll('#global-subtabs .subtab-btn').forEach(b=>{
    const active = b.dataset.view === view;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  const activePanel = document.querySelector('.city-panel.active');
  if(!activePanel) return;
  activePanel.querySelectorAll('.subview').forEach(v=>v.classList.remove('active'));
  activePanel.querySelector('.subview.'+view).classList.add('active');
  document.getElementById('dest-search').value = '';
  document.querySelectorAll('.search-hit').forEach(el=>el.classList.remove('search-hit'));
}
document.querySelectorAll('#global-subtabs .subtab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> setGlobalSubview(btn.dataset.view));
});

/* ---------------------------------------------------------
   TAB BUDGET — ringkasan budget tiap kota + total semua kota.
   Dibaca otomatis dari destinations[].budget (tidak perlu edit manual).
   Kategori dinormalisasi: Tiket masuk, Makan, Transport, Tiket HSR,
   Tiket pesawat (+ visa), Hotel — HSR/pesawat/hotel selalu terpisah.
--------------------------------------------------------- */
const BGT_CATS = [
  ['tiket','Tiket masuk'],
  ['makan','Makan'],
  ['transport','Transport lokal & antar-kota'],
  ['hsr','Tiket HSR'],
  ['pesawat','Tiket pesawat (+ visa)'],
  ['hotel','Hotel']
];
const BGT_RATE = {CNY:'Rp2.650', HKD:'Rp2.300'};
function bgtNum(s){
  const t = String(s == null ? '' : s).replace(/<[^>]*>/g,'').replace(/&[a-z]+;/g,'').replace(/[≈Rp\s*]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}
function bgtFmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function bgtClass(label){
  const l = String(label).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').toLowerCase();
  if(/grand|^total|subtotal/.test(l)) return 'skip';
  if(/hsr/.test(l)) return 'hsr';
  if(/pesawat|penerbangan|flight|visa/.test(l)) return 'pesawat';
  if(/^hotel/.test(l)) return 'hotel';
  if(/^tiket masuk/.test(l)) return 'tiket';
  if(/^makan/.test(l)) return 'makan';
  if(/^transport/.test(l)) return 'transport';
  return 'lain';
}
function bgtCityData(dest){
  const b = dest.budget || {};
  const rows = (b.byCategory && b.byCategory.length) ? b.byCategory : (b.byDay || []);
  const groups = {};
  let approx = false;
  rows.forEach(([l,c,i])=>{
    const k = bgtClass(l);
    if(k === 'skip' || k === 'lain') return;
    if(bgtNum(c) === 0 && bgtNum(i) === 0) return;
    if(String(c).indexOf('≈') !== -1) approx = true;
    (groups[k] = groups[k] || []).push({label:l, c:c, i:i});
  });
  let local = 0, idr = 0;
  const cats = {};
  BGT_CATS.forEach(([k])=>{
    const g = groups[k] || [];
    cats[k] = {local: g.reduce((s,r)=>s+bgtNum(r.c),0), idr: g.reduce((s,r)=>s+bgtNum(r.i),0)};
    local += cats[k].local; idr += cats[k].idr;
  });
  return {groups, cats, local, idr, approx};
}
function bgtEsc(s){ return String(s).replace(/&amp;/g,'&').replace(/&/g,'&amp;'); }
function renderBudgetTab(){
  const panel = document.createElement('div');
  panel.className = 'city-panel';
  panel.id = 'panel-budget';
  panel.innerHTML = '<div class="subview itinerary active"></div><div class="subview lampiran"></div>';
  const view = panel.querySelector('.subview.itinerary');
  const all = {};
  BGT_CATS.forEach(([k])=>{ all[k] = 0; });
  let grandIdr = 0;
  const cityRows = [];
  destinations.forEach(dest=>{
    if(!dest.budget) return;
    const cur = dest.currency || 'CNY';
    const d = bgtCityData(dest);
    const rowsHtml = BGT_CATS.map(([k,name])=>{
      const g = d.groups[k];
      if(!g || !g.length) return '';
      return g.map(r=>`<tr><td>${r.label}</td><td>${r.c || '—'}</td><td>${r.i || '—'}</td></tr>`).join('');
    }).join('');
    const el = document.createElement('details');
    el.className = 'budget-card';
    el.open = true;
    const shortDates = (dest.dates || '').split('·')[0].trim();
    el.innerHTML = `
      <summary><h3 class="serif">${dest.name} <span style="font-weight:400;font-size:.78em;opacity:.75">· ${shortDates} · mata uang ${cur}</span></h3>${CHEV}</summary>
      <div class="budget-card-body">
        <table class="budget">
          <thead><tr><th>Kategori</th><th>${cur}</th><th>IDR</th></tr></thead>
          <tbody>${rowsHtml}<tr class="grand"><td>GRAND TOTAL</td><td>${d.approx ? '≈' : ''}${bgtFmt(d.local)}</td><td>${bgtFmt(d.idr)}</td></tr></tbody>
        </table>
        <div class="budget-note">Kurs 1 ${cur} = ${BGT_RATE[cur] || '—'}.</div>
      </div>`;
    view.appendChild(el);
    BGT_CATS.forEach(([k])=>{ all[k] += d.cats[k].idr; });
    grandIdr += d.idr;
    cityRows.push({name: dest.name, cur: cur, local: d.local, approx: d.approx, idr: d.idr});
  });
  const sumRows = BGT_CATS.filter(([k])=>all[k] > 0).map(([k,name])=>`<tr><td>${name}</td><td>${bgtFmt(all[k])}</td></tr>`).join('');
  const cityHtml = cityRows.map(r=>`<tr><td>${r.name}</td><td>${r.cur}</td><td>${r.approx ? '≈' : ''}${bgtFmt(r.local)}</td><td>${bgtFmt(r.idr)}</td></tr>`).join('');
  const sum = document.createElement('details');
  sum.className = 'budget-card';
  sum.open = true;
  sum.innerHTML = `
    <summary><h3 class="serif">Total Semua Kota <span style="font-weight:400;font-size:.78em;opacity:.75">· dalam IDR</span></h3>${CHEV}</summary>
    <div class="budget-card-body">
      <div class="budget-sub">Summary per kategori seluruh kota (semua mata uang sudah dikonversi ke Rupiah).</div>
      <table class="budget">
        <thead><tr><th>Kategori</th><th>IDR</th></tr></thead>
        <tbody>${sumRows}<tr class="grand"><td>TOTAL SEMUA KOTA</td><td>${bgtFmt(grandIdr)}</td></tr></tbody>
      </table>
      <div class="budget-sub" style="margin-top:12px">Per kota (total lokal tidak dijumlah karena mata uang berbeda).</div>
      <table class="budget">
        <thead><tr><th>Kota</th><th>Mata uang</th><th>Total lokal</th><th>IDR</th></tr></thead>
        <tbody>${cityHtml}<tr class="grand"><td>TOTAL</td><td>—</td><td>—</td><td>${bgtFmt(grandIdr)}</td></tr></tbody>
      </table>
      <div class="budget-note">Komponen bertanda ⚠️ Estimasi masih perkiraan. Hotel Ningbo tidak dihitung (properti pribadi). Tiket pulang ke Jakarta ada di Ningbo 2; tiket pesawat Ningbo → Hong Kong ada di Hong Kong.</div>
    </div>`;
  view.appendChild(sum);
  return panel;
}
(function(){
  const btn = document.createElement('button');
  btn.className = 'city-tab';
  btn.textContent = 'BGT';
  btn.title = 'Budget';
  btn.setAttribute('aria-label', 'Budget');
  btn.dataset.city = '__budget';
  const panel = renderBudgetTab();
  cityPanelsWrap.appendChild(panel);
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.city-panel').forEach(p=>p.classList.remove('active'));
    panel.classList.add('active');
  });
  cityTabsWrap.appendChild(btn);
  cityTabsWrap.addEventListener('click', e=>{
    const b = e.target.closest('.city-tab');
    if(!b) return;
    document.getElementById('global-subtabs').style.display = (b.dataset.city === '__budget') ? 'none' : '';
  });
})();
</script>
